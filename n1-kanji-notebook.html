うどう）安全衛生（あんぜんえいせい）に関（かん）する注意点（ちゅういてん）","q":"営業（えいぎょう）後（のち）、フライヤーの油（あぶら）を交換（こうかん）し、そのあとコーヒーの抽出（ちゅうしゅつ）後（のち）のフィルターを外（はず）す作業（さぎょう）をします。安全（あんぜん）な進め方（すすめかた）として最（もっと）も適切（てきせつ）なものはどれか。","ch":["油（あぶら）の交換（こうかん）作業（さぎょう）は長靴（ながぐつ）・長（ちょう）エプロン・耐熱（たいねつ）手袋（てぶくろ）を着用（ちゃくよう）し、高温（こうおん）油（あぶら）に触（ふ）れるリスクを念頭（ねんとう）におく。","油（あぶら）は熱（あつ）いうちのほうが流（なが）れやすいので、手袋（てぶくろ）を着（つ）けずに素早（すばや）くおこなう。","コーヒー抽出（ちゅうしゅつ）後（のち）のフィルターの内容物（ないようぶつ）は冷（さ）めているので、素手（すで）で取り出（とりだ）してよい。"],"answer_index":0,"ex":"フライヤーを使（つか）う際（きわ）は長靴（ながぐつ）、長（ちょう）エプロン、耐熱（たいねつ）手袋（てぶくろ）を着用（ちゃくよう）し、油（あぶら）の交換（こうかん）作業（さぎょう）を含（ふく）むメンテナンスでは高温（こうおん）油（あぶら）に触（ふ）れるリスクを念頭（ねんとう）におきます。コーヒー抽出（ちゅうしゅつ）後（のち）のフィルターの内容物（ないようぶつ）は高温（こうおん）であり、熱湯（ねっとう）が残（のこ）っている場合（ばあい）もあるので、取り出（とりだ）す際（さい）には十分注意（じゅうぶんちゅうい）します。厨房（ちゅうぼう）内（ない）は暑（あつ）くなりがちなので、熱中（ねっちゅう）症（しょう）発生（はっせい）のおそれにも注意（ちゅうい）が必要（ひつよう）です。","jt":"判断試験"},{"subject":"飲食物調理","type":"実技","source":"飲食物調理 p.22","tp":"（参考（さんこう））キッチン基本用語（きほんようご）（先入（さきい）れ先出（さきだ）し）","q":"冷蔵庫（れいぞうこ）に同（おな）じ食材（しょくざい）が3箱（はこ）ある。アは5月（がつ）8日（にち）、イは5月（がつ）5日（にち）、ウは5月（がつ）10日（にち）に入荷（にゅうか）した箱（はこ）である。5月（がつ）11日（にち）に使（つか）うときの順番（じゅんばん）と管理（かんり）の方法（ほうほう）として正（ただ）しいものはどれか。","ch":["ウ → ア → イ の順（じゅん）に使（つか）い、日付（ひづけ）は使（つか）うときに箱（はこ）に書（か）く","ア → イ → ウ の順（じゅん）に使（つか）い、日付（ひづけ）は箱（はこ）を開（ひら）けてから書（か）く","イ → ア → ウ の順（じゅん）に使（つか）い、検品（けんぴん）後（のち）に箱（はこ）に日付（ひづけ）を書（か）く"],"answer_index":2,"ex":"先入（さきい）れ先出（さきだ）しは、検品（けんぴん）後（のち）に箱（はこ）に日付（ひづけ）を記入（きにゅう）し定位置（ていいち）管理（かんり）をおこない、古（ふる）い順（じゅん）に使（つか）うことである。入荷（にゅうか）日（にち）が古（ふる）い順（したが）はイ（5月（がつ）5日（にち））→ア（5月（がつ）8日（にち））→ウ（5月（がつ）10日（にち））となる。新（あたら）しいものから使（つか）うと古（ふる）い食材（しょくざい）が残（のこ）り、劣化（れっか）して廃棄（はいき）につながる。","jt":"計画立案"},{"subject":"飲食物調理","type":"実技","source":"飲食物調理 p.23","tp":"（参考（さんこう））キッチン基本用語（きほんようご）（ポーション）","q":"ハンバーグ1人前（ひとまえ）のひき肉（にく）は120gである。明日（あした）の予想（よそう）食（しょく）数（かず）は150食（しょく）で、仕込（しこ）み中（なか）の目減（めべ）りを考（かんが）えて必要量（ひつようりょう）の10%を多（おお）く用意（ようい）する。用意（ようい）するひき肉（にく）の量（りょう）はいくつか。","ch":["18.0kg","19.8kg","16.2kg"],"answer_index":1,"ex":"120g×150食（しょく）＝18,000g＝18kg が1人前（ひとまえ）の分量（ぶんりょう）からの必要量（ひつようりょう）。これに10%を足（た）すので18kg×1.1＝19.8kg。18.0kgは目減（めべ）り分（ふん）を足（た）していない誤（あやま）り、16.2kgは18kgから10%を引（ひ）いた誤（あやま）りである。","jt":"計画立案"},{"subject":"飲食物調理","type":"実技","source":"飲食物調理 p.23","tp":"（参考（さんこう））キッチン基本用語（きほんようご）（ポーション・検品（けんぴん））","q":"付（つ）け合（あ）わせのキャベツは1人前（ひとまえ）60gである。200食分（しょくぶん）を用意（ようい）する。外葉（がいよう）などを取（と）るため、使（つか）える部分（ぶぶん）は仕入（しい）れた重（おも）さの80%である。発注（はっちゅう）する量（りょう）はいくつか。","ch":["12.0kg","14.4kg","15.0kg"],"answer_index":2,"ex":"60g×200食（しょく）＝12,000g＝12kg が必要（ひつよう）な使（つか）える部分（ぶぶん）の量（りょう）。使（つか）えるのが80%なので、12kg÷0.8＝15kg を発注（はっちゅう）する。12.0kgは捨（す）てる分（ふん）を考（かんが）えていない誤（あやま）り、14.4kgは12kgに20%を足（た）した（12×1.2）誤（あやま）りである。","jt":"計画立案"}]},{"title":"店舗運営 学科 · भाग 1 (p.5–8)","words":[{"subject":"店舗運営","type":"学科","source":"店舗運営 p.5","tp":"1. 総論（そうろん） 外食産業（がいしょくさんぎょう）の店舗（てんぽ）運営（うんえい）（1）外食産業（がいしょくさんぎょう）の成功（せいこう）のポイント","q":"テキストでは、外食産業（がいしょくさんぎょう）を成功（せいこう）させるために必要（ひつよう）なものを何（なん）と表（あらわ）しているか。正（ただ）しいものはどれか。","ch":["PDCA＋H","QSCA＋H","HACCP＋Q"],"answer_index":1,"ex":"テキストは「外食産業（がいしょくさんぎょう）を成功（せいこう）させるために必要（ひつよう）なものはQSCA＋Hです」と述（の）べています。Q＝商品（しょうひん）の品質（ひんしつ）、S＝心（こころ）のこもったサービス、C＝清潔（せいけつ）さ、A＝店（みせ）の雰囲気（ふんいき）（Atmosphere）、H＝ホスピタリティです。PDCAや5S、HACCPはここでの表現（ひょうげん）ではありません。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.5","tp":"1. 総論（そうろん） 外食産業（がいしょくさんぎょう）の店舗（てんぽ）運営（うんえい）（1）外食産業（がいしょくさんぎょう）の成功（せいこう）のポイント","q":"外食産業（がいしょくさんぎょう）の特徴（とくちょう）について、テキストの説明（せつめい）として正（ただ）しいものはどれか。","ch":["立地（りっち）産業（さんぎょう）であるため商圏（しょうけん）は限定（げんてい）され、客（きゃく）単価（たんか）も決（けっ）して大（おお）きくない","商圏（しょうけん）が広（ひろ）いため、遠方（えんぽう）の新規（しんき）客（きゃく）だけで経営（けいえい）を続（つづ）けられる","立地（りっち）に左右（さゆう）されないため、どこに出店（でみせ）しても売上（うりあげ）は同（おな）じである"],"answer_index":0,"ex":"テキストは、外食産業（がいしょくさんぎょう）は立地（りっち）産業（さんぎょう）で商圏（しょうけん）が限定（げんてい）され、客（きゃく）単価（たんか）も大（おお）きくないと説明（せつめい）しています。そのため商圏（しょうけん）内（ない）のお客様（きゃくさま）に繰り返（くりかえ）し来店（らいてん）してもらうことが経営（けいえい）継続（けいぞく）の方法（ほうほう）だとしています。商圏（しょうけん）が広（ひろ）い、立地（りっち）に左右（さゆう）されないという説明（せつめい）は誤（あやま）りです。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.5","tp":"1. 総論（そうろん）（2）店舗（てんぽ）を運営（うんえい）管理（かんり）する人（にん）とマネジメント","q":"時間帯（じかんたい）責任者（せきにんしゃ）について、テキストの説明（せつめい）として正（ただ）しいものはどれか。","ch":["店長（てんちょう）が休（やす）みの日（にち）だけ出勤（しゅっきん）して店（みせ）を開（ひら）け、閉店（へいてん）の作業（さぎょう）までをおこなう人（にん）のことである","店舗（てんぽ）オペレーションのデイリーワークの中（なか）で、時間帯（じかんたい）における店長（てんちょう）の職務（しょくむ）を代行（だいこう）する人（にん）である","厨房（ちゅうぼう）で調理（ちょうり）だけを担当（たんとう）し、従業員（じゅうぎょういん）の育成（いくせい）やコスト管理（かんり）などのマネジメントはおこなわない人（にん）である"],"answer_index":1,"ex":"テキストでは、時間帯（じかんたい）責任者（せきにんしゃ）は日々（ひび）のオペレーションの中（なか）で、その時間帯（じかんたい）の店長（てんちょう）の職務（しょくむ）を代行（だいこう）する人（にん）と定義（ていぎ）されています。対象（たいしょう）時間帯（じかんたい）のQSCスタンダード維持（いじ）の責任者（せきにんしゃ）であり、従業員（じゅうぎょういん）の育成（いくせい）やトレーニングを含（ふく）むマネジメントもおこないます。調理（ちょうり）だけ、本部（ほんぶ）業務（ぎょうむ）だけという説明（せつめい）は誤（あやま）りです。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.6","tp":"1. 総論（そうろん）（2）店舗（てんぽ）を運営（うんえい）管理（かんり）する人（にん）とマネジメント","q":"時間帯（じかんたい）責任者（せきにんしゃ）が維持（いじ）すべきQSCについて、テキストの説明（せつめい）として正（ただ）しいものはどれか。","ch":["Q（品質（ひんしつ））のスタンダードだけを守（まも）っていれば、S（サービス）とCは自然（しぜん）に守（まも）られる","C（クリンリネス）は営業（えいぎょう）に直接（ちょくせつ）関係（かんけい）がないので、清掃（せいそう）作業（さぎょう）や補充（ほじゅう）点検（てんけん）作業（さぎょう）はすべて後回（あとまわ）しでよい","QとSのベースとなるのは、清掃（せいそう）作業（さぎょう）や補充（ほじゅう）点検（てんけん）作業（さぎょう）の徹底（てってい）によるC（クリンリネス）である"],"answer_index":2,"ex":"テキストは、Q（品質（ひんしつ））の維持（いじ）とS（接客（せっきゃく）サービス）の教育（きょういく）・トレーニングを徹底（てってい）し、それらのベースとなるのが清掃（せいそう）作業（さぎょう）や補充（ほじゅう）点検（てんけん）作業（さぎょう）の徹底（てってい）によるC＝クリンリネス（清潔（せいけつ）な状態（じょうたい））だと述（の）べています。Cを後回（あとまわ）しにするという説明（せつめい）は誤（あやま）りです。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.7","tp":"2. 店舗（てんぽ）運営（うんえい）に必要（ひつよう）な計数（けいすう）管理（かんり）（1）指数（しすう）用語（ようご）の定義（ていぎ）","q":"テキストで、店舗（てんぽ）責任者（せきにんしゃ）がコントロールできる指数（しすう）としてあげられていないものはどれか。","ch":["施設（しせつ）費（ひ）（家賃（やちん））","原価（げんか）率（りつ）","客（きゃく）単価（たんか）"],"answer_index":0,"ex":"テキストは、店舗（てんぽ）責任者（せきにんしゃ）がコントロールできるものは人（にん）時（とき）売上高（うりあげだか）、人（にん）時（とき）生産性（せいさんせい）、原価（げんか）率（りつ）、人（にん）時（とき）接客（せっきゃく）数（かず）（接客（せっきゃく）生産性（せいさんせい））、客数（きゃくすう）、客（きゃく）単価（たんか）であるとしています。家賃（やちん）などの施設（しせつ）費（ひ）は運営（うんえい）経費（けいひ）の内訳（うちわけ）としてあげられていますが、店舗（てんぽ）責任者（せきにんしゃ）がコントロールできる指数（しすう）には含（ふく）まれていません。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.7","tp":"2. 店舗（てんぽ）運営（うんえい）に必要（ひつよう）な計数（けいすう）管理（かんり）（1）指数（しすう）用語（ようご）の定義（ていぎ）","q":"「人（にん）時（とき）（マンアワー）」の意味（いみ）として正（ただ）しいものはどれか。","ch":["1人（にん）の作業者（さぎょうしゃ）が1時間（じかん）にこなす仕事量（しごとりょう）を表（あらわ）す単位（たんい）","1人（にん）のお客様（きゃくさま）が店（みせ）に滞在（たいざい）する時間（じかん）を表（あらわ）す単位（たんい）","1か月（がつ）に働（はたら）く社員（しゃいん）の人数（にんずう）を表（あらわ）す単位（たんい）"],"answer_index":0,"ex":"テキストでは、人（にん）時（とき）（マンアワー）は1人（にん）の作業者（さぎょうしゃ）が1時間（じかん）にこなす仕事量（しごとりょう）を表（あらわ）す単位（たんい）と説明（せつめい）されています。作業者（さぎょうしゃ）数（かず）と作業時間（さぎょうじかん）の積（せき）で計算（けいさん）され、必要（ひつよう）な工数（こうすう）の見積（みつ）もりや労働（ろうどう）投入量（とうにゅうりょう）の推計（すいけい）に使（つか）われます。お客様（きゃくさま）の滞在時間（たいざいじかん）や社員（しゃいん）数（かず）のことではありません。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.7","tp":"2. 店舗（てんぽ）運営（うんえい）に必要（ひつよう）な計数（けいすう）管理（かんり）（1）指数（しすう）用語（ようご）の定義（ていぎ）","q":"人（にん）時（とき）接客（せっきゃく）数（かず）（接客（せっきゃく）生産性（せいさんせい））について、テキストの説明（せつめい）として正（ただ）しいものはどれか。","ch":["数値（すうち）が低（ひく）ければ低（ひく）いほど多（おお）くのお客様（きゃくさま）に対応（たいおう）することになり、従業員（じゅうぎょういん）は忙（いそが）しくなる","一般的（いっぱんてき）にファストフード業界（ぎょうかい）は高（たか）くなり、フルサービスレストランでは低（ひく）くなる","一般的（いっぱんてき）にフルサービスレストランのほうが高（たか）く、ファストフード業界（ぎょうかい）では低（ひく）くなる"],"answer_index":1,"ex":"人（にん）時（とき）接客（せっきゃく）数（かず）は「客数（きゃくすう）÷総（そう）労働時間（ろうどうじかん）数（かず）」で計算（けいさん）し、1人（にん）当（あ）たり何人（なんにん）のお客様（きゃくさま）に対応（たいおう）したかを示（しめ）します。テキストは、一般的（いっぱんてき）にファストフード業界（ぎょうかい）は高（たか）く、客席（きゃくせき）でのフルサービスに労働時間（ろうどうじかん）を割（さ）かれるフルサービスレストランでは低（ひく）くなると説明（せつめい）しています。数値（すうち）が高（たか）いほど忙（いそが）しくなります。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.8","tp":"2. 店舗（てんぽ）運営（うんえい）に必要（ひつよう）な計数（けいすう）管理（かんり）（1）指数（しすう）用語（ようご）の定義（ていぎ）","q":"テキストにおける「粗利益（あらりえき）（荒利（あらり）益（えき））」の説明（せつめい）として正（ただ）しいものはどれか。","ch":["売上高（うりあげだか）から人件費（じんけんひ）を差し引（さしひ）いたもの","売上高（うりあげだか）に原価（げんか）を足（た）したもの","売上高（うりあげだか）から原価（げんか）を差し引（さしひ）いたもの"],"answer_index":2,"ex":"テキストは「粗利益（あらりえき）とは売上高（うりあげだか）から原価（げんか）を差し引（さしひ）いたもの」と定義（ていぎ）しています。また「売上高（うりあげだか）－原価（げんか）＝荒利（あらり）益（えき）」という公式（こうしき）も示（しめ）されています。人件費（じんけんひ）や家賃（やちん）は、粗利益（あらりえき）の中（なか）から支払（しはら）う諸経費（しょけいひ）です。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.8","tp":"2. 店舗（てんぽ）運営（うんえい）に必要（ひつよう）な計数（けいすう）管理（かんり）（1）指数（しすう）用語（ようご）の定義（ていぎ）","q":"労働分配率（ろうどうぶんぱいりつ）について、テキストの説明（せつめい）として正（ただ）しいものはどれか。","ch":["人件費（じんけんひ）÷粗利益（あらりえき）で計算（けいさん）し、フードサービス業（ぎょう）の適正値（てきせいち）は35〜40％である","人件費（じんけんひ）÷売上高（うりあげだか）で計算（けいさん）し、フードサービス業（ぎょう）の適正値（てきせいち）は10〜15％である","粗利益（あらりえき）÷人件費（じんけんひ）で計算（けいさん）し、フードサービス業（ぎょう）の適正値（てきせいち）は60〜70％である"],"answer_index":0,"ex":"テキストは「人件費（じんけんひ）÷粗利益（あらりえき）＝労働分配率（ろうどうぶんぱいりつ）」とし、フードサービス業（ぎょう）の適正値（てきせいち）は35〜40％と示（しめ）しています。この範囲（はんい）であれば継続（けいぞく）企業（きぎょう）として安定（あんてい）成長（せいちょう）が可能（かのう）とされます。なお本部（ほんぶ）やセントラルキッチンの費用（ひよう）も負担（ふたん）するため、店舗（てんぽ）では労働分配率（ろうどうぶんぱいりつ）を40％以下（いか）に低減（ていげん）させる必要（ひつよう）があります。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.8","tp":"2. 店舗（てんぽ）運営（うんえい）に必要（ひつよう）な計数（けいすう）管理（かんり）（1）指数（しすう）用語（ようご）の定義（ていぎ）","q":"テキストが示（しめ）す「企業（きぎょう）として支払（しはらい）える1時間（じかん）当（あ）たりの人件費（じんけんひ）」の求め方（もとめかた）として正（ただ）しいものはどれか。","ch":["人（にん）時（とき）売上高（うりあげだか）×原価（げんか）率（りつ）","人（にん）時（とき）接客（せっきゃく）数（かず）×客（きゃく）単価（たんか）","人（にん）時（とき）生産性（せいさんせい）×労働分配率（ろうどうぶんぱいりつ）"],"answer_index":2,"ex":"テキストは「人（にん）時（とき）生産性（せいさんせい）×労働分配率（ろうどうぶんぱいりつ）＝企業（きぎょう）として支払（しはらい）える1時間（じかん）当（あ）たりの人件費（じんけんひ）」と示（しめ）しています。人（にん）時（とき）生産性（せいさんせい）は1人（にん）1時間（じかん）当（あ）たりの粗利益（あらりえき）なので、そこに粗利益（あらりえき）に占（し）める人件費（じんけんひ）の割合（わりあい）（労働分配率（ろうどうぶんぱいりつ））を掛（か）けます。人（にん）時（とき）生産性（せいさんせい）は従業員（じゅうぎょういん）の賃金（ちんぎん）の源泉（げんせん）でもあると説明（せつめい）されています。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.8","tp":"2. 店舗（てんぽ）運営（うんえい）に必要（ひつよう）な計数（けいすう）管理（かんり）（1）指数（しすう）用語（ようご）の定義（ていぎ）","q":"テキストが廃棄（はいき）ロスの要因（よういん）としてあげているものの組み合（くみあ）わせとして正（ただ）しいものはどれか。","ch":["調理（ちょうり）ミス、家賃（やちん）の値上（ねあ）がり、電気代（でんきだい）や水道代（すいどうだい）の上昇（じょうしょう）、店（みせ）の前（まえ）を通（とう）る人（にん）の数（かず）の減少（げんしょう）、駐車場（ちゅうしゃじょう）や客席（きゃくせき）の数（かず）の不足（ふそく）","調理（ちょうり）ミス、オーダーミス、オーバーストックによる廃棄（はいき）、検収（けんしゅう）作業（さぎょう）がおろそかになった結果（けっか）の使（つか）えない食材（しょくざい）の在庫（ざいこ）","メニュー価格（かかく）の設定（せってい）ミス、看板（かんばん）や外装（がいそう）の劣化（れっか）、駐車場（ちゅうしゃじょう）や客席（きゃくせき）の不足（ふそく）、BGMの音量（おんりょう）の大（おお）きさや選曲（せんきょく）"],"answer_index":1,"ex":"テキストは廃棄（はいき）ロスの要因（よういん）を、調理（ちょうり）ミス、オーダーミス、オーバーストックによる廃棄（はいき）、検収（けんしゅう）（検品（けんぴん）収納（しゅうのう））作業（さぎょう）がおろそかになった結果（けっか）、使（つか）えない食材（しょくざい）を在庫（ざいこ）してしまうことに分（わ）けています。家賃（やちん）や電気代（でんきだい）、店（みせ）の広（ひろ）さは廃棄（はいき）ロスの要因（よういん）としてあげられていません。"}]},{"title":"店舗運営 学科 · भाग 2 (p.9–21)","words":[{"subject":"店舗運営","type":"学科","source":"店舗運営 p.9","tp":"2. 店舗（てんぽ）運営（うんえい）に必要（ひつよう）な計数（けいすう）管理（かんり）（1）指数（しすう）用語（ようご）の定義（ていぎ）","q":"テキストが示（しめ）す「原価（げんか）率（りつ）管理（かんり）のポイント」3点（てん）として正（ただ）しいものはどれ あげだか）を基準（きじゅん）にします。客（きゃく）単価（たんか）1,200円（えん）〜1,800円（えん）の業態（ぎょうたい）は企業（きぎょう）の考え方（かんがえかた）で使い分（つかいわ）けます。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.10","tp":"2. 店舗（てんぽ）運営（うんえい）に必要（ひつよう）な計数（けいすう）管理（かんり）（2）労働時間（ろうどうじかん）をコントロールするためには","q":"テキストが示（しめ）す郊外（こうがい）店（みせ）の繁忙（はんぼう）月（がつ）・閑散（かんさん）月（がつ）の対応（たいおう）として正（ただ）しいものはどれか。","ch":["繁忙（はんぼう）月（がつ）は人（にん）時（とき）接客（せっきゃく）数（かず）・人（にん）時（とき）売上高（うりあげだか）を高（たか）く設定（せってい）し、閑散（かんさん）月（がつ）はパート・アルバイトの労働時間（ろうどうじかん）を適正（てきせい）範囲（はんい）で減（へ）らす","閑散（かんさん）月（がつ）こそ人（にん）時（とき）接客（せっきゃく）数（かず）・人（にん）時（とき）売上高（うりあげだか）を高（たか）く設定（せってい）し、社員（しゃいん）の労働時間（ろうどうじかん）を増（ふ）やして売上高（うりあげだか）を確保（かくほ）する","繁忙（はんぼう）月（がつ）こそパート・アルバイトの労働時間（ろうどうじかん）を適正（てきせい）範囲（はんい）で減（へ）らし、社員（しゃいん）主体（しゅたい）のオペレーションに切り替（きりか）える"],"answer_index":0,"ex":"テキストは、繁忙（はんぼう）月（がつ）は売上高（うりあげだか）が大（おお）きいため生産性（せいさんせい）を高（たか）めて利益（りえき）を確保（かくほ）するよう人（にん）時（とき）接客（せっきゃく）数（かず）・人（にん）時（とき）売上高（うりあげだか）を高（たか）く設定（せってい）し、閑散（かんさん）月（がつ）はパート・アルバイトの労働時間（ろうどうじかん）を適正（てきせい）範囲（はんい）で減（へ）らして社員（しゃいん）主体（しゅたい）のオペレーションが可能（かのう）となる数値（すうち）を設定（せってい）すると説明（せつめい）しています。数値（すうち）を固定（こてい）するという説明（せつめい）は誤（あやま）りです。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.10","tp":"2. 店舗（てんぽ）運営（うんえい）に必要（ひつよう）な計数（けいすう）管理（かんり）（3）客数（きゃくすう）を増（ふ）やすとは","q":"客数（きゃくすう）を増（ふ）やすことについて、テキストの説明（せつめい）として正（ただ）しいものはどれか。","ch":["新規（しんき）顧客（こきゃく）の獲得（かくとく）だけを考（かんが）えればよく、固定（こてい）客（きゃく）のリピート率（りつ）は売上高（うりあげだか）に関係（かんけい）しないのでまったく考（かんが）えなくてよい","固定（こてい）客（きゃく）のリピート率（ひき）を上（あ）げる方法（ほうほう）は値引（ねび）きだけであり、QSCのブラッシュアップは客数（きゃくすう）の増加（ぞうか）にはまったく関係（かんけい）しない","固定（こてい）客（きゃく）のリピート率（りつ）の向上（こうじょう）と新規（しんき）顧客（こきゃく）の獲得（かくとく）の両方（りょうほう）があり、リピート率（りつ）向上（こうじょう）にはQSCのブラッシュアップが必要（ひつよう）である"],"answer_index":2,"ex":"テキストは「売上（うりあげ）＝客数（きゃくすう）×客（きゃく）単価（たんか）」なので客数（きゃくすう）を増（ふ）やすことは売上高（うりあげだか）を上（あ）げることになるとし、客数（きゃくすう）を増（ふ）やす方法（ほうほう）には固定（こてい）客（きゃく）のリピート率（りつ）向上（こうじょう）と新規（しんき）顧客（こきゃく）の獲得（かくとく）の両方（りょうほう）があると説明（せつめい）しています。リピート率（ひき）を上（あ）げるにはQ（品質（ひんしつ））S（サービスの質（しつ））C（清潔感（せいけつかん））のブラッシュアップが必要（ひつよう）で、新規（しんき）顧客（こきゃく）も口コミ（くちこみ）やSNSで増（ふ）えていきます。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.12","tp":"（参考（さんこう）3）計数（けいすう）管理（かんり）公式（こうしき）問題例（もんだいれい）","q":"テキストの計数（けいすう）管理（かんり）公式（こうしき）として正（ただ）しいものはどれか。","ch":["原価（げんか）率（りつ）＋人件費（じんけんひ）率（りつ）＝100％","原価（げんか）率（りつ）＋労働分配率（ろうどうぶんぱいりつ）＝100％","原価（げんか）率（りつ）＋荒利（あらり）益（えき）率（りつ）＝100％"],"answer_index":2,"ex":"テキストの公式（こうしき）には「原価（げんか）率（りつ）＋荒利（あらり）益（えき）率（りつ）＝100％」と示（しめ）されています。売上高（うりあげだか）100％から原価（げんか）を差し引（さしひ）いた残（のこ）りが荒利（あらり）益（えき）だからです。人件費（じんけんひ）率（りつ）や労働分配率（ろうどうぶんぱいりつ）はこの式（しき）に入（い）りません。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.17","tp":"3. 発注（はっちゅう）管理（かんり）と検収（けんしゅう）管理（かんり）（1）発注（はっちゅう）管理（かんり）と発注（はっちゅう）の仕組（しく）みづくりの参考（さんこう）例（れい）","q":"発注（はっちゅう）量（りょう）の求め方（もとめかた）について、テキストの説明（せつめい）として正（ただ）しいものはどれか。","ch":["各（かく）食材（しょくざい）の発注（はっちゅう）時点（じてん）での在庫（ざいこ）量（りょう）＋各（かく）食材（しょくざい）の適正（てきせい）在庫（ざいこ）量（りょう）＝各（かく）食材（しょくざい）の発注（はっちゅう）量（りょう）","各（かく）食材（しょくざい）の適正（てきせい）在庫（ざいこ）量（りょう）－各（かく）食材（しょくざい）の発注（はっちゅう）時点（じてん）での在庫（ざいこ）量（りょう）＝各（かく）食材（しょくざい）の発注（はっちゅう）量（りょう）","各（かく）食材（しょくざい）の適正（てきせい）在庫（ざいこ）量（りょう）×売上（うりあげ）計画（けいかく）＝各（かく）食材（しょくざい）の発注（はっちゅう）量（りょう）"],"answer_index":1,"ex":"テキストは「各（かく）食材（しょくざい）の適正（てきせい）在庫（ざいこ）量（りょう）－各（かく）食材（しょくざい）の発注（はっちゅう）時点（じてん）での在庫（ざいこ）量（りょう）＝各（かく）食材（しょくざい）の発注（はっちゅう）量（りょう）」として納入（のうにゅう）業者（ぎょうしゃ）別（べつ）におこなうと示（しめ）しています。適正（てきせい）在庫（ざいこ）量（りょう）は、売上（うりあげ）予測（よそく）の誤差（ごさ）と発注（はっちゅう）から納品（のうひん）までの売上（うりあげ）に対応（たいおう）した予備（よび）在庫（ざいこ）を見込（みこ）み、売上（うりあげ）計画（けいかく）の120％（精度（せいど）が高（たか）ければ110％でも可（か））に必要（ひつよう）な在庫（ざいこ）量（りょう）として求（もと）めます。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.18","tp":"3. 発注（はっちゅう）管理（かんり）と検収（けんしゅう）管理（かんり）（2）正（ただ）しい棚卸（たなおろ）しと検収（けんしゅう）作業（さぎょう）のポイント","q":"実地（じっち）棚卸（たなおろ）しのポイントについて、テキストの説明（せつめい）として誤（あやま）っているものはどれか。","ch":["納入（のうにゅう）業者（ぎょうしゃ）からのサンプルや不良品（ふりょうひん）は、あらかじめ処理（しょり）しておく","棚卸（たなおろ）しに必要（ひつよう）な秤（はかり）やメジャーカップなどは、あらかじめ用意（ようい）してから開始（かいし）する","空箱（からばこ）や空（そら）ケースも在庫（ざいこ）として数（かぞ）え、棚卸（たなおろし）表（おもて）に記入（きにゅう）する"],"answer_index":2,"ex":"テキストは「空箱（からばこ）や空（そら）ケースは捨（す）てる」と示（しめ）しており、在庫（ざいこ）として数（かぞ）えるのは誤（あやま）りです。他（ほか）の3つはいずれもテキストにある実地（じっち）棚卸（たなおろ）しのポイントです。なお実地（じっち）棚卸（たなおろ）しは、発注（はっちゅう）量（りょう）の決定（けってい）や在庫品（ざいこひん）の品質管理（ひんしつかんり）のために毎日（まいにち）実施（じっし）する必要（ひつよう）があります。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.18、p.19","tp":"3. 発注（はっちゅう）管理（かんり）と検収（けんしゅう）管理（かんり）（2）正（ただ）しい棚卸（たなおろ）しと検収（けんしゅう）作業（さぎょう）のポイント","q":"期末（きまつ）の棚卸（たなおろ）しのカウントと、集計（しゅうけい）・提出（ていしゅつ）のポイントについて、テキストの説明（せつめい）として正（ただ）しいものはどれか。","ch":["カウント担当者（たんとうしゃ）と記入（きにゅう）者（もの）の２人（にん）でおこない、復唱（ふくしょう）しながら進（すす）める","カウントは１人（にん）でおこない、未開封（みかいふう）の箱（はこ）の数（かず）だけを数（かぞ）えて記入（きにゅう）する","集計（しゅうけい）後（のち）のサインは不要（ふよう）で、提出（ていしゅつ）はいつでもよいことになっている"],"answer_index":0,"ex":"期末（きまつ）の棚卸（たなおろ）しでは、カウント担当者（たんとうしゃ）と記入（きにゅう）者（もの）の２人（にん）でおこなうことが望（のぞ）ましく、カウント担当者（たんとうしゃ）が在庫（ざいこ）を手（て）で指し示（さししめ）して数（かぞ）え、未開封（みかいふう）以外（いがい）はバラまで正確（せいかく）に数（かぞ）え、記入（きにゅう）者（もの）が確認（かくにん）して記入（きにゅう）します。２人（にん）は正確（せいかく）な品名（ひんめい）、量（りょう）を相互（そうご）確認（かくにん）し、互（たが）いに復唱（ふくしょう）しながらおこないます。集計（しゅうけい）では単位（たんい）と数量（すうりょう）、単価（たんか）、計算（けいさん）を確認（かくにん）し、担当者（たんとうしゃ）、立ち会（たちあ）い者（もの）、店長（てんちょう）のサインをして、決（き）められた日（にち）までに提出（ていしゅつ）します。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.20、p.21","tp":"4. 販売（はんばい）管理（かんり）","q":"セット割引（わりびき）商品（しょうひん）と時間帯（じかんたい）割引（わりびき）商品（しょうひん）について、テキストの説明（せつめい）として正（ただ）しいものはどれか。","ch":["時間帯（じかんたい）割引（わりびき）商品（しょうひん）は、ピークタイム用（よう）に置（お）いて回転率（かいてんりつ）を上（あ）げるものである","セット割引（わりびき）商品（しょうひん）は割安（わりやす）なので、料理（りょうり）の提供（ていきょう）が遅（おそ）くなり回転率（かいてんりつ）は下（さ）がる","セット割引（わりびき）商品（しょうひん）は注文（ちゅうもん）を集中（しゅうちゅう）させ、提供（ていきょう）が早（はや）くなり回転率（かいてんりつ）が上（あ）がる"],"answer_index":2,"ex":"セット割引（わりびき）商品（しょうひん）とは、数種（すうしゅ）の商品（しょうひん）をまとめて注文（ちゅうもん）すると割安（わりやす）になるよう設定（せってい）された価格（かかく）で販売（はんばい）することで、特（とく）にランチセットなどは注文（ちゅうもん）を集中（しゅうちゅう）させることができます。その結果（けっか）、料理（りょうり）の提供（ていきょう）が早（はや）くなり、回転率（かいてんりつ）が上（あ）がり売上（うりあ）が向上（こうじょう）します。時間帯（じかんたい）割引（わりびき）商品（しょうひん）は、アイドルタイム（食事時（しょくじどき）間帯（かんたい）以外（いがい））用（よう）に値引（ねび）き商品（しょうひん）を置（お）き、来店（らいてん）客（きゃく）の誘引（ゆういん）につなげるものです。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.20","tp":"4. 販売（はんばい）管理（かんり）","q":"メニューのABC分析（ぶんせき）について、テキストの説明（せつめい）として正（ただ）しいものはどれか。","ch":["全（ぜん）メニューを販売価格（はんばいかかく）の高（たか）い順（じゅん）に並（なら）べ、上（うえ）から順（じゅん）にA、B、Cの3つのグループに分（わ）け、価格帯（かかくたい）ごとの構成比（こうせいひ）を見（み）るものである","全（ぜん）メニューを原価（げんか）率（りつ）の低（ひく）い順（じゅん）に並（なら）べ、上（うえ）から順（じゅん）にA、B、Cの3つのグループに分（わ）け、利益（りえき）の出（で）やすさを比（くら）べていくものである","全（ぜん）メニューを売上（うりあげ）順（じゅん）又（また）は売（う）れ個数（こすう）順（じゅん）に並（なら）べ、トータルの70％を構成（こうせい）するメニューをA、70％から90％をB、90％から100％をCとする"],"answer_index":2,"ex":"テキストは、ABC分析（ぶんせき）を全（ぜん）メニューを売上（うりあげ）順（じゅん）又（また）は売（う）れ個数（こすう）順（じゅん）に並（なら）べ、トータルの70％を構成（こうせい）するメニューをA、70％から90％をB、90％から100％をCとする方法（ほうほう）と説明（せつめい）しています。この割合（わりあい）は各（かく）事業体（じぎょうたい）により変化（へんか）します。Cと判定（はんてい）されたメニューはあまり売（う）れないと判断（はんだん）し、次回（じかい）のメニュー改定（かいてい）から外（はず）す対象（たいしょう）になります。"}]},{"title":"店舗運営 学科 · भाग 3 (p.21–23)","words":[{"subject":"店舗運営","type":"学科","source":"店舗運営 p.21","tp":"4. 販売（はんばい）管理（かんり）","q":"割引券（わりびきけん）の使い方（つかいかた）として正（ただ）しいものはどれか。","ch":["来店（らいてん）したときに渡（わた）して、その日（にち）の会計（かいけい）を安（やす）くする","レジ精算（せいさん）のときに渡（わた）して、再来（さいらい）店（みせ）を促（うなが）す","固定（こてい）顧客（こきゃく）には渡（わた）さず、新規（しんき）顧客（こきゃく）だけに渡（わた）す"],"answer_index":1,"ex":"割引券（わりびきけん）の目的（もくてき）は再来（さいらい）店（みせ）を促（うなが）すことなので、レジ精算（せいさん）時（とき）に渡（わた）します。来店（らいてん）時（とき）に渡（わた）すと、単（たん）なる値引（ねび）きになり売上（うりあげ）を下（さ）げる要因（よういん）になります。渡（わた）す相手（あいて）を限定（げんてい）するという説明（せつめい）はテキストにありません。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.21","tp":"5. 顧客（こきゃく）管理（かんり）","q":"客数（きゃくすう）が減少傾向（げんしょうけいこう）になる主（おも）な原因（げんいん）として正（ただ）しいものはどれか。","ch":["予約客（よやくきゃく）の比率（ひりつ）が高（たか）くなること","アイドルタイムに割引（わりびき）商品（しょうひん）を置（お）くこと","固定（こてい）顧客（こきゃく）と準（じゅん）固定（こてい）顧客（こきゃく）が目減（めべ）りすること"],"answer_index":2,"ex":"客数（きゃくすう）が減（へ）る原因（げんいん）は、主（おも）に固定（こてい）顧客（こきゃく）（高頻度（こうひんど）来店（らいてん））と準（じゅん）固定（こてい）顧客（こきゃく）（ときどき来店（らいてん））の目減（めべ）りです。新規（しんき）顧客（こきゃく）の増加（ぞうか）や予約客（よやくきゃく）の増加（ぞうか）は客数（きゃくすう）を減（へ）らす原因（げんいん）ではありません。時間帯（じかんたい）割引（わりびき）は来店（らいてん）客（きゃく）の誘引（ゆういん）が目的（もくてき）です。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.21","tp":"5. 顧客（こきゃく）管理（かんり）","q":"準（じゅん）固定（こてい）顧客（こきゃく）を固定（こてい）顧客（こきゃく）にしていくために、まず大切（たいせつ）なことはどれか。","ch":["次（つぎ）の来店（らいてん）の予約（よやく）を、お帰（かえ）りのときに必（かなら）ず取（と）ってもらうようにする","顔（かお）をできるだけ思い出（おもいだ）し、固定（こてい）顧客（こきゃく）と同（おな）じようにあいさつする","飽（あ）きられないように、メニューを毎月（まいつき）すべて入れ替（いれか）える"],"answer_index":1,"ex":"準（じゅん）固定（こてい）顧客（こきゃく）の顔（かお）を思い出（おもいだ）して固定（こてい）顧客（こきゃく）と同（おな）じようにあいさつすれば、来店（らいてん）頻度（ひんど）が増（ふ）えていきます。値引（ねび）きや予約（よやく）の強制（きょうせい）、メニューの全面（ぜんめん）入れ替（いれか）えは、テキストに示（しめ）された方法（ほうほう）ではありません。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.21","tp":"4. 販売（はんばい）管理（かんり）","q":"ポイント制度（せいど）やＷＥＢサイト、宅配（たくはい）サービスについて、テキストの説明（せつめい）として正（ただ）しいものはどれか。","ch":["ポイント制度（せいど）は、新規（しんき）顧客（こきゃく）だけを対象（たいしょう）にした一回（いっかい）限（かぎ）りの値引（ねび）きである","ポイント制度（せいど）はお客様（きゃくさま）を囲（かこ）い込（こ）み、複数回（ふくすうかい）の来店（らいてん）を促（うなが）す施策（しさく）である","ＷＥＢサイトは既存（きぞん）客（きゃく）への案内（あんない）専用（せんよう）で、新規（しんき）顧客（こきゃく）の獲得（かくとく）には使（つか）えない"],"answer_index":1,"ex":"ポイント制度（せいど）はお客様（きゃくさま）を囲（かこ）い込（こ）むための施策（しさく）で、複数回（ふくすうかい）の来店（らいてん）を促（うなが）すものです。割引券（わりびきけん）とともにリピーターの獲得（かくとく）に有効（ゆうこう）です。ＷＥＢサイトは割引券（わりびきけん）などを張り付（はりつ）けることによって新規（しんき）顧客（こきゃく）を獲得（かくとく）する手段（しゅだん）として有効（ゆうこう）で、宅配（たくはい）サービスはＷＥＢと一体（いったい）で注文（ちゅうもん）を受（う）け、来店（らいてん）動機（どうき）がない人（にん）にも販売（はんばい）できるため新規（しんき）顧客（こきゃく）開拓（かいたく）につながります。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.22","tp":"6. 雇用（こよう）管理（かんり）","q":"労働時間（ろうどうじかん）の原則（げんそく）として正（ただ）しいものはどれか。","ch":["1日（にち）8時間（じかん）、1週（しゅう）40時間以内（じかんいない）","1日（にち）10時間（じかん）、1週（しゅう）45時間以内（じかんいない）","1日（にち）8時間（じかん）、1週（しゅう）48時間以内（じかんいない）"],"answer_index":0,"ex":"使用者（しようしゃ）は原則（げんそく）として1日（にち）8時間（じかん）、1週（しゅう）40時間以内（じかんいない）で働（はたら）かせなければなりません。なお、飲食店（いんしょくてん）などで常時使用（じょうじしよう）する労働者（ろうどうしゃ）が10人（にん）未満（みまん）の事業（じぎょう）場（ば）は、1週（しゅう）44時間（じかん）が上限（じょうげん）となります。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.22","tp":"6. 雇用（こよう）管理（かんり）","q":"法定（ほうてい）の労働時間（ろうどうじかん）を超（こ）えて働（はたら）いてもらうために必要（ひつよう）な手続（てつづ）きとして正（ただ）しいものはどれか。","ch":["使用者（しようしゃ）と従業員（じゅうぎょういん）代表（だいひょう）が36協定（きょうてい）を結（むす）び、労働（ろうどう）基準（きじゅん）監督（かんとく）署（しょ）に届け出（とどけで）る","延長（えんちょう）して働（はたら）く日（にち）ごとに、本人（ほんにん）から同意書（どういしょ）を書（か）いて店長（てんちょう）に出（だ）してもらう","使用者（しようしゃ）と従業員（じゅうぎょういん）代表（だいひょう）が協定（きょうてい）を結（むす）び、地域（ちいき）の消防署（しょうぼうしょ）に届け出（とどけで）る"],"answer_index":0,"ex":"労働基準法（ろうどうきじゅんほう）第（だい）36条（じょう）に基（もと）づく労使（ろうし）協定（きょうてい）（36協定（きょうてい））を締結（ていけつ）し、労働（ろうどう）基準（きじゅん）監督（かんとく）署（しょ）に届け出（とどけで）ることで労働時間（ろうどうじかん）を延長（えんちょう）できます。本部（ほんぶ）への報告（ほうこく）や本人（ほんにん）の同意書（どういしょ）、消防署（しょうぼうしょ）への届出（とどけで）では時間（じかん）を延長（えんちょう）できません。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.22","tp":"6. 雇用（こよう）管理（かんり）","q":"割増（わりまし）賃金（ちんぎん）率（りつ）の説明（せつめい）として正（ただ）しいものはどれか。","ch":["休日（きゅうじつ）労働（ろうどう）と深夜（しんや）労働（ろうどう）が重（おも）なるときは60%以上（いじょう）である","時間外（じかんがい）労働（ろうどう）と深夜（しんや）労働（ろうどう）が重（おも）なるときは25%以上（いじょう）である","月（がつ）60時間（じかん）を超（こ）える残業（ざんぎょう）と深夜（しんや）労働（ろうどう）が重（おも）なるときは50%以上（いじょう）である"],"answer_index":0,"ex":"休日（きゅうじつ）労働（ろうどう）と深夜（しんや）労働（ろうどう）が重（おも）なる場合（ばあい）は60%以上（いじょう）です。深夜（しんや）労働（ろうどう）のみは25%以上（いじょう）、時間外（じかんがい）労働（ろうどう）と深夜（しんや）労働（ろうどう）が重（おも）なる場合（ばあい）は50%以上（いじょう）、月（がつ）60時間（じかん）を超（こ）える残業（ざんぎょう）と深夜（しんや）労働（ろうどう）が重（おも）なる場合（ばあい）は75%以上（いじょう）です。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.22","tp":"6. 雇用（こよう）管理（かんり）","q":"36協定（きょうてい）で労働時間（ろうどうじかん）を延長（えんちょう）する場合（ばあい）の、原則（げんそく）の限度（げんど）として正（ただ）しいものはどれか。","ch":["1か月（がつ）45時間（じかん）、1年（ねん）360時間以内（じかんいない）","1か月（がつ）60時間（じかん）、1年（ねん）480時間以内（じかんいない）","1か月（がつ）45時間（じかん）、1年（ねん）720時間以内（じかんいない）"],"answer_index":0,"ex":"労働時間（ろうどうじかん）の延長（えんちょう）は、1か月（がつ）45時間（じかん）、1年（ねん）360時間以内（じかんいない）で定（さだ）めることが原則（げんそく）です。なお、残業（ざんぎょう）が月（がつ）60時間（じかん）を超（こ）えた部分（ぶぶん）は50%の割増（わりまし）賃金（ちんぎん）となります。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.22","tp":"6. 雇用（こよう）管理（かんり）","q":"休日（きゅうじつ）の与え方（あたえかた）として正（ただ）しいものはどれか。","ch":["どの週（しゅう）も1週間（しゅうかん）に2日（にち）、必（かなら）ず与（あた）えなければならない","1週間（しゅうかん）に1日（にち）、または4週間（しゅうかん）を通（つう）じて4日（にち）以上（いじょう）与（あた）える","休日（きゅうじつ）は4週間（しゅうかん）を通（つう）じて2日（にち）以上（いじょう）を与（あた）えれば足（た）りる"],"answer_index":1,"ex":"休日（きゅうじつ）は1週間（しゅうかん）に1日（にち）、もしくは4週間（しゅうかん）を通（つう）じて4日（にち）以上（いじょう）与（あた）えなければなりません。週（しゅう）2日（にち）が義務（ぎむ）ではなく、4週（しゅう）2日（にち）や月（がつ）1日（にち）では基準（きじゅん）を満（み）たしません。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.23","tp":"6. 雇用（こよう）管理（かんり）","q":"年次（ねんじ）有給休暇（ゆうきゅうきゅうか）について正（ただ）しいものはどれか。","ch":["雇（やと）い入（い）れの日（にち）から3か月（がつ）を過（す）ぎれば、出勤（しゅっきん）率（りつ）に関係（かんけい）なく必（かなら）ず発生（はっせい）する","10日（にち）以上（いじょう）の有給休暇（ゆうきゅうきゅうか）が付与（ふよ）される労働者（ろうどうしゃ）には、年（ねん）に3日取（ひどり）得（え）させる義務（ぎむ）がある","指定（してい）された日（にち）の休暇（きゅうか）が事業（じぎょう）の正常（せいじょう）な運営（うんえい）を妨（さまた）げる場合（ばあい）、使用者（しようしゃ）に時季（じき）変更（へんこう）権（けん）が認（みと）められる"],"answer_index":2,"ex":"労働者（ろうどうしゃ）が時季（じき）指定（してい）した日（にち）の取得（しゅとく）が事業（じぎょう）の正常（せいじょう）な運営（うんえい）を妨（さまた）げる場合（ばあい）、使用者（しようしゃ）には時季（じき）変更（へんこう）権（けん）（別（べつ）の日（にち）にしてもらう権利（けんり））が認（みと）められます。有給休暇（ゆうきゅうきゅうか）は雇（やと）い入（い）れの日（にち）から6か月経（げっけい）過（すご）し、全労（ぜんろう）働（どう）日（にち）の8割（わり）以上（いじょう）出勤（しゅっきん）した場合（ばあい）に発生（はっせい）します。10日（にち）以上（いじょう）付与（ふよ）される労働者（ろうどうしゃ）には年（ねん）5日（にち）の取得（しゅとく）義務（ぎむ）があり、取り消（とりけ）す権利（けんり）はありません。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.23","tp":"6. 雇用（こよう）管理（かんり）","q":"採用（さいよう）面接（めんせつ）の進め方（すすめかた）として正（ただ）しいものはどれか。","ch":["採用（さいよう）と決（き）めたら、その場（ば）ですぐ本人（ほんにん）に伝（つた）える","採用（さいよう）の場合（ばあい）でも、その場（ば）ではその旨（むね）を告（つ）げない","店（みせ）のルールは、採用（さいよう）が決（き）まってから初（はじ）めて説明（せつめい）する"],"answer_index":1,"ex":"採用（さいよう）の場合（ばあい）でも、関係（かんけい）部署（ぶしょ）の了承（りょうしょう）を得（え）るため、その場（ば）では採用（さいよう）を告（つ）げません。履歴書（りれきしょ）は写真（しゃしん）と本人（ほんにん）を見比（みくら）べて確認（かくにん）し、年齢（ねんれい）は証明書（しょうめいしょ）の提示（ていじ）を求（もと）めます。店（みせ）のルール（出退勤（しゅったいきん）、勤務（きんむ）態度（たいど）など）は面接（めんせつ）の中（なか）で説明（せつめい）し、守（まも）ってもらえるか確認（かくにん）します。"}]},{"title":"店舗運営 学科 · भाग 4 (p.23–31)","words":[{"subject":"店舗運営","type":"学科","source":"店舗運営 p.23","tp":"6. 雇用（こよう）管理（かんり）","q":"採用（さいよう）初日（しょにち）のオリエンテーションで、最初（さいしょ）に教（おし）える内容（ないよう）として正（ただ）しいものはどれか。","ch":["出退勤（しゅったいきん）の仕方（しかた）、制服（せいふく）の着用（ちゃくよう）や身（み）だしなみ、手洗（てあら）いなどのハウスルール","月間（げっかん）の売上（うりあげ）予算（よさん）の立（た）て方（ほう）と、原価（げんか）率（りつ）や人件費（じんけんひ）率（りつ）などの細（こま）かい管理（かんり）のしかた","パート・アルバイトの人事（じんじ）考課（こうか）の付け方（つけかた）や、時給（じきゅう）の細（こま）かい決め方（きめかた）"],"answer_index":0,"ex":"初日（しょにち）はオリエンテーションとハウスルール（出退勤（しゅったいきん）の仕方（しかた）、制服（せいふく）の着用（ちゃくよう）や身（み）だしなみ、手洗（てあら）いなどの衛生（えいせい）管理（かんり））から教（おし）えます。その後（のち）、ストアツアーで設備（せつび）や配置（はいち）を説明（せつめい）し、スタッフを紹介（しょうかい）します。原価（げんか）管理（かんり）や人事（じんじ）考課（こうか）は初日（しょにち）に教（おし）える内容（ないよう）ではありません。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.24","tp":"7. 人材（じんざい）の育成（いくせい）指導（しどう）","q":"スキルを教（おし）えるときの標準（ひょうじゅん）となる要素（ようそ）のうち、「量（りょう）」の説明（せつめい）として正（ただ）しいものはどれか。","ch":["どのレベルに仕上（しあ）げるのか","道具（どうぐ）をどのような順序（じゅんじょ）で使（つか）うのか","どこからどこまでが対象（たいしょう）範囲（はんい）か"],"answer_index":2,"ex":"「量（りょう）」はどこからどこまでが対象（たいしょう）範囲（はんい）かを示（しめ）します。「質（しつ）」はどのレベルに仕上（しあ）げるのか、「時間（じかん）」は完了（かんりょう）までの標準時間（ひょうじゅんじかん）、「手順（てじゅん）」は道具（どうぐ）をどのような順序（じゅんじょ）で使（つか）うのかです。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.24","tp":"7. 人材（じんざい）の育成（いくせい）指導（しどう）","q":"人材（じんざい）育成（いくせい）の基本（きほん）体系（たいけい）の説明（せつめい）として正（ただ）しいものはどれか。","ch":["教育（きょういく）は「反復（はんぷく）練習（れんしゅう）する」ことである","訓練（くんれん）は「反復（はんぷく）練習（れんしゅう）する」ことである","啓発（けいはつ）は「方向（ほうこう）付（つ）ける」ことである"],"answer_index":1,"ex":"基本（きほん）体系（たいけい）は、教育（きょういく）＝芽（め）を引き出（ひきだ）す、導入（どうにゅう）＝方向（ほうこう）付（つ）ける、訓練（くんれん）＝反復（はんぷく）練習（れんしゅう）する、啓発（けいはつ）＝開発（かいはつ）する、です。この段階（だんかい）は店（みせ）や職場（しょくば）の責任者（せきにんしゃ）（マネージャー）が担当（たんとう）する必要（ひつよう）があります。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.24","tp":"7. 人材（じんざい）の育成（いくせい）指導（しどう）","q":"サービスの3つの要素（ようそ）のうち、「言葉遣（ことばづか）い」のポイントとして正（ただ）しいものはどれか。","ch":["むずかしい敬語（けいご）をできるだけ多（おお）く使（つか）うことが重要（じゅうよう）である","決（き）められた文章（ぶんしょう）のとおりに言葉（ことば）を言（い）うことが重要（じゅうよう）である","声（こえ）の大（おお）きさやトーン、語調（ごちょう）といった言い方（いいかた）が重要（じゅうよう）である"],"answer_index":2,"ex":"サービスを表現（ひょうげん）する要素（ようそ）は「態度（たいど）・表情（ひょうじょう）・言葉遣（ことばづか）い」で、言葉遣（ことばづか）いのポイントは言葉（ことば）そのものではなく、声（こえ）の大（おお）きさやトーン、語調（ごちょう）といった言い方（いいかた）です。トーンは音質（おんしつ）や音（おと）の高低（こうてい）・抑揚（よくよう）、語調（ごちょう）は話（はな）すリズムや語尾（ごび）の強弱（きょうじゃく）を指（さ）します。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.25","tp":"7. 人材（じんざい）の育成（いくせい）指導（しどう）","q":"OJTとOFFJTの説明（せつめい）として正（ただ）しいものはどれか。","ch":["OJTは現場（げんば）でおこなう実地（じっち）訓練（くんれん）、OFFJTは現場（げんば）を離（はな）れておこなう集合（しゅうごう）教育（きょういく）である","OJTは本部（ほんぶ）でおこなう集合（しゅうごう）教育（きょういく）で、OFFJTは現場（げんば）でおこなう実地（じっち）訓練（くんれん）である","OFFJTは店舗（てんぽ）など現場（げんば）でサービスや作業（さぎょう）の技術（ぎじゅつ）を体得（たいとく）させる実地（じっち）訓練（くんれん）のことである"],"answer_index":0,"ex":"OJTは店舗（てんぽ）など現場（げんば）でサービスや作業（さぎょう）の技術（ぎじゅつ）を体得（たいとく）させる実地（じっち）訓練（くんれん）、OFFJTは理念（りねん）や知識（ちしき）を教（おし）える集合（しゅうごう）教育（きょういく）で現場（げんば）を離（はな）れておこないます。新人（しんじん）育成（いくせい）プログラムは両者（りょうしゃ）を組み合（くみあ）わせ、現場（げんば）に近（ちか）いトレーニーほどOJTの比率（ひりつ）を高（たか）めます。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.26","tp":"8. 防火（ぼうか）・防災（ぼうさい）管理（かんり）","q":"防火（ぼうか）管理者（かんりしゃ）について正（ただ）しいものはどれか。","ch":["だれを選（えら）んでもよく、資格（しかく）の取得（しゅとく）や消防（しょうぼう）機関（きかん）への選任（せんにん）の届出（とどけで）はとくに必要（ひつよう）ない","会社（かいしゃ）の本部（ほんぶ）に1人（にん）置（お）いておけばよく、それぞれの店舗（てんぽ）には置（お）かなくてもかまわない","店長（てんちょう）またはそれに匹敵（ひってき）する管理的（かんりてき）・監督（かんとく）的（てき）地位（ちい）の者（もの）を、店舗（てんぽ）ごとに選任（せんにん）する"],"answer_index":2,"ex":"防火（ぼうか）管理者（かんりしゃ）は店舗（てんぽ）ごとに配置（はいち）し、防火（ぼうか）管理業務（かんりぎょうむ）を適切（てきせつ）に遂行（すいこう）できる管理的（かんりてき）・監督（かんとく）的（てき）地位（ちい）にある店長（てんちょう）またはそれに匹敵（ひってき）する者（もの）である必要（ひつよう）があります。防火（ぼうか）管理（かんり）新規（しんき）講習（こうしゅう）などを受講（じゅこう）して資格（しかく）を持（も）ち、消防（しょうぼう）機関（きかん）へ選任（せんにん）届出（とどけで）をおこなうことも必要（ひつよう）です。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.26","tp":"8. 防火（ぼうか）・防災（ぼうさい）管理（かんり）","q":"燃焼（ねんしょう）三（さん）要素（ようそ）の組み合（くみあ）わせとして正（ただ）しいものはどれか。","ch":["可燃物（かねんぶつ）・酸素（さんそ）・熱源（ねつげん）","可燃物（かねんぶつ）・水（みず）・電気（でんき）","熱源（ねつげん）・煙（けむり）・炭酸（たんさん）ガス"],"answer_index":0,"ex":"燃焼（ねんしょう）三（さん）要素（ようそ）は可燃物（かねんぶつ）（燃（も）えるもの）、酸素（さんそ）（空気（くうき））、熱源（ねつげん）（ガスの炎（ほのお）、電気（でんき）の火花（ひばな）、過（か）加熱（かねつ）など）です。フライ用（よう）の油（あぶら）や排気（はいき）ダクトに溜（た）まった油（あぶら）にコンロの火（ひ）が引火（いんか）すると、一気（いっき）に火（ひ）が回（まわ）り火事（かじ）になります。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.27","tp":"8. 防火（ぼうか）・防災（ぼうさい）管理（かんり）","q":"消火（しょうか）方法（ほうほう）の説明（せつめい）として正（ただ）しいものはどれか。","ch":["除去（じょきょ）消火（しょうか）法（ほう）とは、火元（ひもと）に水（みず）をかけて熱（ねつ）を奪（うば）い、燃焼（ねんしょう）を止（や）める方法（ほうほう）である","窒息（ちっそく）消火（しょうか）法（ほう）とは、燃（も）えている油（あぶら）に布（ぬの）をかぶせて酸素（さんそ）を遮断（しゃだん）する方法（ほうほう）である","冷却（れいきゃく）消火（しょうか）法（ほう）とは、ガスの元栓（もとせん）を閉（し）めて燃（も）えるものを取（と）り去（さ）る方法（ほうほう）である"],"answer_index":1,"ex":"窒息（ちっそく）消火（しょうか）法（ほう）は、燃（も）えている油（あぶら）に布（ぬの）などをかぶせて酸素（さんそ）を遮断（しゃだん）する方法（ほうほう）です。除去（じょきょ）消火（しょうか）法（ほう）はガスの元栓（もとせん）を閉（し）めるなど燃（も）えるものを取（と）り去（さ）る方法（ほうほう）、冷却（れいきゃく）消火（しょうか）法（ほう）は水（みず）をかけて熱（ねつ）を奪（うば）う方法（ほうほう）、希釈（きしゃく）消火（しょうか）はアルコールを水（みず）で薄（うす）める方法（ほうほう）です。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.27","tp":"8. 防火（ぼうか）・防災（ぼうさい）管理（かんり）","q":"店舗（てんぽ）の防火（ぼうか）対策（たいさく）として正（ただ）しいものはどれか。","ch":["避難訓練（ひなんくんれん）は3年（ねん）に1回（かい）おこなえばよい","火災報知器（かさいほうちき）や煙（けむり）感知器（かんちき）が油（あぶら）で汚（よご）れていないか確認（かくにん）する必要（ひつよう）はない","年（ねん）に1回（かい）は避難訓練（ひなんくんれん）を実施（じっし）し、消火器（しょうかき）の使い方（つかいかた）も周知（しゅうち）する"],"answer_index":2,"ex":"年（ねん）に1回（かい）は避難訓練（ひなんくんれん）を実施（じっし）し、決（き）めておいた手順（てじゅん）と役割（やくわり）に従（したが）っておこない、消火器（しょうかき）の使い方（つかいかた）も周知（しゅうち）します。火災報知器（かさいほうちき）や煙（けむり）感知器（かんちき）の油（あぶら）汚（よご）れは点検（てんけん）が必要（ひつよう）で、死角（しかく）になりやすい場所（ばしょ）は整理（せいり）・整頓（せいとん）して可燃物（かねんぶつ）を置（お）きません。"},{"subject":"店舗運営","type":"学科","source":"店舗運営 p.31","tp":"（参考（さんこう）６）マネジメント基本用語（きほんようご）","q":"マネジメント基本用語（きほんようご）の説明（せつめい）として正（ただ）しいものはどれか。","ch":["人（にん）時（とき）売上高（うりあげだか）は、荒利（あらり）益（えき） ÷ 総（そう）労働時間（ろうどうじかん）数（かず）で求（もと）める","労働分配率（ろうどうぶんぱいりつ）は、荒利（あらり）益（えき） ÷ 人件費（じんけんひ）で求（もと）める","人（にん）時（とき）接客（せっきゃく）数（かず）は、客数（きゃくすう） ÷ 総（そう）労働時間（ろうどうじかん）数（かず）で求（もと）める"],"answer_index":2,"ex":"人（にん）時（とき）接客（せっきゃく）数（かず）は客数（きゃくすう）÷総（そう）労働時間（ろうどうじかん）数（かず）で、1人（にん）1時間（じかん）当（あ）たりの接客（せっきゃく）数（かず）です。人（にん）時（とき）売上高（うりあげだか）は売上高（うりあげだか）÷総（そう）労働時間（ろうどうじかん）数（かず）、人（にん）時（とき）生産性（せいさんせい）は荒利（あらり）益（えき）÷総（そう）労働時間（ろうどうじかん）数（かず）、労働分配率（ろうどうぶんぱいりつ）は人件費（じんけんひ）÷荒利（あらり）益（えき）です。"}]},{"title":"店舗運営 実技 · भाग 1 (p.5–9)","words":[{"subject":"店舗運営","type":"実技","source":"店舗運営 p.5","tp":"1. 総論（そうろん）（1）外食産業（がいしょくさんぎょう）の成功（せいこう）のポイント","q":"寒（さむ）い日（にち）に、常連（じょうれん）のお客様（きゃくさま）が小（ちい）さな声（こえ）で「温（あたた）かいお茶（ちゃ）がほしい」と言（い）った。新人（しんじん）スタッフは何（なに）もせず、あとで「マニュアルに書（か）いていないので出（だ）しませんでした」と報告（ほうこく）してきた。店長（てんちょう）としての指導（しどう）として最（もっと）も適切（てきせつ）なものはどれか。","ch":["マニュアルに書（か）いていない仕事（しごと）はしなくてよいので、そのままで問題（もんだい）ないと伝（つた）える","お客様（きゃくさま）の要望（ようぼう）はすべて店長（てんちょう）が聞（き）くので、今後（こんご）は自分（じぶん）で判断（はんだん）しないようにと伝（つた）える","マニュアルを超（こ）えた気配（きくば）りや個別対応（こべつたいおう）も大切（たいせつ）だと教（おし）え、次（つぎ）からは対応（たいおう）させる"],"answer_index":2,"ex":"テキストは、お客様（きゃくさま）の立場（たちば）に立（た）ったマニュアル（定型（ていけい）サービス）を超（こ）えた気配（きくば）りや、思（おも）いやりにあふれた個別対応（こべつたいおう）のサービスが求（もと）められると示（しめ）している。「お客様（きゃくさま）の喜（よろこ）びを自分（じぶん）の喜（よろこ）びとする心（こころ）」がホスピタリティであり、外食産業（がいしょくさんぎょう）を成功（せいこう）させるにはQSCA＋Hが必要（ひつよう）である。","jt":"判断試験"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.6","tp":"1. 総論（そうろん）（2）店舗（てんぽ）を運営（うんえい）管理（かんり）する人（にん）とマネジメント","q":"あなたはディナーの時間帯（じかんたい）責任者（せきにんしゃ）である。新人（しんじん）スタッフの盛（も）り付（つ）けやあいさつを見（み）ると、自店（じてん）で決（き）めたQSCのスタンダードとずれている。本人（ほんにん）は「前（まえ）の店（みせ）ではこうしていた」と言（い）っている。時間帯（じかんたい）責任者（せきにんしゃ）としてとるべき対応（たいおう）はどれか。","ch":["自店（じてん）のQSCのスタンダードを説明（せつめい）し、トレーニングして現場（げんば）で実行（じっこう）させる","前（まえ）の店（みせ）のやり方（ほう）も一（ひと）つの方法（ほうほう）なので、本人（ほんにん）のやりやすい形（かたち）に任（まか）せておく","スタンダードは本部（ほんぶ）が決（き）めるものなので、店（みせ）では何（なに）も直（なお）さずにこのまま続（つづ）けさせる"],"answer_index":0,"ex":"時間帯（じかんたい）責任者（せきにんしゃ）は、自店（じてん）の業態（ぎょうたい）や客（きゃく）単価（たんか）に見合（みあ）ったQSCのスタンダードを的確（てきかく）に理解（りかい）し、部下（ぶか）にトレーニングし、オペレーションをとおして顧客（こきゃく）接点（せってん）で具現化（ぐげんか）させる必要（ひつよう）がある。本人（ほんにん）任（まか）せにしたり、何（なに）も直（なお）さないままでは、自店（じてん）のスタンダードは維持（いじ）できない。","jt":"判断試験"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.7","tp":"2. 店舗（てんぽ）運営（うんえい）に必要（ひつよう）な計数（けいすう）管理（かんり）（1）指数（しすう）用語（ようご）の定義（ていぎ）","q":"ある店（みせ）の1日（にち）の売上高（うりあげだか）は420,000円（えん）、1日（にち）の総（そう）労働時間（ろうどうじかん）は84時間（じかん）であった。この日（にち）の人（にん）時（とき）売上高（うりあげだか）はいくらか。","ch":["4,200円（えん）","5,000円（えん）","5,600円（えん）"],"answer_index":1,"ex":"人（にん）時（とき）売上高（うりあげだか）は「1日（にち）の売上高（うりあげだか）÷1日（にち）の総（そう）労働時間（ろうどうじかん）」で求（もと）めます。420,000円（えん）÷84時間（じかん）＝5,000円（えん）です。従業員（じゅうぎょういん）1人（にん）が1時間（じかん）働（はたら）いていくらの売上高（うりあげだか）を作（つく）るかを示（しめ）す指数（しすう）です。","jt":"計画立案"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.7","tp":"2. 店舗（てんぽ）運営（うんえい）に必要（ひつよう）な計数（けいすう）管理（かんり）（1）指数（しすう）用語（ようご）の定義（ていぎ）","q":"ある店（みせ）の1日（にち）の客数（きゃくすう）は360人（にん）、1日（にち）の総（そう）労働時間（ろうどうじかん）は90時間（じかん）であった。この日（にち）の人（にん）時（とき）接客（せっきゃく）数（かず）（接客（せっきゃく）生産性（せいさんせい））は何人（なんにん）か。","ch":["2人（にん）","3人（にん）","4人（にん）"],"answer_index":2,"ex":"人（にん）時（とき）接客（せっきゃく）数（かず）は「客数（きゃくすう）÷総（そう）労働時間（ろうどうじかん）数（かず）」で求（もと）めます。360人（にん）÷90時間（じかん）＝4人（にん）です。従業員（じゅうぎょういん）1人（にん）が1時間（じかん）当（あ）たり何人（なんにん）のお客様（きゃくさま）に対応（たいおう）したかを示（しめ）す指数（しすう）です。","jt":"計画立案"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.7","tp":"2. 店舗（てんぽ）運営（うんえい）に必要（ひつよう）な計数（けいすう）管理（かんり）（1）指数（しすう）用語（ようご）の定義（ていぎ）","q":"あなたの店（みせ）では、あるべき人（にん）時（とき）接客（せっきゃく）数（かず）（接客（せっきゃく）生産性（せいさんせい））を4人（にん）としている。今週（こんしゅう）の実績（じっせき）を見（み）ると3人（にん）に下（さ）がっており、総（そう）労働時間（ろうどうじかん）が計画（けいかく）より増（ふ）えていた。店舗（てんぽ）責任者（せきにんしゃ）としてとるべき対応（たいおう）はどれか。","ch":["人（にん）時（とき）接客（せっきゃく）数（かず）は低（ひく）いほど効率（こうりつ）がよい指数（しすう）なので、今（いま）のままで問題（もんだい）ないと考（かんが）える","下（さ）がった原因（げんいん）を見（み）つけ、ワークスケジュールを見直（みなお）して対策（たいさく）を打（う）つ","数値（すうち）は本部（ほんぶ）が見（み）るものなので、店（みせ）では原因（げんいん）を調（しら）べずに営業（えいぎょう）を続（つづ）ける"],"answer_index":1,"ex":"店舗（てんぽ）責任者（せきにんしゃ）は、あるべき人（にん）時（とき）接客（せっきゃく）数（かず）（接客（せっきゃく）生産性（せいさんせい））を維持（いじ）しているかをウォッチし、低（ひく）くなればその原因（げんいん）を発見（はっけん）し対策（たいさく）を打（う）つことが仕事（しごと）である。人（にん）時（とき）接客（せっきゃく）数（かず）は客数（きゃくすう）÷総（そう）労働時間（ろうどうじかん）で求（もと）め、高（たか）いほど多（おお）くのお客様（きゃくさま）に対応（たいおう）していることになる。","jt":"判断試験"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.8","tp":"2. 店舗（てんぽ）運営（うんえい）に必要（ひつよう）な計数（けいすう）管理（かんり）（1）指数（しすう）用語（ようご）の定義（ていぎ）","q":"ある店（みせ）の1日（にち）の売上高（うりあげだか）は600,000円（えん）、1日（にち）の原価（げんか）は180,000円（えん）、1日（にち）の総（そう）労働時間（ろうどうじかん）は105時間（じかん）であった。この日（にち）の人（にん）時（とき）生産性（せいさんせい）はいくらか。","ch":["4,000円（えん）","5,714円（えん）","1,714円（えん）"],"answer_index":0,"ex":"まず粗利益（あらりえき）を求（もと）めます。売上高（うりあげだか）－原価（げんか）＝600,000円（えん）－180,000円（えん）＝420,000円（えん）です。次（つぎ）に人（にん）時（とき）生産性（せいさんせい）は「1日（にち）の粗利益（あらりえき）÷1日（にち）の総（そう）労働時間（ろうどうじかん）」なので、420,000円（えん）÷105時間（じかん）＝4,000円（えん）となります。5,714円（えん）は人（にん）時（とき）売上高（うりあげだか）（600,000円（えん）÷105時間（じかん））の計算（けいさん）です。","jt":"計画立案"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.8","tp":"2. 店舗（てんぽ）運営（うんえい）に必要（ひつよう）な計数（けいすう）管理（かんり）（1）指数（しすう）用語（ようご）の定義（ていぎ）","q":"ある店（みせ）の1か月（がつ）の粗利益（あらりえき）は840,000円（えん）、人件費（じんけんひ）は336,000円（えん）であった。この店（みせ）の労働分配率（ろうどうぶんぱいりつ）は何（なに）％か。また、テキストが示（しめ）す適正値（てきせいち）の範囲（はんい）に入（いっ）っているか。","ch":["30％で、適正値（てきせいち）の範囲（はんい）より低（ひく）い","40％で、適正値（てきせいち）の範囲（はんい）に入（いっ）っている","50％で、適正値（てきせいち）の範囲（はんい）を超（こ）えている"],"answer_index":1,"ex":"労働分配率（ろうどうぶんぱいりつ）は「人件費（じんけんひ）÷粗利益（あらりえき）」で求（もと）めます。336,000円（えん）÷840,000円（えん）＝0.4、つまり40％です。テキストが示（しめ）すフードサービス業（ぎょう）の適正値（てきせいち）は35〜40％なので、この店（みせ）は範囲内（はんいない）に入（いっ）っています。","jt":"計画立案"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.8","tp":"2. 店舗（てんぽ）運営（うんえい）に必要（ひつよう）な計数（けいすう）管理（かんり）（1）指数（しすう）用語（ようご）の定義（ていぎ）","q":"ある店（みせ）の当月（とうげつ）の売上高（うりあげだか）は2,400,000円（えん）、原価（げんか）高（たか）は780,000円（えん）であった。この店（みせ）の原価（げんか）率（りつ）は何（なに）％か。","ch":["30.0％","32.5％","67.5％"],"answer_index":1,"ex":"原価（げんか）率（りつ）は「原価（げんか）高（たか）÷売上高（うりあげだか）×100」で求（もと）めます。780,000円（えん）÷2,400,000円（えん）×100＝32.5％です。なお67.5％は荒利（あらり）益（えき）率（りつ）（100％－32.5％）です。","jt":"計画立案"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.8","tp":"2. 店舗（てんぽ）運営（うんえい）に必要（ひつよう）な計数（けいすう）管理（かんり）（1）指数（しすう）用語（ようご）の定義（ていぎ）","q":"同（おな）じメニューなのに、盛（も）り付（つ）ける食材（しょくざい）の量（りょう）がスタッフによってちがっている。今月（こんげつ）の原価（げんか）率（りつ）は先月（せんげつ）より上（あ）がっている。店長（てんちょう）としてとるべき対応（たいおう）はどれか。","ch":["決（き）められた分量（ぶんりょう）（ポーション）を守（まも）るよう、教育（きょういく）とトレーニングをおこなう","分量（ぶんりょう）は作（つく）る人（にん）の感覚（かんかく）に任（まか）せることにし、上（あ）がった原価（げんか）率（りつ）の分（ふん）はメニュー価格（かかく）を上（あ）げる","分量（ぶんりょう）はそのままにして、仕入先（しいれさき）を安（やす）い業者（ぎょうしゃ）に変（か）え、原価（げんか）率（りつ）が下（さ）がるのを待（ま）つ"],"answer_index":0,"ex":"マニュアルで定（さだ）められた分量（ぶんりょう）以上（いじょう）の食材（しょくざい）を使（つか）えばロスが発生（はっせい）し、原価（げんか）高（たか）が上（あ）がって原価（げんか）率（りつ）が上（あ）がる。その要因（よういん）は調理（ちょうり）作業員（さぎょういん）の教育（きょういく）とトレーニングの不足（ふそく）であり、原価（げんか）率（りつ）管理（かんり）のポイントはポーション（既定（きてい）の食材（しょくざい）使用量（しようりょう））を守（まも）ることである。","jt":"判断試験"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.8","tp":"2. 店舗（てんぽ）運営（うんえい）に必要（ひつよう）な計数（けいすう）管理（かんり）（1）指数（しすう）用語（ようご）の定義（ていぎ）","q":"月末（げつまつ）の棚卸（たなおろ）しで、新人（しんじん）が数（かぞ）えにくい在庫（ざいこ）を「だいたいこのくらい」と実際（じっさい）より少（すく）なめに書（か）いていた。本人（ほんにん）は「少（すこ）しの差（さ）なので問題（もんだい）ない」と言（い）っている。店長（てんちょう）としてとるべき対応（たいおう）はどれか。","ch":["少（すこ）しの差（さ）なら翌月（よくげつ）の数字（すうじ）で自然（しぜん）に戻（もど）るので、そのまま本部（ほんぶ）に報告（ほうこく）してよいと伝（つた）える","棚卸（たなおろ）しの数字（すうじ）は原価（げんか）管理（かんり）と関係（かんけい）がないので、書き方（かきかた）は本人（ほんにん）に任（まか）せてよいと伝（つた）える","棚卸（たなおろ）し額（ひたい）を少（すく）なく報告（ほうこく）すると実際（じっさい）原価（げんか）率（りつ）が上（あ）がるので、正確（せいかく）に数（かぞ）え直（なお）させる"],"answer_index":2,"ex":"棚卸（たなおろし）在庫（ざいこ）を月末（げつまつ）棚卸（たなおろ）し額（ひたい）として過少（かしょう）申告（しんこく）して報告（ほうこく）すれば、実際（じっさい）使用（しよう）額（ひたい）が増（ふ）えたように見（み）え、実際（じっさい）原価（げんか）率（りつ）が上（あ）がるという結果（けっか）になる。原価（げんか）率（りつ）管理（かんり）のポイントの一（ひと）つは棚卸（たなおろし）ミスをなくすことであり、正確（せいかく）に数（かぞ）え直（なお）させる必要（ひつよう）がある。","jt":"判断試験"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.9","tp":"2. 店舗（てんぽ）運営（うんえい）に必要（ひつよう）な計数（けいすう）管理（かんり）（1）指数（しすう）用語（ようご）の定義（ていぎ）","q":"ある店（みせ）の当月（とうげつ）売上高（うりあげだか）は8,000,000円（えん）であった。前月（ぜんげつ）末（まつ）棚卸（たなおろ）し額（ひたい）300,000円（えん）、当月（とうげつ）仕入額（しいれがく）2,500,000円（えん）、当月（とうげつ）末（まつ）棚卸（たなおろ）し額（ひたい）280,000円（えん）のとき、当月（とうげつ）の実際（じっさい）原価（げんか）率（りつ）は何（なに）％か。","ch":["27.8％","31.0％","31.5％"],"answer_index":2,"ex":"当月（とうげつ）実際（じっさい）原価（げんか）は「前月（ぜんげつ）末（まつ）棚卸（たなおろ）し額（ひたい）＋当月（とうげつ）仕入額（しいれがく）－当月（とうげつ）末（まつ）棚卸（たなおろ）し額（ひたい）」で求（もと）めます。300,000円（えん）＋2,500,000円（えん）－280,000円（えん）＝2,520,000円（えん）です。実際（じっさい）原価（げんか）率（りつ）は2,520,000円（えん）÷8,000,000円（えん）×100＝31.5％となります。","jt":"計画立案"}]},{"title":"店舗運営 実技 · भाग 2 (p.9–20)","words":[{"subject":"店舗運営","type":"実技","source":"店舗運営 p.9","tp":"2. 店舗（てんぽ）運営（うんえい）に必要（ひつよう）な計数（けいすう）管理（かんり）（2）労働時間（ろうどうじかん）をコントロールするためには","q":"客（きゃく）単価（たんか）1,000円（えん）のファミリーレストランで、来月（らいげつ）の月間（げっかん）売上高（うりあげだか）予算（よさん）を15,000,000円（えん）、その月（がつ）の人（にん）時（とき）接客（せっきゃく）数（かず）を5人（にん）と設定（せってい）した。人（にん）時（とき）接客（せっきゃく）数（かず）を基準（きじゅん）としたとき、月間（げっかん）計画（けいかく）総（そう）労働時間（ろうどうじかん）数（かず）は何時間（なんじかん）か。","ch":["2,500時間（じかん）","1,500時間（じかん）","3,000時間（じかん）"],"answer_index":2,"ex":"テキストの公式（こうしき）は「月間（げっかん）売上高（うりあげだか）予算（よさん）÷客（きゃく）単価（たんか）÷その月（がつ）の人（にん）時（とき）接客（せっきゃく）数（かず）＝月間（げっかん）計画（けいかく）総（そう）労働時間（ろうどうじかん）数（かず）」です。15,000,000円（えん）÷1,000円（えん）＝15,000人（にん）（計画（けいかく）客数（きゃくすう））、15,000人（にん）÷5人（にん）＝3,000時間（じかん）となります。客（きゃく）単価（たんか）1,200円（えん）以下（いか）の業態（ぎょうたい）なので人（にん）時（とき）接客（せっきゃく）数（かず）を基準（きじゅん）にします。","jt":"計画立案"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.9","tp":"2. 店舗（てんぽ）運営（うんえい）に必要（ひつよう）な計数（けいすう）管理（かんり）（2）労働時間（ろうどうじかん）をコントロールするためには","q":"客（きゃく）単価（たんか）2,000円（えん）の焼肉（やきにく）専門店（せんもんてん）で、来月（らいげつ）の月間（げっかん）売上高（うりあげだか）予算（よさん）を14,400,000円（えん）、その月（がつ）の人（にん）時（とき）売上高（うりあげだか）を6,000円（えん）と設定（せってい）した。人（にん）時（とき）売上高（うりあげだか）を基準（きじゅん）としたとき、月間（げっかん）計画（けいかく）総（そう）労働時間（ろうどうじかん）数（かず）は何時間（なんじかん）か。","ch":["2,400時間（じかん）","2,880時間（じかん）","1,200時間（じかん）"],"answer_index":0,"ex":"テキストの公式（こうしき）は「月間（げっかん）売上高（うりあげだか）予算（よさん）÷その月（がつ）の人（にん）時（とき）売上高（うりあげだか）＝月間（げっかん）計画（けいかく）総（そう）労働時間（ろうどうじかん）数（かず）」です。14,400,000円（えん）÷6,000円（えん）＝2,400時間（じかん）となります。1日（にち）の平均（へいきん）客（きゃく）単価（たんか）が1,800円（えん）を超（こ）える焼肉（やきにく）専門店（せんもんてん）などの業態（ぎょうたい）は、人（にん）時（とき）売上高（うりあげだか）を基準（きじゅん）にオペレーションを組（く）みます。","jt":"計画立案"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.10","tp":"2. 店舗（てんぽ）運営（うんえい）に必要（ひつよう）な計数（けいすう）管理（かんり）（4）客（きゃく）単価（たんか）を上（あ）げるとは","q":"ある店（みせ）では、お客様（きゃくさま）1人（にん）当（あ）たりの注文（ちゅうもん）点数（てんすう）が2.5点（てん）、一品（いっぴん）平均（へいきん）単価（たんか）が640円（えん）であった。この店（みせ）の客（きゃく）単価（たんか）はいくらか。","ch":["256円（えん）","1,600円（えん）","1,280円（えん）"],"answer_index":1,"ex":"テキストの公式（こうしき）「客（きゃく）単価（たんか）＝注文（ちゅうもん）点数（てんすう）×一品（いっぴん）平均（へいきん）単価（たんか）」を使（つか）います。2.5点（てん）×640円（えん）＝1,600円（えん）です。デザートのお勧（すす）めなどで注文（ちゅうもん）点数（てんすう）が増（ふ）えたり、一品（いっぴん）平均（へいきん）単価（たんか）が上（あ）がれば客（きゃく）単価（たんか）は上（あ）がります。","jt":"計画立案"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.12","tp":"（参考（さんこう）3）計数（けいすう）管理（かんり）公式（こうしき）問題例（もんだいれい）","q":"ある商品（しょうひん）の個別（こべつ）標準（ひょうじゅん）原価（げんか）は80円（えん）で、当月（とうげつ）の販売数（はんばいすう）は500個（こ）であった。前月（ぜんげつ）末（まつ）棚卸（たなおろ）し額（ひたい）12,000円（えん）、当月（とうげつ）仕入額（しいれがく）45,000円（えん）、当月（とうげつ）末（まつ）棚卸（たなおろ）し額（ひたい）14,000円（えん）のとき、当月（とうげつ）のロス額（ひたい）はいくらか。","ch":["3,000円（えん）","5,000円（えん）","43,000円（えん）"],"answer_index":0,"ex":"当月（とうげつ）標準（ひょうじゅん）原価（げんか）は80円（えん）×500個（こ）＝40,000円（えん）です。当月（とうげつ）実際（じっさい）原価（げんか）は12,000円（えん）＋45,000円（えん）－14,000円（えん）＝43,000円（えん）です。ロス額（ひたい）は「当月（とうげつ）実際（じっさい）原価（げんか）－当月（とうげつ）標準（ひょうじゅん）原価（げんか）」なので、43,000円（えん）－40,000円（えん）＝3,000円（えん）となります。プラスなのでロスです。","jt":"計画立案"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.12","tp":"（参考（さんこう）3）計数（けいすう）管理（かんり）公式（こうしき）問題例（もんだいれい）","q":"ある店（みせ）の当月（とうげつ）売上高（うりあげだか）は5,000,000円（えん）、当月（とうげつ）標準（ひょうじゅん）原価（げんか）は1,600,000円（えん）、当月（とうげつ）実際（じっさい）原価（げんか）は1,670,000円（えん）であった。当月（とうげつ）のロス率（りつ）は何（なに）％か。また、テキストの基準値（きじゅんち）内（ない）におさまっているか。","ch":["0.4％で、基準値（きじゅんち）内（ない）におさまっている","1.4％で、基準値（きじゅんち）を超（こ）えている","2.0％で、基準値（きじゅんち）を超（こ）えている"],"answer_index":1,"ex":"標準（ひょうじゅん）原価（げんか）率（りつ）は1,600,000円（えん）÷5,000,000円（えん）×100＝32.0％、実際（じっさい）原価（げんか）率（りつ）は1,670,000円（えん）÷5,000,000円（えん）×100＝33.4％です。ロス率（りつ）は「当月（とうげつ）実際（じっさい）原価（げんか）率（りつ）－当月（とうげつ）標準（ひょうじゅん）原価（げんか）率（りつ）」なので33.4％－32.0％＝1.4％です。基準値（きじゅんち）は±0.5％以内（いない）なので、この店（みせ）は基準値（きじゅんち）を超（こ）えています。","jt":"計画立案"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.12","tp":"（参考（さんこう）3）計数（けいすう）管理（かんり）公式（こうしき）問題例（もんだいれい）","q":"売価（ばいか）750円（えん）のメニューがある。原材料（げんざいりょう）は、主材（しゅざい）料（りょう）120円（えん）、ソース60円（えん）、添（そ）え野菜（やさい）45円（えん）である。このメニューの個別（こべつ）標準（ひょうじゅん）原価（げんか）率（りつ）と荒利（あらり）益（えき）額（ひたい）の組み合（くみあ）わせとして正（ただ）しいものはどれか。","ch":["標準（ひょうじゅん）原価（げんか）率（りつ）30.0％、荒利（あらり）益（えき）額（ひたい）525円（えん）","標準（ひょうじゅん）原価（げんか）率（りつ）33.3％、荒利（あらり）益（えき）額（ひたい）500円（えん）","標準（ひょうじゅん）原価（げんか）率（りつ）70.0％、荒利（あらり）益（えき）額（ひたい）225円（えん）"],"answer_index":0,"ex":"原価（げんか）合計（ごうけい）は120円（えん）＋60円（えん）＋45円（えん）＝225円（えん）です。個別（こべつ）標準（ひょうじゅん）原価（げんか）率（りつ）は「個別（こべつ）標準（ひょうじゅん）原価（げんか）÷そのメニューの価格（かかく）×100」なので、225円（えん）÷750円（えん）×100＝30.0％です。荒利（あらり）益（えき）額（ひたい）は「メニュー売価（ばいか）－原価（げんか）」で750円（えん）－225円（えん）＝525円（えん）、荒利（あらり）益（えき）率（りつ）は100％－30.0％＝70.0％となります。","jt":"計画立案"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.16","tp":"（参考（さんこう）3）計数（けいすう）管理（かんり）公式（こうしき）問題例（もんだいれい）","q":"ある店（みせ）の1日（にち）平均（へいきん）売上高（うりあげだか）は400,000円（えん）、1日（にち）平均（へいきん）実働時間（じつどうじかん）は100時間（じかん）である。売上高（うりあげだか）を変（か）えずに人（にん）時（とき）売上高（うりあげだか）を5,000円（えん）にするには、実働時間（じつどうじかん）を何時間（なんじかん）減（へ）らせばよいか。","ch":["15時間（じかん）","20時間（じかん）","25時間（じかん）"],"answer_index":1,"ex":"現状（げんじょう）の人（にん）時（とき）売上高（うりあげだか）は400,000円（えん）÷100時間（じかん）＝4,000円（えん）です。人（にん）時（とき）売上高（うりあげだか）を5,000円（えん）にするための実働時間（じつどうじかん）は400,000円（えん）÷5,000円（えん）＝80時間（じかん）です。現状（げんじょう）の100時間（じかん）－80時間（じかん）＝20時間（じかん）減（へ）らせばよいことになります。店長（てんちょう）ができることはワークスケジュール（実働時間（じつどうじかん））のコントロールです。","jt":"計画立案"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.17","tp":"3. 発注（はっちゅう）管理（かんり）と検収（けんしゅう）管理（かんり）（1）発注（はっちゅう）管理（かんり）と発注（はっちゅう）の仕組（しく）みづくりの参考（さんこう）例（れい）","q":"次回（じかい）納品（のうひん）までの売上（うりあげ）計画（けいかく）の合計（ごうけい）は1,000,000円（えん）である。予備（よび）在庫（ざいこ）として売上（うりあげ）計画（けいかく）の120％の売上（うりあげ）に必要（ひつよう）な在庫（ざいこ）量（りょう）を確保（かくほ）する。ある食材（しょくざい）は売上（うりあげ）10万円（まんえん）あたり3kg必要（ひつよう）で、発注（はっちゅう）時点（じてん）の在庫（ざいこ）量（りょう）は8kgである。この食材（しょくざい）の発注（はっちゅう）量（りょう）は何（なに）kgか。","ch":["22kg","36kg","28kg"],"answer_index":2,"ex":"まず必要（ひつよう）な売上（うりあげ）規模（きぼ）は1,000,000円（えん）×120％＝1,200,000円（えん）です。売上（うりあげ）10万円（まんえん）あたり3kg必要（ひつよう）なので、適正（てきせい）在庫（ざいこ）量（りょう）は12×3kg＝36kgです。発注（はっちゅう）量（りょう）は「適正（てきせい）在庫（ざいこ）量（りょう）－発注（はっちゅう）時点（じてん）での在庫（ざいこ）量（りょう）」なので、36kg－8kg＝28kgとなります。","jt":"計画立案"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.17","tp":"3. 発注（はっちゅう）管理（かんり）と検収（けんしゅう）管理（かんり）（1）発注（はっちゅう）管理（かんり）と発注（はっちゅう）の仕組（しく）みづくりの参考（さんこう）例（れい）","q":"明日（あした）は納入（のうにゅう）業者（ぎょうしゃ）の配送（はいそう）日（にち）である。冷凍庫（れいとうこ）を見（み）ると前回（ぜんかい）納品（のうひん）した食材（しょくざい）がまだ多（おお）く残（のこ）っているが、発注（はっちゅう）担当者（たんとうしゃ）はいつもと同（おな）じ量（りょう）を発注（はっちゅう）しようとしている。店長（てんちょう）としてとるべき対応（たいおう）はどれか。","ch":["品切（しなぎ）れが一番（いちばん）こわいので、在庫（ざいこ）が多（おお）くてもいつもどおりの量（りょう）を発注（はっちゅう）させる","適正（てきせい）在庫（ざいこ）量（りょう）から今（いま）の在庫（ざいこ）量（りょう）を引（ひ）いた量（りょう）を発注（はっちゅう）させ、過剰在庫（かじょうざいこ）を防（ふせ）ぐ","発注（はっちゅう）量（りょう）は業者（ぎょうしゃ）に決（き）めてもらい、多（おお）く届（とど）いた分（ふん）は翌週（よくしゅう）に使（つか）えばよいと考（かんが）える"],"answer_index":1,"ex":"過剰（かじょう）な食材（しょくざい）の在庫（ざいこ）は品質（ひんしつ）の劣化（れっか）を起（お）こしロスにつながるだけでなく、無駄（むだ）な仕入（しいれ）コストを増（ふ）やし、資金繰（しきんぐ）りにも悪影響（あくえいきょう）を与（あた）える。発注（はっちゅう）は「各（かく）食材（しょくざい）の適正（てきせい）在庫（ざいこ）量（りょう）－各（かく）食材（しょくざい）の発注（はっちゅう）時点（じてん）での在庫（ざいこ）量（りょう）＝各（かく）食材（しょくざい）の発注（はっちゅう）量（りょう）」としておこなう。","jt":"判断試験"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.19","tp":"3. 発注（はっちゅう）管理（かんり）と検収（けんしゅう）管理（かんり）（2）正（ただ）しい棚卸（たなおろ）しと検収（けんしゅう）作業（さぎょう）のポイント","q":"人気商品（にんきしょうひん）が夜（よる）のピーク前（まえ）に品切（しなぎ）れになり、お客様（きゃくさま）の注文（ちゅうもん）を断（た）った。同（おな）じことが今週（こんしゅう）すでに3回（かい）起（お）きている。店長（てんちょう）としてとるべき対応（たいおう）はどれか。","ch":["品切（しなぎ）れは仕方（しかた）がないので、注文（ちゅうもん）を断（ことわ）るときにていねいにあやまるだけにする","毎日（まいにち）の実地（じっち）棚卸（たなおろ）しをもとに、売上（うりあげ）予測（よそく）に合（あ）った発注（はっちゅう）量（りょう）へ見直（みなお）す","品切（しなぎ）れが続（つづ）くメニューは人気（にんき）がないと考（かんが）えて、メニュー表（おもて）から外（はず）してしまう"],"answer_index":1,"ex":"売（う）れたはずの商品（しょうひん）を売（う）り損（そこ）ねることを販売機（はんばいき）会（かい）損失（そんしつ）（チャンスロス）といい、頻繁（ひんぱん）に発生（はっせい）すれば顧客（こきゃく）満足（まんぞく）を損（そこ）ね、店（みせ）の信用（しんよう）を無（な）くして客数（きゃくすう）ダウンに繋（つな）がる。適正（てきせい）な発注（はっちゅう）は正確（せいかく）な実地（じっち）棚卸（たなおろ）しを元（もと）におこない、実地（じっち）棚卸（たなおろ）しは毎日（まいにち）実施（じっし）する必要（ひつよう）がある。","jt":"判断試験"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.20","tp":"3. 発注（はっちゅう）管理（かんり）と検収（けんしゅう）管理（かんり）（2）正（ただ）しい棚卸（たなおろ）しと検収（けんしゅう）作業（さぎょう）のポイント","q":"マグロの納品書（のうひんしょ）の数量（すうりょう）は10キロと記（しる）されていたが、実際（じっさい）に納入（のうにゅう）された現品（げんぴん）の数量（すうりょう）は7キロであった。検収（けんしゅう）時（とき）に気（き）づかず納品書（のうひんしょ）にサインした場合（ばあい）、キロ当（あ）たり4,000円（えん）のマグロならいくらのロスが発生（はっせい）しているか。","ch":["12,000円（えん）","28,000円（えん）","40,000円（えん）"],"answer_index":0,"ex":"不足（ふそく）数量（すうりょう）は10キロ－7キロ＝3キロです。3キロ×4,000円（えん）＝12,000円（えん）のロスとなります。これは食材（しょくざい）が劣化（れっか）した廃棄（はいき）ロスではなく、納品書（のうひんしょ）を元（もと）に請求（せいきゅう）された金額（きんがく）を支払（しはら）うことで発生（はっせい）する「見（み）えないロス」です。だから現品（げんぴん）の数量（すうりょう）を必（かなら）ず確認（かくにん）します。","jt":"計画立案"}]},{"title":"店舗運営 実技 · भाग 3 (p.20–23)","words":[{"subject":"店舗運営","type":"実技","source":"店舗運営 p.20","tp":"3. 発注（はっちゅう）管理（かんり）と検収（けんしゅう）管理（かんり）（2）正（ただ）しい棚卸（たなおろ）しと検収（けんしゅう）作業（さぎょう）のポイント","q":"あなたは時間帯（じかんたい）責任者（せきにんしゃ）である。マグロの納品時（のうひんじ）に検品（けんぴん）したところ、納品書（のうひんしょ）の数量（すうりょう）は12キロ、現品（げんぴん）の数量（すうりょう）も12キロで一致（いっち）し、品質（ひんしつ）にも問題（もんだい）はなかった。しかし発注（はっちゅう）書（かき）を見（み）ると発注（はっちゅう）数量（すうりょう）は10キロであった。このときの判断（はんだん）として最（もっと）も適切（てきせつ）なものはどれか。","ch":["納品書（のうひんしょ）の数量（すうりょう）と現品（げんぴん）の数量（すうりょう）が一致（いっち）しているので、発注（はっちゅう）書（かき）は確認（かくにん）せずにそのまま受け取（うけと）って納品書（のうひんしょ）にサインする","発注（はっちゅう）数量（すうりょう）より2キロ多（おお）いので問題（もんだい）であり、余分（よぶん）な2キロは廃棄（はいき）ロスと支払（しはら）い増（ぞう）につながることを踏（ふ）まえて業者（ぎょうしゃ）に確認（かくにん）する","多（おお）く納品（のうひん）された分（ふん）は次回（じかい）の発注（はっちゅう）量（りょう）から引（ひ）けばよいので、業者（ぎょうしゃ）への確認（かくにん）も記録（きろく）を残（のこ）すこともとくに必要（ひつよう）ない"],"answer_index":1,"ex":"検収（けんしゅう）ではA）発注（はっちゅう）数量（すうりょう）、B）納品書（のうひんしょ）の数量（すうりょう）、C）現品（げんぴん）の数量（すうりょう）と品質（ひんしつ）の3つを確認（かくにん）します。BとCが一致（いっち）していても、Aの発注（はっちゅう）数量（すうりょう）10キロより2キロ多（おお）く納品（のうひん）されている点（てん）が問題（もんだい）です。売上（うりあげ）予測（よそく）に基（もと）づく発注（はっちゅう）量（りょう）を超（こ）えた2キロは売（う）れずに劣化（れっか）して廃棄（はいき）ロスになり、業者（ぎょうしゃ）への支払（しはら）い額（ひたい）も増（ふ）えてしまいます。","jt":"判断試験"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.20","tp":"3. 発注（はっちゅう）管理（かんり）と検収（けんしゅう）管理（かんり）（2）正（ただ）しい棚卸（たなおろ）しと検収（けんしゅう）作業（さぎょう）のポイント","q":"マグロが納品（のうひん）された。納品書（のうひんしょ）の数量（すうりょう）は10キロだが、量（りょう）ってみると現品（げんぴん）は8キロしかない。配達員（はいたついん）は「急（いそ）いでいるので、先（さき）にサインしてほしい」と言（い）っている。時間帯（じかんたい）責任者（せきにんしゃ）としてとるべき対応（たいおう）はどれか。","ch":["その場（ば）で業者（ぎょうしゃ）に数量（すうりょう）のちがいを伝（つた）え、訂正（ていせい）されるまで納品書（のうひんしょ）にサインしない","配達員（はいたついん）が急（いそ）いでいるので、先（さき）にサインをして、あとから電話（でんわ）で業者（ぎょうしゃ）に伝（つた）える","現品（げんぴん）の品質（ひんしつ）に問題（もんだい）がなければ、数量（すうりょう）のちがいはメモに残（のこ）しておいてサインしてよい"],"answer_index":0,"ex":"検収（けんしゅう）では、A）発注（はっちゅう）数量（すうりょう）、B）納品書（のうひんしょ）の数量（すうりょう）、C）現品（げんぴん）の数量（すうりょう）と品質（ひんしつ）の3つを確認（かくにん）する。現品（げんぴん）の不足（ふそく）に気（き）づかずに納品書（のうひんしょ）にサインすれば、納品書（のうひんしょ）を元（もと）に請求（せいきゅう）された金額（きんがく）を支払（しはら）うことになり、2キロ分（ふん）の「見（み）えないロス」が発生（はっせい）する。","jt":"判断試験"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.20","tp":"3. 発注（はっちゅう）管理（かんり）と検収（けんしゅう）管理（かんり）（2）正（ただ）しい棚卸（たなおろ）しと検収（けんしゅう）作業（さぎょう）のポイント","q":"冷蔵（れいぞう）で納品（のうひん）された和牛（わぎゅう）ロース肉（にく）を確認（かくにん）すると、ドリップが出（で）ていて肉（にく）の色（いろ）も悪（わる）い。数量（すうりょう）は発注（はっちゅう）どおりで、納品書（のうひんしょ）とも合（あ）っている。時間帯（じかんたい）責任者（せきにんしゃ）としてとるべき対応（たいおう）はどれか。","ch":["数量（すうりょう）が合（あ）っているので受け取（うけと）り、状態（じょうたい）の悪（わる）い部分（ぶぶん）を切（き）り落（お）として使（つか）うことにする","品質（ひんしつ）の判断（はんだん）は調理（ちょうり）長（ちょう）の仕事（しごと）なので、確認（かくにん）をせずにそのまま冷蔵庫（れいぞうこ）へ収納（しゅうのう）しておく","その場（ば）で業者（ぎょうしゃ）に返品（へんぴん）して、基準（きじゅん）どおりの食材（しょくざい）をすぐに納品（のうひん）させる"],"answer_index":2,"ex":"納品時（のうひんじ）にドリップが出（で）た状態（じょうたい）であれば肉質（にくしつ）は劣化（れっか）しており、業者（ぎょうしゃ）にはその場（ば）で返品（へんぴん）して、すぐに基準（きじゅん）どおりの食材（しょくざい）を納品（のうひん）させる。品質（ひんしつ）基準（きじゅん）に合（あ）わない食材（しょくざい）は使い物（つかいもの）にならずロスとなり、店（みせ）としてのクオリティ（商品（しょうひん）の品質（ひんしつ））も維持（いじ）できない。","jt":"判断試験"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.21","tp":"5. 顧客（こきゃく）管理（かんり）","q":"毎週（まいしゅう）来（き）ていたお客様（きゃくさま）が、最近（さいきん）来（こ）なくなった。ほかにも来店（らいてん）の回数（かいすう）が減（へ）ったお客様（きゃくさま）がいて、店（みせ）全体（ぜんたい）の客数（きゃくすう）も減少傾向（げんしょうけいこう）である。店長（てんちょう）としてとるべき対応（たいおう）はどれか。","ch":["固定（こてい）顧客（こきゃく）の顔（かお）と好（この）みのメニューや席（せき）を覚（おぼ）え、あいさつに一言（ひとこと）を添（そ）える","客数（きゃくすう）の減少（げんしょう）は新規（しんき）顧客（こきゃく）が増（ふ）えないことだけが原因（げんいん）なので、広告（こうこく）だけを増（ふ）やす","来（こ）なくなったお客様（きゃくさま）には、次（つぎ）の来店（らいてん）から毎回（まいかい）値引（ねび）きをして呼（よ）び戻（もど）す"],"answer_index":0,"ex":"客数（きゃくすう）が減少傾向（げんしょうけいこう）となる原因（げんいん）は、主（おも）に固定（こてい）顧客（こきゃく）と準（じゅん）固定（こてい）顧客（こきゃく）の目減（めべ）りである。固定（こてい）顧客（こきゃく）の目減（めべ）りを減（へ）らすには、品質（ひんしつ）を落（お）とさないことを前提（ぜんてい）に、顔（かお）をしっかり覚（おぼ）えてあいさつの時（とき）に「いつもありがとうございます」の一言（ひとこと）を添（そ）え、好（この）みのメニューや席（せき）も覚（おぼ）えることが大切（たいせつ）である。","jt":"判断試験"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.22","tp":"6. 雇用（こよう）管理（かんり）","q":"時給（じきゅう）1,200円（えん）のアルバイトが、ある日（にち）に法定（ほうてい）の労働時間（ろうどうじかん）を超（こ）えて3時間（じかん）の時間外（じかんがい）労働（ろうどう）をした（深夜（しんや）の時間帯（じかんたい）にはかかっていない）。この3時間分（じかんぶん）に支払（しはら）う賃金（ちんぎん）はいくらか。","ch":["3,600円（えん）","4,200円（えん）","4,500円（えん）"],"answer_index":2,"ex":"時間外（じかんがい）労働（ろうどう）の割増（わりまし）賃金（ちんぎん）は25%以上（いじょう）です。1,200円（えん） × 1.25 ＝ 1,500円（えん）。1,500円（えん） × 3時間（じかん） ＝ 4,500円（えん）となります。割増（わりまし）をしない3,600円（えん）（1,200円（えん）×3時間（じかん））では不足（ふそく）です。","jt":"計画立案"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.22","tp":"6. 雇用（こよう）管理（かんり）","q":"時給（じきゅう）1,000円（えん）のアルバイトが、22時（とき）から24時（とき）までの2時間（じかん）働（はたら）いた。この2時間（じかん）は法定（ほうてい）労働時間（ろうどうじかん）を超（こ）えた時間外（じかんがい）労働（ろうどう）にあたる。この2時間分（じかんぶん）に支払（しはら）う賃金（ちんぎん）はいくらか。","ch":["2,500円（えん）","3,000円（えん）","3,500円（えん）"],"answer_index":1,"ex":"22時（とき）から翌朝（よくちょう）5時（とき）までは深夜（しんや）労働（ろうどう）です。時間外（じかんがい）労働（ろうどう）と深夜（しんや）労働（ろうどう）が重（おも）なる場合（ばあい）の割増（わりまし）賃金（ちんぎん）率（りつ）は50%以上（いじょう）なので、1,000円（えん） × 1.5 ＝ 1,500円（えん）。1,500円（えん） × 2時間（じかん） ＝ 3,000円（えん）です。深夜（しんや）のみの25%増（ぞう）（2,500円（えん））では不足（ふそく）します。","jt":"計画立案"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.22","tp":"6. 雇用（こよう）管理（かんり）","q":"時給（じきゅう）1,200円（えん）の従業員（じゅうぎょういん）が、休日（きゅうじつ）労働（ろうどう）として23時（とき）から翌日（よくじつ）2時（とき）までの3時間（じかん）働（はたら）いた。この3時間分（じかんぶん）に支払（しはら）う賃金（ちんぎん）はいくらか。","ch":["5,760円（えん）","5,400円（えん）","6,300円（えん）"],"answer_index":0,"ex":"休日（きゅうじつ）労働（ろうどう）と深夜（しんや）労働（ろうどう）が重（おも）なる場合（ばあい）の割増（わりまし）賃金（ちんぎん）率（りつ）は60%以上（いじょう）です。1,200円（えん） × 1.6 ＝ 1,920円（えん）。1,920円（えん） × 3時間（じかん） ＝ 5,760円（えん）となります。75%増（ぞう）（6,300円（えん））は、月（がつ）60時間（じかん）を超（こ）える残業（ざんぎょう）と深夜（しんや）労働（ろうどう）が重（おも）なる場合（ばあい）の率（りつ）です。","jt":"計画立案"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.22","tp":"6. 雇用（こよう）管理（かんり）","q":"あなたは常時使用（じょうじしよう）する労働者（ろうどうしゃ）が8人（にん）の飲食店（いんしょくてん）の店長（てんちょう）で、来週（らいしゅう）のシフトを作（つく）っている。1人（にん）の従業員（じゅうぎょういん）について、1週間（しゅうかん）の労働時間（ろうどうじかん）は原則（げんそく）として何時間（なんじかん）以内（いない）にすべきか。","ch":["40時間（じかん）","42時間（じかん）","44時間（じかん）"],"answer_index":2,"ex":"飲食店（いんしょくてん）（接客（せっきゃく）娯楽（ごらく）業（ぎょう））で常時使用（じょうじしよう）する労働者（ろうどうしゃ）が10人（にん）未満（みまん）の事業（じぎょう）場（ば）は、1週（しゅう）44時間以内（じかんいない）が原則（げんそく）です。一般（いっぱん）の原則（げんそく）は1週（しゅう）40時間（じかん）ですが、この店（みせ）は10人（にん）未満（みまん）なので44時間（じかん）が上限（じょうげん）になります。","jt":"計画立案"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.22","tp":"6. 雇用（こよう）管理（かんり）","q":"あなたはシフトを作（つく）っている。あるアルバイトの勤務（きんむ）は10時（とき）から19時（とき）30分（ふん）までで、休憩（きゅうけい）を除（のぞ）いた労働時間（ろうどうじかん）は8時間（じかん）30分（ふん）になる。休憩（きゅうけい）の与え方（あたえかた）として正（ただ）しいものはどれか。","ch":["始業（しぎょう）直後（ちょくご）の10時（とき）から11時（とき）に休憩（きゅうけい）を与（あた）える","14時（とき）から15時（とき）までの間（ま）に60分（ふん）の休憩（きゅうけい）を与（あた）える","14時（とき）に45分（ふん）の休憩（きゅうけい）を与（あた）える"],"answer_index":1,"ex":"労働時間（ろうどうじかん）が8時間（じかん）を超（こ）えるので、60分（ふん）以上（いじょう）の休憩（きゅうけい）が必要（ひつよう）です。また休憩（きゅうけい）は労働時間（ろうどうじかん）の途中（とちゅう）に与（あた）えなければならず、始業（しぎょう）直後（ちょくご）や終業（しゅうぎょう）直前（ちょくぜん）に設定（せってい）することはできません。45分（ふん）では8時間（じかん）超（ちょう）の基準（きじゅん）を満（み）たしません。","jt":"計画立案"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.22","tp":"6. 雇用（こよう）管理（かんり）","q":"週（しゅう）5日勤（にっきん）務（つとむ）のアルバイトが入社（にゅうしゃ）して6か月（がつ）になった。この6か月（がつ）の出勤（しゅっきん）率（りつ）は9割（わり）で、欠勤（けっきん）はほとんどない。この人（にん）に与（あた）える年次（ねんじ）有給休暇（ゆうきゅうきゅうか）の日数（にっすう）は何日（なんにち）か。","ch":["10日（にち）","7日（にち）","14日（にち）"],"answer_index":0,"ex":"雇（やと）い入（い）れの日（にち）から6か月（がつ）を経過（けいか）し、その期間（きかん）の全労（ぜんろう）働（どう）日（にち）の8割（わり）以上（いじょう）出勤（しゅっきん）すると有給休暇（ゆうきゅうきゅうか）が発生（はっせい）します。週（しゅう）5日（にち）以上（いじょう）（または週（しゅう）30時間（じかん）以上（いじょう））の一般（いっぱん）の労働者（ろうどうしゃ）は、勤続（きんぞく）0.5年（ねん）で10日（にち）が付与（ふよ）されます。14日（にち）は勤続（きんぞく）3.5年（ねん）の日数（にっすう）です。","jt":"計画立案"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.23","tp":"6. 雇用（こよう）管理（かんり）","q":"週（しゅう）の所定（しょてい）労働（ろうどう）日数（にっすう）が4日（にち）、週（しゅう）の所定（しょてい）労働時間（ろうどうじかん）が30時間（じかん）未満（みまん）のパート従業員（じゅうぎょういん）が、雇入（やといいれ）れの日（にち）から3年（ねん）6か月（がつ）継続（けいぞく）して勤務（きんむ）した。この人（にん）に与（あた）える年次（ねんじ）有給休暇（ゆうきゅうきゅうか）の日数（にっすう）は何日（なんにち）か。","ch":["7日（にち）","10日（にち）","12日（にち）"],"answer_index":1,"ex":"週（しゅう）30時間（じかん）未満（みまん）で週（しゅう）所定（しょてい）労働（ろうどう）日数（にっすう）4日（にち）の労働者（ろうどうしゃ）は、継続勤務（けいぞくきんむ）6か月（がつ）で7日（にち）、3年（ねん）6か月（がつ）で10日（にち）が付与（ふよ）されます。12日（にち）は4年（ねん）6か月（がつ）、15日（にち）は6年（ねん）6か月（がつ）以上（いじょう）の日数（にっすう）です。","jt":"計画立案"}]},{"title":"店舗運営 実技 · भाग 4 (p.23–28)","words":[{"subject":"店舗運営","type":"実技","source":"店舗運営 p.23","tp":"6. 雇用（こよう）管理（かんり）（4）採用（さいよう）面接（めんせつ）の仕方（しかた）","q":"アルバイトの採用（さいよう）面接（めんせつ）をしている。店（みせ）が採用（さいよう）したいのは平日（へいじつ）の昼（ひる）の時間帯（じかんたい）だが、応募者（おうぼしゃ）の希望（きぼう）は土日（どにち）の夜（よる）だけである。面接（めんせつ）での対応（たいおう）として最（もっと）も適切（てきせつ）なものはどれか。","ch":["希望（きぼう）が合（あ）わないので、その場（ば）ですぐに不採用（ふさいよう）であることを本人（ほんにん）に伝（つた）える","採用（さいよう）したい時間帯（じかんたい）は言（い）わずに採用（さいよう）し、入店（にゅうてん）後（のち）に平日（へいじつ）の昼（ひる）へ変更（へんこう）させる","希望（きぼう）時間帯（じかんたい）を変（か）えられるか確認（かくにん）し、店（みせ）のルールも説明（せつめい）して確認（かくにん）する"],"answer_index":2,"ex":"採用（さいよう）面接（めんせつ）では、採用（さいよう）したい時間帯（じかんたい）と希望（きぼう）時間帯（じかんたい）を確認（かくにん）し、合（あ）わない場合（ばあい）は希望（きぼう）時間帯（じかんたい）の変更（へんこう）が可能（かのう）か確認（かくにん）する。また、店（みせ）のルール（出退勤（しゅったいきん）、勤務（きんむ）態度（たいど）など）を説明（せつめい）し、守（まも）ってもらえるか確認（かくにん）する。なお、採用（さいよう）の場合（ばあい）でもその場（ば）でその旨（むね）は告（つ）げない。","jt":"判断試験"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.23","tp":"6. 雇用（こよう）管理（かんり）（3）年次（ねんじ）有給休暇（ゆうきゅうきゅうか）","q":"半年前（はんとしまえ）に年次（ねんじ）有給休暇（ゆうきゅうきゅうか）が10日付（ひづけ）与（くみ）されたパート従業員（じゅうぎょういん）が、まだ1日（にち）も取（と）っていない。本人（ほんにん）は「店（みせ）が忙（いそが）しいから今（いま）はいい」と言（い）っている。店長（てんちょう）としてとるべき対応（たいおう）はどれか。","ch":["本人（ほんにん）が希望（きぼう）していないのだから、有給休暇（ゆうきゅうきゅうか）は取（と）らせなくてよいと考（かんが）える","年（ねん）5日（にち）は取得（しゅとく）させる義務（ぎむ）があるので、本人（ほんにん）と話（はな）して取得（しゅとく）日（にち）を決（き）める","有給休暇（ゆうきゅうきゅうか）は本人（ほんにん）の自由（じゆう）なので、来年（らいねん）にまとめて取（と）るように伝（つた）えておく"],"answer_index":1,"ex":"使用者（しようしゃ）は、10日（にち）以上（いじょう）の年次（ねんじ）有給休暇（ゆうきゅうきゅうか）が付与（ふよ）される労働者（ろうどうしゃ）については、年（ねん）に5日（にち）の有給休暇（ゆうきゅうきゅうか）を取得（しゅとく）させる義務（ぎむ）が課（か）されている。本人（ほんにん）が希望（きぼう）しないからといって取（と）らせないままにすることはできない。","jt":"判断試験"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.25","tp":"7. 人材（じんざい）の育成（いくせい）指導（しどう）","q":"新人（しんじん）アルバイトに洗（あら）い場（ば）の作業（さぎょう）をOJTで教（おし）えている。手本（てほん）を見（み）せ、本人（ほんにん）にも一度（いちど）やってもらったが、まだ一人（ひとり）では正（ただ）しくできない。明日（あした）は忙（いそが）しくなる予定（よてい）である。トレーナーとしての対応（たいおう）として正（ただ）しいものはどれか。","ch":["新人（しんじん）3人（にん）をまとめて集（あつ）め、一度（いちど）に説明（せつめい）して終（お）わりにする","一人（ひとり）でできるようになるまで、マンツーマンで訓練（くんれん）を続（つづ）ける","残（のこ）りは現場（げんば）を離（はな）れた集合（しゅうごう）教育（きょういく）（OFFJT）にすべて任（まか）せる"],"answer_index":1,"ex":"OJTの原則（げんそく）は、トレーナー1人（にん）とトレーニー1人（にん）のマンツーマンで、トレーニーが一人（ひとり）でできるようになるまでおこなうことです。まとめての説明（せつめい）や集合（しゅうごう）教育（きょういく）は、現場（げんば）の作業（さぎょう）技術（ぎじゅつ）を体得（たいとく）させるOJTの代（か）わりにはなりません。","jt":"判断試験"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.25","tp":"7. 人材（じんざい）の育成（いくせい）指導（しどう）","q":"あなたはトレーナーとして、下（さ）げ物（もの）の仕方（しかた）をトレーニングしている。導入（どうにゅう）でトレーニーに興味（きょうみ）を持（も）たせ、なぜそうするかを解説（かいせつ）しながら手本（てほん）をやって見（み）せ終（お）わった。次（つぎ）におこなうステップとして正（ただ）しいものはどれか。","ch":["もう一度（いちど）上手（じょうず）に質問（しつもん）をして、トレーニーに強（つよ）く興味（きょうみ）を持（も）たせる","どのくらい理解（りかい）できたかをチェックし、フォローアップに結（むす）び付（つ）ける","トレーニーに実際（じっさい）にやらせてみて、手先（てさき）の使い方（つかいかた）や手順（てじゅん）を観察（かんさつ）する"],"answer_index":2,"ex":"トレーニングの4ステップは、導入（どうにゅう）（習（なら）う気持（きも）ちにさせる）→掲示（けいじ）（やって見（み）せる）→適用（てきよう）（やらせてみる）→フォローアップです。手本（てほん）を見（み）せた次（つぎ）は「適用（てきよう）」で、トレーニーにやってもらい、さりげなく、しかししっかり観察（かんさつ）します。理解度（りかいど）のチェックはその後（あと）です。","jt":"判断試験"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.25","tp":"7. 人材（じんざい）の育成（いくせい）指導（しどう）（6）トレーニングの4ステップ","q":"新人（しんじん）にグラス磨（みが）きを教（おし）えることになった。店（みせ）が忙（いそが）しいので、あなたは何（なに）も説明（せつめい）しないまま、いきなり「まずやってみて」と言（い）おうとしている。トレーナーとしての進め方（すすめかた）として正（ただ）しいものはどれか。","ch":["導入（どうにゅう）で興味（きょうみ）を持（も）たせ、手本（てほん）をやって見（み）せてから、本人（ほんにん）にやらせてみる","時間（じかん）がないので先（さき）に一人（ひとり）でやらせてみて、できないところだけあとで直（なお）す","紙（かみ）のマニュアルを渡（わた）して読（よ）ませ、読み終（よみお）わったら一人（ひとり）でやらせておく"],"answer_index":0,"ex":"トレーニングの4ステップは、①導入（どうにゅう）（トレーニーを習（なら）う気持（きも）ちにさせる）、②掲示（けいじ）（トレーナーがやって見（み）せる）、③適用（てきよう）（トレーニーにやらせてみる）、④的確（てきかく）にフォローアップする、の順（じゅん）である。いきなりやらせたり、マニュアルを渡（わた）すだけでは技術（ぎじゅつ）は体得（たいとく）できない。","jt":"判断試験"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.27","tp":"8. 防火（ぼうか）・防災（ぼうさい）管理（かんり）","q":"ランチのピークが終（お）わったころ、厨房（ちゅうぼう）のフライヤーの油（あぶら）に火（ひ）が上（あ）がった。まだ火（ひ）は小（ちー）さく、周（まわ）りに人（にん）はいない。最初（さいしょ）にとるべき行動（こうどう）として正（ただ）しいものはどれか。","ch":["毛布（もうふ）やシーツのような布（ぬの）をかぶせて、酸素（さんそ）を遮断（しゃだん）する","すぐに大量（たいりょう）の水（みず）をかけて冷（ひ）やす","フード内（ない）のダンパーを開（ひら）けて、煙（けむり）をダクトの外（そと）へ出（だ）す"],"answer_index":0,"ex":"火（ひ）が上（あ）がったフライヤーには、毛布（もうふ）やシーツのような布（ぬの）をかぶせて酸素（さんそ）を遮断（しゃだん）すると一気（いっき）に鎮火（ちんか）します（窒息（ちっそく）消火（しょうか）法（ほう））。水（みず）で薄（うす）める希釈（きしゃく）消火（しょうか）はアルコールの火（ひ）に用（もち）いる方法（ほうほう）で、油（あぶら）の火（ひ）に水（みず）は適（てき）しません。ダンパーは炎（ほのお）がダクト内（ない）に侵入（しんにゅう）しないためのシャッターです。","jt":"判断試験"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.27","tp":"8. 防火（ぼうか）・防災（ぼうさい）管理（かんり）","q":"店内（てんない）で火災（かさい）が起（お）き、客席（きゃくせき）に煙（けむり）が広（ひろ）がってきた。あなたはお客様（きゃくさま）の避難（ひなん）誘導（ゆうどう）を担当（たんとう）している。とるべき対応（たいおう）として正（ただ）しいものはどれか。","ch":["煙（けむり）は下（した）のほうにたまるので、体（からだ）を起（お）こして立ち上（たちあ）がり、出口（でぐち）に向（む）かって走（はし）って逃（に）げるよう案内（あんない）する","煙（けむり）は上（うえ）に上（あ）がるので、顔（かお）を床面（ゆかめん）に近（ちか）づけ、大（おお）きな透明（とうめい）のビニール袋（ふくろ）に顔（かお）を入（い）れて避難（ひなん）してもらう","煙（けむり）が消（き）えるまでは動（うご）かないほうが安全（あんぜん）なので、そのまま客席（きゃくせき）で待（ま）つようにお客様（きゃくさま）に伝（つた）える"],"answer_index":1,"ex":"火災（かさい）で命（いのち）を落（お）とす原因（げんいん）は焼死（しょうし）と有毒（ゆうどく）ガスによる死亡（しぼう）です。煙（けむり）は上（うえ）へ上（あ）がるので顔（かお）を床面（ゆかめん）に近（ちか）づけ、大（おお）きな透明（とうめい）のビニール袋（ふくろ）の中（なか）に顔（かお）を入（い）れて避難（ひなん）すると有毒（ゆうどく）ガスから身（み）を守（まも）れます。誘導（ゆうどう）灯（ともしび）は日（にち）ごろから点灯（てんとう）しているかチェックしておく必要（ひつよう）があります。","jt":"判断試験"},{"subject":"店舗運営","type":"実技","source":"店舗運営 p.28","tp":"8. 防火（ぼうか）・防災（ぼうさい）管理（かんり）（7）マニュアルの確認（かくにん）","q":"地震（じしん）のあと、厨房（ちゅうぼう）から火（ひ）が出（で）て店内（てんない）が混乱（こんらん）した。消防署（しょうぼうしょ）に電話（でんわ）する人（にん）もお客様（きゃくさま）を誘導（ゆうどう）する人（にん）も決（き）まっておらず、従業員（じゅうぎょういん）がばらばらに動（うご）いてしまった。店長（てんちょう）としてとるべき対応（たいおう）はどれか。","ch":["緊急時（きんきゅうじ）は各自（かくじ）がその場（ば）の判断（はんだん）で動（うご）くほうが早（はや）いので、役割（やくわり）はとくに決（き）めないでおく","通報（つうほう）、避難（ひなん）誘導（ゆうどう）、従業員（じゅうぎょういん）の役割分担（やくわりぶんたん）のマニュアルを確認（かくにん）し、全員（ぜんいん）に周知（しゅうち）する","通報（つうほう）と誘導（ゆうどう）はお客様（きゃくさま）に任（まか）せ、従業員（じゅうぎょういん）は自分（じぶん）の身（み）を守（まも）ることだけを考（かんが）える"],"answer_index":1,"ex":"テキストは、消防署（しょうぼうしょ）への通報（つうほう）マニュアル、お客様（きゃくさま）の避難（ひなん）誘導（ゆうどう）マニュアル、緊急時（きんきゅうじ）の従業員（じゅうぎょういん）役割分担（やくわりぶんたん）マニュアルを確認（かくにん）しておくよう示（しめ）している。火災（かさい）、地震（じしん）災害（さいがい）などの場合（ばあい）の通報（つうほう）連絡（れんらく）及（およ）び避難（ひなん）誘導（ゆうどう）は、防火（ぼうか）管理業務（かんりぎょうむ）の内容（ないよう）にも含（ふく）まれている。","jt":"判断試験"}]}];

/* ---------- course registry ---------- */
function joinMeaning(nepali, english){
  if(nepali && english) return nepali + ' (' + english + ')';
  return nepali || english || '';
}
function normalizeVocab(raw){
  return raw.map(item => ({
    term: item.term || item.kanji || '',
    reading: item.reading || item.hiragana || '',
    meaning: item.meaning || joinMeaning(item.nepali_meaning || item.nepali, item.english_meaning || item.english),
  }));
}
function normalizeVocabPages(rawPages){
  return rawPages.map(p => ({ title: p.title, words: normalizeVocab(p.words) }));
}
function normalizeQAItem(w){
  const choices = w.choices || w.ch || null;
  const idx = (w.answer_index !== undefined) ? w.answer_index : w.answerIndex;
  return {
    question: w.question || w.q || '',
    choices: choices,
    answer: choices ? choices[idx] : (w.answer || ''),
    explanation: w.explanation || w.ex || '',
    topic: w.topic || w.tp || '',
    subject: w.subject || '', type: w.type || '', source: w.source || '', jt: w.jt || '',
  };
}
function normalizeQAPages(rawPages){
  return rawPages.map(p => ({ title: p.title, words: p.words.map(normalizeQAItem) }));
}

function chunk(arr, size){ const out=[]; for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size)); return out; }
function getCourseLevels(course){ return course.pages ? course.pages.map(p=>p.words) : chunk(course.words, course.levelSize||15); }
function getLevelTitle(course, i){ return (course.pages && course.pages[i]) ? course.pages[i].title : null; }
function getAllWords(course){ return course.pages ? course.pages.flatMap(p=>p.words) : course.words; }
function isQACourse(course){ return course.type === 'qa'; }
function getCourseById(id){ return COURSES.find(c=>c.id===id) || COURSES[0]; }

/* ---------- progress persistence ---------- */
const STORAGE_KEY = 'n1kanji-notebook-progress-v2';
let PROGRESS = { courses: {} };

function courseState(courseId){
  if(!PROGRESS.courses[courseId]) PROGRESS.courses[courseId] = { unlockedLevels:1, clearedLevels:{}, wordStats:{} };
  return PROGRESS.courses[courseId];
}
async function loadProgress(){
  try{
    if(window.storage){
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value) PROGRESS = JSON.parse(res.value);
    } else {
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) PROGRESS = JSON.parse(raw);
    }
  }catch(e){ /* start fresh */ }
}
async function saveProgress(){
  try{
    if(window.storage){ await window.storage.set(STORAGE_KEY, JSON.stringify(PROGRESS), false); }
    else { localStorage.setItem(STORAGE_KEY, JSON.stringify(PROGRESS)); }
  }catch(e){ /* best effort */ }
}
function recordAnswer(courseId, key, correct){
  const s = courseState(courseId);
  const cur = s.wordStats[key] || { correct:0, wrong:0 };
  s.wordStats[key] = correct ? {...cur, correct: cur.correct+1} : {...cur, wrong: cur.wrong+1};
  saveProgress();
}
function markLevelCleared(courseId, levelIndex){
  const s = courseState(courseId);
  if(!s.clearedLevels[levelIndex]){ s.clearedLevels[levelIndex] = true; saveProgress(); }
}
function unlockNextLevel(courseId, maxLevels){
  const s = courseState(courseId);
  if(s.unlockedLevels < maxLevels){ s.unlockedLevels++; saveProgress(); }
}
function getCourseStats(courseId, words){
  const s = courseState(courseId);
  let mastered=0, learning=0;
  words.forEach(w=>{
    const key = w.term || w.question;
    const st = s.wordStats[key];
    if(!st) return;
    if(st.correct>=2 && st.correct>st.wrong) mastered++;
    else if(st.correct>0 || st.wrong>0) learning++;
  });
  return { mastered, learning, total: words.length, untouched: words.length - mastered - learning };
}

/* ---------- shuffle ---------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ---------- app state ---------- */
let state = {
  screen: 'courseSelect',
  course: null,
  mode: 'reading',
  levelIndex: 0,
  quiz: null,
};

function showScreen(name){
  document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  state.screen = name;
}

/* ---------- course select ---------- */
function renderCourseSelect(){
  const wrap = document.getElementById('courseList');
  wrap.innerHTML = '';
  COURSES.forEach(course=>{
    const levels = getCourseLevels(course);
    const el = document.createElement('button');
    el.className = 'course-card';
    el.style.width = '100%';
    el.style.border = '1px solid var(--line)';
    el.style.background = 'var(--card)';
    el.innerHTML = `
      <div class="course-icon">${course.icon||'学'}</div>
      <div style="flex:1; text-align:left;">
        <div class="course-title">${course.title}</div>
        <div class="course-sub">${course.subtitle}</div>
        <div class="course-meta">${getAllWords(course).length} शब्द · ${levels.length} तह</div>
      </div>
      <div class="chevron">›</div>
    `;
    el.addEventListener('click', ()=>{
      state.course = course;
      state.mode = course.forcedMode || (isQACourse(course) ? 'qa' : 'reading');
      renderHome();
      showScreen('home');
    });
    wrap.appendChild(el);
  });
}

const MODES = [

function renderHome(){
  const course = state.course;
  const isQA = isQACourse(course);
  const hasModeChoice = !isQA && !course.forcedMode;
  const levels = getCourseLevels(course);
  const allWords = getAllWords(course);
  const cs = courseState(course.id);
  const stats = getCourseStats(course.id, allWords);
  const unit = isQA ? 'प्रश्न' : 'शब्द';

  document.getElementById('homeBrandMark').textContent = course.icon || '語';
  document.getElementById('homeTitle').textContent = course.title;
  document.getElementById('homeSub').textContent = `${course.subtitle} · ${stats.total} ${unit}`;
  document.getElementById('statMastered').textContent = stats.mastered;
  document.getElementById('statLearning').textContent = stats.learning;
  document.getElementById('statNew').textContent = stats.untouched;

  const modeSection = document.getElementById('modeSection');
  if(!hasModeChoice){
    modeSection.style.display = 'none';
  } else {
    modeSection.style.display = 'block';
    const modeList = document.getElementById('modeList');
    modeList.innerHTML = '';
    MODES.forEach(m=>{
      const el = document.createElement('button');
      el.className = 'mode-opt' + (state.mode===m.key ? ' active' : '');
      el.style.width = '100%';
      el.style.textAlign = 'left';
      el.innerHTML = `<div class="radio"></div><div class="mode-opt-text">${m.label}</div>`;
      el.addEventListener('click', ()=>{ state.mode = m.key; renderHome(); });
      modeList.appendChild(el);
    });
  }

  const levelList = document.getElementById('levelList');
  levelList.innerHTML = '';
  levels.forEach((words, index)=>{
    const unlocked = index < cs.unlockedLevels;
    const cleared = !!cs.clearedLevels[index];
    const pageTitle = getLevelTitle(course, index);
    const start = index*(course.levelSize||15)+1;
    const end = start + words.length - 1;
    const btn = document.createElement('button');
    btn.className = 'level-card';
    btn.disabled = !unlocked;
    btn.innerHTML = `
      <div class="level-badge${cleared?' cleared':''}">${cleared?'✓':(index+1)}</div>
      <div class="level-info">
        <div class="level-title">${pageTitle ? pageTitle : 'तह '+(index+1)}</div>
        <div class="level-sub">${pageTitle ? words.length+' '+unit : unit+' '+start+'–'+end}</div>
      </div>
      ${unlocked ? '' : '<div class="lock-icon">🔒</div>'}
    `;
    if(unlocked){ btn.addEventListener('click', ()=> startLevel(index)); }
    levelList.appendChild(btn);
  });
}

document.getElementById('btnChangeCourse').addEventListener('click', ()=>{
  renderCourseSelect();
  showScreen('courseSelect');
});

/* ---------- quiz: mastery-loop engine ----------
   A level is only "finished" once every word in it has been answered
   correctly at least once in this session. Each round runs through the
   current pool of not-yet-mastered words (freshly shuffled); anything
   answered wrong stays in the pool (shuffled again) for the next round.
   This repeats until the pool is empty. */
function buildOptionsByField(correctVal, field, pool){
  const shuffled = shuffle(pool.filter(w => w[field] && w[field] !== correctVal));
  const seen = new Set();
  const distractors = [];
  for(const w of shuffled){
    if(distractors.length>=3) break;
    if(seen.has(w[field])) continue;
    seen.add(w[field]);
    distractors.push(w[field]);
  }
  return shuffle([correctVal, ...distractors]);
}

function startLevel(levelIndex){
  const course = state.course;
  const isQA = isQACourse(course);
  const levels = getCourseLevels(course);
  const levelWords = levels[levelIndex];
  const allWords = getAllWords(course);

  state.levelIndex = levelIndex;
  state.quiz = {
    isQA, allWords,
    totalCount: levelWords.length,
    masteredCount: 0,
    pool: shuffle(levelWords),
    idx: 0,
    round: 1,
    wrongThisRound: [],
    wordAttempts: {}, // key -> wrong count this session
    streak: 0,
    answered: false, selected: null, qMode: null, options: [],
  };
  showScreen('quiz');
  showQuestion();
}

function currentQMode(){
  const q = state.quiz;
  const course = state.course;
  if(q.isQA) return 'qa';
  if(course.forcedMode) return course.forcedMode;
  if(state.mode==='mixed') return Math.random()<0.5 ? 'reading':'meaning';
  return state.mode;
}

function showQuestion(){
  const q = state.quiz;
  q.answered = false; q.selected = null;

  document.getElementById('stamp1').classList.remove('show','wrong');
  document.getElementById('stamp2').classList.remove('show','wrong');
  document.getElementById('feedback').classList.remove('show');

  const pct = (q.masteredCount / q.totalCount) * 100;
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('countPill').textContent = q.masteredCount+'/'+q.totalCount+' मास्टर';
  document.getElementById('streakNum').textContent = q.streak;
  document.getElementById('roundPill').textContent = q.round > 1
    ? `राउन्ड ${q.round} — फेरि अभ्यास (${q.pool.length} वटा बाँकी)`
    : '';

  const item = q.pool[q.idx];
  q.qMode = currentQMode();
  const field = q.isQA ? 'answer' : (q.qMode==='meaning' ? 'meaning' : 'reading');
  const correctVal = item[field];
  q.options = (q.isQA && item.choices) ? shuffle(item.choices) : buildOptionsByField(correctVal, field, q.allWords);

  const vocabStage = document.getElementById('vocabStage');
  const qaStage = document.getElementById('qaStage');
  if(q.isQA){
    vocabStage.style.display='none'; qaStage.style.display='flex';
    document.getElementById('qaQuestion').textContent = item.question;
    document.getElementById('qaTag').textContent = 'सही उत्तर छान्नुहोस्' + (item.source ? ' · ' + item.source : '');
  } else {
    qaStage.style.display='none'; vocabStage.style.display='flex';
    document.getElementById('kanjiTag').textContent = q.qMode==='reading' ? 'यसको उच्चारण छान्नुहोस्' : 'यसको अर्थ छान्नुहोस्';
    document.getElementById('kanjiBig').textContent = item.term;
  }

  const wrap = document.getElementById('optionsWrap');
  wrap.innerHTML = '';
  q.options.forEach(val=>{
    const btn = document.createElement('button');
    btn.className = 'opt-btn' + (q.isQA ? ' qa' : (q.qMode==='meaning' ? ' small nepali' : ''));
    btn.textContent = val;
    btn.addEventListener('click', ()=> commitAnswer(val));
    wrap.appendChild(btn);
  });
}

function commitAnswer(pickedVal){
  const q = state.quiz;
  const course = state.course;
  if(q.answered) return;
  q.answered = true; q.selected = pickedVal;

  const item = q.pool[q.idx];
  const field = q.isQA ? 'answer' : (q.qMode==='meaning' ? 'meaning' : 'reading');
  const correctVal = item[field];
  const correct = pickedVal === correctVal;
  const key = item.term || item.question;

  document.querySelectorAll('#optionsWrap .opt-btn').forEach(b=>{
    b.setAttribute('disabled','true');
    if(b.textContent === correctVal) b.classList.add('correct');
    else if(b.textContent === pickedVal) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  recordAnswer(course.id, key, correct);

  let note = '';
  if(correct){
    q.masteredCount++; q.streak++;
  } else {
    q.streak = 0;
    q.wordAttempts[key] = (q.wordAttempts[key]||0) + 1;
    q.wrongThisRound.push(item);
    note = 'यो शब्द फेरि अर्को राउन्डमा सोधिनेछ, ठीक नभएसम्म।';
  }
  document.getElementById('streakNum').textContent = q.streak;

  const stampEl = q.isQA ? document.getElementById('stamp2') : document.getElementById('stamp1');
  stampEl.textContent = correct ? '合' : '否';
  stampEl.classList.toggle('wrong', !correct);
  stampEl.classList.add('show');

  const fbIcon = document.getElementById('fbIcon');
  const fbTitle = document.getElementById('fbTitle');
  fbIcon.className = 'fb-icon ' + (correct?'ok':'no');
  fbIcon.textContent = correct ? '✓' : '✕';
  fbTitle.className = 'fb-title ' + (correct?'ok':'no');
  fbTitle.textContent = correct ? 'ठीक छ! मास्टर भयो।' : 'अफसोस, सही जवाफ हेर्नुहोस्।';
  document.getElementById('fbNote').textContent = note;
  document.getElementById('fbReading').style.display = q.isQA ? 'none' : 'block';
  document.getElementById('fbReading').textContent = q.isQA ? '' : item.reading;
  document.getElementById('fbMeaning').textContent = q.isQA ? item.answer : item.meaning;
  const fbEx = document.getElementById('fbExplain');
  fbEx.textContent = (q.isQA && item.explanation) ? item.explanation : '';
  fbEx.style.display = (q.isQA && item.explanation) ? 'block' : 'none';
  document.getElementById('feedback').classList.add('show');
}

document.getElementById('btnIdk').addEventListener('click', ()=>{
  const q = state.quiz;
  if(q.answered) return;
  commitAnswer(null);
});

document.getElementById('btnQuitQuiz').addEventListener('click', ()=>{
  renderHome();
  showScreen('home');
});

document.getElementById('btnNext').addEventListener('click', ()=>{
  document.getElementById('feedback').classList.remove('show');
  const q = state.quiz;
  setTimeout(()=>{
    q.idx++;
    if(q.idx >= q.pool.length){
      // round complete — anything answered wrong this round becomes the next round
      if(q.wrongThisRound.length === 0){
        finishQuiz();
        return;
      }
      q.pool = shuffle(q.wrongThisRound);
      q.wrongThisRound = [];
      q.idx = 0;
      q.round++;
    }
    showQuestion();
  }, 180);
});

/* ---------- result ---------- */
function finishQuiz(){
  const q = state.quiz;
  const course = state.course;
  const isQA = q.isQA;
  const levels = getCourseLevels(course);
  const levelIndex = state.levelIndex;
  const unit = isQA ? 'प्रश्न' : 'शब्द';

  // Finishing the mastery loop always means every word was eventually
  // answered correctly, so the level is complete by definition.
  markLevelCleared(course.id, levelIndex);
  const cs = courseState(course.id);
  const isFrontier = levelIndex === cs.unlockedLevels - 1;
  const isLastLevel = levelIndex === levels.length - 1;
  if(isFrontier && !isLastLevel) unlockNextLevel(course.id, levels.length);

  const struggledKeys = Object.keys(q.wordAttempts);
  const totalMistakes = struggledKeys.reduce((sum,k)=> sum + q.wordAttempts[k], 0);

  document.getElementById('resultPct').textContent = q.totalCount;
  document.getElementById('resultFrac').textContent = unit + ' मास्टर भयो';
  const ring = document.getElementById('resultRing');
  ring.style.borderColor = struggledKeys.length===0 ? 'var(--moss)' : (struggledKeys.length <= q.totalCount/3 ? 'var(--gold)' : 'var(--seal)');

  let title = 'तह पूरा भयो! 🎉';
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultSub').textContent = struggledKeys.length===0
    ? `सबै ${q.totalCount} ${unit} एकै पटकमा सही भयो — उत्कृष्ट!`
    : `${struggledKeys.length} वटा ${unit}मा जम्मा ${totalMistakes} पटक गल्ती भयो, तर अन्ततः सबै मास्टर भयो।`;

  const unlockWrap = document.getElementById('unlockWrap');
  unlockWrap.innerHTML = '';
  if(isFrontier && !isLastLevel){
    const nextTitle = getLevelTitle(course, levelIndex+1);
    const nextCount = levels[levelIndex+1] ? levels[levelIndex+1].length : 0;
    const div = document.createElement('div');
    div.className = 'unlock-card';
    div.innerHTML = `
      <div class="unlock-title">तह ${levelIndex+1} पूरा भयो 🔓</div>
      <div class="unlock-sub">${nextTitle ? `अर्को खण्ड "${nextTitle}" (${nextCount} ${unit}) unlock भयो।` : `अर्को तह (तह ${levelIndex+2}) unlock भयो।`}</div>
    `;
    unlockWrap.appendChild(div);
  }

  const missWrap = document.getElementById('missWrap');
  missWrap.innerHTML = '';
  if(struggledKeys.length){
    const label = document.createElement('div');
    label.className = 'miss-label';
    label.textContent = 'गल्ती भएका ' + unit + 'हरू (धेरै गल्ती भएको माथि)';
    missWrap.appendChild(label);
    const sortedKeys = struggledKeys.sort((a,b)=> q.wordAttempts[b]-q.wordAttempts[a]);
    sortedKeys.forEach(key=>{
      const item = q.allWords.find(w => (w.term||w.question) === key);
      if(!item) return;
      const row = document.createElement('div');
      if(isQA){
        row.className = 'miss-qa';
        row.innerHTML = `<div class="miss-qa-q">${item.question}</div><div class="miss-qa-a">${item.answer}</div><div style="margin-top:6px;"><span class="miss-attempts">${q.wordAttempts[key]} पटक गल्ती</span></div>`;
      } else {
        row.className = 'miss-item';
        row.innerHTML = `<div class="miss-kanji">${item.term}</div><div class="miss-reading">${item.reading}</div><div class="miss-meaning nepali">${item.meaning}</div><div class="miss-attempts">${q.wordAttempts[key]}×</div>`;
      }
      missWrap.appendChild(row);
    });
  }

  showScreen('result');
}

document.getElementById('btnRetry').addEventListener('click', ()=> startLevel(state.levelIndex));
document.getElementById('btnResultHome').addEventListener('click', ()=>{ renderHome(); showScreen('home'); });

/* ---------- boot ---------- */
(async function boot(){
  await loadProgress();
  renderCourseSelect();
  showScreen('courseSelect');
})();
</script>
