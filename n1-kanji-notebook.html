う）する","ねずみは体（からだ）が大（おお）きいので、10cm以上（いじょう）のすき間（かん）がなければ施設（しせつ）に侵入（しんにゅう）できない"],"answer_index":0,"ex":"クマねずみは垂直（すいちょく）面（めん）の移動（いどう）が得意（とくい）で、天井（てんじょう）の配線（はいせん）、床（とこ）の配水管（はいすいかん）のすき間（かん）、パイプなど2cm程度（ていど）のすき間（かん）も通（とう）り抜（ぬ）けて侵入（しんにゅう）します。一方（いっぽう）、ドブねずみは上下（じょうげ）の動（うご）きが苦手（にがて）です。パイプ、配線（はいせん）と天井（てんじょう）、床（とこ）とのすき間（かん）は必（かなら）ず塞（ふさ）ぎます。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.25","tp":"４．一般的（いっぱんてき）な衛生（えいせい）管理（かんり）の基準（きじゅん）１４項目（こうもく）の詳細（しょうさい）（６）廃棄物（はいきぶつ）及（およ）び排水（はいすい）の取扱（とりあつか）い","q":"店舗（てんぽ）のゴミの取扱（とりあつか）いについて、正（ただ）しいものはどれか。","ch":["生（なま）ゴミや食品（しょくひん）残（のこ）さは水気（みずけ）をよくきり、ビニール袋（ふくろ）や専用（せんよう）容器（ようき）に密封（みっぷう）する","生（なま）ゴミの容器（ようき）はフタを外（はず）し、風通（かぜとお）しのよい調理場（ちょうりば）の隅（すみ）で保管（ほかん）する","瓶（かめ）や缶（かん）は中（なか）をすすがず、紙（かみ）の段ボール（だんぼーる）と同（おな）じ袋（ふくろ）にまとめて捨（す）てる"],"answer_index":0,"ex":"生（なま）ゴミや食品（しょくひん）残（のこ）さは水気（みずけ）をよくきり、液（えき）漏（も）れしないようビニール袋（ふくろ）や専用（せんよう）容器（ようき）に密封（みっぷう）します。容器（ようき）は洗浄（せんじょう）が簡単（かんたん）な専用（せんよう）のフタ付（つ）き容器（ようき）を用意（ようい）します。瓶（かめ）や缶（かん）は中（なか）をすすぎ洗（あら）いして分別（ふんべつ）し、分別（ふんべつ）のしかたは回収（かいしゅう）業者（ぎょうしゃ）や自治体（じちたい）のルールに従（したが）います。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.25","tp":"４．一般的（いっぱんてき）な衛生（えいせい）管理（かんり）の基準（きじゅん）１４項目（こうもく）の詳細（しょうさい）（６）廃棄物（はいきぶつ）及（およ）び排水（はいすい）の取扱（とりあつか）い","q":"施設（しせつ）の排水（はいすい）の取扱（とりあつか）いについて、正（ただ）しいものはどれか。","ch":["シンクの排水（はいすい）は床（とこ）に直接（ちょくせつ）流（なが）し、床（とこ）の清掃（せいそう）と一緒（いっしょ）におこなう","シンクや手洗（てあら）い器（き）の排水（はいすい）は、パイプで排水管（はいすいかん）や排水溝（はいすいこう）に流（なが）す","油脂（ゆし）類（るい）を多（おお）く含（ふく）む排水（はいすい）は、問題（もんだい）のない排水（はいすい）として扱（あつか）われる"],"answer_index":1,"ex":"シンクや手洗（てあら）い器（き）の排水（はいすい）は床（とこ）に直（すぐ）に流（なが）さず、パイプで排水管（はいすいかん）や排水溝（はいすいこう）に排水（はいすい）します。公共（こうきょう）の下水道（げすいどう）に放流（ほうりゅう）する場合（ばあい）は「下水道（げすいどう）法（ほう）」や自治体（じちたい）条例（じょうれい）による水質（すいしつ）基準（きじゅん）を守（まも）ることが求（もと）められます。油脂（ゆし）類（るい）を多（おお）く含（ふく）む排水（はいすい）は、問題（もんだい）となる排水（はいすい）の一（ひと）つです。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.25","tp":"４．一般的（いっぱんてき）な衛生（えいせい）管理（かんり）の基準（きじゅん）１４項目（こうもく）の詳細（しょうさい）（７）食品（しょくひん）等（など）取扱者（とりあつかいしゃ）の衛生（えいせい）管理（かんり）","q":"ノロウイルス食中毒（しょくちゅうどく）について、テキストの内容（ないよう）として正（ただ）しいものはどれか。","ch":["夏季（かき）に流行（りゅうこう）し、原因（げんいん）のほとんどは井戸（いど）水（みず）である","発生原因（はっせいげんいん）の約（やく）８０％は、食品（しょくひん）取扱者（とりあつかいしゃ）に由来（ゆらい）したものであるとの報告（ほうこく）がある","食品（しょくひん）取扱者（とりあつかいしゃ）の健康管理（けんこうかんり）よりも、施設（しせつ）の構造（こうぞう）の改善（かいぜん）が最（もっと）も重要（じゅうよう）である"],"answer_index":1,"ex":"ノロウイルスは冬季（とうき）に流行（りゅうこう）し、ノロウイルス食中毒（しょくちゅうどく）の発生原因（はっせいげんいん）の約（やく）８０％は食品（しょくひん）取扱者（とりあつかいしゃ）に由来（ゆらい）したものであるとの報告（ほうこく）があります。少量（しょうりょう）感染（かんせん）で発生（はっせい）するため、食品（しょくひん）取扱者（とりあつかいしゃ）の日常（にちじょう）の健康管理（けんこうかんり）と、食品（しょくひん）取扱者（とりあつかいしゃ）から食品（しょくひん）への二次（にじ）汚染（おせん）防止対策（ぼうしたいさく）が非常（ひじょう）に重要（じゅうよう）です。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.26","tp":"４．一般的（いっぱんてき）な衛生（えいせい）管理（かんり）の基準（きじゅん）１４項目（こうもく）の詳細（しょうさい）（７）食品（しょくひん）等（など）取扱者（とりあつかいしゃ）の衛生（えいせい）管理（かんり）","q":"食品（しょくひん）取扱者（とりあつかいしゃ）の毎日（まいにち）の健康管理（けんこうかんり）について、誤（あやま）っているものはどれか。","ch":["毎日（まいにち）の健康（けんこう）チェックは、朝礼（ちょうれい）などの機会（きかい）を活用（かつよう）して実施（じっし）する","腹痛（ふくつう）、下痢（げり）、おう吐（と）、吐き気（はきけ）などの症状（しょうじょう）や発熱（はつねつ）の有無（うむ）を確認（かくにん）する","検便（けんべん）（腸内（ちょうない）細菌（さいきん）検査（けんさ））をおこなえば、毎日（まいにち）の健康（けんこう）確認（かくにん）は必要（ひつよう）ない"],"answer_index":2,"ex":"検便（けんべん）（腸内（ちょうない）細菌（さいきん）検査（けんさ））は定期的（ていきてき）に実施（じっし）して、毎日（まいにち）の健康（けんこう）確認（かくにん）を補完（ほかん）するものです。毎日（まいにち）の健康（けんこう）チェックの代（か）わりにはなりません。ほかの３つはテキストに示（しめ）された確認（かくにん）方法（ほうほう）や確認項目（かくにんこうもく）です。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.26","tp":"４．一般的（いっぱんてき）な衛生（えいせい）管理（かんり）の基準（きじゅん）１４項目（こうもく）の詳細（しょうさい）（７）食品（しょくひん）等（など）取扱者（とりあつかいしゃ）の衛生（えいせい）管理（かんり）","q":"作業着（さぎょうぎ）や帽子（ぼうし）の取扱（とりあつか）いについて、正（ただ）しいものはどれか。","ch":["帽子（ぼうし）やインナーネットは、毛髪（もうはつ）の落下（らっか）による異物（いぶつ）混入（こんにゅう）を防（ふせ）ぐために着用（ちゃくよう）する","作業着（さぎょうぎ）のほころびや裂（さ）けは、見た目（みため）の問題（もんだい）だけなのでそのまま着用（ちゃくよう）してよい","調理場（ちょうりば）内（ない）には、作業（さぎょう）に直接（ちょくせつ）関係（かんけい）のない私物（しぶつ）を持ち込（もちこ）んでもよい"],"answer_index":0,"ex":"帽子（ぼうし）やインナーネットは、毛髪（もうはつ）の落下（らっか）による異物（いぶつ）混入（こんにゅう）を防止（ぼうし）するために着用（ちゃくよう）します。作業着（さぎょうぎ）のほころびや裂（さ）けは異物（いぶつ）混入（こんにゅう）の原因（げんいん）になるため、着用（ちゃくよう）前後（ぜんご）に必（かなら）ず確認（かくにん）します。調理場（ちょうりば）には私物（しぶつ）を持ち込（もちこ）まず、更衣室（こういしつ）はこまめに清掃（せいそう）します。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.27","tp":"４．一般的（いっぱんてき）な衛生（えいせい）管理（かんり）の基準（きじゅん）１４項目（こうもく）の詳細（しょうさい）（７）食品（しょくひん）等（など）取扱者（とりあつかいしゃ）の衛生（えいせい）管理（かんり）","q":"マスクの着用（ちゃくよう）について、正（ただ）しいものはどれか。","ch":["盛（も）り付（つ）けなど、食品（しょくひん）に直接（ちょくせつ）触（ふ）れる作業（さぎょう）の時（とき）は必（かなら）ず着用（ちゃくよう）する","マスクは主（おも）に、毛髪（もうはつ）の落下（らっか）を防（ふせ）ぐために着用（ちゃくよう）する","作業中（さぎょうちゅう）のくしゃみは飛散（ひさん）しないので、マスクの効果（こうか）はない"],"answer_index":0,"ex":"食品（しょくひん）に直接（ちょくせつ）触（ふ）れる作業時（さぎょうじ）はマスクを必（かなら）ず着用（ちゃくよう）し、鼻（はな）や口（くち）を出（だ）さないように着（つ）けます。マスクは黄色（きいろ）ブドウ球菌（きゅうきん）などの細菌（さいきん）汚染（おせん）の防止（ぼうし）と、くしゃみなどをした際（さい）の細菌（さいきん）や唾液（だえき）の飛散（ひさん）を防（ふせ）ぐために効果的（こうかてき）です。毛髪（もうはつ）の落下（らっか）防止（ぼうし）は帽子（ぼうし）やインナーネットの役割（やくわり）です。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.27","tp":"４．一般的（いっぱんてき）な衛生（えいせい）管理（かんり）の基準（きじゅん）１４項目（こうもく）の詳細（しょうさい）（７）食品（しょくひん）等（など）取扱者（とりあつかいしゃ）の衛生（えいせい）管理（かんり）","q":"履物（はきもの）の取扱（とりあつか）いについて、誤（あやま）っているものはどれか。","ch":["調理場（ちょうりば）用（よう）、トイレ用（よう）など、それぞれ専用（せんよう）の履物（はきもの）を使用（しよう）する","調理場（ちょうりば）用（よう）の靴（くつ）は、作業終了（さぎょうしゅうりょう）後（のち）に靴底（くつぞこ）まで洗浄（せんじょう）・消毒（しょうどく）する","靴箱（くつばこ）は汚染（おせん）を受（う）けにくいので、清掃（せいそう）や消毒（しょうどく）は必要（ひつよう）ない"],"answer_index":2,"ex":"靴箱（くつばこ）も汚染（おせん）を受（う）けやすいので、清掃（せいそう）実施日（じっしび）を定（さだ）めて清掃（せいそう）や消毒（しょうどく）をおこないます。履物（はきもの）は調理場（ちょうりば）用（よう）、汚染（おせん）区域（くいき）や非（ひ）汚染（おせん）区域（くいき）用（よう）、トイレ用（よう）などを使い分（つかいわ）け、作業終了（さぎょうしゅうりょう）後（のち）に靴底（くつぞこ）まで洗浄（せんじょう）・消毒（しょうどく）して専用（せんよう）の靴箱（くつばこ）で保管（ほかん）します。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.27","tp":"４．一般的（いっぱんてき）な衛生（えいせい）管理（かんり）の基準（きじゅん）１４項目（こうもく）の詳細（しょうさい）（７）食品（しょくひん）等（など）取扱者（とりあつかいしゃ）の衛生（えいせい）管理（かんり）","q":"使い捨（つかいす）て手袋（てぶくろ）の使い方（つかいかた）として、正（ただ）しいものはどれか。","ch":["手洗（てあら）いをする代（か）わりに、使い捨（つかいす）て手袋（てぶくろ）を着用（ちゃくよう）する","汚（よご）れていなければ、一度（いちど）使（つか）った手袋（てぶくろ）を洗（あら）って再使用（さいしよう）する","汚染（おせん）作業（さぎょう）から非（ひ）汚染（おせん）作業（さぎょう）に変（か）わる時（とき）は、手袋（てぶくろ）を交換（こうかん）する"],"answer_index":2,"ex":"手袋（てぶくろ）交換（こうかん）の目安（めやす）は、破（やぶ）れや汚（よご）れが認（みと）められた時（とき）のほか、汚染（おせん）作業（さぎょう）から非（ひ）汚染（おせん）作業（さぎょう）に変（か）わる時（とき）や、調理（ちょうり）施設（しせつ）で設定（せってい）した着用（ちゃくよう）時間（じかん）を経過（けいか）した時（とき）です。十分（じゅうぶん）に手洗（てあら）いをおこなった後（のち）の手指（てゆび）に着用（ちゃくよう）し、一度（いちど）使用（しよう）した手袋（てぶくろ）を再使用（さいしよう）してはいけません。箱（はこ）から取り出（とりだ）す際（きわ）は、素手（すで）でほかの手袋（てぶくろ）を汚染（おせん）しないよう注意（ちゅうい）します。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.28","tp":"４．一般的（いっぱんてき）な衛生（えいせい）管理（かんり）の基準（きじゅん）１４項目（こうもく）の詳細（しょうさい）（７）食品（しょくひん）等（など）取扱者（とりあつかいしゃ）の衛生（えいせい）管理（かんり）","q":"手洗（てあら）いのタイミングについて、誤（あやま）っているものはどれか。","ch":["調理場（ちょうりば）に入（い）る前（まえ）は、手（て）が汚（よご）れていなければ手洗（てあら）いを省略（しょうりゃく）してよい","刺身（さしみ）など、生（う）のまま提供（ていきょう）する食材（しょくざい）を扱（あつか）う前（まえ）に手（て）を洗（あら）う","下（した）膳（ぜん）作業（さぎょう）の後（のち）や、残飯（ざんぱん）・廃棄物（はいきぶつ）を処理（しょり）した後（のち）に手（て）を洗（あら）う"],"answer_index":0,"ex":"調理場（ちょうりば）に入室（にゅうしつ）する前（まえ）は、有害（ゆうがい）微生物（びせいぶつ）を持ち込（もちこ）まないために調理場（ちょうりば）入口（いりぐち）で必（かなら）ず手（て）を洗（あら）います。省略（しょうりゃく）はできません。ほかの３つは、テキストに示（しめ）された調理（ちょうり）工程（こうてい）中（なか）の手洗（てあら）いのタイミングです。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.29","tp":"４．一般的（いっぱんてき）な衛生（えいせい）管理（かんり）の基準（きじゅん）１４項目（こうもく）の詳細（しょうさい）（８）情報（じょうほう）の提供（ていきょう）","q":"保健所（ほけんしょ）への情報提供（じょうほうていきょう）が必要（ひつよう）な場合（ばあい）として、正（ただ）しいものはどれか。","ch":["製造機（せいぞうき）械（かい）の破損（はそん）で、金属（きんぞく）などの異物（いぶつ）が製品（せいひん）に混入（こんにゅう）した可能性（かのうせい）がある場合（ばあい）","従業員（じゅうぎょういん）が調理中（ちょうりちゅう）に食器（しょっき）を割（さ）ったが、破片（はへん）をその場（ば）ですべて片（かた）づけた場合（ばあい）","仕入（しい）れ先（さき）の都合（つごう）で食材（しょくざい）の納品（のうひん）が遅（おく）れ、一部（いちぶ）の料理（りょうり）を出（だ）せなかった場合（ばあい）"],"answer_index":0,"ex":"製造機（せいぞうき）械（かい）の破損（はそん）で金属（きんぞく）や硬質（こうしつ）プラスチックなどの異物（いぶつ）が混入（こんにゅう）した可能性（かのうせい）がある場合（ばあい）は、保健所（ほけんしょ）へ情報（じょうほう）を提供（ていきょう）します。医師（いし）や複数（ふくすう）のお客様（きゃくさま）から食中毒（しょくちゅうどく）ではないかとの連絡（れんらく）があった場合（ばあい）、自主（じしゅ）検査（けんさ）で未（み）加熱（かねつ）で食（た）べる食品（しょくひん）から有害（ゆうがい）微生物（びせいぶつ）を検出（けんしゅつ）した場合（ばあい）なども対象（たいしょう）です。味（あじ）や納品（のうひん）の遅（おく）れは、保健所（ほけんしょ）への情報提供（じょうほうていきょう）の対象（たいしょう）ではありません。"}]},{"title":"衛生管理 学科 · भाग 4 (p.29–37)","words":[{"subject":"衛生管理","type":"学科","source":"衛生管理 p.29","tp":"４．一般的（いっぱんてき）な衛生（えいせい）管理（かんり）の基準（きじゅん）１４項目（こうもく）の詳細（しょうさい）（８）情報（じょうほう）の提供（ていきょう）","q":"外食（がいしょく）などでのアレルゲン情報（じょうほう）について、正（ただ）しいものはどれか。","ch":["レストランでも、アレルゲン情報（じょうほう）の提供（ていきょう）が義務（ぎむ）づけられている","容器（ようき）包装（ほうそう）された加工（かこう）食品（しょくひん）では、アレルゲンの表示（ひょうじ）はすべて推奨（すいしょう）にとどまる","外食（がいしょく）などでは義務（ぎむ）ではないが、メニューへの記載（きさい）など情報提供（じょうほうていきょう）が推奨（すいしょう）されている"],"answer_index":2,"ex":"対面（たいめん）販売（はんばい）や量（はか）り売（う）り、レストランのような飲食店（いんしょくてん）などでは、アレルゲン情報（じょうほう）の提供（ていきょう）は義務（ぎむ）づけられていません。しかし注文（ちゅうもん）や販売時（はんばいじ）にお客様（きゃくさま）への情報提供（じょうほうていきょう）は可能（かのう）なので、メニューへ記載（きさい）するなどの提供（ていきょう）が推奨（すいしょう）されています。容器（ようき）包装（ほうそう）された加工（かこう）食品（しょくひん）と添加物（てんかぶつ）は、８品目（ひんもく）の特定（とくてい）原材料（げんざいりょう）の表示（ひょうじ）が義務（ぎむ）です。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.30","tp":"４．一般的（いっぱんてき）な衛生（えいせい）管理（かんり）の基準（きじゅん）１４項目（こうもく）の詳細（しょうさい）（８）情報（じょうほう）の提供（ていきょう）","q":"食品（しょくひん）表示法（ひょうじほう）のアレルゲン表示（ひょうじ）について、正（ただ）しいものはどれか。","ch":["大豆（だいず）やごまは特定（とくてい）原材料（げんざいりょう）に準（じゅん）ずるもので、表示（ひょうじ）が推奨（すいしょう）されている","大豆（だいず）やごまは特定（とくてい）原材料（げんざいりょう）にあたり、表示（ひょうじ）が義務（ぎむ）づけられている","特定（とくてい）原材料（げんざいりょう）に準（じゅん）ずるものは２０品目（ひんもく）あり、いずれも表示（ひょうじ）の義務（ぎむ）がある"],"answer_index":0,"ex":"食品（しょくひん）表示法（ひょうじほう）では、容器（ようき）包装（ほうそう）された加工（かこう）食品（しょくひん）および添加物（てんかぶつ）について特定（とくてい）原材料（げんざいりょう）８品目（ひんもく）の表示（ひょうじ）が義務（ぎむ）づけられ、表示（ひょうじ）を推奨（すいしょう）されている「特定（とくてい）原材料（げんざいりょう）に準（じゅん）ずるもの」２０品目（ひんもく）と合（あ）わせて２８品目（ひんもく）のアレルゲン表示（ひょうじ）が規定（きてい）されています。大豆（だいず）、ごま、やまいも、りんご、カシューナッツなどは準（じゅん）ずるものに含（ふく）まれ、表示（ひょうじ）は推奨（すいしょう）です。準（じゅん）ずるものは、症例（しょうれい）数（かず）などが特定（とくてい）原材料（げんざいりょう）に比（くら）べると少（すく）ないものです。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.31","tp":"４．一般的（いっぱんてき）な衛生（えいせい）管理（かんり）の基準（きじゅん）１４項目（こうもく）の詳細（しょうさい）（９）回収（かいしゅう）・廃棄（はいき）について（食品（しょくひん）などのリコール）","q":"食品（しょくひん）リコール（自主（じしゅ）回収（かいしゅう））の報告（ほうこく）制度（せいど）について、正（ただ）しいものはどれか。","ch":["２０２１年（ねん）６月（がつ）１日（にち）から、自主（じしゅ）回収（かいしゅう）に着手（ちゃくしゅ）した旨（むね）と回収（かいしゅう）の状況（じょうきょう）を都道府県（とどうふけん）に届け出（とどけで）ることが義務（ぎむ）づけられた","この制度（せいど）は、法律（ほうりつ）に違反（いはん）した食品（しょくひん）について事業者（じぎょうしゃ）にリコールそのものをおこなうことを義務（ぎむ）づける制度（せいど）である","回収（かいしゅう）に着手（ちゃくしゅ）した旨（むね）だけを届け出（とどけで）れば、その後（のち）の回収（かいしゅう）の状況（じょうきょう）は届け出（とどけで）る必要（ひつよう）がないとされている"],"answer_index":0,"ex":"２０２１年（ねん）６月（がつ）１日（にち）から、営業者（えいぎょうしゃ）は食品（しょくひん）リコールに着手（ちゃくしゅ）した旨（むね）および回収（かいしゅう）の状況（じょうきょう）を都道府県（とどうふけん）に届け出（とどけで）ることが義務（ぎむ）づけられました。この制度（せいど）はリコール自体（じたい）を義務（ぎむ）づけるものではなく、事業者（じぎょうしゃ）みずからの判断（はんだん）でリコールした場合（ばあい）に届け出（とどけで）るものです。自主（じしゅ）回収（かいしゅう）は、行政（ぎょうせい）による回収（かいしゅう）命令（めいれい）とは異（こと）なる措置（そち）です。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.31","tp":"４．一般的（いっぱんてき）な衛生（えいせい）管理（かんり）の基準（きじゅん）１４項目（こうもく）の詳細（しょうさい）（９）回収（かいしゅう）・廃棄（はいき）について（食品（しょくひん）などのリコール）","q":"食品（しょくひん）リコールの届出（とどけで）が不要（ふよう）な場合（ばあい）として、正（ただ）しいものはどれか。","ch":["金属（きんぞく）やガラスなどの硬質（こうしつ）異物（いぶつ）が混入（こんにゅう）した食品（しょくひん）を回収（かいしゅう）する場合（ばあい）","消費（しょうひ）期限（きげん）を過（す）ぎた食品（しょくひん）など、消費者（しょうひしゃ）が飲食（いんしょく）しないことが明（あき）らかな場合（ばあい）","小麦（こむぎ）やそば、卵（たまご）などのアレルゲン表示（ひょうじ）が欠落（けつらく）した食品（しょくひん）を回収（かいしゅう）する場合（ばあい）"],"answer_index":1,"ex":"消費（しょうひ）期限（きげん）や賞味期限（しょうみきげん）を過（す）ぎた食品（しょくひん）のように、その食品（しょくひん）を消費者（しょうひしゃ）が飲食（いんしょく）しないことが明（あき）らかな場合（ばあい）は届出（とどけで）が不要（ふよう）です。硬質（こうしつ）異物（いぶつ）の混入（こんにゅう）や添加物（てんかぶつ）の使用基準（しようきじゅん）違反（いはん）は食品（しょくひん）衛生（えいせい）法（ほう）違反（いはん）、アレルゲン表示（ひょうじ）の欠落（けつらく）は食品（しょくひん）表示法（ひょうじほう）違反（いはん）として、届出（とどけで）の対象（たいしょう）になります。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.32","tp":"４．一般的（いっぱんてき）な衛生（えいせい）管理（かんり）の基準（きじゅん）１４項目（こうもく）の詳細（しょうさい）（１０）運搬（うんぱん）・販売（はんばい）","q":"食品（しょくひん）の運搬（うんぱん）時（とき）の管理（かんり）について、誤（あやま）っているものはどれか。","ch":["積（つ）み込（こ）み時（とき）に品温（ひんおん）を点検（てんけん）し、必要（ひつよう）があれば車両（しゃりょう）やコンテナを予（あらかじめ）冷（ひや）する","運搬（うんぱん）時間（じかん）は、到着後（とうちゃくご）に冷（ひ）やせばよいので特（とく）に決（き）めなくてよい","出発（しゅっぱつ）から到着（とうちゃく）までの保冷（ほれい）車（くるま）の温度変化（おんどへんか）を確認（かくにん）し、記録（きろく）する"],"answer_index":1,"ex":"運搬中（うんぱんちゅう）の食品（しょくひん）の温度変化（おんどへんか）を踏（ふ）まえて運搬（うんぱん）時間（じかん）を設定（せってい）し、所定（しょてい）の運搬（うんぱん）時間（じかん）を超（こ）えないようにします。積（つ）み込（こ）み時（とき）の品温（ひんおん）点検（てんけん）や予（あらかじめ）冷（れい）、迅速（じんそく）な積（つ）み降（ふ）ろし、温度変化（おんどへんか）の確認（かくにん）・記録（きろく）は、テキストに示（しめ）された正（ただ）しい管理方法（かんりほうほう）です。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.33","tp":"４．一般的（いっぱんてき）な衛生（えいせい）管理（かんり）の基準（きじゅん）１４項目（こうもく）の詳細（しょうさい）（１０）運搬（うんぱん）・販売（はんばい）","q":"販売品（はんばいひん）の管理（かんり）について、正（ただ）しいものはどれか。","ch":["商品（しょうひん）は、後（のち）から入（い）れたものから先（さき）に売（う）るようにする","ショーケースでは、ロードラインを超（こ）えて商品（しょうひん）を積（つ）んでよい","冷蔵（れいぞう）・冷凍品（れいとうひん）は定期的（ていきてき）に温度（おんど）を確認（かくにん）して記録（きろく）する"],"answer_index":2,"ex":"冷蔵（れいぞう）・冷凍品（れいとうひん）をショーケースで販売（はんばい）する場合（ばあい）は、ロードライン（商品（しょうひん）陳列（ちんれつ）の上限（じょうげん）ライン）を守（まも）り、定期的（ていきてき）に温度（おんど）を確認（かくにん）して記録（きろく）します。商品（しょうひん）は先入（さきい）れ・先出（さきだ）しが守（まも）られるようロット管理（かんり）をおこないます。計（はか）り売（う）り商品（しょうひん）の表示（ひょうじ）は免除（めんじょ）されますが、器具（きぐ）の洗浄（せんじょう）・消毒（しょうどく）や食品（しょくひん）の覆（おお）いなどが必要（ひつよう）です。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.33","tp":"４．一般的（いっぱんてき）な衛生（えいせい）管理（かんり）の基準（きじゅん）１４項目（こうもく）の詳細（しょうさい）（１１）教育（きょういく）訓練（くんれん）","q":"衛生（えいせい）管理（かんり）の教育（きょういく）訓練（くんれん）について、正（ただ）しいものはどれか。","ch":["化学物質（かがくぶっしつ）の混入（こんにゅう）事故（じこ）は人為的（じんいてき）なミスが多（おお）いため、安全（あんぜん）な取扱（とりあつか）いを教育（きょういく）する","教育（きょういく）訓練（くんれん）は、新規（しんき）採用（さいよう）時（とき）に１回（かい）おこなえば十分（じゅうぶん）である","保健所（ほけんしょ）の食品（しょくひん）衛生（えいせい）講習会（こうしゅうかい）の受講（じゅこう）は、教育（きょういく）訓練（くんれん）の項目（こうもく）に含（ふく）まれない"],"answer_index":0,"ex":"食品（しょくひん）取扱（とりあつかい）施設（しせつ）にある化学物質（かがくぶっしつ）の食品（しょくひん）への混入（こんにゅう）事故（じこ）の多（おお）くは、従業員（じゅうぎょういん）による人為的（じんいてき）なミスで発生（はっせい）しているため、安全（あんぜん）な取扱（とりあつか）いの教育（きょういく）訓練（くんれん）を実施（じっし）します。教育（きょういく）訓練（くんれん）は新規（しんき）採用（さいよう）時（とき）や従事（じゅうじ）経験（けいけん）に応（おう）じて実施（じっし）し、効果（こうか）を検証（けんしょう）して必要（ひつよう）に応（おう）じて見直（みなお）します。食品（しょくひん）衛生（えいせい）講習会（こうしゅうかい）の受講（じゅこう）も主（おも）な教育（きょういく）訓練（くんれん）項目（こうもく）の一（ひと）つです。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.34","tp":"４．一般的（いっぱんてき）な衛生（えいせい）管理（かんり）の基準（きじゅん）１４項目（こうもく）の詳細（しょうさい）（１２）そのほか（記録（きろく）と保存（ほぞん））","q":"衛生（えいせい）管理（かんり）の記録（きろく）を毎日（まいにち）とる理由（りゆう）として、誤（あやま）っているものはどれか。","ch":["記録（きろく）があれば、食中毒（しょくちゅうどく）が起（お）きても営業者（えいぎょうしゃ）の責任（せきにん）はなくなる","問題（もんだい）が起（お）きた製品（せいひん）（ロット）を特定（とくてい）し、迅速（じんそく）な回収（かいしゅう）ができる","記録（きろく）を検証（けんしょう）して、作業（さぎょう）工程（こうてい）の無駄（むだ）や改善点（かいぜんてん）を把握（はあく）できる"],"answer_index":0,"ex":"記録（きろく）の目的（もくてき）は、不適切（ふてきせつ）な事象（じしょう）の発見（はっけん）と改善（かいぜん）による事故（じこ）の未然（みぜん）防止（ぼうし）、問題（もんだい）が起（お）きた時（とき）の原因究明（げんいんきゅうめい）とロットの特定（とくてい）、作業（さぎょう）の効率化（こうりつか）と自主（じしゅ）管理（かんり）の推進（すいしん）、そして安全性（あんぜんせい）をアピールし信頼（しんらい）を獲得（かくとく）することです。記録（きろく）によって責任（せきにん）がなくなるとは書（か）かれていません。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.35","tp":"５．食品（しょくひん）調理（ちょうり）・提供（ていきょう）工程（こうてい）における適切（てきせつ）な衛生（えいせい）管理（かんり）のポイント（１）食材（しょくざい）の適切（てきせつ）な下（した）処理（しょり）と保管（ほかん）","q":"下（した）処理後（しょりご）の食材（しょくざい）の保管（ほかん）温度（おんど）の目安（めやす）として、正（ただ）しいものはどれか。","ch":["肉（にく）・魚（さかな）は２０℃以下（いか）、生食（いけずき）用（よう）魚介類（ぎょかいるい）は１０℃以下（いか）","肉（にく）・魚（さかな）は１０℃以下（いか）、生食（いけずき）用（よう）魚介類（ぎょかいるい）も１０℃以下（いか）","肉（にく）・魚（さかな）は１０℃以下（いか）、生食（いけずき）用（よう）魚介類（ぎょかいるい）は４℃以下（いか）"],"answer_index":2,"ex":"下（した）処理後（しょりご）の食材（しょくざい）は、肉（にく）・魚（さかな）は１０℃以下（いか）（生食（いけずき）用（よう）魚介類（ぎょかいるい）は４℃以下（いか））、生鮮（せいせん）果実（かじつ）・野菜（やさい）は１０℃前後（ぜんご）で保管（ほかん）します。下（した）処理（しょり）作業（さぎょう）はできるだけ素早（すばや）くおこない、食材（しょくざい）は相互（そうご）汚染（おせん）のないよう用途（ようと）ごとにフタ付（つ）き容器（ようき）などで保管（ほかん）します。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.36","tp":"５．食品（しょくひん）調理（ちょうり）・提供（ていきょう）工程（こうてい）における適切（てきせつ）な衛生（えいせい）管理（かんり）のポイント（２）食材（しょくざい）の解凍（かいとう）と保管（ほかん）","q":"冷凍（れいとう）食材（しょくざい）の解凍（かいとう）方法（ほうほう）について、正（ただ）しいものはどれか。","ch":["自然（しぜん）・室温（しつおん）解凍（かいとう）は時間（じかん）はかかるが、細菌（さいきん）が増（ふ）えないので最（もっと）も安全（あんぜん）である","流水（りゅうすい）解凍（かいとう）は食材（しょくざい）の温度（おんど）がまったく上（あ）がらないため、鮮度（せんど）が落（お）ちずドリップも出（で）ない","冷蔵庫（れいぞうこ）内（ない）での解凍（かいとう）は時間（じかん）がかかるが、品質（ひんしつ）の保持（ほじ）と細菌（さいきん）増殖（ぞうしょく）の抑制（よくせい）に適（てき）している"],"answer_index":2,"ex":"冷蔵庫（れいぞうこ）内（ない）での解凍（かいとう）は低温（ていおん）環境（かんきょう）のため時間（じかん）がかかりますが、品質（ひんしつ）の保持（ほじ）と細菌（さいきん）増殖（ぞうしょく）の抑制（よくせい）に適（てき）しています。自然（しぜん）・室温（しつおん）解凍（かいとう）は食材（しょくざい）表面（ひょうめん）で細菌（さいきん）が増殖（ぞうしょく）するため、おこなってはいけません。流水（りゅうすい）解凍（かいとう）は温度（おんど）が急（きゅう）に上（あ）がり鮮度（せんど）低下（ていか）やドリップが起（お）こり、電子レンジ（でんしれんじ）解凍（かいとう）は解凍（かいとう）ムラができやすくなります。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.37","tp":"５．食品（しょくひん）調理（ちょうり）・提供（ていきょう）工程（こうてい）における適切（てきせつ）な衛生（えいせい）管理（かんり）のポイント（４）加熱（かねつ）工程（こうてい）のない食材（しょくざい）の取扱（とりあつか）い","q":"サラダや和（あ）え物（もの）など、加熱（かねつ）工程（こうてい）のない食材（しょくざい）の取扱（とりあつか）いについて、正（ただ）しいものはどれか。","ch":["和（あ）える際（きわ）は、必（かなら）ず使い捨（つかいす）て手袋（てぶくろ）を使用（しよう）する","消毒（しょうどく）剤（ざい）で処理（しょり）した後（のち）は、すすぎ洗（あら）いをせずにそのまま使（つか）う","調理済（ちょうりず）みの和（あ）え物（もの）は、常温（じょうおん）で保管（ほかん）してから提供（ていきょう）する"],"answer_index":0,"ex":"和（あ）える際（きわ）は必（かなら）ず使い捨（つかいす）て手袋（てぶくろ）を使用（しよう）し、加工（かこう）調理（ちょうり）の前（まえ）には十分（じゅうぶん）な手洗（てあら）いをおこないます。野菜（やさい）・果実（かじつ）は十分（じゅうぶん）な流水（りゅうすい）で洗浄（せんじょう）し、消毒（しょうどく）処理（しょり）をした場合（ばあい）は流水（りゅうすい）ですすぎ洗（あら）いします。調理済（ちょうりず）み食品（しょくひん）はフタ付（つ）きの清潔（せいけつ）な容器（ようき）に入（い）れ、危険（きけん）温度（おんど）帯（たい）（１０〜６０℃）を避（さ）けて速（すみ）やかに１０℃以下（いか）の冷蔵庫（れいぞうこ）で保管（ほかん）します。"}]},{"title":"衛生管理 実技 · भाग 1 (p.7–19)","words":[{"subject":"衛生管理","type":"実技","source":"衛生管理 p.7","tp":"2. 食品（しょくひん）衛生（えいせい）管理（かんり）の基本（きほん）（1）食中毒（しょくちゅうどく）予防（よぼう）の3原則（げんそく）","q":"客席（きゃくせき）でお客様（きゃくさま）がおう吐（と）しました。近（ちか）くにいた従業員（じゅうぎょういん）が、調理場（ちょうりば）で使（つか）っているふきんで拭（ふ）き取（と）り、そのふきんを洗（あら）い場（ば）ですすごうとしています。食中毒（しょくちゅうどく）予防（よぼう）の3原則（げんそく）の「拡（ひろ）げない」の考え方（かんがえかた）から、とるべき対応（たいおう）はどれか。","ch":["においが消（き）えるまで換気（かんき）をおこない、床（とこ）はそのままにしておく","調理場（ちょうりば）のふきんで拭（ふ）き取（と）り、そのふきんは洗（あら）い場（ば）で洗（あら）って元（もと）に戻（もど）す","おう吐物（とぶつ）を適切（てきせつ）に処理（しょり）させ、器具（きぐ）の洗浄（せんじょう）・消毒（しょうどく）と手洗（てあら）いを徹底（てってい）する"],"answer_index":2,"ex":"「つけない」対策（たいさく）を確実（かくじつ）に実施（じっし）するには、調理場（ちょうりば）に「持ち込（もちこ）まない」「拡（ひろ）げない」ことも重要（じゅうよう）な要素（ようそ）です。「拡（ひろ）げない」の具体策（ぐたいさく）は、手洗（てあら）いの励行（れいこう）、おう吐物（とぶつ）の適切（てきせつ）な処理（しょり）、トイレを清潔（せいけつ）に保（たも）つ、二枚（にまい）貝（かい）を扱（あつか）った器具（きぐ）の洗浄（せんじょう）・消毒（しょうどく）です。調理場（ちょうりば）のふきんで拭（ぬぐ）いて洗（あら）い場（ば）ですすげば、汚染（おせん）を調理場（ちょうりば）に拡（ひろ）げてしまいます。","jt":"判断試験"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.8","tp":"2. 食品（しょくひん）衛生（えいせい）管理（かんり）の基本（きほん）（1）食中毒（しょくちゅうどく）予防（よぼう）の3原則（げんそく）","q":"冬（ふゆ）にカキ（二枚（にまい）貝（かい））を使（つか）った加熱（かねつ）料理（りょうり）を出（だ）すことになりました。カキはノロウイルスに汚染（おせん）されているおそれがあります。加熱（かねつ）の管理（かんり）として、もっとも適切（てきせつ）なものはどれか。","ch":["食品（しょくひん）の中心部（ちゅうしんぶ）が85～90℃で90秒間（びょうかん）以上（いじょう）になるように加熱（かねつ）する","食品（しょくひん）の表面（ひょうめん）にしっかり焼（や）き色（いろ）がつくまで、強（つよ）い火（ひ）で加熱（かねつ）する","食品（しょくひん）の中心部（ちゅうしんぶ）の温度（おんど）が60℃で1分間（ふんかん）以上（いじょう）になるように加熱（かねつ）する"],"answer_index":0,"ex":"ノロウイルス汚染（おせん）のおそれのある食品（しょくひん）は、中心部（ちゅうしんぶ）を85～90℃で90秒間（びょうかん）以上（いじょう）加熱（かねつ）します（通常（つうじょう）の食品（しょくひん）は中心部（ちゅうしんぶ）75℃で1分間（ふんかん）以上（いじょう））。表面（ひょうめん）の焼（や）き色（いろ）では中心部（ちゅうしんぶ）の温度（おんど）は分（わ）かりません。冷凍（れいとう）で死滅（しめつ）するのはアニサキスなどの寄生虫（きせいちゅう）についての説明（せつめい）です。","jt":"計画立案"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.13","tp":"4.（2）施設（しせつ）の衛生（えいせい）管理（かんり）　1）施設（しせつ）の清掃（せいそう）について","q":"昼（ひる）の営業中（えいぎょうちゅう）に、従業員（じゅうぎょういん）が「今（いま）からトイレを掃除（そうじ）します」と申し出（もうしで）ました。店長（てんちょう）の対応（たいおう）としてもっとも適切（てきせつ）なものはどれか。","ch":["トイレ清掃（せいそう）はできるだけ終業（しゅうぎょう）後（のち）におこなうよう伝（つた）え、衛生（えいせい）手袋（てぶくろ）と専用（せんよう）の清掃用具（せいそうようぐ）を使（つか）わせる","調理場（ちょうりば）で使（つか）っているブラシとスポンジをそのまま持（も）っていかせ、営業中（えいぎょうちゅう）にすぐ掃除（そうじ）させる","トイレの清掃（せいそう）は汚（よご）れが目立（めだ）った時（とき）だけでよいので、毎日（まいにち）はしなくてよいと伝（つた）える"],"answer_index":0,"ex":"トイレ清掃（せいそう）後（のち）に調理場（ちょうりば）へ入（いっ）って汚染（おせん）しないよう、トイレ清掃（せいそう）はできるだけ終業（しゅうぎょう）後（のち）におこないます。清掃（せいそう）時（とき）は衛生（えいせい）手袋（てぶくろ）（使い捨（つかいす）て手袋（てぶくろ））を着用（ちゃくよう）し、専用（せんよう）の清掃用具（せいそうようぐ）を用（もち）いて毎日（まいにち）定期的（ていきてき）に清掃（せいそう）・消毒（しょうどく）します。汚（よご）れを見（み）つけた時（とき）はその都度（つど）清掃（せいそう）・消毒（しょうどく）します。","jt":"判断試験"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.16","tp":"4.（3）－1 器具（きぐ）・容器（ようき）・設備（せつび）の洗浄（せんじょう）、消毒（しょうどく）、保管（ほかん）　2）調理器具（ちょうりきぐ）類（るい）の洗浄（せんじょう）方法（ほうほう）","q":"アルバイトが、生（う）の鶏肉（とりにく）を切（き）った包丁（ほうちょう）とまな板（いた）を、水（みず）でさっと流（なが）しただけでサラダ用（よう）の生野菜（なまやさい）を切（き）ろうとしています。店長（てんちょう）としてとるべき対応（たいおう）はどれか。","ch":["包丁（ほうちょう）だけを洗（あら）い直（なお）させ、まな板（いた）はそのまま使（つか）わせる","洗浄（せんじょう）と消毒（しょうどく）をおこなってから使（つか）うよう指示（しじ）する","まな板（いた）の裏面（うらめん）を使（つか）えばよいと指示（しじ）する"],"answer_index":1,"ex":"包丁（ほうちょう）、まな板（いた）、ボウルで鮮魚（せんぎょ）介類（かいるい）、生肉（なまにく）、生野菜（なまやさい）などを処理（しょり）した後（のち）は、必（かなら）ず洗浄（せんじょう）・消毒（しょうどく）してから使（つか）わなければなりません。水（みず）で流（なが）すだけでは食品（しょくひん）残（のこ）さや微生物（びせいぶつ）が残（のこ）り、二次（にじ）汚染（おせん）の原因（げんいん）になります。まな板（いた）は裏面（うらめん）や側面（そくめん）もよく洗浄（せんじょう）します。","jt":"判断試験"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.16","tp":"4.（3）－1 器具（きぐ）・容器（ようき）・設備（せつび）の洗浄（せんじょう）、消毒（しょうどく）、保管（ほかん）　2）調理器具（ちょうりきぐ）類（るい）の洗浄（せんじょう）方法（ほうほう）","q":"洗（あら）い場（ば）で、野菜（やさい）の水切（みずき）りに使（つか）うザルの網（あみ）が一部（いちぶ）破（やぶ）れているのを見（み）つけました。とるべき対応（たいおう）はどれか。","ch":["破（やぶ）れた部分（ぶぶん）を避（さ）けて使（つか）い続（つづ）ける","直（ただ）ちに取（と）り替（か）える","破（やぶ）れた部分（ぶぶん）をテープでふさいで使（つか）う"],"answer_index":1,"ex":"網（あみ）が弱（よわ）ったものや破（やぶ）れたザルを発見（はっけん）した場合（ばあい）は、危険（きけん）な異物（いぶつ）混入（こんにゅう）の原因（げんいん）になるので直（ただ）ちに取（と）り替（か）えます。金属製（きんぞくせい）たわしも劣化（れっか）した金属片（きんぞくへん）が危険（きけん）な異物（いぶつ）になるため、できるだけ使用（しよう）しないようにします。","jt":"判断試験"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.17","tp":"4.（3）－1 器具（きぐ）・容器（ようき）・設備（せつび）の洗浄（せんじょう）、消毒（しょうどく）、保管（ほかん）　1）洗浄（せんじょう）と洗浄剤（せんじょうざい）について","q":"従業員（じゅうぎょういん）が、食器（しょっき）洗浄機（せんじょうき）の内部（ないぶ）のスケール除去（じょきょ）に使（つか）う酸性（さんせい）洗浄剤（せんじょうざい）と、消毒用（しょうどくよう）の次亜塩素酸（じあえんそさん）ナトリウム溶液（ようえき）を「まとめて使（つか）えば早（はや）い」と言（い）って混（ま）ぜようとしています。とるべき対応（たいおう）はどれか。","ch":["換気扇（かんきせん）を強（つよ）くして窓（まど）も開（ひら）ければ安全（あんぜん）なので、混（ま）ぜてよいと教（おし）える","水（みず）で10倍（ばい）にうすめてから少量（しょうりょう）ずつ混（ま）ぜれば危険（きけん）はないと教（おし）える","混（ま）ぜると塩素（えんそ）ガスが発生（はっせい）して危険（きけん）なので、絶対（ぜったい）に混（ま）ぜないよう止（や）める"],"answer_index":2,"ex":"酸性（さんせい）洗浄剤（せんじょうざい）は次亜塩素酸（じあえんそさん）ナトリウム溶液（ようえき）と混（ま）ぜると塩素（えんそ）ガスを発生（はっせい）するので危険（きけん）です。換気（かんき）や手袋（てぶくろ）では防（ふせ）げないため、混（ま）ぜてはいけません。洗浄剤（せんじょうざい）は種類（しゅるい）ごとの特性（とくせい）を理解（りかい）し、製品（せいひん）の指示（しじ）を守（まも）って使用（しよう）します。","jt":"判断試験"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.17","tp":"4.（3）－1 器具（きぐ）・容器（ようき）・設備（せつび）の洗浄（せんじょう）、消毒（しょうどく）、保管（ほかん）　1）洗浄（せんじょう）と洗浄剤（せんじょうざい）について","q":"サラダ用（よう）のレタスと、お客様（きゃくさま）に出（だ）す食器（しょっき）を、それぞれ洗浄剤（せんじょうざい）で洗（あら）ったあと流水（りゅうすい）ですすぐ。食品（しょくひん）衛生（えいせい）法（ほう）で定（さだ）められた使用基準（しようきじゅん）にしたがった、すすぎ時間（じかん）の計画（けいかく）として正（ただ）しいものはどれか。","ch":["レタスは5秒間（びょうかん）以上（いじょう）、食器（しょっき）は30秒間（びょうかん）以上（いじょう）すすぐ","レタスは10秒間（びょうかん）以上（いじょう）、食器（しょっき）は10秒間（びょうかん）以上（いじょう）すすぐ","レタスは30秒間（びょうかん）以上（いじょう）、食器（しょっき）は5秒間（びょうかん）以上（いじょう）すすぐ"],"answer_index":2,"ex":"流水（りゅうすい）を用（もち）いる場合（ばあい）、野菜（やさい）・果実（かじつ）は30秒間（びょうかん）以上（いじょう）、食器（しょっき）は5秒間（びょうかん）以上（いじょう）すすぐことが定（さだ）められている。レタスは野菜（やさい）なので30秒間（びょうかん）以上（いじょう）、食器（しょっき）は5秒間（びょうかん）以上（いじょう）となる。野菜（やさい）と食器（しょっき）の秒数（びょうすう）を逆（ぎゃく）にするのがよくある間違（まちが）いである。なお、ため水（みず）を用（もち）いる場合（ばあい）は水（みず）をかえて2回（かい）以上（いじょう）すすぐ。","jt":"計画立案"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.17","tp":"4.（3）－1 器具（きぐ）・容器（ようき）・設備（せつび）の洗浄（せんじょう）、消毒（しょうどく）、保管（ほかん）　1）洗浄（せんじょう）と洗浄剤（せんじょうざい）について","q":"10時（とき）00分（ふん）に、野菜（やさい）を洗浄剤（せんじょうざい）の溶液（ようえき）に浸（しん）けた。食品（しょくひん）衛生（えいせい）法（ほう）で定（さだ）められた洗浄剤（せんじょうざい）の使用基準（しようきじゅん）を守（まも）るには、遅（おそ）くとも何時何分（なんじなんぷん）までに野菜（やさい）を取り出（とりだ）す計画（けいかく）にすればよいか。","ch":["10時（とき）10分（ふん）までに取り出（とりだ）す","10時（とき）05分（ふん）までに取り出（とりだ）す","10時（とき）30分（ふん）までに取り出（とりだ）す"],"answer_index":1,"ex":"野菜（やさい）または果実（かじつ）は、5分間（ふんかん）以上（いじょう）洗浄剤（せんじょうざい）の溶液（ようえき）に浸（ひた）せきされないようにしなければならない。10時（とき）00分（ふん）＋5分（ふん）＝10時（とき）05分（ふん）なので、遅（おそ）くとも10時（とき）05分（ふん）までに取り出（とりだ）す。10分（ふん）や30分（ふん）浸（しん）けるのは使用基準（しようきじゅん）を超（こ）える計画（けいかく）である。","jt":"計画立案"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.18","tp":"4.（3）－1 器具（きぐ）・容器（ようき）・設備（せつび）の洗浄（せんじょう）、消毒（しょうどく）、保管（ほかん）　2）消毒（しょうどく）とその方法（ほうほう）について","q":"洗浄（せんじょう）が終（お）わった食器類（しょっきるい）を加熱（かねつ）消毒（しょうどく）する。16時（とき）00分（ふん）に温度（おんど）が80℃になった。同（おな）じ時間帯（じかんたい）に布（ぬの）きんの煮沸（しゃふつ）殺菌（さっきん）もおこなう。消毒（しょうどく）の計画（けいかく）として正（ただ）しいものはどれか。","ch":["食器（しょっき）は16時（とき）05分（ふん）まで80℃を保（たも）ち、布（ぬの）きんは100℃で5分間（ふんかん）以上（いじょう）煮沸（しゃふつ）する","食器（しょっき）は16時（とき）03分（ふん）まで80℃を保（たも）ち、布（ぬの）きんは100℃で3分間（ふんかん）以上（いじょう）煮沸（しゃふつ）する","食器（しょっき）は16時（とき）10分（ふん）まで80℃を保（たも）ち、布（ぬの）きんは100℃で10分間（ふんかん）以上（いじょう）煮沸（しゃふつ）する"],"answer_index":0,"ex":"洗浄（せんじょう）後（のち）の食器類（しょっきるい）・調理器具（ちょうりきぐ）類（たぐ）は80℃で5分間（ふんかん）以上（いじょう）の加熱（かねつ）で消毒（しょうどく）する。16時（とき）00分（ふん）＋5分（ふん）＝16時（とき）05分（ふん）まで80℃を保（たも）つ。布（ぬの）きんやタオルは100℃で5分間（ふんかん）以上（いじょう）の煮沸（しゃふつ）殺菌（さっきん）が有効（ゆうこう）である。3分（ふん）や10分（ふん）はテキストの時間（じかん）と異（こと）なる。","jt":"計画立案"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.19","tp":"4.（3）－1 器具（きぐ）・容器（ようき）・設備（せつび）の洗浄（せんじょう）、消毒（しょうどく）、保管（ほかん）　3）食器（しょっき）、器具（きぐ）類（るい）の保管（ほかん）について","q":"洗浄（せんじょう）・消毒（しょうどく）したあとの大型（おおがた）のボウルとバットが、水気（みずけ）が残（のこ）ったまま重（おも）ねて床（とこ）の上（うえ）に置（お）かれていました。指導（しどう）としてもっとも適切（てきせつ）なものはどれか。","ch":["水気（みずけ）が乾（かわ）くまで、そのまま床（とこ）に置（お）いておく","逆（さか）さにして、床（とこ）から離（はな）した専用（せんよう）の清潔（せいけつ）な場所（ばしょ）に保管（ほかん）する","使（つか）う直前（ちょくぜん）にもう一度（いちど）洗（あら）えばよいので、そのままでよい"],"answer_index":1,"ex":"扉（とびら）付（つ）き戸棚（とだな）などに納（おさ）まらない大型（おおがた）のボウル、ザル、バットなどは、逆（さか）さにして専用（せんよう）の清潔（せいけつ）な場所（ばしょ）に保管（ほかん）します。そのまま重（かさ）ねると乾燥（かんそう）不足（ふそく）の水分（すいぶん）が底（そこ）に溜（た）まり、埃（ほこり）が混入（こんにゅう）して不衛生（ふえいせい）になります。また、床（とこ）からの跳（は）ね水（みず）や埃（ほこり）を防（ふせ）ぐため、床（とこ）から離（はな）した高（たか）さのある場所（ばしょ）に保管（ほかん）します。","jt":"判断試験"}]},{"title":"衛生管理 実技 · भाग 2 (p.20–26)","words":[{"subject":"衛生管理","type":"実技","source":"衛生管理 p.20","tp":"4.（3）－2 計器（けいき）類（るい）・装置（そうち）、手洗（てあら）い設備（せつび）の管理（かんり）　2）手洗（てあら）い設備（せつび）の整備（せいび）について","q":"調理場（ちょうりば）入口（いりぐち）の手洗（てあら）い設備（せつび）を点検（てんけん）すると、手洗（てあら）い方法（ほうほう）を示（しめ）した掲示（けいじ）がなく、ペーパータオルの廃棄（はいき）容器（ようき）は手（て）でふたを開（ひら）ける形（かたち）のものでした。改善（かいぜん）としてもっとも適切（てきせつ）なものはどれか。","ch":["手洗（てあら）い方法（ほうほう）の掲示（けいじ）を設備（せつび）の近（ちか）くに出（だ）し、廃棄（はいき）容器（ようき）を足踏（あしふ）み式（しき）に替（か）える","手洗（てあら）い方法（ほうほう）は朝礼（ちょうれい）で口頭（こうとう）で伝（つた）え、廃棄（はいき）容器（ようき）は手洗（てあら）いシンクの中（なか）に置（お）く","手洗（てあら）い方法（ほうほう）の掲示（けいじ）は年（ねん）１回（かい）配（くば）る資料（しりょう）にし、廃棄（はいき）容器（ようき）は調理（ちょうり）台（だい）の下（した）に移（うつ）す"],"answer_index":0,"ex":"手洗（てあら）い設備（せつび）の近（ちか）くの見（み）やすい場所（ばしょ）に、手洗（てあら）い方法（ほうほう）を示（しめ）した掲示（けいじ）をおこない、常（つね）に確認（かくにん）できるようにします。また、ペーパータオルの廃棄（はいき）容器（ようき）は足踏（あしふ）み式（しき）などで、手指（てゆび）を再（ふたた）び汚染（おせん）させる危険性（きけんせい）がないものを設置（せっち）します。ふたを手（て）で開（ひら）ける容器（ようき）や、ふたを外（はず）したままの容器（ようき）は適切（てきせつ）ではありません。","jt":"判断試験"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.20","tp":"4.（3）－2 計器（けいき）類（るい）・装置（そうち）、手洗（てあら）い設備（せつび）の管理（かんり）　1）計器（けいき）類（るい）や装置（そうち）の点検（てんけん）について","q":"食器（しょっき）の紫外線（しがいせん）殺菌（さっきん）保管（ほかん）庫（こ）を使（つか）っている。紫外線（しがいせん）殺菌（さっきん）灯（ともしび）の寿命（じゅみょう）は3,000時間程度（じかんていど）である。この保管（ほかん）庫（こ）を1日（にち）10時間（じかん）使（つか）う計画（けいかく）のとき、交換時期（こうかんじき）の目安（めやす）は使（つか）い始（はじ）めからおよそ何日後（なんにちご）か。","ch":["約（やく）30日後（にちご）が交換（こうかん）の目安（めやす）になる","約（やく）300日後（にちご）が交換（こうかん）の目安（めやす）になる","約（やく）3,000日後（にちご）が交換（こうかん）の目安（めやす）になる"],"answer_index":1,"ex":"紫外線（しがいせん）殺菌（さっきん）灯（ともしび）の寿命（じゅみょう）は3,000時間程度（じかんていど）なので、3,000時間（じかん） ÷ 10時間（じかん）／日（にち） ＝ 300日（にち）となる。約（やく）30日（にち）は計算（けいさん）のけたを1つ間違（まちが）えたもの、約（やく）3,000日（にち）は1日（にち）1時間（じかん）で計算（けいさん）したものである。交換時期（こうかんじき）は記録（きろく）し、次回（じかい）の交換（こうかん）予定（よてい）時期（じき）も含（ふく）めて管理（かんり）する。","jt":"計画立案"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.21、p.22","tp":"4.（4）使用（しよう）水（みず）などの管理（かんり）　2）施設（しせつ）における使用（しよう）水（みず）の管理方法（かんりほうほう）","q":"飲用（いんよう）井戸（いど）の水（みず）を使（つか）っている店（みせ）で、休（やす）まず30日間（にちかん）営業（えいぎょう）する月（がつ）の使用（しよう）水（みず）の管理（かんり）計画（けいかく）を立（た）てる。日常（にちじょう）点検（てんけん）の回数（かいすう）、水質（すいしつ）検査（けんさ）の回数（かいすう）、検査（けんさ）成績（せいせき）書（かき）の保存期間（ほぞんきかん）の組み合（くみあ）わせとして正（ただ）しいものはどれか。","ch":["点検（てんけん）は月（がつ）30回（かい）以上（いじょう）、水質（すいしつ）検査（けんさ）は月（がつ）1回（かい）以上（いじょう）、成績（せいせき）書（かき）は6か月間（げっかん）保存（ほぞん）","点検（てんけん）は月（がつ）4回（かい）以上（いじょう）、水質（すいしつ）検査（けんさ）は年（ねん）1回（かい）以上（いじょう）、成績（せいせき）書（かき）は3年間（ねんかん）以上（いじょう）保存（ほぞん）","点検（てんけん）は月（がつ）30回（かい）以上（いじょう）、水質（すいしつ）検査（けんさ）は年（ねん）1回（かい）以上（いじょう）、成績（せいせき）書（かき）は1年間（ねんかん）以上（いじょう）保存（ほぞん）"],"answer_index":2,"ex":"使用（しよう）水（みず）の日常（にちじょう）点検（てんけん）は作業（さぎょう）開始前（かいしまえ）に1日（にち）1回（かい）以上（いじょう）おこなうので、30日（にち）営業（えいぎょう）なら1回（かい）×30日（にち）＝30回（かい）以上（いじょう）となる。飲用（いんよう）井戸（いど）などの水質（すいしつ）検査（けんさ）は1年（ねん）1回（かい）以上（いじょう）、水質（すいしつ）検査（けんさ）の成績（せいせき）書（かき）は1年間（ねんかん）以上（いじょう）保存（ほぞん）する。点検（てんけん）を週（しゅう）1回（かい）（月（がつ）4回（かい））にしたり、水質（すいしつ）検査（けんさ）を月（がつ）1回（かい）にしたり、保存期間（ほぞんきかん）を6か月（がつ）や3年（ねん）としたりするのは取り違（とりちが）えである。","jt":"計画立案"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.22","tp":"4.（4）使用（しよう）水（みず）などの管理（かんり）　3）問題（もんだい）があった時（とき）の対応（たいおう）","q":"作業（さぎょう）開始前（かいしまえ）の使用（しよう）水（みず）の点検（てんけん）で、水（みず）に濁（にご）りとふだんと違（ちが）う臭（くさ）いがありました。店長（てんちょう）としてとるべき対応（たいおう）はどれか。","ch":["5分（ふん）ほど水（みず）を流（なが）し続（つづ）けて濁（にご）りが薄（うす）くなれば、そのまま調理（ちょうり）に使（つか）う","直（ただ）ちに水（みず）の使用（しよう）を停止（ていし）し、水質（すいしつ）検査（けんさ）をおこなうなどの対策（たいさく）をとる","水（みず）を煮沸（しゃふつ）すれば安全（あんぜん）になるので、検査（けんさ）はせずにそのまま調理（ちょうり）に使（つか）う"],"answer_index":1,"ex":"水（みず）に異常（いじょう）を認（みと）めた時（とき）や、災害（さいがい）により汚染（おせん）のおそれがある場合（ばあい）は、直（ただ）ちに水（みず）の使用（しよう）を停止（ていし）し、水質（すいしつ）検査（けんさ）をおこなうなどの対策（たいさく）を講（こう）じます。その結果（けっか）、異常（いじょう）が認（みと）められた場合（ばあい）は保健所（ほけんしょ）などに連絡（れんらく）し、指導（しどう）を受（う）けます。日常（にちじょう）点検（てんけん）は色（いろ）、濁（にご）り、臭（くさ）い、味（あじ）を作業（さぎょう）開始前（かいしまえ）に確認（かくにん）し記録（きろく）します。","jt":"判断試験"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.22","tp":"4.（5）ねずみ及（およ）び昆虫（こんちゅう）対策（たいさく）　1）ねずみ及（およ）び昆虫（こんちゅう）の侵入（しんにゅう）防止（ぼうし）・駆除（くじょ）方法（ほうほう）と記録（きろく）","q":"4月（がつ）10日（にち）に、専門（せんもん）業者（ぎょうしゃ）にたのんでねずみ・昆虫（こんちゅう）の駆除（くじょ）を1回（かい）実施（じっし）した。生息（せいそく）調査（ちょうさ）（モニタリング）はおこなっていない。この1年（ねん）の駆除（くじょ）計画（けいかく）と記録（きろく）の保管（ほかん）として正（ただ）しいものはどれか。","ch":["年内（ねんない）にあと2回（かい）以上（いじょう）実施（じっし）し、記録（きろく）は1年間（ねんかん）保管（ほかん）する","年内（ねんない）にあと1回（かい）以上（いじょう）実施（じっし）し、記録（きろく）は1年間（ねんかん）保管（ほかん）する","年内（ねんない）はこれで終（お）わりでよく、記録（きろく）は2年間（ねんかん）保管（ほかん）する"],"answer_index":1,"ex":"ねずみおよび昆虫（こんちゅう）の駆除（くじょ）は1年（ねん）に2回（かい）以上（いじょう）実施（じっし）し、その記録（きろく）を1年間（ねんかん）保管（ほかん）する。4月（がつ）10日（にち）に1回（かい）実施（じっし）したので、2回（かい）以上（いじょう）にするには年内（ねんない）にあと1回（かい）以上（いじょう）必要（ひつよう）である（1回（かい）＋1回（かい）＝2回（かい））。あと2回（かい）では合計（ごうけい）3回（まわ）となり基準（きじゅん）の読（よ）み違（ちが）え、1回（かい）で終（お）わりにするのは回数（かいすう）不足（ふそく）である。","jt":"計画立案"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.23","tp":"4.（5）ねずみ及（およ）び昆虫（こんちゅう）対策（たいさく）　2）ハエの侵入（しんにゅう）・発生（はっせい）防止（ぼうし）および駆除（くじょ）","q":"調理場（ちょうりば）の排水溝（はいすいこう）のまわりでコバエが多（おお）く飛（と）んでいます。従業員（じゅうぎょういん）が「殺虫剤（さっちゅうざい）を調理場（ちょうりば）全体（ぜんたい）にスプレーしましょう」と言（い）っています。もっとも適切（てきせつ）な対応（たいおう）はどれか。","ch":["調理（ちょうり）施設（しせつ）内（ない）での殺虫剤（さっちゅうざい）の噴霧（ふんむ）は極力避（きょくりょくさ）け、排水溝（はいすいこう）などの発生源（はっせいげん）の清掃（せいそう）と侵入（しんにゅう）防止（ぼうし）をおこなう","食品（しょくひん）を扱（あつか）っている調理中（ちょうりちゅう）でも、調理場（ちょうりば）の全体（ぜんたい）と客席（きゃくせき）に殺虫剤（さっちゅうざい）をすぐ広（ひろ）くスプレーさせる","調理場（ちょうりば）の窓（まど）と裏口（うらぐち）をすべて開（ひら）け放（はな）して、コバエが自分（じぶん）から外（そと）に出（で）るのを待（ま）つ"],"answer_index":0,"ex":"食品類（しょくひんるい）を取り扱（とりあつか）う調理（ちょうり）施設（しせつ）内（ない）で殺虫剤（さっちゅうざい）を噴霧（ふんむ）することは極力避（きょくりょくさ）け、施設（しせつ）内（ない）への侵入（しんにゅう）を防（ふせ）ぐことと発生源（はっせいげん）を断（た）つことがもっとも重要（じゅうよう）です。排水溝（はいすいこう）、ゴミ、食品（しょくひん）残（のこ）さ、グリストラップのフタなどの洗浄（せんじょう）・清掃（せいそう）をしっかりおこないます。大量発生（たいりょうはっせい）時（とき）は専門（せんもん）業者（ぎょうしゃ）への依頼（いらい）を検討（けんとう）します。窓（まど）の開放（かいほう）は逆（ぎゃく）に昆虫（こんちゅう）の侵入（しんにゅう）を招（まね）きます。","jt":"判断試験"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.23、p.24","tp":"4.（5）ねずみ及（およ）び昆虫（こんちゅう）対策（たいさく）　3）ゴキブリの発生（はっせい）防止（ぼうし）および駆除（くじょ）","q":"ゴキブリが大量（たいりょう）に発生（はっせい）したため、専門（せんもん）業者（ぎょうしゃ）に燻煙（くんえん）法（ほう）での駆除（くじょ）を依頼（いらい）しました。作業（さぎょう）の前後（ぜんご）に店長（てんちょう）がおこなうこととして、適切（てきせつ）でないものはどれか。","ch":["燻煙（くんえん）後（のち）、すぐに調理（ちょうり）を再開（さいかい）できるよう作業（さぎょう）直後（ちょくご）に調理場（ちょうりば）へ入（い）る","駆除（くじょ）処理後（しょりご）に見（み）つかったゴキブリの死骸（しがい）は、見（み）つけたらすぐに取り除（とりのぞ）く","戸棚（とだな）、引き出（ひきだ）し、狭（せま）いすき間（ま）など隠（かく）れ場所（ばしょ）になりやすい場所（ばしょ）を清掃（せいそう）する"],"answer_index":0,"ex":"燻煙（くんえん）法（ほう）では、薬剤（やくざい）をたいた後（のち）3～4時間（じかん）は調理（ちょうり）施設（しせつ）内（ない）へ入（い）れません。薬剤（やくざい）汚染（おせん）を防（ふせ）ぐため食器（しょっき）などは保管（ほかん）庫（こ）に入（い）れるかラップで覆（おお）います。駆除（くじょ）処理後（しょりご）は死骸（しがい）が見（み）つかりやすく、異物（いぶつ）混入（こんにゅう）やお客様（きゃくさま）の目（め）にふれないよう、見（み）つけたらすぐ取り除（とりのぞ）きます。","jt":"判断試験"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.23","tp":"4.（5）ねずみ及（およ）び昆虫（こんちゅう）対策（たいさく）　3）ゴキブリの発生（はっせい）防止（ぼうし）および駆除（くじょ）","q":"ゴキブリが多（おお）く発生（はっせい）したので、閉店（へいてん）後（のち）の22時（とき）00分（わ）から薬剤（やくざい）による燻煙（くんえん）法（ほう）で駆除（くじょ）する。食器（しょっき）は保管（ほかん）庫（こ）に入（い）れて覆（おお）いをした。翌日（よくじつ）の作業（さぎょう）開始時刻（かいしじこく）を計画（けいかく）するとき、正（ただ）しいものはどれか。","ch":["3〜4時間（じかん）は入（い）れないので、入室（にゅうしつ）は翌日（よくじつ）1時（とき）00分（ふん）以降（いこう）にする","1〜2時間（じかん）は入（い）れないので、入室（にゅうしつ）は翌日（よくじつ）0時（とき）00分（ふん）以降（いこう）にする","20〜30分（ふん）は入（い）れないので、入室（にゅうしつ）は22時（とき）30分（ふん）以降（いこう）にする"],"answer_index":0,"ex":"燻煙（くんえん）法（ほう）では3〜4時間（じかん）は調理（ちょうり）施設（しせつ）内（ない）へ入（い）れない。22時（とき）00分（ふん）＋3時間（じかん）＝翌日（よくじつ）1時（とき）00分（ふん）、22時（とき）00分（ふん）＋4時間（じかん）＝翌日（よくじつ）2時（とき）00分（ふん）なので、入室（にゅうしつ）は早（はや）くても翌日（よくじつ）1時（とき）00分（ふん）以降（いこう）とする。1〜2時間（じかん）や20〜30分（ふん）では待ち時間（まちじかん）が足（た）りない。","jt":"計画立案"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.24","tp":"4.（5）ねずみ及（およ）び昆虫（こんちゅう）対策（たいさく）　4）ねずみの侵入（しんにゅう）防止（ぼうし）および駆除（くじょ）","q":"朝（あさ）の点検（てんけん）で、調理場（ちょうりば）のすみに積（つ）んだ段ボール（だんぼーる）に、ねずみのかじった跡（あと）とふんを見（み）つけました。従業員（じゅうぎょういん）は「市販（しはん）の殺（ころ）そ剤（ざい）を食材（しょくざい）棚（たな）の下（した）にまきましょう」と言（い）っています。店長（てんちょう）としてとるべき対応（たいおう）はどれか。","ch":["従業員（じゅうぎょういん）の言（い）うとおり、殺（ころ）そ剤（ざい）を食材（しょくざい）棚（たな）の下（した）にまいてもらう","段ボール（だんぼーる）や食品（しょくひん）くずを片（かた）づけて清掃（せいそう）し、薬剤（やくざい）は専門（せんもん）業者（ぎょうしゃ）に相談（そうだん）する","かじられた段ボール（だんぼーる）だけを捨（す）て、ふんは翌週（よくしゅう）の清掃（せいそう）日（にち）に片（かた）づける"],"answer_index":1,"ex":"ゴミや餌（えさ）になるようなものを作業場（さぎょうば）内（ない）に残（のこ）さないこと、人（にん）の目（め）がゆきとどかない場所（ばしょ）も整理（せいり）・整頓（せいとん）、清掃（せいそう）をして、ねずみの巣（す）になる場所（ばしょ）を作（つく）らないことが大切（たいせつ）です。駆除（くじょ）には粘着（ねんちゃく）トラップなどの捕獲（ほかく）や忌避剤（きひざい）などの物理的（ぶつりてき）方法（ほうほう）もありますが、調理（ちょうり）施設（しせつ）内（ない）での薬剤（やくざい）の使用（しよう）はねずみの回収（かいしゅう）処理（しょり）や薬剤（やくざい）の安全性（あんぜんせい）などの問題（もんだい）があるため、専門（せんもん）業者（ぎょうしゃ）に相談（そうだん）・依頼（いらい）することが有効（ゆうこう）です。","jt":"判断試験"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.26","tp":"４．一般的（いっぱんてき）な衛生（えいせい）管理（かんり）の基準（きじゅん）１４項目（こうもく）の詳細（しょうさい）（７）食品（しょくひん）等（など）取扱者（とりあつかいしゃ）の衛生（えいせい）管理（かんり）","q":"朝（あさ）の健康（けんこう）チェックで、調理（ちょうり）担当（たんとう）のスタッフから「昨夜（さくや）から下痢（げり）が続（つづ）いている」と申し出（もうしで）がありました。店長（てんちょう）がとるべき対応（たいおう）はどれか。","ch":["その日（にち）は調理（ちょうり）作業（さぎょう）に従事（じゅうじ）させず、代替（だいたい）の要員（よういん）で対応（たいおう）する","手袋（てぶくろ）とマスクをすれば問題（もんだい）ないので、通常（つうじょう）どおり調理（ちょうり）させる","本人（ほんにん）が元気（げんき）なら、盛（も）り付（つ）け作業（さぎょう）だけを担当（たんとう）させる"],"answer_index":0,"ex":"食品（しょくひん）取扱者（とりあつかいしゃ）に下痢（げり）やおう吐（と）などの胃腸（いちょう）炎症（えんしょう）状（じょう）がある場合（ばあい）は、調理（ちょうり）作業（さぎょう）に従事（じゅうじ）しないことが重要（じゅうよう）です。職場（しょくば）の責任者（せきにんしゃ）などは、体調不良（たいちょうふりょう）者（もの）が出（で）た場合（ばあい）の代替（だいたい）要員（よういん）の確保（かくほ）などの対策（たいさく）を事前（じぜん）に練（ね）っておく必要（ひつよう）があります。手袋（てぶくろ）やマスクをしても、調理（ちょうり）作業（さぎょう）に従事（じゅうじ）させてよい理由（りゆう）にはなりません。","jt":"判断試験"}]},{"title":"衛生管理 実技 · भाग 3 (p.27–36)","words":[{"subject":"衛生管理","type":"実技","source":"衛生管理 p.27、p.28","tp":"４．一般的（いっぱんてき）な衛生（えいせい）管理（かんり）の基準（きじゅん）１４項目（こうもく）の詳細（しょうさい）（７）食品（しょくひん）等（など）取扱者（とりあつかいしゃ）の衛生（えいせい）管理（かんり）","q":"手洗（てあら）いの前（まえ）の確認（かくにん）で、スタッフの指（ゆび）に切り傷（きりきず）が見（み）つかりました。正（ただ）しい対応（たいおう）はどれか。","ch":["傷（きず）が小（ちー）さければ報告（ほうこく）の必要（ひつよう）はないので、そのまま素手（すで）で作業（さぎょう）してよい","責任者（せきにんしゃ）に報告（ほうこく）し、手洗（てあら）い後（のち）に耐水性（たいすいせい）の絆創膏（ばんそうこう）と使い捨（つかいす）て手袋（てぶくろ）を着（つ）けて作業（さぎょう）する","傷（きず）の上（うえ）に布（ぬの）のばんそうこうをしっかり貼（は）っておけば、使い捨（つかいす）て手袋（てぶくろ）は必要（ひつよう）ない"],"answer_index":1,"ex":"手（て）に傷（きず）や手荒（てあら）れがある場合（ばあい）は責任者（せきにんしゃ）などに報告（ほうこく）し、手洗（てあら）い後（のち）に決（き）められた耐水性（たいすいせい）の絆創膏（ばんそうこう）と使い捨（つかいす）て手袋（てぶくろ）を着用（ちゃくよう）して作業（さぎょう）をおこないます。手指（てゆび）に傷（きず）や手荒（てあら）れがある場合（ばあい）、作業中（さぎょうちゅう）は常（つね）に手袋（てぶくろ）を着用（ちゃくよう）します。手洗（てあら）いをしないという対応（たいおう）はありません。","jt":"判断試験"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.30","tp":"４．一般的（いっぱんてき）な衛生（えいせい）管理（かんり）の基準（きじゅん）１４項目（こうもく）の詳細（しょうさい）（８）情報（じょうほう）の提供（ていきょう）","q":"食事中（しょくじちゅう）のお客様（きゃくさま）が、じんましんに続（つづ）いて「息（いき）が苦（くる）しい」と訴（うった）え、症状（しょうじょう）が急（きゅう）に悪（わる）くなりました。店（みせ）としての対応（たいおう）はどれか。","ch":["水（みず）を飲（の）んでもらい、しばらく様子（ようす）を見（み）る","症状（しょうじょう）を見極（みきわ）め、速（すみ）やかに救急車（きゅうきゅうしゃ）を手配（てはい）する","料理（りょうり）に何（なに）が入（いっ）っていたかを調（しら）べ終（お）わってから、対応（たいおう）を決（き）める"],"answer_index":1,"ex":"お客様（きゃくさま）がアレルギーを発症（はっしょう）した時（とき）には症状（しょうじょう）を見極（みきわ）め、重篤（しげあつ）な状態（じょうたい）や症状（しょうじょう）が急変（きゅうへん）した時（とき）は速（すみ）やかに救急車（きゅうきゅうしゃ）を手配（てはい）します。食物（たべもの）アレルギーは呼吸困難（こきゅうこんなん）や血圧（けつあつ）低下（ていか）、意識（いしき）混濁（こんだく）などを招（まね）き、重篤（しげあつ）な場合（ばあい）は生命（せいめい）にかかわることがあります。","jt":"判断試験"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.33","tp":"４．一般的（いっぱんてき）な衛生（えいせい）管理（かんり）の基準（きじゅん）１４項目（こうもく）の詳細（しょうさい）（１１）教育（きょういく）訓練（くんれん）","q":"新（あたら）しく採用（さいよう）したスタッフが厨房（ちゅうぼう）に入（い）ります。店長（てんちょう）がおこなう衛生（えいせい）教育（きょういく）の内容（ないよう）として、適切（てきせつ）でないものはどれか。","ch":["出勤時（しゅっきんじ）の健康（けんこう）チェック項目（こうもく）と、体調不良（たいちょうふりょう）時（とき）の連絡方法（れんらくほうほう）を教（おし）える","手洗（てあら）いの方法（ほうほう）とタイミング、衛生（えいせい）手袋（てぶくろ）の使用方法（しようほうほう）を教（おし）える","教育（きょういく）は採用（さいよう）時（とき）に１回（かい）おこなえば十分（じゅうぶん）で、効果（こうか）の検証（けんしょう）は必要（ひつよう）ない"],"answer_index":2,"ex":"教育（きょういく）訓練（くんれん）は新規（しんき）採用（さいよう）時（とき）や従事（じゅうじ）経験（けいけん）に応（おう）じて実施（じっし）し、研修（けんしゅう）やOJTの機会（きかい）を活用（かつよう）して衛生（えいせい）レベルの維持（いじ）・向上（こうじょう）を図（はか）ります。また、教育（きょういく）訓練（くんれん）が実際（じっさい）に十分（じゅうぶん）な効果（こうか）を得（え）られているかを検証（けんしょう）し、必要（ひつよう）に応（おう）じて見直（みなお）します。健康管理（けんこうかんり）、身（み）だしなみ、手洗（てあら）い、食品（しょくひん）・器具（きぐ）の取扱（とりあつか）いは主（おも）な教育（きょういく）訓練（くんれん）項目（こうもく）です。","jt":"判断試験"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.35","tp":"5. 食品（しょくひん）調理（ちょうり）・提供（ていきょう）工程（こうてい）における適切（てきせつ）な衛生（えいせい）管理（かんり）のポイント（1）食材（しょくざい）の適切（てきせつ）な下（した）処理（しょり）と保管（ほかん）","q":"下（した）処理（しょり）を終（お）えた3つの食材（しょくざい）を冷蔵（れいぞう）保管（ほかん）する。豚肉（ぶたにく）、刺身（さしみ）に使（つか）う生食（いけずき）用（よう）のまぐろ、サラダに使（つか）うレタスについて、保管（ほかん）温度（おんど）の組み合（くみあ）わせとして正（ただ）しいものはどれか。","ch":["豚肉（ぶたにく）4℃以下（いか）、まぐろ10℃以下（いか）、レタス10℃前後（ぜんご）","豚肉（ぶたにく）10℃前後（ぜんご）、まぐろ10℃以下（いか）、レタス4℃以下（いか）","豚肉（ぶたにく）10℃以下（いか）、まぐろ4℃以下（いか）、レタス10℃前後（ぜんご）"],"answer_index":2,"ex":"下（した）処理後（しょりご）の保管（ほかん）温度（おんど）は、肉（にく）・魚（さかな）が10℃以下（いか）、生食（いけずき）用（よう）魚介類（ぎょかいるい）が4℃以下（いか）、生鮮（せいせん）果実（かじつ）・野菜（やさい）が10℃前後（ぜんご）である。豚肉（ぶたにく）は肉（にく）なので10℃以下（いか）、生食（いけずき）用（よう）のまぐろはより低（ひく）い4℃以下（いか）、レタスは野菜（やさい）なので10℃前後（ぜんご）となる。肉（にく）と生食（いけずき）用（よう）魚介類（ぎょかいるい）の温度（おんど）を逆（ぎゃく）にするのがよくある間違（まちが）いである。","jt":"計画立案"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.36","tp":"５．食品（しょくひん）調理（ちょうり）・提供（ていきょう）工程（こうてい）における適切（てきせつ）な衛生（えいせい）管理（かんり）のポイント（３）食材（しょくざい）の加熱（かねつ）処理（しょり）とその後（のち）の取扱（とりあつか）い","q":"鶏肉（とりにく）の揚げ物（あげもの）を作（つく）っています。中心（ちゅうしん）温度計（おんどけい）で測（はか）ると、食品（しょくひん）の中心部（ちゅうしんぶ）の温度（おんど）は７２℃でした。この時（とき）にとるべき対応（たいおう）はどれか。","ch":["７２℃は７５℃に近（ちか）いので、そのまま提供（ていきょう）する","加熱（かねつ）を続（つづ）け、中心部（ちゅうしんぶ）が７５℃で１分間（ふんかん）以上（いじょう）になったことを確認（かくにん）する","中心（ちゅうしん）温度計（おんどけい）は使（つか）わず、見た目（みため）の色（いろ）で加熱（かねつ）の終（お）わりを判断（はんだん）する"],"answer_index":1,"ex":"有害（ゆうがい）微生物（びせいぶつ）を殺菌（さっきん）するための加熱（かねつ）の基本（きほん）は、食品（しょくひん）の中心部（ちゅうしんぶ）が７５℃で１分間（ふんかん）以上（いじょう）です。７２℃ではこの条件（じょうけん）に達（たっ）していないので、加熱（かねつ）を続（つづ）けて中心（ちゅうしん）温度（おんど）と時間（じかん）を確認（かくにん）します。加熱（かねつ）調理（ちょうり）の温度（おんど）測定（そくてい）には中心（ちゅうしん）温度計（おんどけい）を使（つか）い、加熱（かねつ）した時間（じかん）も計測（けいそく）します。","jt":"計画立案"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.36","tp":"５．食品（しょくひん）調理（ちょうり）・提供（ていきょう）工程（こうてい）における適切（てきせつ）な衛生（えいせい）管理（かんり）のポイント（３）食材（しょくざい）の加熱（かねつ）処理（しょり）とその後（のち）の取扱（とりあつか）い","q":"前日（ぜんじつ）の夜（よる）に大量（たいりょう）に作（つく）ったカレーを、火（ひ）を止（と）めたあと鍋（なべ）にふたをして調理場（ちょうりば）に置（お）き、翌日（よくじつ）に温（あたた）め直（なお）して出（だ）す予定（よてい）です。ウエルシュ菌（きん）などの芽胞（がほう）形成（けいせい）菌（きん）のことを考（かんが）えたとき、店長（てんちょう）の指示（しじ）として正（ただ）しいものはどれか。","ch":["室温（しつおん）でゆっくり冷（さ）ますほうが味（あじ）がよくなるので、このままにしておく","加熱後（かねつご）は速（すみ）やかに冷却（れいきゃく）して低温（ていおん）で保管（ほかん）し、提供（ていきょう）前（まえ）に十分（じゅうぶん）に再加熱（さいかねつ）する","翌日（よくじつ）に長（なが）い時間（じかん）ぐつぐつ煮（に）れば芽胞（がほう）は死（し）ぬので、冷却（れいきゃく）はしなくてよい"],"answer_index":1,"ex":"ボツリヌス菌（きん）、ウエルシュ菌（きん）、セレウス菌（きん）などの食中毒（しょくちゅうどく）菌（きん）は熱（ねつ）に強（つよ）い芽胞（がほう）を形成（けいせい）するため、１００℃で加熱（かねつ）しても死滅（しめつ）しません。そのため、加熱（かねつ）調理（ちょうり）後（のち）の食品（しょくひん）であっても芽胞（がほう）の増殖（ぞうしょく）抑制（よくせい）のための温度管理（おんどかんり）が重要（じゅうよう）です。防（ふせ）ぐポイントは、加熱後（かねつご）の速（すみ）やかな喫食（きっしょく）、保管（ほかん）する場合（ばあい）は迅速（じんそく）な冷却（れいきゃく）と低温（ていおん）保管（ほかん）、提供（ていきょう）前（まえ）の十分（じゅうぶん）な再加熱（さいかねつ）です。","jt":"判断試験"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.36","tp":"５．食品（しょくひん）調理（ちょうり）・提供（ていきょう）工程（こうてい）における適切（てきせつ）な衛生（えいせい）管理（かんり）のポイント（３）食材（しょくざい）の加熱（かねつ）処理（しょり）とその後（のち）の取扱（とりあつか）い","q":"加熱（かねつ）調理（ちょうり）した料理（りょうり）を冷却（れいきゃく）しています。店（みせ）に冷却（れいきゃく）機（き）はなく、記録（きろく）には加熱（かねつ）終了（しゅうりょう）から３０分後（ふんご）の中心（ちゅうしん）温度（おんど）が４５℃と書（か）かれていました。「大量（たいりょう）調理（ちょうり）施設（しせつ）衛生（えいせい）管理（かんり）マニュアル」の目安（めやす）に照（て）らした店長（てんちょう）の判断（はんだん）として、正（ただ）しいものはどれか。","ch":["そのまま常温（じょうおん）で冷（さ）めるのを待（ま）ち、記録（きろく）には「異常（いじょう）なし」と書（か）く","細菌（さいきん）が増（ふ）える温度（おんど）帯（たい）は３０〜４０℃なので、４５℃なら問題（もんだい）ないと判断（はんだん）する","目安（めやす）から外（はず）れているので、氷（こおり）や保冷（ほれい）材（ざい）で冷却（れいきゃく）を早（はや）め、逸脱（いつだつ）として記録（きろく）する"],"answer_index":2,"ex":"「大量（たいりょう）調理（ちょうり）施設（しせつ）衛生（えいせい）管理（かんり）マニュアル」では、加熱（かねつ）済（す）み食品（しょくひん）は３０分（ふん）以内（いない）に２０℃、または１時間以内（じかんいない）に１０℃まで冷却（れいきゃく）することとしています。３０分（ふん）で４５℃は目安（めやす）から外（はず）れているため、水（みず）、氷（こおり）、保冷（ほれい）材（ざい）や清浄（せいじょう）な冷風（れいふう）を使（つか）って速（すみ）やかに冷却（れいきゃく）します。細菌（さいきん）の増殖（ぞうしょく）が可能（かのう）な危険（きけん）温度（おんど）帯（たい）は１０〜６０℃です。","jt":"計画立案"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.36","tp":"５．食品（しょくひん）調理（ちょうり）・提供（ていきょう）工程（こうてい）における適切（てきせつ）な衛生（えいせい）管理（かんり）のポイント（２）食材（しょくざい）の解凍（かいとう）と保管（ほかん）","q":"朝（あさ）、調理場（ちょうりば）に入（い）ると、新人（しんじん）スタッフが冷凍（れいとう）の魚（さかな）を調理（ちょうり）台（だい）の上（うえ）に出（だ）したまま室温（しつおん）で解凍（かいとう）していました。店長（てんちょう）としての対応（たいおう）はどれか。","ch":["室温（しつおん）解凍（かいとう）はしてはいけないと教（おし）え、冷蔵庫（れいぞうこ）内（ない）での解凍（かいとう）か流水（りゅうすい）解凍（かいとう）に変（か）えさせる","40℃くらいの熱（あつ）いお湯（ゆ）につけさせて、すぐに解凍（かいとう）作業（さぎょう）を終（お）わらせる","解凍（かいとう）したあとにしっかり加熱（かねつ）すれば細菌（さいきん）はすべて死（し）ぬので、問題（もんだい）はないと伝（つた）える"],"answer_index":0,"ex":"自然（しぜん）・室温（しつおん）解凍（かいとう）は、食材（しょくざい）の表面（ひょうめん）で細菌（さいきん）が増殖（ぞうしょく）する機会（きかい）を与（あた）えるため、衛生（えいせい）管理上（かんりじょう）おこなってはいけない解凍（かいとう）方法（ほうほう）です。冷蔵庫（れいぞうこ）内（ない）での解凍（かいとう）は細菌（さいきん）増殖（ぞうしょく）の抑制（よくせい）に適（てき）し、流水（りゅうすい）解凍（かいとう）は比較的（ひかくてき）短時間（たんじかん）で解凍（かいとう）できます。解凍（かいとう）方法（ほうほう）の教育（きょういく）もあわせて必要（ひつよう）です。","jt":"判断試験"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.36","tp":"5. 食品（しょくひん）調理（ちょうり）・提供（ていきょう）工程（こうてい）における適切（てきせつ）な衛生（えいせい）管理（かんり）のポイント（3）食材（しょくざい）の加熱（かねつ）処理（しょり）とその後（のち）の取扱（とりあつか）い","q":"ハンバーグを焼（や）いている。中心（ちゅうしん）温度計（おんどけい）で測（はか）ると、11時（とき）20分（ふん）に中心（ちゅうしん）温度（おんど）が75℃になった。テキストの加熱（かねつ）の基準（きじゅん）を守（まも）るとき、加熱（かねつ）を終（お）えてよいのは何時何分（なんじなんぷん）以降（いこう）か。","ch":["11時（とき）20分（ふん）以降（いこう）（75℃になった時点（じてん）で終了（しゅうりょう））","11時（とき）21分（ふん）以降（いこう）（75℃になって1分後（ふんご））","11時（とき）30分（ふん）以降（いこう）（75℃になって10分後（ふんご））"],"answer_index":1,"ex":"加熱（かねつ）の基準（きじゅん）は食品（しょくひん）の中心部（ちゅうしんぶ）が75℃で1分間（ふんかん）以上（いじょう）である。75℃到達（とうたつ）が11時（とき）20分（ふん）なので、11時（とき）20分（ふん）＋1分（ふん）＝11時（とき）21分（ふん）。11時（とき）21分（ふん）以降（いこう）に加熱（かねつ）を終（お）えてよい。75℃になった時点（じてん）で止（や）めると1分間（ふんかん）の保持（ほじ）がなく、10分（ふん）は基準（きじゅん）の取り違（とりちが）えである。","jt":"計画立案"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.36","tp":"5. 食品（しょくひん）調理（ちょうり）・提供（ていきょう）工程（こうてい）における適切（てきせつ）な衛生（えいせい）管理（かんり）のポイント（3）食材（しょくざい）の加熱（かねつ）処理（しょり）とその後（のち）の取扱（とりあつか）い","q":"ノロウイルス汚染（おせん）のおそれがある二枚（にまい）貝（かい）（カキ）を加熱（かねつ）している。10時（とき）30分（ふん）00秒（びょう）に中心（ちゅうしん）温度（おんど）が87℃になった。テキストの基準（きじゅん）を守（まも）る加熱（かねつ）計画（けいかく）として正（ただ）しいものはどれか。","ch":["10時（とき）30分（ふん）30秒（びょう）まで加熱（かねつ）を続（つづ）ける","10時（とき）31分（ふん）00秒（びょう）まで加熱（かねつ）を続（つづ）ける","10時（とき）31分（ふん）30秒（びょう）まで加熱（かねつ）を続（つづ）ける"],"answer_index":2,"ex":"二枚（にまい）貝（かい）などノロウイルス汚染（おせん）のおそれのある食材（しょくざい）は85〜90℃で90秒間（びょうかん）以上（いじょう）の加熱（かねつ）が必要（ひつよう）である。90秒（びょう）＝1分（ふん）30秒（びょう）なので、10時（とき）30分（ふん）00秒（びょう）＋1分（ふん）30秒（びょう）＝10時（とき）31分（ふん）30秒（びょう）。30秒（びょう）や60秒（びょう）で止（や）めるのは秒数（びょうすう）の取り違（とりちが）えである。","jt":"計画立案"}]},{"title":"衛生管理 実技 · भाग 4 (p.36–38)","words":[{"subject":"衛生管理","type":"実技","source":"衛生管理 p.36","tp":"5. 食品（しょくひん）調理（ちょうり）・提供（ていきょう）工程（こうてい）における適切（てきせつ）な衛生（えいせい）管理（かんり）のポイント（3）食材（しょくざい）の加熱（かねつ）処理（しょり）とその後（のち）の取扱（とりあつか）い","q":"煮物（にもの）の加熱（かねつ）調理（ちょうり）が11時（とき）00分（ふん）に終（お）わった。この後（のち）、冷却（れいきゃく）して冷蔵（れいぞう）保管（ほかん）する。「大量（たいりょう）調理（ちょうり）施設（しせつ）衛生（えいせい）管理（かんり）マニュアル」の冷却（れいきゃく）の考え方（かんがえかた）にしたがうとき、中心（ちゅうしん）温度（おんど）の目標（もくひょう）時刻（じこく）の計画（けいかく）として正（ただ）しいものはどれか。","ch":["11時（とき）30分（ふん）に20℃まで、12時（とき）00分（ふん）に10℃まで下（さ）げる","11時（とき）15分（ふん）に20℃まで、11時（とき）45分（ふん）に10℃まで下（さ）げる","12時（とき）00分（ふん）に20℃まで、13時（とき）00分（ふん）に10℃まで下（さ）げる"],"answer_index":0,"ex":"冷却（れいきゃく）は30分（ふん）以内（いない）に20℃、または1時間以内（じかんいない）に10℃までとされている。起点（きてん）は加熱（かねつ）終了（しゅうりょう）の11時（とき）00分（ふん）なので、11時（とき）00分（ふん）＋30分（ふん）＝11時（とき）30分（ふん）に20℃、11時（とき）00分（ふん）＋60分（ふん）＝12時（とき）00分（ふん）に10℃となる。15分（ふん）・45分（ふん）や、1時間（じかん）・2時間（じかん）としたものは時間（じかん）の取り違（とりちが）えである。","jt":"計画立案"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.36","tp":"5. 食品（しょくひん）調理（ちょうり）・提供（ていきょう）工程（こうてい）における適切（てきせつ）な衛生（えいせい）管理（かんり）のポイント（3）食材（しょくざい）の加熱（かねつ）処理（しょり）とその後（のち）の取扱（とりあつか）い","q":"14時（とき）40分（ふん）に加熱（かねつ）調理（ちょうり）が終（お）わり、冷却（れいきゃく）を始（はじ）めた。15時（とき）10分（ふん）に中心（ちゅうしん）温度（おんど）を測（はか）ると24℃だった。この後（のち）の冷却（れいきゃく）計画（けいかく）として正（ただ）しいものはどれか。","ch":["30分後（ふんご）の目標（もくひょう）20℃を満（み）たしている。15時（とき）40分（ふん）までに10℃以下（いか）にする","30分後（ふんご）の目標（もくひょう）は25℃なので問題（もんだい）ない。16時（とき）10分（ふん）までに10℃以下（いか）にする","30分後（ふんご）の目標（もくひょう）20℃を満（み）たしていない。15時（とき）40分（ふん）までに10℃以下（いか）にする"],"answer_index":2,"ex":"起点（きてん）は加熱（かねつ）終了（しゅうりょう）の14時（とき）40分（ふん）。14時（とき）40分（ふん）＋30分（ふん）＝15時（とき）10分（ふん）に20℃以下（いか）が目標（もくひょう）だが、実測（じっそく）は24℃なので目標（もくひょう）を満（み）たしていない。14時（とき）40分（ふん）＋60分（ふん）＝15時（とき）40分（ふん）までに10℃まで下（さ）げる必要（ひつよう）があるので、冷却（れいきゃく）を強（つよ）める。目標（もくひょう）を25℃としたり、起点（きてん）を測定時（そくていじ）刻（きざ）にして16時（とき）10分（ふん）とするのは誤（あやま）りである。","jt":"計画立案"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.37","tp":"５．食品（しょくひん）調理（ちょうり）・提供（ていきょう）工程（こうてい）における適切（てきせつ）な衛生（えいせい）管理（かんり）のポイント（３）食材（しょくざい）の加熱（かねつ）処理（しょり）とその後（のち）の取扱（とりあつか）い","q":"加熱（かねつ）調理（ちょうり）した煮物（にもの）を保温（ほおん）庫（こ）（ウォーマー）で保管（ほかん）しています。温度（おんど）を確認（かくにん）すると、庫内（こない）は５８℃でした。とるべき対応（たいおう）として正（ただ）しいものはどれか。","ch":["設定（せってい）を上（あ）げて６５℃以上（いじょう）を保（たも）ち、確認（かくにん）した温度（おんど）を記録（きろく）する","５０℃以上（いじょう）あれば細菌（さいきん）は増（ふ）えないので、そのままにする","温度（おんど）が下（さ）がっても味（あじ）は変（か）わらないので、記録（きろく）には６５℃と書（か）いておく"],"answer_index":0,"ex":"加熱（かねつ）調理（ちょうり）後（のち）に温（おん）蔵（くら）する食品（しょくひん）は、細菌（さいきん）が増殖（ぞうしょく）しにくい温度（おんど）帯（たい）（６５℃以上（いじょう））を維持（いじ）して保管（ほかん）します。５８℃は危険（きけん）温度（おんど）帯（たい）（１０〜６０℃）に入（い）るため、すぐに温度（おんど）を上（あ）げる必要（ひつよう）があります。実際（じっさい）と違（ちが）う温度（おんど）を記録（きろく）することは、事故（じこ）の未然（みぜん）防止（ぼうし）という記録（きろく）の目的（もくてき）に反（はん）します。","jt":"計画立案"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.37","tp":"5. 食品（しょくひん）調理（ちょうり）・提供（ていきょう）工程（こうてい）における適切（てきせつ）な衛生（えいせい）管理（かんり）のポイント（6）調理済（ちょうりず）み食品（しょくひん）の適切（てきせつ）な取扱（とりあつか）い","q":"加熱後（かねつご）のカレーを温（おん）蔵（くら）庫（こ）で保管（ほかん）し、1時間（じかん）ごとに中心（ちゅうしん）温度（おんど）を記録（きろく）した。記録（きろく）は11時（とき）00分（ふん）72℃、12時（とき）00分（ふん）68℃、13時（とき）00分（ふん）63℃、14時（とき）00分（ふん）66℃だった。基準（きじゅん）に照（て）らした判断（はんだん）として正（ただ）しいものはどれか。","ch":["12時（とき）00分（ふん）の68℃が基準（きじゅん）の70℃以上（いじょう）を下回（げかい）っている","13時（とき）00分（ふん）の63℃が基準（きじゅん）の65℃以上（いじょう）を下回（げかい）っている","14時（とき）00分（ふん）の66℃が基準（きじゅん）の70℃以上（いじょう）を下回（げかい）っている"],"answer_index":1,"ex":"温（おん）蔵（くら）保管（ほかん）は65℃以上（いじょう）を維持（いじ）する。72℃・68℃・66℃はいずれも65℃以上（いじょう）だが、13時（とき）00分（ふん）の63℃だけが65℃未満（みまん）で基準（きじゅん）を下回（したまわ）る。基準（きじゅん）を70℃以上（いじょう）と考（かんが）えるのは温度（おんど）帯（たい）の取り違（とりちが）えである。","jt":"計画立案"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.38","tp":"５．食品（しょくひん）調理（ちょうり）・提供（ていきょう）工程（こうてい）における適切（てきせつ）な衛生（えいせい）管理（かんり）のポイント（５）盛（も）り付（つ）け作業（さぎょう）","q":"盛（も）り付（つ）け作業（さぎょう）の途中（とちゅう）で、着用（ちゃくよう）していた使い捨（つかいす）て手袋（てぶくろ）が破（やぶ）れました。担当者（たんとうしゃ）がとるべき行動（こうどう）として正（ただ）しいものはどれか。","ch":["破（やぶ）れた部分（ぶぶん）が小（ちー）さいので、手袋（てぶくろ）を替（か）えずにそのまま作業（さぎょう）を続（つづ）ける","手袋（てぶくろ）を交換（こうかん）し、破損（はそん）片（へん）が皿（さら）や食品（しょくひん）に混入（こんにゅう）していないか確認（かくにん）する","破（やぶ）れた手袋（てぶくろ）は外（はず）さず、その上（うえ）に新（あたら）しい手袋（てぶくろ）を重（おも）ねて着（つ）ける"],"answer_index":1,"ex":"盛（も）り付（つ）け時（とき）に手袋（てぶくろ）や器具（きぐ）が破損（はそん）した時（とき）は交換（こうかん）をおこないますが、その破損（はそん）片（へん）が盛（も）り付（つ）け皿（さら）や食品（しょくひん）に混入（こんにゅう）していないことを確認（かくにん）します。盛（も）り付（つ）けは素手（すで）でおこなわず、必（かなら）ず使い捨（つかいす）て手袋（てぶくろ）と清潔（せいけつ）な箸（はし）、トングなどの器具（きぐ）を使用（しよう）します。手袋（てぶくろ）を着（つ）ける前（まえ）には必（かなら）ず衛生的（えいせいてき）な手洗（てあら）いをおこないます。","jt":"判断試験"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.38","tp":"５．食品（しょくひん）調理（ちょうり）・提供（ていきょう）工程（こうてい）における適切（てきせつ）な衛生（えいせい）管理（かんり）のポイント（６）調理済（ちょうりず）み食品（しょくひん）の適切（てきせつ）な取扱（とりあつか）い","q":"調理済（ちょうりず）みの冷菜（れいさい）を食品（しょくひん）冷蔵庫（れいぞうこ）で保管（ほかん）しています。温度計（おんどけい）を見（み）ると、庫内（こない）は１４℃でした。この時（とき）の対応（たいおう）として正（ただ）しいものはどれか。","ch":["冷蔵（れいぞう）品（ひん）の保管（ほかん）温度（おんど）の目安（めやす）は１５℃以下（いか）なので、このまま保管（ほかん）を続（つづ）けても問題（もんだい）はないと考（かんが）える","常温（じょうおん）品（ひん）の目安（めやす）と同（おな）じ温度（おんど）なので、冷蔵庫（れいぞうこ）から出（だ）して専用（せんよう）ケースに移（うつ）して保管（ほかん）する","冷蔵（れいぞう）品（ひん）の目安（めやす）は１０℃以下（いか）なので、原因（げんいん）を確（たし）かめて温度（おんど）を下（さ）げ、確認（かくにん）した温度（おんど）を記録（きろく）する"],"answer_index":2,"ex":"調理済（ちょうりず）み食品（しょくひん）の保管（ほかん）温度（おんど）の目安（めやす）は、温（おん）蔵（くら）品（ひん）は温（おん）蔵（くら）庫内（こない）で６５℃以上（いじょう）、常温（じょうおん）品（ひん）は専用（せんよう）ケースで１５〜２５℃、冷蔵（れいぞう）品（ひん）は食品（しょくひん）冷蔵庫（れいぞうこ）（棚（たな））で１０℃以下（いか）、冷凍品（れいとうひん）は食品（しょくひん）冷凍庫（れいとうこ）内（ない）で−１５℃以下（いか）です。１４℃は冷蔵（れいぞう）品（ひん）の目安（めやす）を超（こ）えているため対応（たいおう）が必要（ひつよう）で、温度（おんど）は必（かなら）ず確認（かくにん）と記録（きろく）をとります。","jt":"計画立案"},{"subject":"衛生管理","type":"実技","source":"衛生管理 p.38","tp":"5. 食品（しょくひん）調理（ちょうり）・提供（ていきょう）工程（こうてい）における適切（てきせつ）な衛生（えいせい）管理（かんり）のポイント（6）調理済（ちょうりず）み食品（しょくひん）の適切（てきせつ）な取扱（とりあつか）い","q":"調理済（ちょうりず）み食品（しょくひん）を4つの方法（ほうほう）で保管（ほかん）する計画（けいかく）を立（た）てる。温（おん）蔵（くら）するスープ、常温（じょうおん）で置（お）くパン、冷蔵（れいぞう）するサラダ、冷凍（れいとう）するアイスについて、保管（ほかん）温度（おんど）の目安（めやす）の組み合（くみあ）わせとして正（ただ）しいものはどれか。","ch":["スープ65℃以上（いじょう）、パン15〜25℃、サラダ10℃以下（いか）、アイス−15℃以下（いか）","スープ60℃以上（いじょう）、パン10〜20℃、サラダ15℃以下（いか）、アイス−10℃以下（いか）","スープ70℃以上（いじょう）、パン20〜30℃、サラダ5℃以下（いか）、アイス−20℃以下（いか）"],"answer_index":0,"ex":"テキストでは温（おん）蔵（くら）品（ひん）は温（おん）蔵（くら）庫内（こない）で65℃以上（いじょう）、常温（じょうおん）品（ひん）は専用（せんよう）ケースで15〜25℃、冷蔵（れいぞう）品（ひん）は10℃以下（いか）、冷凍品（れいとうひん）は−15℃以下（いか）が目安（めやす）とされている。60℃以上（いじょう）や70℃以上（いじょう）、5℃以下（いか）や−20℃以下（いか）はテキストの目安（めやす）と異（こと）なる温度（おんど）帯（たい）の取り違（とりちが）えである。","jt":"計画立案"}]},{"title":"飲食物調理 学科 · भाग 1 (p.5–11)","words":[{"subject":"飲食物調理","type":"学科","source":"飲食物調理 p.5","tp":"1. 食材（しょくざい）（原材料（げんざいりょう））に関（かん）する注意点（ちゅういてん）","q":"肉（にく）の部位（ぶい）の名称（めいしょう）を定（さだ）めている規格（きかく）について、正（ただ）しいものはどれか。","ch":["牛肉（ぎゅうにく）と豚肉（ぶたにく）の部位（ぶい）の名称（めいしょう）は、日本食（にほんしょく）肉（にく）格付（かくつけ）協会（きょうかい）が定（さだ）めた部分（ぶぶん）肉（にく）取引（とりひき）規格（きかく）で決（き）められている。","牛肉（ぎゅうにく）の部位（ぶい）の名称（めいしょう）は、農林水産省（のうりんすいさんしょう）が定（さだ）めた食鶏（しょくけい）小売（こうり）規格（きかく）で決（き）められている。","鶏肉（とりにく）の部位（ぶい）の名称（めいしょう）は、日本食（にほんしょく）肉（にく）格付（かくつけ）協会（きょうかい）が定（さだ）めた鶏（にわとり）部分（ぶぶん）肉（にく）取引（とりひき）規格（きかく）で決（き）められている。"],"answer_index":0,"ex":"牛肉（ぎゅうにく）は牛（うし）部分（ぶぶん）肉（にく）取引（とりひき）規格（きかく）、豚肉（ぶたにく）は豚（ぶた）部分（ぶぶん）肉（にく）取引（とりひき）規格（きかく）で名称（めいしょう）が決（き）められており、どちらも社団法人（しゃだんほうじん）日本食（にほんしょく）肉（にく）格付（かくつけ）協会（きょうかい）が定（さだ）めたものです。鶏肉（とりにく）だけは農林水産省（のうりんすいさんしょう）が定（さだ）めた食鶏（しょくけい）小売（こうり）規格（きかく）によります。規格（きかく）の名前（なまえ）と定（さだ）めた団体（だんたい）を入（い）れかえた他（ほか）の選択肢（せんたくし）は誤（あやま）りです。"},{"subject":"飲食物調理","type":"学科","source":"飲食物調理 p.5","tp":"1. 食材（しょくざい）（原材料（げんざいりょう））に関（かん）する注意点（ちゅういてん）","q":"肉（にく）の加熱（かねつ）について、正（ただ）しいものはどれか。","ch":["肉（にく）は加熱（かねつ）すると脂（あぶら）が溶（と）けるので、加熱時間（かねつじかん）が長（なが）いほど必（かなら）ず柔（やわ）らかくなる。","タンパク質（しつ）は６０℃付近（ふきん）で熱（ねつ）凝固（ぎょうこ）が起（お）こり、肉（にく）が収縮（しゅうしゅく）して小（ちー）さくなる。","すね肉（にく）のような筋（すじ）の多（おお）い肉（にく）は、短時間（たんじかん）の加熱（かねつ）でコラーゲンが分解（ぶんかい）されて柔（やわ）らかくなる。"],"answer_index":1,"ex":"テキストでは、タンパク質（しつ）の変性（へんせい）により６０℃付近（ふきん）で熱（ねつ）凝固（ぎょうこ）が起（お）こり、肉（にく）が収縮（しゅうしゅく）して小（ちー）さくなると説明（せつめい）しています。加熱（かねつ）すると肉汁（にくじゅう）が流（なが）れ出（で）て硬（かた）くなるので、長（なが）く加熱（かねつ）するほど必（かなら）ず柔（やわ）らかくなるのは誤（あやま）りです。一般的（いっぱんてき）には、はじめに強火（つよび）～中火（ちゅうび）で表面（ひょうめん）を凝固（ぎょうこ）させ、その後（のち）、弱火（よわび）で中（なか）まで火（ひ）を通（とう）します。すね肉（にく）のような筋（すじ）の多（おお）い肉（にく）は、長時間（ちょうじかん）加熱（かねつ）するとコラーゲンが分解（ぶんかい）されて柔（やわ）らかくなります。"},{"subject":"飲食物調理","type":"学科","source":"飲食物調理 p.6","tp":"1. 食材（しょくざい）（原材料（げんざいりょう））に関（かん）する注意点（ちゅういてん）","q":"魚（さかな）の鮮度（せんど）の見分（みわ）け方（ほう）として、正（ただ）しいものはどれか。","ch":["目（め）が大（おお）きく落ち込（おちこ）み、白（しろ）くにごって見（み）えるもの。","えらの色（いろ）があせて、白（しろ）っぽく変色（へんしょく）しているもの。","腹（はら）に弾力（だんりょく）があり、うろこがきれいについているもの。"],"answer_index":2,"ex":"新鮮（しんせん）な魚（さかな）は、目（め）が澄（す）んでいて落ち込（おちこ）んでいない、えらが鮮（せん）やかな赤色（せきしょく）である、腹（はら）の弾力（だんりょく）がある、体（からだ）はかたく色（いろ）つやがある、うろこがきれいについている、生臭（なまぐさ）さやアンモニア臭（しゅう）がしない、という特徴（とくちょう）があります。目（め）の落ち込（おちこ）み、えらの変色（へんしょく）、アンモニア臭（しゅう）はいずれも鮮度（せんど）が落（お）ちたサインなので誤（あやま）りです。"},{"subject":"飲食物調理","type":"学科","source":"飲食物調理 p.7","tp":"1. 食材（しょくざい）（原材料（げんざいりょう））に関（かん）する注意点（ちゅういてん）","q":"魚（さかな）の下（くだ）ろし方（ほう）や盛（も）り付（つ）けについて、正（ただ）しいものはどれか。","ch":["五（ご）枚（まい）おろしは、頭（あたま）を残（のこ）したまま身（み）を上下（じょうげ）に５分割（ぶんかつ）することをいう。","フグは、調理師（ちょうりし）の資格（しかく）をもつ人（にん）であればだれでも処理（しょり）してよい。","三枚（さんまい）おろしは、頭（あたま）を落（お）とし、骨（ほね）と身（み）を左右（さゆう）に分（わ）けて３分割（ぶんかつ）することをいう。"],"answer_index":2,"ex":"三枚（さんまい）おろしは、頭（あたま）を落（お）として骨（ほね）と身（み）を左右（さゆう）に分（わ）け、３分割（ぶんかつ）にする方法（ほうほう）です。五（ご）枚（まい）おろしも頭（あたま）を落（お）としてから、骨（ほね）に添（そ）って身（み）を左右上下（さゆうじょうげ）に５分割（ぶんかつ）します（ヒラメなど）。フグは毒（どく）をもっているので、都道府県知事（とどうふけんちじ）などが認（みと）めた専門（せんもん）のフグ処理（しょり）者（もの）が処理（しょり）する必要（ひつよう）があります。一（いち）尾（お）魚（さかな）は頭（あたま）を左（ひだり）、腹（はら）を下（した）にして盛（も）り付（つ）けます。"},{"subject":"飲食物調理","type":"学科","source":"飲食物調理 p.7、p.8","tp":"1. 食材（しょくざい）（原材料（げんざいりょう））に関（かん）する注意点（ちゅういてん）","q":"野菜（やさい）の性質（せいしつ）や調理（ちょうり）について、正（ただ）しいものはどれか。","ch":["ほうれん草（くさ）などの青菜（あおな）は、少（すく）ない湯（ゆ）で蓋（ふた）をして時間（じかん）をかけてゆでる。","ごぼうやれんこんは、切（き）ったあとすぐに水（みず）につけると切り口（きりくち）の褐変（かっぺん）を防（ふせ）ぐことができる。","野菜（やさい）は加熱（かねつ）するとかさが増（ふ）えるため、生（なま）で食（た）べるより量（りょう）を食（た）べられなくなる。"],"answer_index":1,"ex":"ごぼうやれんこんなどは切（き）ったあと、すぐに水（みず）につけると切り口（きりくち）の褐変（かっぺん）を防（ふせ）ぐことができます。野菜類（やさいるい）の水分（すいぶん）は一般的（いっぱんてき）に８０～９０％前後（ぜんご）で、タンパク質（しつ）、脂質（ししつ）、炭水化物（たんすいかぶつ）は少（すく）ないです。青菜（あおな）は緑色（りょくしょく）の色素（しきそ）（クロロフィル）が熱（ねつ）に弱（よわ）いので、たっぷりのお湯（ゆ）で蓋（ふた）をせずにさっとゆで、水（みず）にとって冷（さ）まします。加熱（かねつ）するとかさが減（へ）り、多（おお）く食（た）べることができます。"},{"subject":"飲食物調理","type":"学科","source":"飲食物調理 p.8","tp":"1. 食材（しょくざい）（原材料（げんざいりょう））に関（かん）する注意点（ちゅういてん）","q":"和牛（わぎゅう）について、正（ただ）しいものはどれか。","ch":["和牛（わぎゅう）は、黒毛（くろげ）和種（わしゅ）・褐（かつ）毛（け）和種（わしゅ）・無（む）角（かく）和種（わしゅ）・日本（にほん）短角（たんかく）種（たね）の４品種（ひんしゅ）とそれらの交雑（こうざつ）種（たね）をいう。","和牛（わぎゅう）とは、日本（にほん）で飼育（しいく）された牛（うし）のうち黒毛（くろげ）和種（わしゅ）の１品種（ひんしゅ）だけを指（さ）し、交雑（こうざつ）種（たね）は含（ふく）まない。","褐（かつ）毛（け）和種（わしゅ）は和牛（わぎゅう）全体（ぜんたい）の９５％以上（いじょう）を占（し）め、毛色（けいろ）は黒（くろ）褐（かつ）単色（たんしょく）で脂肪（しぼう）交雑（こうざつ）の面（めん）で優（まさ）れる。"],"answer_index":0,"ex":"和牛（わぎゅう）は、黒毛（くろげ）和種（わしゅ）・褐（かつ）毛（け）和種（わしゅ）・無（む）角（かく）和種（わしゅ）・日本（にほん）短角（たんかく）種（たね）の４品種（ひんしゅ）とそれらの交雑（こうざつ）種（たね）のことを指（さ）します。和牛（わぎゅう）全体（ぜんたい）の９５％以上（いじょう）を占（し）め、脂肪（しぼう）交雑（こうざつ）（いわゆる「さし」）に優（まさ）れるのは黒毛（くろげ）和牛（わぎゅう）です。日本（にほん）短角（たんかく）種（たね）の主（しゅ）産（さん）県（けん）は岩手県（いわてけん）で毛色（けいろ）は濃（のう）褐色（かっしょく）、山口県（やまぐちけん）が主（しゅ）産（さん）県（けん）なのは無（む）角（かく）和種（わしゅ）です。"},{"subject":"飲食物調理","type":"学科","source":"飲食物調理 p.9","tp":"2. 下（した）処理（しょり）に関（かん）する注意点（ちゅういてん）","q":"下（した）処理（しょり）について、正（ただ）しいものはどれか。","ch":["下（した）処理（しょり）とは、調理（ちょうり）が終（お）わったあとに味（あじ）や見た目（みため）を整（ととの）えるためにおこなう仕上（しあ）げの作業（さぎょう）である。","下（した）処理（しょり）の目的（もくてき）は食材（しょくざい）にあらかじめ味（あじ）をつけることだけであり、洗浄（せんじょう）やあく抜（ぬ）きなどの作業（さぎょう）は含（ふく）まれない。","下（した）処理中（しょりちゅう）に微生物（びせいぶつ）を増（ふ）やさないことと、加熱（かねつ）調理済（ちょうりず）み食品（しょくひん）などへ二次（にじ）汚染（おせん）させないことが重要（じゅうよう）である。"],"answer_index":2,"ex":"下（した）処理（しょり）は調理（ちょうり）の前（まえ）にあらかじめ食材（しょくざい）におこなう加工（かこう）処理（しょり）で、洗浄（せんじょう）、あくをぬく、切れ目（きれめ）を入（い）れる、乾物（かんぶつ）をもどすなどがあります。調理（ちょうり）前（まえ）の食材（しょくざい）には食中毒（しょくちゅうどく）菌（きん）や腐敗（ふはい）にかかわる微生物（びせいぶつ）が付着（ふちゃく）しているため、下（した）処理中（しょりちゅう）に増（ふ）やさないことと、手指（てゆび）や調理器具（ちょうりきぐ）・作業台（さぎょうだい）を介（かい）して加熱（かねつ）調理済（ちょうりず）み食品（しょくひん）や殺菌（さっきん）済（す）みの食品（しょくひん）を汚染（おせん）（二次（にじ）汚染（おせん））させないことが重要（じゅうよう）です。下（した）処理（しょり）状態（じょうたい）が悪（わる）いと、料理（りょうり）そのものの味（あじ）や食感（しょっかん）が悪（わる）くなります。"},{"subject":"飲食物調理","type":"学科","source":"飲食物調理 p.9","tp":"2. 下（した）処理（しょり）に関（かん）する注意点（ちゅういてん）","q":"野菜（やさい）の下（した）処理（しょり）について、正（ただ）しいものはどれか。","ch":["れんこんやごぼうは、酢水（すみず）に入（い）れると白（しろ）くなる。","じゃがいもやなすは、熱湯（ねっとう）につけてあく抜（ぬ）きをする。","きゅうりやキャベツは塩（しお）でもむと、水分（すいぶん）を吸（す）って張（は）りが出（で）る。"],"answer_index":0,"ex":"れんこんやごぼうは酢水（すみず）に入（い）れると白（しろ）くなります。じゃがいも、さつまいもなどのいも類（るい）やなすは、冷水（ひやみず）につけてあく抜（ぬ）きをします。きゅうりやキャベツは塩（しお）でもむと、浸透圧（しんとうあつ）の作用（さよう）で野菜（やさい）から水分（すいぶん）が出（で）てしんなりします。泥（どろ）のついたものは、たわしでよく洗（あら）って泥（どろ）を落（お）とし、最後（さいご）に流水（りゅうすい）で洗（あら）います。"},{"subject":"飲食物調理","type":"学科","source":"飲食物調理 p.10","tp":"3. 各（かく）調理方法（ちょうりほうほう）に関（かん）する注意点（ちゅういてん）","q":"加熱（かねつ）調理（ちょうり）の方法（ほうほう）の説明（せつめい）として、正（ただ）しいものはどれか。","ch":["「茹（ゆ）でる」は、調味料（ちょうみりょう）の入（いっ）った煮汁（にじる）やだし汁（しる）で味（あじ）を含（ふく）ませながら加熱（かねつ）することをいう。","「揚（あ）げる」は、少量（しょうりょう）の油脂（ゆし）を用（もち）いて、食品（しょくひん）を撹拌（かくはん）しながら短時間（たんじかん）で加熱（かねつ）することをいう。","「炒（いた）める」は、高温（こうおん）・少量（しょうりょう）の油脂（ゆし）を用（もち）いて、撹拌（かくはん）しながら短時間（たんじかん）で加熱（かねつ）することをいう。"],"answer_index":2,"ex":"炒（いた）めるは、高温（こうおん）・少量（しょうりょう）の油脂（ゆし）を用（もち）いて撹拌（かくはん）しながら短時間（たんじかん）で加熱（かねつ）する方法（ほうほう）です。茹（ゆ）でるは多量（たりょう）の水（みず）または熱湯（ねっとう）の中（なか）で加熱（かねつ）し、煮（に）るは調味料（ちょうみりょう）の入（いっ）った煮汁（にじる）やだし汁（しる）で加熱（かねつ）します。揚（あ）げるは高温（こうおん）・多量（たりょう）の油（あぶら）で加熱（かねつ）し、蒸（む）すは蒸（む）し器（き）やせいろなどを使（つか）って水蒸気（すいじょうき）で加熱（かねつ）します。"},{"subject":"飲食物調理","type":"学科","source":"飲食物調理 p.10","tp":"3. 各（かく）調理方法（ちょうりほうほう）に関（かん）する注意点（ちゅういてん）","q":"揚（あ）げ油（あぶら）の劣化（れっか）について、正（ただ）しいものはどれか。","ch":["油（あぶら）が劣化（れっか）すると、油（あぶら）の表面（ひょうめん）に持続性（じぞくせい）の泡立（あわだ）ちが起（お）こるようになる。","揚（あ）げかすはうまみが出（で）るので、取（と）らずに残（のこ）しておくとよい。","油（あぶら）は長時間（ちょうじかん）加熱（かねつ）を続（つづ）けるほど、色（いろ）や香（かお）りが良（よ）くなる。"],"answer_index":0,"ex":"揚げ物（あげもの）を揚（あ）げ続（つづ）けると油（あぶら）が酸化（さんか）され、色（いろ）や香（かお）りが悪（わる）くなり粘（ねば）りが増（ま）し、油（あぶら）の表面（ひょうめん）に持続性（じぞくせい）の泡立（あわだ）ちが起（お）こるようになります。不純物（ふじゅんぶつ）が混（ま）じると酸化（さんか）が進（すす）むので、揚（あ）げかすはこまめにすくいます。劣化（れっか）を防（ふせ）ぐには、空気（くうき）になるべくさらさない、長時間（ちょうじかん）の加熱（かねつ）を避（さ）ける、直射日光（ちょくしゃにっこう）に当（あ）てない、不純物（ふじゅんぶつ）を混（ま）ぜないことが大切（たいせつ）です。"},{"subject":"飲食物調理","type":"学科","source":"飲食物調理 p.11","tp":"3. 各（かく）調理方法（ちょうりほうほう）に関（かん）する注意点（ちゅういてん）（2）非（ひ）加熱（かねつ）調理（ちょうり）","q":"非（ひ）加熱（かねつ）調理（ちょうり）について、テキストの説明（せつめい）として正（ただ）しいものはどれか。","ch":["加熱（かねつ）をしないため、交差（こうさ）汚染（おせん）・二次（にじ）汚染（おせん）のリスクは低（ひく）くなる","混合（こんごう）・撹拌（かくはん）とは、２種類（しゅるい）以上（いじょう）の食品（しょくひん）や成分（せいぶん）を均一（きんいつ）にすることである","混合（こんごう）・撹拌（かくはん）とは、１種類（しゅるい）の食品（しょくひん）の形（かたち）と大（おお）きさをそろえることである"],"answer_index":1,"ex":"非（ひ）加熱（かねつ）調理（ちょうり）は熱（ねつ）を加（くわ）えずにおこなう調理方法（ちょうりほうほう）で、混合（こんごう）や撹拌（かくはん）、冷却（れいきゃく）などがあります。混合（こんごう）・撹拌（かくはん）とは２種類（しゅるい）以上（いじょう）の食品（しょくひん）や成分（せいぶん）を均一（きんいつ）にすることで、冷却（れいきゃく）とは食品（しょくひん）の温度（おんど）を下（さ）げるための処理（しょり）をいいます。非（ひ）加熱（かねつ）調理（ちょうり）では交差（こうさ）汚染（おせん）・二次（にじ）汚染（おせん）のリスクが高（たか）いので、衛生（えいせい）管理（かんり）での注意事項（ちゅういじこう）は確実（かくじつ）に守（まも）ることが大切（たいせつ）です。"}]},{"title":"飲食物調理 学科 · भाग 2 (p.12–22)","words":[{"subject":"飲食物調理","type":"学科","source":"飲食物調理 p.12","tp":"4. 調理（ちょうり）機器（きき）、器具（きぐ）・備品（びひん）などに関（かん）する注意点（ちゅういてん）","q":"熱（ねつ）機器（きき）の点検（てんけん）について、正（ただ）しいものはどれか。","ch":["グリドルの端（はじ）と中央部（ちゅうおうぶ）の温度差（おんどさ）が１０℃以上（いじょう）あっても、調整（ちょうせい）の必要（ひつよう）はない。","炊（た）きあがったライスに異常（いじょう）があっても、提供（ていきょう）を続（つづ）けながら様子（ようす）を見（み）る。","フライヤーの油（あぶら）はＡＶ値（ち）３．０以上（いじょう）であれば、その日（にち）の営業終了（えいぎょうしゅうりょう）時（とき）に交換（こうかん）する。"],"answer_index":2,"ex":"フライヤーは油（あぶら）の酸化（さんか）値（ち）（ＡＶ値（ち）３．０未満（みまん））が正常（せいじょう）か確認（かくにん）し、ＡＶ値（ち）３．０以上（いじょう）であればその日（にち）の営業終了（えいぎょうしゅうりょう）時（とき）に油（あぶら）を交換（こうかん）します。茹（ゆ）で麺（めん）器（き）の湯（ゆ）の温度（おんど）はほぼ１００℃になっているか確認（かくにん）し、グリドルやブレージングパンは端（はじ）と中央部（ちゅうおうぶ）の温度差（おんどさ）が１０℃以上（いじょう）ある場合（ばあい）はガスバーナーあるいは設定（せってい）温度（おんど）を調整（ちょうせい）します。炊（た）きあがったライスは必（かなら）ず試食（ししょく）し、異常（いじょう）がある場合（ばあい）は提供（ていきょう）しないでオーダーストップするなどの対応（たいおう）を取（と）ります。"},{"subject":"飲食物調理","type":"学科","source":"飲食物調理 p.13","tp":"4. 調理（ちょうり）機器（きき）、器具（きぐ）・備品（びひん）などに関（かん）する注意点（ちゅういてん）","q":"冷機（れいき）器（き）、洗浄機（せんじょうき）、計測機（けいそくき）器（き）の管理（かんり）について、正（ただ）しいものはどれか。","ch":["氷（こおり）用（よう）スコップは、すぐ使（つか）えるように貯（ちょ）氷（こおり）ケースの中（なか）に入（い）れたままにする。","洗浄機（せんじょうき）の洗浄（せんじょう）温度（おんど）は６０～７０℃、すすぎ温度（おんど）は８０～９０℃が基本（きほん）である。","温度計（おんどけい）は精密機械（せいみつきかい）なので、点検（てんけん）（校正（こうせい））をおこなってはいけない。"],"answer_index":1,"ex":"洗浄機（せんじょうき）は洗浄（せんじょう）温度（おんど）６０～７０℃、すすぎ温度（おんど）８０～９０℃（リンス剤（ざい）添加（てんか））が基本（きほん）です。氷（こおり）用（よう）スコップは不特定多数（ふとくていたすう）が触（ふ）れて菌（きん）の付着（ふちゃく）が多（おお）いため、製氷皿（せいひょうざら）や貯（ちょ）氷（こおり）ケースの外（そと）に衛生的（えいせいてき）に保管（ほかん）します。計量器（けいりょうき）を移動（いどう）した場合（ばあい）は必（かなら）ず動作確認（どうさかくにん）をおこない、温度計（おんどけい）も定期的（ていきてき）に正（ただ）しく計測（けいそく）できているか点検（てんけん）（校正（こうせい））をおこないます。"},{"subject":"飲食物調理","type":"学科","source":"飲食物調理 p.14","tp":"4. 調理（ちょうり）機器（きき）、器具（きぐ）・備品（びひん）などに関（かん）する注意点（ちゅういてん）","q":"包丁（ほうちょう）の種類（しゅるい）の説明（せつめい）として、正（ただ）しいものはどれか。","ch":["ペティナイフは、刃（は）に重（おも）みと厚（あつ）みがあり、骨（ほね）を切（き）るのに適（てき）している。","三徳（さんとく）包丁（ほうちょう）は、肉（にく）、魚（さかな）、野菜（やさい）などさまざまな食材（しょくざい）に使用（しよう）できる包丁（ほうちょう）である。","中華（ちゅうか）包丁（ほうちょう）は小型（こがた）で、野菜（やさい）や果物（くだもの）の皮（かわ）むきなど細（こま）かい作業（さぎょう）に便利（べんり）である。"],"answer_index":1,"ex":"三徳（さんとく）包丁（ほうちょう）は、肉（にく）、魚（さかな）、野菜（やさい）など様々（さまざま）な食材（しょくざい）に使用（しよう）できる包丁（ほうちょう）です。刃渡（はわたり）りが長（なが）く主（おも）に刺身（さしみ）を切（き）るのは柳（やなぎ）刃（は）包丁（ほうちょう）（刺身（さしみ）包丁（ほうちょう））、魚（さかな）をさばき骨（ほね）を切（き）ることもできるのが出刃包丁（でばぼうちょう）です。ペティナイフは小型（こがた）で皮（かわ）むきなど細（こま）かい作業（さぎょう）に便利（べんり）な包丁（ほうちょう）、中華（ちゅうか）包丁（ほうちょう）は刃（は）の重（おも）みで切（き）ったり刃（は）の平面（へいめん）で食材（しょくざい）をつぶしたりできる包丁（ほうちょう）です。"},{"subject":"飲食物調理","type":"学科","source":"飲食物調理 p.15","tp":"5. 労働（ろうどう）安全衛生（あんぜんえいせい）に関（かん）する注意点（ちゅういてん）","q":"飲食店（いんしょくてん）の労働（ろうどう）災害（さいがい）の発生（はっせい）状況（じょうきょう）について、正（ただ）しいものはどれか。","ch":["最（もっと）も多（おお）い事故（じこ）は「転倒（てんとう）」で、全体（ぜんたい）の約（やく）３割（わり）を占（し）めている。","最（もっと）も多（おお）い事故（じこ）は「動作（どうさ）の反動（はんどう）・無理（むり）な動作（どうさ）」である。","飲食店（いんしょくてん）では高年（こうねん）齢（れい）層（そう）の被災（ひさい）だけが問題（もんだい）で、若年層（じゃくねんそう）の被災（ひさい）はほとんどない。"],"answer_index":0,"ex":"飲食店（いんしょくてん）での労働（ろうどう）災害（さいがい）で最（もっと）も多（おお）い事故（じこ）は「転倒（てんとう）」で、全体（ぜんたい）の約（やく）３割（わり）を占（し）めています。次（つぎ）に「切（き）れ・こすれ」、「高温（こうおん）・低温（ていおん）物（もの）との接触（せっしょく）」、「動作（どうさ）の反動（はんどう）・無理（むり）な動作（どうさ）」の順（じゅん）です。全産（ぜんさん）業（ぎょう）と比較（ひかく）して高（たか）い「切（き）れ・こすれ」「高温（こうおん）・低温（ていおん）物（もの）との接触（せっしょく）」は過去（かこ）５年間（ねんかん）減少（げんしょう）していません。また、飲食店（いんしょくてん）は若年層（じゃくねんそう）の労働者（ろうどうしゃ）が多（おお）く、その被災（ひさい）が目立（めだ）っています。"},{"subject":"飲食物調理","type":"学科","source":"飲食物調理 p.18","tp":"5. 労働（ろうどう）安全衛生（あんぜんえいせい）に関（かん）する注意点（ちゅういてん）","q":"飲食店（いんしょくてん）の労働（ろうどう）安全（あんぜん）の取り組（とりく）みについて、正（ただ）しいものはどれか。","ch":["危険（きけん）の「見（み）える化（か）」は、目（め）で見（み）てすぐ分（わ）かる危険（きけん）だけを対象（たいしょう）にする。","ハザードマップは作成（さくせい）するだけでよく、店舗（てんぽ）で周知（しゅうち）する必要（ひつよう）はない。","５Ｓ活動（かつどう）とは、整理（せいり）、整頓（せいとん）、清掃（せいそう）、清潔（せいけつ）、習慣（しゅうかん）のことをいう。"],"answer_index":2,"ex":"５Ｓ活動（かつどう）は整理（せいり）、整頓（せいとん）、清掃（せいそう）、清潔（せいけつ）、習慣（しゅうかん）のことで、徹底（てってい）することで転倒（てんとう）災害（さいがい）防止（ぼうし）と作業（さぎょう）の効率化（こうりつか）が期待（きたい）できます。職場（しょくば）に潜（ひそ）む危険（きけん）は視覚的（しかくてき）にとらえられないものが多（おお）いため、それらを可視化（かしか）（見（み）える化（か））することでより効果的（こうかてき）な安全（あんぜん）活動（かつどう）ができます。法令（ほうれい）上（うえ）の義務付（ぎむづ）けがないことから取組（とりくみ）が十分（じゅうぶん）でない現状（げんじょう）がありますが、労働（ろうどう）安全（あんぜん）の担当者（たんとうしゃ）を決（き）めて防止（ぼうし）に努（つと）める必要（ひつよう）があり、ハザードマップは作成（さくせい）・掲示（けいじ）して店舗（てんぽ）で周知（しゅうち）します。"},{"subject":"飲食物調理","type":"学科","source":"飲食物調理 p.19","tp":"5. 労働（ろうどう）安全衛生（あんぜんえいせい）に関（かん）する注意点（ちゅういてん）","q":"食品（しょくひん）加工（かこう）用（よう）機械（きかい）について、労働（ろうどう）安全衛生（あんぜんえいせい）規則（きそく）で事業者（じぎょうしゃ）に義務付（ぎむづ）けられている措置（そち）として正（ただ）しいものはどれか。","ch":["原材料（げんざいりょう）の送（そう）給（きゅう）や取（と）りだしをするときは、機械（きかい）の運転（うんてん）を停止（ていし）するか用具（ようぐ）などを使用（しよう）する。","粉砕（ふんさい）機（き）や混合（こんごう）機（き）は、開口部（かいこうぶ）から転落（てんらく）の危険（きけん）があっても蓋（ふた）などを設置（せっち）しなくてよい。","機械（きかい）の掃除（そうじ）や給油（きゅうゆ）は、運転（うんてん）したままおこなうことが原則（げんそく）である。"],"answer_index":0,"ex":"労働（ろうどう）安全衛生（あんぜんえいせい）規則（きそく）では、食品（しょくひん）加工（かこう）用（よう）切断（せつだん）機（き）や切削（せっさく）機（き）、粉砕（ふんさい）機（き）や混合（こんごう）機（き）について、原材料（げんざいりょう）の送（そう）給（きゅう）や取（と）りだし時（とき）には機械（きかい）の運転（うんてん）を停止（ていし）するか用具（ようぐ）などを使用（しよう）することが義務付（ぎむづ）けられています。切断（せつだん）機（き）は、切断（せつだん）に必要（ひつよう）な部分以外（ぶぶんいがい）の危険（きけん）な部分（ぶぶん）に覆（おお）いなどを設置（せっち）します。粉砕（ふんさい）機（き）や混合（こんごう）機（き）は開口部（かいこうぶ）から転落（てんらく）危険（きけん）がある場合（ばあい）に蓋（ふた）などを設置（せっち）し、機械（きかい）の掃除（そうじ）、給油（きゅうゆ）、検査（けんさ）、調整（ちょうせい）の作業（さぎょう）で危険（きけん）な場合（ばあい）は原則（げんそく）として運転（うんてん）を停止（ていし）します。"},{"subject":"飲食物調理","type":"学科","source":"飲食物調理 p.19","tp":"6. 食品（しょくひん）の流通（りゅうつう）","q":"食品（しょくひん）の流通（りゅうつう）について、正（ただ）しいものはどれか。","ch":["卸売（おろしうり）市場（しじょう）は集荷（しゅうか）だけをおこない、価格（かかく）形成（けいせい）や決済（けっさい）の機能（きのう）は持（も）たない。","食品（しょくひん）は生産者（せいさんしゃ）から消費者（しょうひしゃ）に直接（ちょくせつ）届（とど）くため、出荷（しゅっか）事業者（じぎょうしゃ）や小売業（こうりぎょう）を経由（けいゆ）することはない。","卸売（おろしうり）市場（しじょう）は、集荷（しゅうか）、価格（かかく）形成（けいせい）、決済（けっさい）、情報（じょうほう）受発信（じゅはっしん）、災害時（さいがいじ）対応（たいおう）、衛生（えいせい）の保持（ほじ）の機能（きのう）を持（も）つ。"],"answer_index":2,"ex":"卸売（おろしうり）市場（しじょう）は、①集荷（しゅうか）、②価格（かかく）形成（けいせい）、③決済（けっさい）、④情報（じょうほう）受発信（じゅはっしん）、⑤災害時（さいがいじ）対応（たいおう）、⑥衛生（えいせい）の保持（ほじ）の機能（きのう）を持（も）ち、生鮮食料品（せいせんしょくりょうひん）などを安定的（あんていてき）に供給（きょうきゅう）するシステムとして運営（うんえい）されています。食品（しょくひん）は生産者（せいさんしゃ）から農協（のうきょう）などの出荷（しゅっか）事業者（じぎょうしゃ）、卸売（おろしうり）市場（しじょう）や食品（しょくひん）製造業（せいぞうぎょう）、食品（しょくひん）小売業（こうりぎょう）などを経由（けいゆ）して消費者（しょうひしゃ）に届（とど）きます。飲食店（いんしょくてん）の仕入先（しいれさき）には小売店（こうりてん）、業務用（ぎょうむよう）専門（せんもん）スーパー、卸売（おろしうり）市場（しじょう）、卸売（おろしうり）業者（ぎょうしゃ）（通信販売（つうしんはんばい）も含（ふく）む）などがあり、自店（じてん）にあった仕入先（しいれさき）を選（えら）ぶことが重要（じゅうよう）です。"},{"subject":"飲食物調理","type":"学科","source":"飲食物調理 p.20","tp":"7. 食品添加物（しょくひんてんかぶつ）","q":"食品添加物（しょくひんてんかぶつ）について、正（ただ）しいものはどれか。","ch":["食品添加物（しょくひんてんかぶつ）は、指定（してい）添加物（てんかぶつ）と既存（きぞん）添加物（てんかぶつ）の２種類（しゅるい）だけに分（わ）けられ、天然（てんねん）香料（こうりょう）は含（ふく）まれない。","既存（きぞん）添加物（てんかぶつ）とは、長年（ながねん）使用（しよう）されてきた天然（てんねん）添加物（てんかぶつ）として品目（ひんもく）が決（き）められているものである。","指定（してい）添加物（てんかぶつ）とは、動物（どうぶつ）試験（しけん）などの結果（けっか）をもとに、都道府県知事（とどうふけんちじ）が指定（してい）するもののことである。"],"answer_index":1,"ex":"食品添加物（しょくひんてんかぶつ）には、指定（してい）添加物（てんかぶつ）、既存（きぞん）添加物（てんかぶつ）、一般（いっぱん）飲食物（いんしょくぶつ）添加物（てんかぶつ）、天然（てんねん）香料（こうりょう）の４つの種類（しゅるい）があります。既存（きぞん）添加物（てんかぶつ）はいわゆる天然（てんねん）添加物（てんかぶつ）で、長年（ながねん）使用（しよう）されてきたものとして品目（ひんもく）が決（き）められています。食品（しょくひん）安全（あんぜん）委員会（いいんかい）が動物（どうぶつ）試験（しけん）などの結果（けっか）をもとに評価（ひょうか）し、安全性（あんぜんせい）を確認（かくにん）したものを厚生（こうせい）労働（ろうどう）大臣（だいじん）が「指定（してい）添加物（てんかぶつ）」として指定（してい）し、食品（しょくひん）ごとに基準値（きじゅんち）を設定（せってい）しています。"},{"subject":"飲食物調理","type":"学科","source":"飲食物調理 p.21","tp":"7. 食品添加物（しょくひんてんかぶつ）","q":"食品添加物（しょくひんてんかぶつ）の種類（しゅるい）と、その目的（もくてき）・効果（こうか）の組み合（くみあ）わせとして正（ただ）しいものはどれか。","ch":["保存料（ほぞんりょう） ― 食品（しょくひん）に甘味（あまみ）を与（あた）え、口当（くちあ）たりをよくする","膨張（ぼうちょう）剤（ざい） ― 水（みず）と油（あぶら）を均一（きんいつ）に乳化（にゅうか）させ、なめらかにする","酸化（さんか）防止剤（ぼうしざい） ― 油脂（ゆし）などの酸化（さんか）を防（ふせ）ぎ保存性（ほぞんせい）をよくする"],"answer_index":2,"ex":"酸化（さんか）防止剤（ぼうしざい）は油脂（ゆし）などの酸化（さんか）を防（ふせ）ぎ保存性（ほぞんせい）をよくするもので、エリソルビン酸（さん）ナトリウムやミックスビタミンＥなどがあります。保存料（ほぞんりょう）はかびや細菌（さいきん）などの発育（はついく）を抑制（よくせい）し保存性（ほぞんせい）を向上（こうじょう）させるもの、甘味（あまみ）を与（あた）えるのは甘味料（かんみりょう）です。柑橘類（かんきつるい）などのかびの発生（はっせい）を防止（ぼうし）するのは防（ぼう）カビ剤（ざい）で、発色（はっしょく）剤（ざい）は肉類（にくるい）の色調（しきちょう）・風味（ふうみ）を改善（かいぜん）します。膨張（ぼうちょう）剤（ざい）はケーキなどに膨（ふく）らみを与（あた）えるもので、水（みず）と油（あぶら）を均一（きんいつ）に乳化（にゅうか）させるのは乳化剤（にゅうかざい）です。"},{"subject":"飲食物調理","type":"学科","source":"飲食物調理 p.22","tp":"（参考（さんこう））キッチン基本用語（きほんようご）","q":"キッチン基本用語（きほんようご）の説明（せつめい）として、正（ただ）しいものはどれか。","ch":["「先入（さきい）れ先出（さきだ）し」とは、日付（ひづけ）の管理（かんり）と定位置（ていいち）管理（かんり）をおこない、古（ふる）い順（じゅん）に食材（しょくざい）を使用（しよう）するローテーションのことである。","「経時変化（けいじへんか）」とは、手持（ても）ちの食材（しょくざい）や備品（びひん）の数量（すうりょう）を品目（ひんもく）ごとに実際（じっさい）に調（しら）べ、在庫（ざいこ）量（りょう）と在庫（ざいこ）額（ひたい）を把握（はあく）する作業（さぎょう）のことである。","「ポーション」とは、お客様（きゃくさま）が帰（かえ）った後（のち）にテーブルの上（うえ）の皿（さら）やグラス、はしなどを下（さ）げる作業（さぎょう）のことである。"],"answer_index":0,"ex":"先入（さきい）れ先出（さきだ）しは食材（しょくざい）の品質管理（ひんしつかんり）の基本（きほん）で、検品（けんぴん）後（のち）に日付（ひづけ）を記入（きにゅう）したりタグを付（つ）けたりして定位置（ていいち）管理（かんり）をおこない、古（ふる）い順（じゅん）に使用（しよう）するローテーションのことです。検品（けんぴん）は納入（のうにゅう）された食材（しょくざい）や備品（びひん）を発注（はっちゅう）リストと照（て）らし合（あ）わせてチェックすること、経時変化（けいじへんか）は仕込（しこ）んだ食材（しょくざい）や料理（りょうり）の品質（ひんしつ）が時間（じかん）の経過（けいか）とともに変化（へんか）することをいいます。ポーションは分量（ぶんりょう）のことで、決（き）まった分量（ぶんりょう）より多（おお）く付（つ）けることをオーバーポーションといい、食器（しょっき）を下（さ）げる作業（さぎょう）はバッシングです。"}]},{"title":"飲食物調理 実技 · भाग 1 (p.5–10)","words":[{"subject":"飲食物調理","type":"実技","source":"飲食物調理 p.5","tp":"１．（１）肉類（にくるい）について（加熱時間（かねつじかん）と温度（おんど）の調節（ちょうせつ））","q":"厚（あつ）めの豚肉（ぶたにく）のソテーを、合計（ごうけい）8分（ふん）で焼（や）く。テキストが示（しめ）す加熱（かねつ）の考え方（かんがえかた）に合（あ）う時間（じかん）の配分（はいぶん）と順序（じゅんじょ）はどれか。","ch":["はじめから弱火（よわび）のまま8分間（ふんかん）、動（うご）かさずにじっくり焼（や）く","はじめに弱火（よわび）で6分（ふん）焼（や）き、そのあとで強火（つよび）で2分（ふん）焼（や）いて仕上（しあ）げる","はじめに強火（つよび）〜中火（ちゅうび）で2分（ふん）焼（や）き、そのあと弱火（よわび）で6分（ふん）中（なか）まで焼（や）く"],"answer_index":2,"ex":"肉（にく）のうまみを逃（のが）さないためには、一般的（いっぱんてき）にはじめに強火（つよび）〜中火（ちゅうび）で加熱（かねつ）して表面（ひょうめん）を凝固（ぎょうこ）させ、その後（のち）、弱火（よわび）で中（なか）まで火（ひ）を通（とう）す。合計（ごうけい）8分（ふん）を2分（ふん）＋6分（ふん）に分（わ）け、強火（つよび）〜中火（ちゅうび）の2分（ふん）を先（さき）におこなう。順序（じゅんじょ）が逆（ぎゃく）だと肉汁（にくじゅう）が流（なが）れ出（で）てうまみが逃（に）げる。","jt":"計画立案"},{"subject":"飲食物調理","type":"実技","source":"飲食物調理 p.6","tp":"1. 食材（しょくざい）（原材料（げんざいりょう））に関（かん）する注意点（ちゅういてん）","q":"朝（あさ）、肉（にく）の納品（のうひん）がありました。検品（けんぴん）すると、牛肉（ぎゅうにく）のパックの底（そこ）にドリップ（液汁（えきじゅう））がたまっており、豚肉（ぶたにく）は表面（ひょうめん）がぬるぬるしています。店長（てんちょう）としてとるべき対応（たいおう）はどれか。","ch":["ドリップは肉（にく）のうまみが出（で）たものなので、そのまま受け入（うけい）れて予定（よてい）どおり調理（ちょうり）に使（つか）う。","表面（ひょうめん）のぬるぬるは流水（りゅうすい）で洗（あら）えば取（と）れるので、よく洗（あら）ってから予定（よてい）どおり使（つか）う。","ドリップやぬめりは鮮度（せんど）が落（お）ちたサインなので、受け入（うけい）れずに納入（のうにゅう）業者（ぎょうしゃ）へ連絡（れんらく）する。"],"answer_index":2,"ex":"テキストの肉（にく）の鮮度（せんど）の見分（みわ）け方（ほう）では、いやなにおいがしない、ドリップが出（で）ていない、弾力（だんりょく）がある、ぬるぬるしていないことが良（よ）い肉（にく）の条件（じょうけん）とされています。ドリップやぬめりがあるものは鮮度（せんど）が落（お）ちているので、受け入（うけい）れずに業者（ぎょうしゃ）へ連絡（れんらく）します。洗（あら）ったり加熱（かねつ）したりしても鮮度（せんど）は元（もと）にもどりません。","jt":"判断試験"},{"subject":"飲食物調理","type":"実技","source":"飲食物調理 p.6","tp":"1. 食材（しょくざい）（原材料（げんざいりょう））に関（かん）する注意点（ちゅういてん）","q":"冷凍（れいとう）した鶏肉（とりにく）を明日（あした）の仕込（しこ）みで使（つか）うため、今日（きょう）のうちに解凍（かいとう）しておきます。解凍（かいとう）のしかたとして最（もっと）も適切（てきせつ）なものはどれか。","ch":["包装（ほうそう）のまま常温（じょうおん）の調理（ちょうり）台（だい）の上（うえ）に置（お）いて、朝（あさ）まで時間（じかん）をかけて自然（しぜん）に解凍（かいとう）する。","下（した）処理用（しょりよう）の容器（ようき）に移（うつ）し、食肉（しょくにく）・魚介類（ぎょかいるい）などの保管（ほかん）区分（くぶん）の冷蔵庫（れいぞうこ）内（ない）で緩慢（かんまん）解凍（かいとう）する。","野菜（やさい）を保管（ほかん）している冷蔵庫（れいぞうこ）の棚（たな）に、包装（ほうそう）のまま直接（ちょくせつ）置（お）いて時間（じかん）をかけて解凍（かいとう）する。"],"answer_index":1,"ex":"テキストでは、冷凍（れいとう）した食肉（しょくにく）を使用（しよう）するときは下（した）処理用（しょりよう）の容器（ようき）に移（うつ）し、食肉（しょくにく）・魚介類（ぎょかいるい）などの保管（ほかん）区分（くぶん）の冷蔵庫（れいぞうこ）内（ない）で緩慢（かんまん）解凍（かいとう）すると示（しめ）されています。解凍（かいとう）する際（きわ）は、ドリップが下（した）に落（お）ちてほかの食材（しょくざい）や容器（ようき）を汚染（おせん）しないよう、トレイで受（う）けるなどの工夫（くふう）をします。常温（じょうおん）やお湯（ゆ）での解凍（かいとう）、野菜（やさい）用（よう）の保管（ほかん）区分（くぶん）での解凍（かいとう）は適切（てきせつ）ではありません。","jt":"計画立案"},{"subject":"飲食物調理","type":"実技","source":"飲食物調理 p.6","tp":"１．（１）肉類（にくるい）について（肉（にく）の保存（ほぞん）の注意点（ちゅういてん））","q":"冷凍（れいとう）の牛肉（ぎゅうにく）を使（つか）う。冷蔵庫（れいぞうこ）内（ない）での緩慢（かんまん）解凍（かいとう）に18時間（じかん）かかる。翌日（よくじつ）の11時（とき）00分（わ）から仕込（しこ）みを始（はじ）めるための計画（けいかく）として正（ただ）しいものはどれか。","ch":["当日（とうじつ）の朝（あさ）7時（とき）00分（ふん）に、常温（じょうおん）の作業台（さぎょうだい）にトレイを置（お）いて解凍（かいとう）する","前日（ぜんじつ）の23時（とき）00分（ふん）に、トレイで受（う）けて冷蔵庫（れいぞうこ）の食肉（しょくにく）区分（くぶん）に移（うつ）す","前日（ぜんじつ）の17時（とき）00分（ふん）に、トレイで受（う）けて冷蔵庫（れいぞうこ）の食肉（しょくにく）区分（くぶん）に移（うつ）す"],"answer_index":2,"ex":"11時（とき）00分（ふん）の18時間前（じかんまえ）は前日（ぜんじつ）の17時（とき）00分（ふん）（11時（とき）＋24時（とき）＝35時（とき）、35時（とき）−18時間（じかん）＝17時（とき））。冷凍（れいとう）した食肉（しょくにく）は下（した）処理用（しょりよう）の容器（ようき）に移（うつ）し、食肉（しょくにく）・魚介類（ぎょかいるい）などの保管（ほかん）区分（くぶん）の冷蔵庫（れいぞうこ）内（ない）で緩慢（かんまん）解凍（かいとう）する。ドリップがほかの食材（しょくざい）や容器（ようき）を汚染（おせん）しないようトレイで受（う）ける。常温（じょうおん）での解凍（かいとう）は誤（あやま）り。","jt":"計画立案"},{"subject":"飲食物調理","type":"実技","source":"飲食物調理 p.8","tp":"1. 食材（しょくざい）（原材料（げんざいりょう））に関（かん）する注意点（ちゅういてん）","q":"仕込（しこ）みが終（お）わり、使（つか）い残（のこ）したたまねぎ、ほうれん草（くさ）、葉（は）のついただいこんを保管（ほかん）します。保管（ほかん）のしかたとして最（もっと）も適切（てきせつ）なものはどれか。","ch":["たまねぎもほうれん草（くさ）も、区別（くべつ）せずまとめてラップに包（つつ）んで冷蔵庫（れいぞうこ）に入（い）れる。だいこんは葉（は）をつけたままにする。","たまねぎは冷暗所（れいあんじょ）で常温（じょうおん）保存（ほぞん）し、ほうれん草（くさ）はラップなどに包（つつ）んで冷蔵庫（れいぞうこ）で保存（ほぞん）する。だいこんは葉（は）を切り離（きりはな）す。","だいこんは葉（は）をつけたまま保存（ほぞん）し、たまねぎとほうれん草（くさ）はどちらも冷暗所（れいあんじょ）に置（お）いて常温（じょうおん）で保存（ほぞん）する。"],"answer_index":1,"ex":"ねぎ、たまねぎ、にんにくなどは冷暗所（れいあんじょ）での常温（じょうおん）保存（ほぞん）が適（てき）しています。それ以外（いがい）の野菜（やさい）は水分（すいぶん）の蒸散（じょうさん）を抑（おさ）えるため、ラップなどに包（つつ）んで冷蔵庫（れいぞうこ）で保存（ほぞん）します。また、根（ね）や葉（は）をつけておくと身（み）の質（しつ）が落（お）ちるため、切り離（きりはな）して保存（ほぞん）します。","jt":"判断試験"},{"subject":"飲食物調理","type":"実技","source":"飲食物調理 p.9","tp":"2. 下（した）処理（しょり）に関（かん）する注意点（ちゅういてん）","q":"一（いち）尾（お）の魚（さかな）を下（した）処理（しょり）します。まずうろこを落（お）としますが、専用（せんよう）のウロコ取（と）りが見当（みあ）たりません。このときの作業（さぎょう）として最（もっと）も適切（てきせつ）なものはどれか。","ch":["包丁（ほうちょう）の刃（は）を立（た）て、頭（あたま）から尾（お）の方向（ほうこう）へ強（つよ）くこすりつけるようにして取（と）る。","包丁（ほうちょう）の背（せ）を使（つか）い、尾（つ）から頭（あたま）の方向（ほうこう）に向（む）かって、身（み）を傷（きず）つけないようにとる。","熱湯（ねっとう）をかけてうろこをふやかしてから、素手（すで）で頭（あたま）のほうへむしり取（と）る。"],"answer_index":1,"ex":"うろこは尾（つ）から頭（あたま）の方向（ほうこう）に向（む）かってとります。専用（せんよう）のウロコ取（と）りがない場合（ばあい）は、包丁（ほうちょう）の背（せ）を使（つか）って身（み）を傷（きず）つけないようにとります。そのあと、えらを取（と）る、内臓（ないぞう）を取り出（とりだ）す、手早（てばや）く流水（りゅうすい）で洗（あら）って水気（みずけ）をしっかりふきとる、という順（じゅん）で作業（さぎょう）を進（すす）めます。","jt":"判断試験"},{"subject":"飲食物調理","type":"実技","source":"飲食物調理 p.9","tp":"２．（４）魚介類（ぎょかいるい）の下（した）処理（しょり）について","q":"一（いち）尾（お）の魚（さかな）を切り身（きりみ）にする。ア 内臓（ないぞう）をとりだす、イ うろこを落（お）とす、ウ 頭（あたま）を取（と）る、エ えらを取（と）る、オ 水洗（みずあら）いをする。正（ただ）しい順（したが）はどれか。","ch":["イ → エ → ア → オ → ウ","イ → ア → エ → オ → ウ","ウ → イ → エ → ア → オ"],"answer_index":0,"ex":"魚（さかな）の下（した）処理（しょり）は①うろこを落（お）とす②えらを取（と）る③内臓（ないぞう）をとりだす④水洗（みずあら）い⑤頭（あたま）を取（と）る の順（じゅん）である。よってイ→エ→ア→オ→ウ。うろこは尾（つ）から頭（あたま）の方向（ほうこう）に向（む）かってとり、水洗（みずあら）いは手早（てばや）く流水（りゅうすい）でおこない水気（みずけ）をしっかりふきとる。","jt":"計画立案"},{"subject":"飲食物調理","type":"実技","source":"飲食物調理 p.10","tp":"3. 各（かく）調理方法（ちょうりほうほう）に関（かん）する注意点（ちゅういてん）","q":"にんじん、たまねぎ、もやし、豚肉（ぶたにく）を使（つか）った炒（いた）め物（もの）をつくります。フライパンへの入れ方（いれかた）として最（もっと）も適切（てきせつ）なものはどれか。","ch":["すべての食材（しょくざい）を同時（どうじ）に入（い）れ、弱火（よわび）で長時間（ちょうじかん）ゆっくり加熱（かねつ）する。","熱（ねつ）の通（とう）りが早（はや）いもやしから先（さき）に入（い）れて、最後（さいご）ににんじんを入（い）れる。","熱（ねつ）の通（とう）りが遅（おそ）いにんじんから先（さき）に入（い）れ、熱（ねつ）の入（い）り具合（ぐあい）を均等（きんとう）にする。"],"answer_index":2,"ex":"炒（いた）める調理（ちょうり）では、複数（ふくすう）の食材（しょくざい）を入（い）れるとき、熱（ねつ）の通（とう）りが遅（おそ）い具材（ぐざい）から先（さき）に入（い）れて熱（ねつ）の入（い）り具合（ぐあい）を均等（きんとう）にします。炒（いた）めるは高温（こうおん）・少量（しょうりょう）の油脂（ゆし）を用（もち）いて撹拌（かくはん）しながら短時間（たんじかん）で加熱（かねつ）する方法（ほうほう）なので、低温（ていおん）・長時間（ちょうじかん）の加熱（かねつ）や、撹拌（かくはん）しない方法（ほうほう）は適（てき）していません。","jt":"計画立案"},{"subject":"飲食物調理","type":"実技","source":"飲食物調理 p.10","tp":"３．（１）加熱（かねつ）調理（ちょうり）（炒（いた）める）","q":"野菜炒（やさいいた）めを作（つく）る。火（ひ）が通（とう）るまでにんじんは4分（ふん）、たまねぎは2分（ふん）、もやしは1分（わ）かかる。3つを同時（どうじ）に仕上（しあ）げるための投入（とうにゅう）の計画（けいかく）として正（ただ）しいものはどれか。","ch":["もやしを先（さき）に入（い）れ、1分後（ふんご）にたまねぎ、3分後（ふんご）ににんじんを入（い）れる","にんじんを先（さき）に入（い）れ、2分後（ふんご）にたまねぎ、3分後（ふんご）にもやしを入（い）れる","3つを同時（どうじ）に入（い）れて、4分間（ふんかん）まとめて炒（いた）める"],"answer_index":1,"ex":"炒（いた）めるときは、熱（ねつ）の通（とう）りが遅（おそ）い具材（ぐざい）から先（さき）に入（い）れて熱（ねつ）の入（い）り具合（ぐあい）を均等（きんとう）にする。全体（ぜんたい）は最（もっと）も長（なが）い4分（ふん）。にんじんを0分（ふん）で入（い）れ、たまねぎは4分（ふん）−2分（ふん）＝2分後（ふんご）、もやしは4分（ふん）−1分（ふん）＝3分後（ふんご）に入（い）れると、3つが同時（どうじ）に仕上（しあ）がる。","jt":"計画立案"}]},{"title":"飲食物調理 実技 · भाग 2 (p.11–12)","words":[{"subject":"飲食物調理","type":"実技","source":"飲食物調理 p.11","tp":"3. 各（かく）調理方法（ちょうりほうほう）に関（かん）する注意点（ちゅういてん）","q":"加熱（かねつ）しないサラダを和（あ）えて盛（も）り付（つ）けます。非（ひ）加熱（かねつ）調理（ちょうり）の衛生（えいせい）管理（かんり）として最（もっと）も適切（てきせつ）なものはどれか。","ch":["手（て）をよく洗（あら）ったので、手袋（てぶくろ）は着（つ）けずにそのまま素手（すで）で和（あ）えて盛（も）り付（つ）ける。","前（まえ）の作業（さぎょう）で使（つか）った菜箸（さいばし）を、洗（あら）わずにそのまま使（つか）って手早（てばや）く和（あ）えてから器（き）に盛（も）り付（つ）ける。","手（て）をよく洗（あら）った後（のち）に使い捨（つかいす）て手袋（てぶくろ）を着用（ちゃくよう）し、洗浄（せんじょう）済（す）みのボールを使（つか）って和（あ）える。"],"answer_index":2,"ex":"非（ひ）加熱（かねつ）調理（ちょうり）は交差（こうさ）汚染（おせん）・二次（にじ）汚染（おせん）のリスクが高（たか）いので、衛生（えいせい）管理（かんり）の注意事項（ちゅういじこう）を確実（かくじつ）に守（まも）ります。手（て）で和（あ）えるときは手（て）をよく洗（あら）った後（のち）に使い捨（つかいす）て手袋（てぶくろ）を着用（ちゃくよう）し、菜箸（さいばし）やトング、ボールなどはその都度（つど）、洗浄（せんじょう）済（す）みのものを使（つか）います。完成品（かんせいひん）を保存（ほぞん）するときはラップをして冷蔵庫（れいぞうこ）で保存（ほぞん）します。","jt":"判断試験"},{"subject":"飲食物調理","type":"実技","source":"飲食物調理 p.11","tp":"3. 各（かく）調理方法（ちょうりほうほう）に関（かん）する注意点（ちゅういてん）","q":"新（あたら）しい調理（ちょうり）スタッフが増（ふ）え、人（にん）によって作業（さぎょう）の手順（てじゅん）がばらつき、ムダも出（で）ています。店長（てんちょう）として調理（ちょうり）計画（けいかく）（調理（ちょうり）マニュアル）を作（つく）るときの考え方（かんがえかた）として最（もっと）も適切（てきせつ）なものはどれか。","ch":["調理（ちょうり）工程（こうてい）や厨房（ちゅうぼう）機器（きき）の扱い方（あつかいかた）、労働（ろうどう）安全（あんぜん）に関（かん）することなどを入（い）れ、スタッフが自（みずか）ら学（まな）び・確認（かくにん）できるようにする。","調理（ちょうり）長（ちょう）だけが見（み）るものにして、内容（ないよう）はスタッフに見（み）せず、作業（さぎょう）のたびに口頭（こうとう）で指示（しじ）するようにする。","食材（しょくざい）の仕入（しいれ）や管理方法（かんりほうほう）はお金（きん）にかかわる話（はなし）なので、調理（ちょうり）計画（けいかく）には入（い）れず本部（ほんぶ）の担当者（たんとうしゃ）だけで管理（かんり）することにする。"],"answer_index":0,"ex":"調理（ちょうり）計画（けいかく）を作成（さくせい）すると、次（つぎ）に何（なに）をしなければならないか、何（なん）のためにその作業（さぎょう）をするのかが明確（めいかく）になり、作業（さぎょう）の効率化（こうりつか）及（およ）び料理（りょうり）の品質維持（ひんしついじ）ができます。一般的（いっぱんてき）には調理（ちょうり）マニュアルとして、調理（ちょうり）スタッフが厨房（ちゅうぼう）での業務（ぎょうむ）について自（みずか）ら学（まな）び・確認（かくにん）できるようにします。主（おも）な内容（ないよう）は、食材（しょくざい）の仕入（しいれ）・管理方法（かんりほうほう）、調理（ちょうり）工程（こうてい）（下（した）処理（しょり）、調理（ちょうり）、盛（も）り付（つ）け手順（てじゅん）など）、厨房（ちゅうぼう）機器（きき）や調理器具（ちょうりきぐ）の扱い方（あつかいかた）・手入（てい）れ、労働（ろうどう）安全（あんぜん）に関（かん）することです。","jt":"計画立案"},{"subject":"飲食物調理","type":"実技","source":"飲食物調理 p.11","tp":"３．（３）調理（ちょうり）計画（けいかく）について","q":"12時（とき）00分（ふん）に煮込（にこ）み料理（りょうり）を提供（ていきょう）する。下（した）処理（しょり）に20分（ふん）、加熱（かねつ）に60分（ふん）、盛（も）り付（つ）けに5分（わ）かかる。作業（さぎょう）を始（はじ）める時刻（じこく）として正（ただ）しいものはどれか。","ch":["10時（とき）35分（ふん）","10時（とき）55分（ふん）","11時（とき）00分（ふん）"],"answer_index":0,"ex":"提供（ていきょう）時刻（じこく）から逆算（ぎゃくさん）する。盛（も）り付（つ）け5分（ふん）を引（ひ）いて11時（とき）55分（ふん）、加熱（かねつ）60分（ふん）を引（ひ）いて10時（とき）55分（ふん）、下（した）処理（しょり）20分（ふん）を引（ひ）いて10時（とき）35分（ふん）。合計（ごうけい）は20分（ふん）＋60分（ふん）＋5分（ふん）＝85分（ふん）で、12時（とき）00分（ふん）−85分（ふん）＝10時（とき）35分（ふん）。10時（とき）55分（ふん）は下（した）処理（しょり）の20分（ふん）を数（かぞ）えていない誤（あやま）り。","jt":"計画立案"},{"subject":"飲食物調理","type":"実技","source":"飲食物調理 p.11","tp":"３．（２）非（ひ）加熱（かねつ）調理（ちょうり）（凍結（とうけつ）した食品（しょくひん）の解凍（かいとう））","q":"18時（とき）00分（ふん）に、冷凍（れいとう）のフライ（衣（ころも）をつけたそうざい半製品（はんせいひん））と冷凍（れいとう）の豚肉（ぶたにく）の料理（りょうり）を出（だ）す。フライは揚（あ）げるのに4分（ふん）、豚肉（ぶたにく）は冷蔵庫（れいぞうこ）で12時間（じかん）の解凍（かいとう）が必要（ひつよう）で、解凍後（かいとうご）の加熱（かねつ）に30分（わ）かかる。計画（けいかく）として正（ただ）しいものはどれか。","ch":["フライは前日（ぜんじつ）の夜（よる）から冷蔵庫（れいぞうこ）で解凍（かいとう）し、豚肉（ぶたにく）は当日（とうじつ）5時（とき）30分（ふん）に冷蔵庫（れいぞうこ）へ移（うつ）す","フライは凍（こご）ったまま17時（とき）56分（わ）から揚（あ）げ、豚肉（ぶたにく）は当日（とうじつ）5時（とき）30分（ふん）に冷蔵庫（れいぞうこ）へ移（うつ）す","フライは凍（こご）ったまま17時（とき）56分（わ）から揚（あ）げ、豚肉（ぶたにく）は当日（とうじつ）17時（とき）30分（ふん）に冷蔵庫（れいぞうこ）へ移（うつ）す"],"answer_index":1,"ex":"衣（ころも）をつけたフライなどのそうざい半製品（はんせいひん）は凍（こご）ったまま揚（あ）げるので、18時（とき）00分（ふん）−4分（ふん）＝17時（とき）56分（ふん）に揚（あ）げ始（はじ）める。豚肉（ぶたにく）は加熱（かねつ）30分（ふん）なので18時（とき）00分（ふん）−30分（ふん）＝17時（とき）30分（ふん）に加熱（かねつ）を始（はじ）め、その12時間前（じかんまえ）の5時（とき）30分（ふん）に冷蔵庫（れいぞうこ）へ移（うつ）して解凍（かいとう）を始（はじ）める。17時（とき）30分（ふん）に冷蔵庫（れいぞうこ）へ移（うつ）すのは解凍時（かいとうじ）間（かん）を数（かぞ）えていない誤（あやま）り。","jt":"計画立案"},{"subject":"飲食物調理","type":"実技","source":"飲食物調理 p.11","tp":"３．（３）調理（ちょうり）計画（けいかく）について","q":"18時（とき）30分（ふん）にステーキ、スープ、サラダを同時（どうじ）に提供（ていきょう）する。ステーキは焼（や）くのに8分（ふん）、スープは温（あたた）めるのに3分（ふん）、サラダは盛（も）り付（つ）けに2分（わ）かかる。作業（さぎょう）を始（はじ）める時刻（じこく）として正（ただ）しいものはどれか。","ch":["ステーキ18時（とき）22分（ふん）、スープ18時（とき）22分（ふん）、サラダ18時（とき）22分（ふん）","ステーキ18時（とき）22分（ふん）、スープ18時（とき）27分（ふん）、サラダ18時（とき）28分（ふん）","ステーキ18時（とき）28分（ふん）、スープ18時（とき）27分（ふん）、サラダ18時（とき）22分（ふん）"],"answer_index":1,"ex":"提供（ていきょう）時刻（じこく）18時（とき）30分（わ）から各（かく）作業時間（さぎょうじかん）を引（ひ）く。ステーキは30分（ふん）−8分（ふん）＝18時（とき）22分（ふん）、スープは30分（ふん）−3分（ふん）＝18時（とき）27分（ふん）、サラダは30分（ふん）−2分（ふん）＝18時（とき）28分（ふん）。時間（じかん）のかかるものから先（さき）に始（はじ）めると3品（ひん）が同時（どうじ）に仕上（しあ）がる。全部（ぜんぶ）を同時（どうじ）に始（はじ）めるとスープとサラダが早（はや）く出来上（できあ）がり、品質（ひんしつ）が落（お）ちる。","jt":"計画立案"},{"subject":"飲食物調理","type":"実技","source":"飲食物調理 p.12","tp":"4. 調理（ちょうり）機器（きき）、器具（きぐ）・備品（びひん）などに関（かん）する注意点（ちゅういてん）","q":"中華（ちゅうか）ガスレンジの火（ひ）がつきにくく、ついても火（ひ）が小（ちー）さいままです。見（み）ると換気扇（かんきせん）は止（と）まっており、バーナーの周（まわ）りに吹（ふ）きこぼれの汚（よご）れがこびりついています。とるべき対応（たいおう）はどれか。","ch":["換気扇（かんきせん）を回（まわ）して窓（まど）も開（ひら）け、換気（かんき）をしたうえで、バーナーキャップとその周（まわ）りの汚（よご）れを取り除（とりのぞ）く。","火（ひ）が小（ちー）さくなるのはよくあることなので、バーナーの汚（よご）れは落（お）とさずそのまま調理（ちょうり）を続（つづ）ける。","換気（かんき）をすると火（ひ）が消（き）えやすくなるので、ガスを使（つか）うときは換気扇（かんきせん）も窓（まど）も使（つか）わないようにする。"],"answer_index":0,"ex":"ガスを使（つか）うときは必（かなら）ず換気（かんき）（換気扇（かんきせん）・窓（まど））をします。換気（かんき）が不十分（ふじゅうぶん）だと一酸化炭素（いっさんかたんそ）中毒（ちゅうどく）を起（お）こす恐（おそ）れがあり、最悪（さいあく）の場合（ばあい）は死亡事故（しぼうじこ）に至（いた）ります。バーナーキャップとその周（まわ）りに汚（よご）れがこびりついていると、火（ひ）がつかない、火（ひ）が小（ちー）さい、火（ひ）が途中（とちゅう）で消（き）えるなどのトラブルにつながるため、吹（ふ）きこぼれや揚げ物（あげもの）の油（あぶら）は必（かなら）ず取り除（とりのぞ）き、清潔（せいけつ）に保（たも）ちます。","jt":"判断試験"},{"subject":"飲食物調理","type":"実技","source":"飲食物調理 p.12","tp":"4. 調理（ちょうり）機器（きき）、器具（きぐ）・備品（びひん）などに関（かん）する注意点（ちゅういてん）","q":"スチームコンベクションオーブンでの加熱（かねつ）が終（お）わり、続（つづ）けて庫内（こない）を掃除（そうじ）しようとしています。作業（さぎょう）として最（もっと）も適切（てきせつ）なものはどれか。","ch":["加熱（かねつ）調理（ちょうり）の直後（ちょくご）にとびらを一気（いっき）に大（おお）きく開（ひら）け、電源（でんげん）を入（い）れたまま熱（あつ）いうちに庫内（こない）を水（みず）で洗（あら）う。","庫内（こない）の温度（おんど）を下（さ）げ、電源（でんげん）を切（き）ってから掃除（そうじ）する。とびらは高温（こうおん）の水蒸気（すいじょうき）に注意（ちゅうい）して開（ひら）ける。","自動（じどう）洗浄機（せんじょうき）能（のう）がついているので、説明書（せつめいしょ）は読（よ）まずに自分（じぶん）の判断（はんだん）で温度（おんど）や時間（じかん）を操作（そうさ）する。"],"answer_index":1,"ex":"スチームコンベクションオーブンは、庫内（こない）の温度（おんど）を下（さ）げ、電源（でんげん）を切（き）ってから掃除（そうじ）をおこないます。加熱（かねつ）調理（ちょうり）直後（ちょくご）の庫内（こない）には高温（こうおん）の水蒸気（すいじょうき）が充満（じゅうまん）しており、急（きゅう）にとびらを開（ひら）けると手（て）や顔（かお）にやけどをする危険（きけん）があります。自動（じどう）洗浄（せんじょう）などの機能（きのう）がついている場合（ばあい）は、説明書（せつめいしょ）に従（したが）って使用（しよう）します。","jt":"判断試験"},{"subject":"飲食物調理","type":"実技","source":"飲食物調理 p.12","tp":"４．（１）調理（ちょうり）機器（きき）について（フライヤー）","q":"朝（あさ）の点検（てんけん）でフライヤーの油（あぶら）の酸化（さんか）値（ち）（AV値（ち））を測（はか）ると3.2だった。営業時間（えいぎょうじかん）は11時（とき）00分（わ）から22時（とき）00分（ふん）である。とるべき計画（けいかく）として正（ただ）しいものはどれか。","ch":["3.2は正常（せいじょう）な値（ち）の範囲（はんい）なので、次（つぎ）の点検（てんけん）日（にち）まで油（あぶら）はそのまま使（つか）う","AV値（ち）3.0以上（いじょう）なので、その日（にち）の営業終了後（えいぎょうしゅうりょうご）の22時（とき）に油（あぶら）を交換（こうかん）する","AV値（ち）3.0以上（いじょう）なので、翌日（よくじつ）の朝（あさ）11時（とき）の開店（かいてん）をしてから油（あぶら）を交換（こうかん）する"],"answer_index":1,"ex":"AV値（ち）3.2 ≧ 3.0 なので正常（せいじょう）ではない。フライヤーの油（あぶら）はAV値（ち）3.0未満（みまん）が正常（せいじょう）で、3.0以上（いじょう）であればその日（にち）の営業終了（えいぎょうしゅうりょう）時（とき）に油（あぶら）を交換（こうかん）する。よって 11時（とき）00分（ふん）開店（かいてん） → 22時（とき）00分営（ぶんえい）業（ぎょう）終了（しゅうりょう） → 22時（とき）に油（あぶら）を交換（こうかん）、という計画（けいかく）になる。交換（こうかん）作業（さぎょう）は高温（こうおん）油（あぶら）に触（ふ）れるので、長靴（ながぐつ）、長（ちょう）エプロン、耐熱（たいねつ）手袋（てぶくろ）を着用（ちゃくよう）する。","jt":"計画立案"},{"subject":"飲食物調理","type":"実技","source":"飲食物調理 p.12","tp":"４．（１）調理（ちょうり）機器（きき）について（グリドル）","q":"グリドルの温度（おんど）を測（はか）ると、端（はじ）が180℃、中央部（ちゅうおうぶ）が195℃だった。とるべき対応（たいおう）として正（ただ）しいものはどれか。","ch":["差（さ）は15℃だが基準（きじゅん）は20℃以上（いじょう）なので、そのまま使用（しよう）を続（つづ）ける","差（さ）は10℃で基準（きじゅん）の中（なか）なので、次（つぎ）の点検（てんけん）日（にち）まで様子（ようす）を見（み）る","差（さ）は15℃で10℃以上（いじょう）なので、設定（せってい）温度（おんど）やバーナーを調整（ちょうせい）する"],"answer_index":2,"ex":"グリドル、ブレージングパンは端（はじ）と中央部（ちゅうおうぶ）の温度（おんど）を測（はか）り、差（さ）が10℃以上（いじょう）ある場合（ばあい）はガスバーナーあるいは設定（せってい）温度（おんど）を調整（ちょうせい）する。195℃−180℃＝15℃なので、10℃以上（いじょう）にあたり調整（ちょうせい）が必要（ひつよう）である。","jt":"計画立案"}]},{"title":"飲食物調理 実技 · भाग 3 (p.13–23)","words":[{"subject":"飲食物調理","type":"実技","source":"飲食物調理 p.13、p.14","tp":"4. 調理（ちょうり）機器（きき）、器具（きぐ）・備品（びひん）などに関（かん）する注意点（ちゅういてん）","q":"閉店（へいてん）後（のち）の片（かた）づけで、フッ素（もと）加工（かこう）のフライパン、鋼製（こうせい）の包丁（ほうちょう）、まな板（いた）、ボールを洗（あら）います。取り扱（とりあつか）いとして最（もっと）も適切（てきせつ）なものはどれか。","ch":["フッ素（もと）加工（かこう）のフライパンは、使用（しよう）直後（ちょくご）の熱（あつ）いうちに水（みず）をかけて急（きゅう）に冷（ひ）やしてから洗（あら）う。","ボールの隅（すみ）に付（つ）いた汚（よご）れは、スチールたわしを使（つか）ってしっかりこすり落（お）としてから流（なが）す。","鋼製（こうせい）の包丁（ほうちょう）は洗（あら）ったあと水気（みずけ）をしっかりふき取（と）り、まな板（いた）は全体（ぜんたい）が乾燥（かんそう）する状態（じょうたい）で保管（ほかん）する。"],"answer_index":2,"ex":"鋼製（こうせい）の包丁（ほうちょう）はさびやすいので、洗浄（せんじょう）後（のち）にしっかり水気（みずけ）をふき取（と）ります。まな板（いた）は壁（かべ）に立（た）てかけず、まな板（いた）全体（ぜんたい）が乾燥（かんそう）する状態（じょうたい）で保管（ほかん）します。フッ素（もと）加工（かこう）のフライパンは、使用（しよう）直後（ちょくご）の熱（あつ）いうちに水（みず）をかけて急（きゅう）に冷（ひ）やすと表面（ひょうめん）の加工（かこう）が剥（は）がれるのでしてはいけません。ボールなどを洗（あら）うときはスポンジを使（つか）い、スチールたわしは絶対（ぜったい）に使用（しよう）しません。","jt":"判断試験"},{"subject":"飲食物調理","type":"実技","source":"飲食物調理 p.13","tp":"４．（１）調理（ちょうり）機器（きき）について（洗浄機（せんじょうき））","q":"洗浄機（せんじょうき）の温度（おんど）を測（はか）ると、洗浄（せんじょう）温度（おんど）は55℃、すすぎ温度（おんど）は75℃だった。基本（きほん）の範囲（はんい）に入（い）れるために最低限（さいていげん）上（あ）げるべき温度（おんど）はいくつか。","ch":["洗浄（せんじょう）を5℃上（あ）げて60℃、すすぎを5℃上（あ）げて80℃","洗浄（せんじょう）を5℃上（あ）げて60℃、すすぎを15℃上（あ）げて90℃","洗浄（せんじょう）を15℃上（あ）げて70℃、すすぎを5℃上（あ）げて80℃"],"answer_index":0,"ex":"洗浄（せんじょう）温度（おんど）は60〜70℃、すすぎ温度（おんど）は80〜90℃が基本（きほん）である。60℃−55℃＝5℃、80℃−75℃＝5℃上（あ）げれば下限（かげん）に入（い）る。上限（じょうげん）の70℃や90℃まで上（あ）げる必要（ひつよう）はないので、ほかの2つは上（あ）げすぎである。","jt":"計画立案"},{"subject":"飲食物調理","type":"実技","source":"飲食物調理 p.15","tp":"５．（１）飲食店（いんしょくてん）の労働（ろうどう）災害（さいがい）の発生（はっせい）状況（じょうきょう）","q":"ある地域（ちいき）の飲食店（いんしょくてん）で、1年間（ねんかん）に労働（ろうどう）災害（さいがい）が60件（けん）起（お）きた。テキストが示（しめ）す発生（はっせい）状況（じょうきょう）の割合（わりあい）を使（つか）うと、最（もっと）も多（おお）い事故（じこ）と件数（けんすう）、そしてまず取り組（とりく）む対策（たいさく）はどれか。","ch":["「転倒（てんとう）」で約（やく）18件（けん）。5S活動（かつどう）を徹底（てってい）し、濡（ぬ）れた床（とこ）をすぐにふき取（と）る","「切（き）れ・こすれ」で約（やく）18件（けん）。刃物（はもの）を使（つか）うときにだけ注意（ちゅうい）すればよい","「転倒（てんとう）」で約（やく）6件（けん）。年（ねん）に1回（かい）の清掃（せいそう）をスケジュール化（か）すれば足（た）りる"],"answer_index":0,"ex":"飲食店（いんしょくてん）の労働（ろうどう）災害（さいがい）で最（もっと）も多（おお）い事故（じこ）は「転倒（てんとう）」で全体（ぜんたい）の約（やく）3割（わり）を占（し）める。60件（けん）×0.3＝18件（けん）となる。転倒（てんとう）は床（とこ）が水（みず）や油（あぶら）で濡（ぬ）れていることによる滑（すべ）りや、通路（つうろ）の荷物（にもつ）によるつまづきが多（おお）いので、5S活動（かつどう）（整理（せいり）、整頓（せいとん）、清掃（せいそう）、清潔（せいけつ）、習慣（しゅうかん））を徹底（てってい）し、濡（ぬ）れた床（とこ）はすぐにふき取（と）る。","jt":"計画立案"},{"subject":"飲食物調理","type":"実技","source":"飲食物調理 p.18","tp":"5. 労働（ろうどう）安全衛生（あんぜんえいせい）に関（かん）する注意点（ちゅういてん）","q":"スタッフが、大（おお）きくて重（おも）い食材（しょくざい）の箱（はこ）を一人（ひとり）で抱（かか）えて運（はこ）ぼうとしています。通路（つうろ）は清掃中（せいそうちゅう）で床（とこ）が濡（ぬ）れています。店長（てんちょう）としての指示（しじ）で最（もっと）も適切（てきせつ）なものはどれか。","ch":["作業（さぎょう）が早（はや）く終（お）わるように、台車（だいしゃ）は使（つか）わずに、一度（いちど）で持（も）てるだけの箱（はこ）をまとめて抱（かか）えて運（はこ）ばせるようにする。","台車（だいしゃ）を使（つか）う、ひとりでは持（も）たない、何回（なんかい）かに分（わ）けて運（はこ）ぶなどの措置（そち）をとらせ、濡（ぬ）れた床（とこ）にも注意（ちゅうい）させる。","濡（ぬ）れた床（とこ）は自然（しぜん）に乾（かわ）くので、ふき取（と）らずにそのままにしておき、荷物（にもつ）を運（はこ）ぶ作業（さぎょう）を続（つづ）けさせる。"],"answer_index":1,"ex":"大（おお）きいものを無理（むり）に抱（かか）えて運（はこ）ぶと、足元（あしもと）や前方（ぜんぽう）が見（み）えにくく、両手（りょうて）がふさがって身体（しんたい）のバランスがとりづらいため、転倒（てんとう）のリスクが高（たか）まります。重（おも）い荷物（にもつ）を運（はこ）ぶ際（きわ）は、台車（だいしゃ）を使（つか）う、ひとりでは持（も）たない、何回（なんかい）かに分（わ）けて運（はこ）ぶなど転倒（てんとう）リスク低減（ていげん）の措置（そち）をとります。床（とこ）のぬれはすぐにふき取（と）り、清掃中（せいそうちゅう）の箇所（かしょ）を通（とう）る際（きわ）は床（とこ）のぬれに留意（りゅうい）します。通路（つうろ）が暗（くら）いことも転倒（てんとう）のリスクを高（たか）めます。","jt":"判断試験"},{"subject":"飲食物調理","type":"実技","source":"飲食物調理 p.18","tp":"5. 労働（ろうどう）安全衛生（あんぜんえいせい）に関（かん）する注意点（ちゅういてん）","q":"閉店（へいてん）後（のち）、割（わ）れた食器（しょっき）や焼き鳥（やきとり）の串（くし）が入（いっ）っているかもしれないゴミ袋（ふくろ）を運（はこ）び、そのあと食器（しょっき）を洗（あら）います。安全（あんぜん）な作業（さぎょう）として最（もっと）も適切（てきせつ）なものはどれか。","ch":["素手（すで）のほうが作業（さぎょう）しやすいので、軍手（ぐんて）もエプロンも着（つ）けずにゴミ袋（ふくろ）を運（はこ）び、そのあと食器（しょっき）も素手（すで）で洗（あら）う。","ゴミ袋（ふくろ）は上（うえ）から手（て）で強（つよ）く押（お）して空気（くうき）を抜（ぬ）き、口（くち）をしっかりしばってから両手（りょうて）で抱（かか）えて運（はこ）ぶ。","軍手（ぐんて）や長（なが）いエプロンなど手先（てさき）や足元（あしもと）を保護（ほご）するものを着用（ちゃくよう）し、食器（しょっき）を洗（あら）うときはゴム手袋（てぶくろ）を着（つ）ける。"],"answer_index":2,"ex":"ゴミ袋（ふくろ）には割（わ）れた食器（しょっき）や焼き鳥（やきとり）の串（くし）などの鋭利（えいり）なものが混入（こんにゅう）している可能性（かのうせい）があるので、軍手（ぐんて）や長（なが）いエプロンなど手先（てさき）や足元（あしもと）を保護（ほご）するものを着用（ちゃくよう）します。食器（しょっき）を洗（あら）うときはゴム手袋（てぶくろ）など手先（てさき）を保護（ほご）するものを着用（ちゃくよう）します。刃物（はもの）は使用（しよう）するとき目線（めせん）を外（はず）さず、使（つか）い終（お）わった刃物（はもの）は指定（してい）された場所（ばしょ）に片（かた）づけます。","jt":"判断試験"},{"subject":"飲食物調理","type":"実技","source":"飲食物調理 p.18","tp":"5. 労働（ろ
