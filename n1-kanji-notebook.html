<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>N1 漢字帳 — Kanji Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFE7D3; --paper-2:#F8F3E5; --card:#FBF8EF;
    --ink:#292420; --ink-soft:#736A5E; --ink-faint:#A79C89; --line:#DED2B3;
    --seal:#AE3529; --seal-dark:#8A2A20; --seal-bg:#F5E2DD;
    --gold:#B9862E; --gold-bg:#F3E6C9; --moss:#4C7955; --moss-bg:#E4EDDD;
    --shadow: 0 3px 0 var(--line);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 20% 15%, rgba(174,53,41,0.05), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(76,121,85,0.05), transparent 45%);
    font-family:'Zen Kaku Gothic New','Inter',sans-serif;
    color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .app{ max-width:480px; margin:0 auto; min-height:100vh; padding:18px 18px 40px; display:flex; flex-direction:column; }
  .nepali{ font-family:'Noto Sans Devanagari','Zen Kaku Gothic New',sans-serif; }
  button{ font-family:inherit; cursor:pointer; }
  .btn-primary{
    background:var(--seal); color:#F9EFE9; border:none; border-radius:16px;
    padding:16px 20px; font-size:17px; font-weight:700; box-shadow:0 4px 0 var(--seal-dark);
    transition:transform .05s ease;
  }
  .btn-primary:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--seal-dark); }
  .btn-primary:disabled{ opacity:.5; }
  .btn-ghost{
    background:transparent; border:1.5px solid var(--line); color:var(--ink-soft);
    border-radius:16px; padding:14px 20px; font-size:15px; font-weight:500; width:100%;
  }
  .screen{ display:none; flex-direction:column; flex:1; }
  .screen.active{ display:flex; }
  .brand-mark{
    width:64px;height:64px;border-radius:50%; background:var(--seal);
    display:flex;align-items:center;justify-content:center; color:#F9EFE9;
    font-family:'Shippori Mincho',serif;font-size:26px;font-weight:700; margin:0 auto 18px;
    box-shadow:0 3px 0 var(--seal-dark);
  }
  .title-lg{ font-family:'Shippori Mincho',serif; font-size:28px; font-weight:700; text-align:center; margin:0 0 4px; }
  .sub{ text-align:center; color:var(--ink-soft); font-size:13px; margin:0 0 22px; }
  .course-card{
    display:flex; align-items:center; gap:14px; background:var(--card);
    border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px;
  }
  .course-icon{
    width:46px;height:46px;border-radius:23px;background:var(--seal-bg);
    display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--seal);
    flex-shrink:0;
  }
  .course-title{ font-size:16px; font-weight:700; }
  .course-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:1px; }
  .course-meta{ font-size:11.5px; color:var(--ink-faint); margin-top:4px; }
  .chevron{ font-size:22px; color:var(--ink-faint); }
  .top-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .course-switch{ background:none; border:none; color:var(--ink-soft); font-weight:600; font-size:13.5px; padding:6px 4px; }
  .stat-row{ display:flex; gap:10px; margin-bottom:16px; }
  .stat-card{ flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 10px; text-align:center; }
  .stat-num{ font-size:20px; font-weight:700; font-family:'Shippori Mincho',serif; }
  .stat-label{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .stat-card.mastered .stat-num{ color:var(--moss); }
  .stat-card.learning .stat-num{ color:var(--gold); }
  .stat-card.new .stat-num{ color:var(--seal); }
  .section-label{ font-size:13px; color:var(--ink-soft); font-weight:600; margin:14px 0 8px; }
  .mode-opt{
    display:flex; align-items:center; gap:10px; background:var(--card); border:1.5px solid var(--line);
    border-radius:14px; padding:12px; margin-bottom:8px;
  }
  .mode-opt.active{ border-color:var(--seal); background:var(--seal-bg); }
  .radio{ width:16px;height:16px;border-radius:8px;border:1.5px solid var(--ink-faint); flex-shrink:0; }
  .mode-opt.active .radio{ border-color:var(--seal); background:var(--seal); }
  .mode-opt-text{ font-size:13.5px; }
  .level-card{
    display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:14px; margin-bottom:9px; text-align:left; width:100%;
  }
  .level-card:disabled{ opacity:.5; }
  .level-badge{
    width:38px;height:38px;border-radius:19px;background:var(--gold-bg);
    display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold); flex-shrink:0;
  }
  .level-badge.cleared{ background:var(--moss-bg); color:var(--moss); }
  .level-info{ flex:1; min-width:0; }
  .level-title{ font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .level-sub{ font-size:12px; color:var(--ink-soft); margin-top:1px; }
  .lock-icon{ font-size:15px; }
  .topbar{ display:flex; align-items:center; gap:10px; }
  .close-btn{
    width:34px;height:34px;border-radius:17px;border:1px solid var(--line); background:var(--card);
    color:var(--ink-soft); font-size:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .progress-track{ flex:1; height:12px; background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .progress-fill{ height:100%; width:0%; background:linear-gradient(90deg, var(--gold), var(--seal)); border-radius:8px; transition:width .35s ease; }
  .count-pill{ font-size:12.5px; font-weight:600; color:var(--ink-soft); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:6px 10px; white-space:nowrap; }
  .streak-pill{ font-size:12.5px; font-weight:700; color:var(--gold); background:var(--gold-bg); border-radius:10px; padding:6px 10px; white-space:nowrap; }
  .round-pill{ font-size:11.5px; font-weight:600; color:var(--ink-faint); text-align:center; margin-top:6px; }
  .kanji-stage{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; min-height:200px; padding:16px 0; }
  .kanji-tag{ font-size:13px; color:var(--ink-faint); margin-bottom:10px; text-align:center; }
  .kanji-big{ font-family:'Shippori Mincho',serif; font-weight:700; font-size:clamp(44px, 14vw, 72px); line-height:1.15; text-align:center; }
  .kanji-underline{ width:56px; height:3px; background:var(--seal); border-radius:2px; margin-top:14px; opacity:.55; }
  .qa-stage{ flex:1; display:flex; flex-direction:column; justify-content:center; position:relative; padding:12px 0; }
  .qa-card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; min-height:90px; display:flex; align-items:center; }
  .qa-question{ font-size:17px; line-height:1.55; font-weight:600; }
  .stamp{
    position:absolute; top:6px; right:4px; width:68px; height:68px; border-radius:50%;
    border:3.5px solid var(--seal); color:var(--seal); display:flex; align-items:center; justify-content:center;
    font-family:'Shippori Mincho',serif; font-weight:800; font-size:22px;
    transform:rotate(-14deg) scale(0); opacity:0;
  }
  .stamp.wrong{ border-color:var(--ink-soft); color:var(--ink-soft); }
  .stamp.show{ animation:stampIn .4s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes stampIn{ 0%{transform:rotate(-14deg) scale(2.2);opacity:0;} 60%{transform:rotate(-14deg) scale(.92);opacity:1;} 100%{transform:rotate(-14deg) scale(1);opacity:1;} }
  .options{ display:flex; flex-direction:column; gap:11px; margin-top:8px; }
  .opt-btn{
    background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:16px 18px;
    font-size:18px; font-weight:600; text-align:center; box-shadow:var(--shadow); transition:transform .05s ease;
  }
  .opt-btn.qa{ text-align:left; font-size:14px; line-height:1.4; font-weight:500; padding:13px 16px; }
  .opt-btn:active{ transform:translateY(2px); }
  .opt-btn.correct{ background:var(--moss-bg); border-color:var(--moss); color:#2E4C36; }
  .opt-btn.wrong{ background:var(--seal-bg); border-color:var(--seal); color:var(--seal-dark); }
  .opt-btn.dim{ opacity:.45; }
  .opt-btn[disabled]{ pointer-events:none; }
  .opt-btn.small{ font-size:14px; }
  .idk-btn{
    margin-top:14px; background:var(--paper-2); border:1.5px solid var(--line); border-radius:14px;
    padding:15px 18px; font-size:15px; font-weight:600; color:var(--ink-soft); text-align:center;
  }
  .feedback{
    position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:2px solid var(--line);
    border-radius:20px 20px 0 0; padding:20px 22px 22px; box-shadow:0 -6px 18px rgba(41,36,32,.10); max-height:75vh; overflow-y:auto;
    transform:translateY(105%); transition:transform .3s cubic-bezier(.25,1,.4,1); max-width:480px; margin:0 auto;
  }
  .feedback.show{ transform:translateY(0); }
  .fb-head{ display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  .fb-icon{ width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px; flex-shrink:0; }
  .fb-icon.ok{ background:var(--moss); color:#F3F8EF; }
  .fb-icon.no{ background:var(--seal); color:#F9EFE9; }
  .fb-title{ font-weight:700; font-size:15px; }
  .fb-title.ok{ color:var(--moss); }
  .fb-title.no{ color:var(--seal-dark); }
  .fb-note{ font-size:12px; color:var(--ink-faint); margin-top:2px; }
  .fb-reading{ font-size:20px; font-family:'Shippori Mincho',serif; margin:10px 0 4px; font-weight:700; }
  .fb-meaning{ font-size:14px; color:var(--ink-soft); margin-bottom:16px; line-height:1.5; }
  .fb-explain{ font-size:13px; color:var(--ink-soft); line-height:1.6; margin:-6px 0 16px; padding:10px 12px; background:var(--paper-2); border-radius:10px; display:none; }
  .result-ring{
    width:128px; height:128px; border-radius:50%; margin:20px auto 16px; border-width:8px; border-style:solid;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
  }
  .result-ring b{ font-size:26px; font-family:'Shippori Mincho',serif; }
  .result-ring span{ font-size:11.5px; color:var(--ink-soft); text-align:center; padding:0 8px; }
  .result-title{ text-align:center; font-family:'Shippori Mincho',serif; font-size:22px; font-weight:700; margin:0 0 6px; }
  .result-sub{ text-align:center; color:var(--ink-soft); font-size:14px; margin-bottom:20px; }
  .unlock-card{ background:var(--moss-bg); border-radius:16px; padding:16px; margin-bottom:18px; }
  .unlock-title{ font-weight:700; font-size:15px; margin-bottom:4px; }
  .unlock-sub{ font-size:13px; color:var(--ink-soft); margin-bottom:0; }
  .miss-label{ font-size:12px; color:var(--ink-faint); font-weight:600; margin-bottom:8px; }
  .miss-item{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 14px; margin-bottom:8px; }
  .miss-kanji{ font-family:'Shippori Mincho',serif; font-size:19px; font-weight:700; min-width:56px; }
  .miss-reading{ font-size:12.5px; color:var(--ink-soft); }
  .miss-meaning{ font-size:12px; color:var(--ink-faint); text-align:right; flex:1; }
  .miss-attempts{ font-size:11px; color:var(--seal); font-weight:700; background:var(--seal-bg); border-radius:8px; padding:2px 7px; white-space:nowrap; }
  .miss-qa{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:8px; }
  .miss-qa-q{ font-size:13px; font-weight:700; margin-bottom:4px; line-height:1.4; }
  .miss-qa-a{ font-size:12.5px; color:var(--ink-soft); line-height:1.4; }
  .footer-buttons{ margin-top:auto; padding-top:14px; }
  .footer-buttons .btn-primary{ width:100%; margin-bottom:10px; }
</style>
</head>
<body>
<div class="app">

  <div class="screen" id="screen-courseSelect">
    <div class="brand-mark">学</div>
    <h1 class="title-lg">कुन Course पढ्ने?</h1>
    <p class="sub">तह वा विषय अनुसार छान्नुहोस्</p>
    <div id="courseList"></div>
  </div>

  <div class="screen" id="screen-home">
    <div class="top-row">
      <button class="course-switch" id="btnChangeCourse">‹ Course</button>
    </div>
    <div class="brand-mark" id="homeBrandMark">語</div>
    <h1 class="title-lg" id="homeTitle">N1 漢字帳</h1>
    <p class="sub" id="homeSub">JLPT N1 · 189 वाक्यांश</p>
    <div class="stat-row">
      <div class="stat-card mastered"><div class="stat-num" id="statMastered">0</div><div class="stat-label">राम्रो जानेको</div></div>
      <div class="stat-card learning"><div class="stat-num" id="statLearning">0</div><div class="stat-label">सिकिरहेको</div></div>
      <div class="stat-card new"><div class="stat-num" id="statNew">0</div><div class="stat-label">नयाँ</div></div>
    </div>
    <div id="modeSection">
      <div class="section-label">प्रश्न कसरी सोध्ने?</div>
      <div id="modeList"></div>
    </div>
    <div class="section-label">तहहरू (Levels)</div>
    <div id="levelList"></div>
  </div>

  <div class="screen" id="screen-quiz">
    <div class="topbar">
      <button class="close-btn" id="btnQuitQuiz">✕</button>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="count-pill" id="countPill">0/15</div>
      <div class="streak-pill">🔥 <span id="streakNum">0</span></div>
    </div>
    <div class="round-pill" id="roundPill"></div>

    <div class="kanji-stage" id="vocabStage" style="display:none;">
      <div class="kanji-tag" id="kanjiTag"></div>
      <div class="kanji-big" id="kanjiBig"></div>
      <div class="kanji-underline"></div>
      <div class="stamp" id="stamp1">合</div>
    </div>

    <div class="qa-stage" id="qaStage" style="display:none;">
      <div class="kanji-tag" id="qaTag">सही उत्तर छान्नुहोस्</div>
      <div class="qa-card"><div class="qa-question" id="qaQuestion"></div></div>
      <div class="stamp" id="stamp2">合</div>
    </div>

    <div class="options" id="optionsWrap"></div>
    <button class="idk-btn" id="btnIdk">？ थाहा छैन / I don't know</button>
  </div>

  <div class="screen" id="screen-result">
    <div style="flex:1; overflow-y:auto;">
      <div class="result-ring" id="resultRing"><b id="resultPct">0</b><span id="resultFrac">शब्द मास्टर भयो</span></div>
      <h2 class="result-title" id="resultTitle">तह पूरा भयो!</h2>
      <p class="result-sub" id="resultSub"></p>
      <div id="unlockWrap"></div>
      <div id="missWrap"></div>
    </div>
    <div class="footer-buttons">
      <button class="btn-primary" id="btnRetry">यो तह फेरि खेल्नुहोस्</button>
      <button class="btn-ghost" id="btnResultHome">गृहपृष्ठमा फर्कनुहोस्</button>
    </div>
  </div>

</div>

<div class="feedback" id="feedback">
  <div class="fb-head">
    <div class="fb-icon" id="fbIcon">✓</div>
    <div>
      <div class="fb-title" id="fbTitle">ठीक छ!</div>
      <div class="fb-note" id="fbNote"></div>
    </div>
  </div>
  <div class="fb-reading" id="fbReading"></div>
  <div class="fb-meaning nepali" id="fbMeaning"></div>
  <div class="fb-explain" id="fbExplain"></div>
  <button class="btn-primary" id="btnNext" style="width:100%;">जारी राख्नुहोस्</button>
</div>

const QA_PAGES_RAW = [{"title":"接客全般 学科 · भाग 1 (p.5–7)","words":[{"subject":"接客全般","type":"学科","source":"接客全般 p.5","tp":"1. 接客（せっきゃく）に関（かん）する知識（ちしき）","q":"飲食店（いんしょくてん）の店舗（てんぽ）責任者（せきにんしゃ）（店長（てんちょう）など）や時間帯（じかんたい）責任者（せきにんしゃ）に求（もと）められる役割（やくわり）として、正（ただ）しいものはどれか。","ch":["接客（せっきゃく）全般（ぜんぱん）の責任者（せきにんしゃ）として行動（こうどう）し、従業員（じゅうぎょういん）の実践（じっせん）モデル（手本（てほん））となる。","接客（せっきゃく）はすべて従業員（じゅうぎょういん）に任（まか）せ、責任者（せきにんしゃ）は事務作業（じむさぎょう）だけをおこなう。","クレーム対応（たいおう）は担当（たんとう）した従業員（じゅうぎょういん）の仕事（しごと）なので、責任者（せきにんしゃ）は関（かか）わらない。"],"answer_index":0,"ex":"店舗（てんぽ）責任者（せきにんしゃ）は、料理（りょうり）・サービス・清潔感（せいけつかん）・手違（てちが）い・クレーム対応（たいおう）など接客（せっきゃく）全般（ぜんぱん）の責任者（せきにんしゃ）として行動（こうどう）し、従業員（じゅうぎょういん）の実践（じっせん）モデル（手本（てほん））となることが求（もと）められます。さらに作業（さぎょう）マニュアルの整備（せいび）・見直（みなお）し、教育（きょういく）とトレーニング、顧客（こきゃく）管理（かんり）など、指導者（しどうしゃ）・管理者（かんりしゃ）の役割（やくわり）も果（は）たします。よって責任（せきにん）を従業員（じゅうぎょういん）に任（まか）せきりにする選択肢（せんたくし）や、マニュアルを見直（みなお）さない選択肢（せんたくし）は誤（あやま）りです。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.5","tp":"1. 接客（せっきゃく）に関（かん）する知識（ちしき）（1）接客（せっきゃく）サービスについて","q":"日本（にほん）における接客（せっきゃく）サービスの特性（とくせい）「おもてなし」について、正（ただ）しいものはどれか。","ch":["「おもてなし」はホスピタリティのことで、実現（じつげん）には店舗（てんぽ）環境（かんきょう）づくりと従業員（じゅうぎょういん）の教育（きょういく）が重要（じゅうよう）である。","「おもてなし」は高級（こうきゅう）店（みせ）だけに必要（ひつよう）で、一般（いっぱん）の店（みせ）には関係（かんけい）がない。","「おもてなし」の心（こころ）は言葉（ことば）にしないと伝（つた）わらないので、料理（りょうり）提供（ていきょう）のたびに口（くち）で説明（せつめい）する。"],"answer_index":0,"ex":"テキストでは、日本（にほん）の接客（せっきゃく）サービスの特性（とくせい）として「おもてなし」（＝ホスピタリティ）を挙（あ）げています。お客様（きゃくさま）への配慮（はいりょ）や気（き）づかいといった「おもてなしの心（こころ）」が伝（つた）わるよう、店舗（てんぽ）環境（かんきょう）づくりと従業員（じゅうぎょういん）教育（きょういく）が重要（じゅうよう）とされています。クレンリネスは清潔感（せいけつかん）を指（さ）す別（べつ）の言葉（ことば）なので誤（あやま）りです。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.5","tp":"1. 接客（せっきゃく）に関（かん）する知識（ちしき）（1）接客（せっきゃく）サービスについて","q":"お客様（きゃくさま）の期待（きたい）と顧客（こきゃく）満足（まんぞく）の関係（かんけい）について、正（ただ）しいものはどれか。","ch":["期待（きたい）を下回（げかい）っても、値段（ねだん）さえ安（やす）ければ不満（ふまん）は残（のこ）らず、必（かなら）ず再来（さいらい）店（みせ）してもらえる。","期待（きたい）を上回（うわまわ）れば十分（じゅうぶん）に満足（まんぞく）して帰（かえ）り、リピーターとして再来（さいらい）店（みせ）する確率（かくりつ）が増（ふ）える。","お客様（きゃくさま）は何（なん）の期待（きたい）も持（も）たずに来店（らいてん）するので、味（あじ）や清潔感（せいけつかん）の事前（じぜん）の準備（じゅんび）は必要（ひつよう）ない。"],"answer_index":1,"ex":"お客様（きゃくさま）は味（あじ）のレベル、サービス、清潔感（せいけつかん）、雰囲気（ふんいき）などに一定（いってい）の期待（きたい）を持（も）って来店（らいてん）します。期待（きたい）を上回（うわまわ）れば満足（まんぞく）して再来（さいらい）店（みせ）の確率（かくりつ）が増（ふ）え、下回（したまわ）れば不満（ふまん）となり再来（さいらい）店（みせ）がありません。クレームの情報（じょうほう）は広（ひろ）がりやすく、潜在的（せんざいてき）なお客様（きゃくさま）まで減（へ）らしてしまいます。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.5","tp":"1. 接客（せっきゃく）に関（かん）する知識（ちしき）（1）接客（せっきゃく）サービスについて","q":"顧客（こきゃく）満足（まんぞく）や価値（かち）（Value）に関係（かんけい）する要因（よういん）「QSCA」の組み合（くみあ）わせとして正（ただ）しいものはどれか。","ch":["Quantity（分量（ぶんりょう））、Service（サービス）、Cleanliness（清潔感（せいけつかん））、Attitude（態度（たいど））","Quality（料理（りょうり）の品質（ひんしつ））、Sales（売上（うりあげ））、Cost（原価（げんか））、Atmosphere（雰囲気（ふんいき））","Quality（料理（りょうり）の品質（ひんしつ））、Service（サービス）、Cleanliness（清潔感（せいけつかん））、Atmosphere（雰囲気（ふんいき））"],"answer_index":2,"ex":"顧客（こきゃく）満足（まんぞく）・価値（かち）に関係（かんけい）する要因（よういん）は、料理（りょうり）の品質（ひんしつ）（Quality）、サービス（Service）、清潔感（せいけつかん）（Cleanliness）、雰囲気（ふんいき）（Atmosphere）の4つです。QSCAは1つとして漏（も）らすことなく評価（ひょうか）を高（たか）めていく必要（ひつよう）があります。Speedやコスト、売上（うりあげ）はここでの要因（よういん）には含（ふく）まれません。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.5","tp":"1. 接客（せっきゃく）に関（かん）する知識（ちしき）（1）接客（せっきゃく）サービスについて","q":"料理（りょうり）の品質（ひんしつ）（Quality）の確認（かくにん）事項（じこう）として正（ただ）しいものはどれか。","ch":["客席（きゃくせき）周（まわ）りに汚（よご）れやほこりがないか確認（かくにん）する。","いつも通（とう）りの味（あじ）・分量（ぶんりょう）・盛（も）り付（つ）けで提供（ていきょう）できているか確認（かくにん）する。","従業員（じゅうぎょういん）が笑顔（えがお）とアイコンタクトで応対（おうたい）しているか確認（かくにん）する。"],"answer_index":1,"ex":"Qualityでは、いつも通（とう）りの味（あじ）・分量（ぶんりょう）・盛（も）り付（つ）け、メニューの清潔（せいけつ）さ、注文（ちゅうもん）通（とう）りの温度（おんど）・状態（じょうたい）・時間（じかん）での提供（ていきょう）を確認（かくにん）します。客席（きゃくせき）の汚（よご）れは清潔感（せいけつかん）（C）、BGMは雰囲気（ふんいき）（A）、笑顔（えがお）とアイコンタクトはサービス（S）の確認（かくにん）事項（じこう）です。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.6","tp":"1. 接客（せっきゃく）に関（かん）する知識（ちしき）（1）接客（せっきゃく）サービスについて","q":"「中間（ちゅうかん）サービス」の内容（ないよう）として正（ただ）しいものはどれか。","ch":["食事中（しょくじちゅう）の水（みず）の継（つ）ぎ足（た）しや、不要（ふよう）な食器（しょっき）の中間（ちゅうかん）下（さ）げをおこなうこと。","お客様（きゃくさま）を入口（いりぐち）でお迎（むか）えし、人数（にんずう）に合（あ）った席（せき）までご案内（あんない）すること。","レジでお客様（きゃくさま）をお待（ま）たせしないように、精算（せいさん）をおこなうこと。"],"answer_index":0,"ex":"中間（ちゅうかん）サービスとは、食事中（しょくじちゅう）の水（みず）の継（つ）ぎ足（た）しや不要（ふよう）な食器（しょっき）の中間（ちゅうかん）下（さ）げ、お客様（きゃくさま）の食事（しょくじ）に不都合（ふつごう）がないかの確認（かくにん）などを指（さ）します。忘れ物（わすれもの）確認（かくにん）やバッシングはお帰（かえ）り後（のち）の作業（さぎょう）、ご案内（あんない）やレジ精算（せいさん）は別（べつ）のサービスです。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.6","tp":"1. 接客（せっきゃく）に関（かん）する知識（ちしき）（1）接客（せっきゃく）サービスについて","q":"サービス（Service）の確認（かくにん）事項（じこう）として正（ただ）しいものはどれか。","ch":["窓（まど）ガラスにくもりや汚（よご）れがないか確認（かくにん）する。","メニューが清潔（せいけつ）な状態（じょうたい）で、注文（ちゅうもん）通（とう）りの温度（おんど）や状態（じょうたい）で提供（ていきょう）されているか確認（かくにん）する。","フルサービスの店（みせ）で、オーダー（注文（ちゅうもん））受（う）けが放置（ほうち）されていないか確認（かくにん）する。"],"answer_index":2,"ex":"Serviceでは、オーダー受（う）けの放置（ほうち）、配膳（はいぜん）の温度（おんど）と時間（じかん）、水（みず）やドリンクの提供（ていきょう）の遅（おく）れ、レジで長（なが）く待（ま）たせていないかなどを確認（かくにん）します。窓（まど）ガラスは清潔感（せいけつかん）（C）、空調（くうちょう）温度（おんど）は雰囲気（ふんいき）（A）、メニューの清潔（せいけつ）さは料理（りょうり）の品質（ひんしつ）（Q）の確認（かくにん）事項（じこう）です。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.7","tp":"1. 接客（せっきゃく）に関（かん）する知識（ちしき）（1）接客（せっきゃく）サービスについて","q":"清潔感（せいけつかん）（Cleanliness）の確認（かくにん）事項（じこう）として正（ただ）しいものはどれか。","ch":["点灯（てんとう）すべき電飾（でんしょく）看板（かんばん）やイルミネーションが点（てん）いているか確認（かくにん）する。","客用（きゃくよう）トイレをチェックし、異臭（いしゅう）がなく清潔感（せいけつかん）があるか確認（かくにん）する。","出来上（できあ）がった料理（りょうり）が適正（てきせい）な時間内（じかんない）にテーブルへ配膳（はいぜん）されているか確認（かくにん）する。"],"answer_index":1,"ex":"Cleanlinessでは、客席（きゃくせき）の汚（よご）れ、テーブル備品（びひん）、食器（しょっき）やシルバー、床（とこ）、窓（まど）ガラス、照明器具（しょうめいきぐ）のほこり、客用（きゃくよう）トイレの異臭（いしゅう）、従業員（じゅうぎょういん）の制服（せいふく）などを確認（かくにん）します。電飾（でんしょく）看板（かんばん）や照明（しょうめい）の照度（しょうど）は雰囲気（ふんいき）（A）、配膳（はいぜん）の時間（じかん）はサービス（S）の確認（かくにん）事項（じこう）です。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.7","tp":"1. 接客（せっきゃく）に関（かん）する知識（ちしき）（1）接客（せっきゃく）サービスについて","q":"雰囲気（ふんいき）（Atmosphere）の確認（かくにん）事項（じこう）として正（ただ）しいものはどれか。","ch":["接客（せっきゃく）する従業員（じゅうぎょういん）の制服（せいふく）に汚（よご）れやほつれがないか確認（かくにん）する。","店内（てんない）照明（しょうめい）に電球（でんきゅう）切（き）れがなく、適度（てきど）な照度（しょうど）で快適（かいてき）か確認（かくにん）する。","提供（ていきょう）する食器（しょっき）やグラスが清潔（せいけつ）な状態（じょうたい）か確認（かくにん）する。"],"answer_index":1,"ex":"Atmosphereでは、空調（くうちょう）温度（おんど）、照明（しょうめい）の電球（でんきゅう）切（き）れと照度（しょうど）、電飾（でんしょく）看板（かんばん）やイルミネーションの点灯（てんとう）、BGMの選曲（せんきょく）と音量（おんりょう）を確認（かくにん）します。テーブル備品（びひん）、制服（せいふく）、食器（しょっき）の清潔（せいけつ）さはいずれも清潔感（せいけつかん）（C）の確認（かくにん）事項（じこう）です。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.7","tp":"1. 接客（せっきゃく）に関（かん）する知識（ちしき）（2）接客（せっきゃく）における基本動作（きほんどうさ）","q":"客席（きゃくせき）内（ない）における動作（どうさ）の基本（きほん）「ニコニコ、ハキハキ、キビキビ」の説明（せつめい）として正（ただ）しいものはどれか。","ch":["キビキビとは、お客様（きゃくさま）の質問（しつもん）に的確（てきかく）に答（こた）えることである。","ニコニコとは、お客様（きゃくさま）の前（まえ）にいるときだけ笑顔（えがお）になることである。","ニコニコとは、いつも口角（こうかく）を上（あ）げて対応（たいおう）することである。"],"answer_index":2,"ex":"ニコニコはいつも口角（こうかく）を上（あ）げて対応（たいおう）すること、ハキハキはお客様（きゃくさま）の質問（しつもん）に的確（てきかく）に答（こた）えること、キビキビはダラダラ歩（ある）いたり反応（はんのう）が遅（おそ）かったりしないことです。店内（てんない）を走（はし）ることは注意（ちゅうい）すべき行動（こうどう）であり、正（ただ）しい説明（せつめい）ではありません。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.7","tp":"1. 接客（せっきゃく）に関（かん）する知識（ちしき）（2）接客（せっきゃく）における基本動作（きほんどうさ）","q":"従業員（じゅうぎょういん）がほかの従業員（じゅうぎょういん）にあいさつをすることが重要（じゅうよう）な、一番目（いちばんめ）の理由（りゆう）はどれか。","ch":["気持（きも）ちよく心（こころ）を合（あ）わせ、チームワークで仕事（しごと）をしたいという意思表示（いしひょうじ）をするため。","遅刻（ちこく）や欠勤（けっきん）の有無（うむ）を確認（かくにん）するため。","お客様（きゃくさま）に、元気（げんき）で活気（かっき）のある店（みせ）だという印象（いんしょう）を持（も）ってもらい、来店（らいてん）を増（ふ）やすため。"],"answer_index":0,"ex":"従業員（じゅうぎょういん）へのあいさつが重要（じゅうよう）な一番目（いちばんめ）の理由（りゆう）は、「今日（こんにち）は気持（きも）ちよく、心（こころ）を合（あ）わせ、チームワークで仕事（しごと）をしたい」という意思表示（いしひょうじ）をし、心（こころ）で握手（あくしゅ）を交（まじ）わしている状態（じょうたい）にするためです。出勤時（しゅっきんじ）も退勤時（たいきんじ）もあいさつができているか確認（かくにん）します。"}]},{"title":"接客全般 学科 · भाग 2 (p.8–12)","words":[{"subject":"接客全般","type":"学科","source":"接客全般 p.8","tp":"1. 接客（せっきゃく）に関（かん）する知識（ちしき）（2）接客（せっきゃく）における基本動作（きほんどうさ）","q":"従業員（じゅうぎょういん）同士（どうし）の「スマイル＆アイコンタクト」について、正（ただ）しいものはどれか。","ch":["笑顔（えがお）は個人（こじん）の性格（せいかく）によるものなので、店（みせ）として基準（きじゅん）を決（き）めたり、できているか確認（かくにん）したりする必要（ひつよう）はない。","「今日（きょう）も楽（たの）しく仕事（しごと）しましょうね」という意味（いみ）があり、結果（けっか）としてお客様（きゃくさま）へのサービスの質（しつ）が上（あ）がる。","出退勤（しゅったいきん）時（とき）にお客様（きゃくさま）とすれ違（ちが）うときは、止（と）まらずに歩（ある）きながらおこなう。"],"answer_index":1,"ex":"従業員（じゅうぎょういん）同士（どうし）が笑顔（えがお）と目線（めせん）を交（まじ）わし合（あ）うスマイル＆アイコンタクトは「今日（きょう）も楽（たの）しく仕事（しごと）しましょうね」という意味（いみ）があり、チームワークよく楽（たの）しく接客（せっきゃく）する雰囲気（ふんいき）を作（つく）り、お客様（きゃくさま）へのサービスの質（しつ）を上（あ）げます。お客様（きゃくさま）とすれ違（ちが）う際（きわ）は一旦（いったん）止（ど）まり、正体（しょうたい）しておこないます。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.8","tp":"1. 接客（せっきゃく）に関（かん）する知識（ちしき）（2）接客（せっきゃく）における基本動作（きほんどうさ）","q":"従業員（じゅうぎょういん）の立（た）ち方（ほう）・歩き方（あるきかた）について、正（ただ）しいものはどれか。","ch":["トレンチ（お盆（ぼん））は手（て）で下（さ）げ、ブラブラさせながら歩（ある）く。","料理（りょうり）を運（はこ）んでいるときは急（いそ）いでいるので、お客様（きゃくさま）とすれ違（ちが）う際（きわ）も止（と）まらずに先（さき）に通（とお）ってよい。","待機（たいき）のときは決（き）められた場所（ばしょ）に背筋（せすじ）を伸（の）ばして立（た）ち、すぐ反応（はんのう）できるようにする。"],"answer_index":2,"ex":"待機（たいき）の際（きわ）は決（き）められた場所（ばしょ）に背筋（せすじ）を伸（の）ばして立（た）ち、入店（にゅうてん）やオーダー、呼（よ）ばれた時（とき）にすぐ反応（はんのう）できるようにします。店内（てんない）を走（はし）る、トレンチをブラブラ下（さ）げて歩（ある）くのは注意（ちゅうい）すべき行動（こうどう）です。お客様（きゃくさま）とすれ違（ちが）う際（きわ）は、料理（りょうり）を運（はこ）んでいる場合（ばあい）も脇（わき）に寄（よ）って立（た）ち止（ど）まり、会釈（えしゃく）してお客様（きゃくさま）優先（ゆうせん）でお通（とう）しします。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.8","tp":"1. 接客（せっきゃく）に関（かん）する知識（ちしき）（2）接客（せっきゃく）における基本動作（きほんどうさ）","q":"お辞儀（じぎ）について、正（ただ）しいものはどれか。","ch":["首（くび）だけを曲（ま）げて、すばやく上（あ）げるのがよい。","相手（あいて）に正体（しょうたい）して背筋（せすじ）を伸（の）ばしたまま腰（こし）から折（お）るように頭（あたま）を下（さ）げ、一旦（いったん）止（と）めてゆっくりと上（あ）げる。","お辞儀（じぎ）の心（こころ）がまえは『出迎（でむか）え７歩（ほ）、見送（みおく）り３歩（ほ）』と言（い）われ、見送（みおく）りよりも出迎（でむか）えを長（なが）くする。"],"answer_index":1,"ex":"お辞儀（じぎ）は鎌倉時代（かまくらじだい）から続（つづ）く日本（にほん）礼法（れいほう）の基本（きほん）で、あいさつや感謝（かんしゃ）、敬意（けいい）を形（かたち）で現（あらわ）すものです。相手（あいて）に正体（しょうたい）し姿勢（しせい）を正（ただ）し、背筋（せすじ）を伸（の）ばしたまま腰（こし）から折（お）って頭（あたま）を下（さ）げ、一旦（いったん）止（と）めてゆっくり上（あ）げます。テキストでは『出迎（でむか）え３歩（ほ）、見送（みおく）り７歩（ほ）』と示（しめ）されており、7歩（ほ）と3歩（ほ）が逆（ぎゃく）の選択肢（せんたくし）は誤（あやま）りです。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.9","tp":"1. 接客（せっきゃく）に関（かん）する知識（ちしき）（3）食（しょく）のマナーについて","q":"和食（わしょく）のマナーに関（かん）する確認（かくにん）事項（じこう）として、正（ただ）しいものはどれか。","ch":["料理（りょうり）は入口（いりぐち）に近（ちか）いお客様（きゃくさま）から順（じゅん）に提供（ていきょう）する。","主賓（しゅひん）から料理（りょうり）が提供（ていきょう）されているか確認（かくにん）する。","食（た）べ終（お）わった食器（しょっき）は、閉店（へいてん）前（まえ）にまとめて下（さ）げる。"],"answer_index":1,"ex":"和食（わしょく）では、サービスマニュアルどおりの提供（ていきょう）、食事（しょくじ）のペースに合（あ）わせた提供（ていきょう）、主賓（しゅひん）からの提供（ていきょう）、料理（りょうり）の説明（せつめい）、下（さ）げるべきものをタイミングどおりに下（さ）げることを確認（かくにん）します。席（せき）の位置（いち）で順番（じゅんばん）を決（き）めることや、説明（せつめい）を省（はぶ）くことは示（しめ）されていません。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.9","tp":"1. 接客（せっきゃく）に関（かん）する知識（ちしき）（3）食（しょく）のマナーについて","q":"洋食（ようしょく）のマナーに関（かん）する確認（かくにん）事項（じこう）として、正（ただ）しいものはどれか。","ch":["皿（さら）に食べ物（たべもの）が残（のこ）っていないときは、フォーク・ナイフの置き方（おきかた）に関（かか）わらず皿（さら）を下（さ）げているか確認（かくにん）する。","皿（さら）に食べ物（たべもの）が残（のこ）っていなくても、フォークとナイフが揃（そろ）って置（お）かれていなければ、その皿（さら）は下（さ）げないでおく。","提供（ていきょう）が遅（おそ）くなっている料理（りょうり）があっても、お客様（きゃくさま）から言（い）われるまではこちらから確認（かくにん）する必要（ひつよう）はない。"],"answer_index":0,"ex":"洋食（ようしょく）では、皿（さら）に食べ物（たべもの）が残（のこ）っていないときはフォーク・ナイフの置き方（おきかた）に関（かか）わらず皿（さら）を下（さ）げているか確認（かくにん）します。また、社内（しゃない）基準（きじゅん）（サービスマニュアル）どおりの提供（ていきょう）と、提供（ていきょう）が遅（おく）れている料理（りょうり）がないかの確認（かくにん）が基本（きほん）です。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.9","tp":"1. 接客（せっきゃく）に関（かん）する知識（ちしき）（3）食（しょく）のマナーについて","q":"中国料理（ちゅうごくりょうり）のマナーに関（かん）する確認（かくにん）事項（じこう）として、正（ただ）しいものはどれか。","ch":["取り分（とりぶん）け用（よう）の小皿（こざら）、スプーンや菜箸（さいばし）が足（た）りているか確認（かくにん）する。","取り分（とりぶん）けはお客様（きゃくさま）がおこなうので、小皿（こざら）の数（かず）は確認（かくにん）しなくてよい。","食べ方（たべかた）や飲（の）み方（ほう）の説明（せつめい）は、お客様（きゃくさま）に失礼（しつれい）なのでしない。"],"answer_index":0,"ex":"中国料理（ちゅうごくりょうり）では、取り分（とりぶん）け用（よう）の小皿（こざら）・スプーン・菜箸（さいばし）が足（た）りているか、必要（ひつよう）な調味料（ちょうみりょう）が揃（そろ）っているか、必要（ひつよう）に応（おう）じて食べ方（たべかた）や飲（の）み方（ほう）を説明（せつめい）しているか、提供（ていきょう）が遅（おく）れている料理（りょうり）がないかを確認（かくにん）します。説明（せつめい）をしない、確認（かくにん）しないという対応（たいおう）は誤（あやま）りです。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.10","tp":"1. 接客（せっきゃく）に関（かん）する知識（ちしき）（5）適切（てきせつ）な配膳（はいぜん）（サービング）について","q":"適切（てきせつ）な配膳（はいぜん）（サービング）について、正（ただ）しいものはどれか。","ch":["同（おな）じテーブルのお客様（きゃくさま）へはほぼ同時（どうじ）に提供（ていきょう）し、同時（どうじ）提供（ていきょう）であってもお子（こ）様（よう）の料理（りょうり）を一番先（いちばんさき）に配膳（はいぜん）する。","同時（どうじ）提供（ていきょう）のときは、大人（おとな）の料理（りょうり）を先（さき）に配膳（はいぜん）する。","配膳（はいぜん）の順番（じゅんばん）は特（とく）に決（き）まっていないので、担当（たんとう）した従業員（じゅうぎょういん）がその場（ば）の状況（じょうきょう）を見（み）て自由（じゆう）に決（き）めてよいことになっている。"],"answer_index":0,"ex":"料理（りょうり）が配膳（はいぜん）されるときはお客様（きゃくさま）の期待（きたい）が最（もっと）も高（たか）まる瞬間（しゅんかん）で、テーブル全員（ぜんいん）の料理（りょうり）が遅（おく）れなく配膳（はいぜん）されることがベストです。同（おな）じテーブルにはほぼ同時（どうじ）に提供（ていきょう）し、同時（どうじ）提供（ていきょう）であってもお子（こ）様（よう）の料理（りょうり）を一番先（いちばんさき）に配膳（はいぜん）しているか確認（かくにん）します。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.10","tp":"1. 接客（せっきゃく）に関（かん）する知識（ちしき）（5）適切（てきせつ）な配膳（はいぜん）（サービング）について","q":"店内（てんない）飲食（いんしょく）をした後（のち）、商品（しょうひん）をテイクアウトするお客様（きゃくさま）への対応（たいおう）として正（ただ）しいものはどれか。","ch":["テイクアウト商品（しょうひん）は、注文（ちゅうもん）を受（う）けたらすぐにお渡（わた）しし、消費（しょうひ）期限（きげん）はお客様（きゃくさま）に聞（き）かれたときだけ答（こた）える。","テイクアウト商品（しょうひん）は、お客様（きゃくさま）が帰（かえ）る直前（ちょくぜん）にお渡（わた）しし、食（た）べられる期限（きげん）（消費（しょうひ）期限（きげん））も必（かなら）ず伝（つた）える。","テイクアウト商品（しょうひん）は、お客様（きゃくさま）が帰（かえ）る直前（ちょくぜん）にお渡（わた）しすればよく、消費（しょうひ）期限（きげん）は伝（つた）えなくてよい。"],"answer_index":1,"ex":"店内（てんない）飲食（いんしょく）後（のち）にテイクアウトするお客様（きゃくさま）の料理（りょうり）は、帰（かえ）る直前（ちょくぜん）にお渡（わた）しします。あわせて食（た）べられる期限（きげん）（消費（しょうひ）期限（きげん））も必（かなら）ず伝（つた）える必要（ひつよう）があります。先（さき）に渡（わた）すことや、期限（きげん）を伝（つた）えないことは誤（あやま）りです。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.11","tp":"1. 接客（せっきゃく）に関（かん）する知識（ちしき）（6）接客（せっきゃく）基本用語（きほんようご）とその使い方（つかいかた）","q":"サジェスティブセールス（推奨（すいしょう）販売（はんばい））の説明（せつめい）として正（ただ）しいものはどれか。","ch":["高（たか）いメニューだけをすすめて客（きゃく）単価（たんか）を上（あ）げること。","お客様（きゃくさま）が注文（ちゅうもん）を決（き）められないときに、店側（みせがわ）が売（う）れ残（のこ）りそうなメニューを代（か）わりに選（えら）んで注文（ちゅうもん）を決（き）めてしまうこと。","お得（え）なメニューや新（しん）メニュー、食後（しょくご）のデザートなどをすすめ、お客様（きゃくさま）の満足度（まんぞくど）を高（たか）めること。"],"answer_index":2,"ex":"お客様（きゃくさま）はメニュー情報（じょうほう）をすべて把握（はあく）して注文（ちゅうもん）しているわけではないため、よりお得（え）なメニューや新（しん）メニュー、嗜好（しこう）に合（あ）ったメニュー、食後（しょくご）のデザートなどを推奨（すいしょう）して満足度（まんぞくど）を高（たか）めます。強（つよ）くお願（ねが）いしたり、店（みせ）が代（か）わりに決（き）めたりするものではありません。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.11","tp":"1. 接客（せっきゃく）に関（かん）する知識（ちしき）（7）サービスの優先順位（ゆうせんじゅんい）","q":"接客（せっきゃく）人員（じんいん）が少（すく）なく、複数（ふくすう）のサービスが同時（どうじ）に発生（はっせい）したときの優先順位（ゆうせんじゅんい）として正（ただ）しいものはどれか。","ch":["①ご案内（あんない） ②注文（ちゅうもん）受（う）け ③料理（りょうり）提供（ていきょう） ④レジ精算（せいさん） ⑤デザート・ドリンクの提供（ていきょう） ⑥下（さ）げ","①料理（りょうり）提供（ていきょう） ②レジ精算（せいさん） ③ご案内（あんない） ④注文（ちゅうもん）受（う）け ⑤デザート・ドリンクの提供（ていきょう） ⑥下（さ）げ","①注文（ちゅうもん）受（う）け ②料理（りょうり）提供（ていきょう） ③ご案内（あんない） ④下（さ）げ ⑤レジ精算（せいさん） ⑥デザート・ドリンクの提供（ていきょう）"],"answer_index":1,"ex":"優先順位（ゆうせんじゅんい）は①料理（りょうり）提供（ていきょう）②レジ精算（せいさん）③ご案内（あんない）④注文（ちゅうもん）受（う）け⑤デザート・ドリンクの提供（ていきょう）⑥下（さ）げです。料理（りょうり）提供（ていきょう）が1番（ばん）なのは、待（ま）たせすぎると料理（りょうり）が冷（さ）めて美味（おい）しさが低下（ていか）し再来（さいらい）店（みせ）してもらえないからで、レジ精算（せいさん）が2番（ばん）なのは、レジのお客様（きゃくさま）は声掛（こえか）けで待（ま）ってもらえるからです。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.12","tp":"1. 接客（せっきゃく）に関（かん）する知識（ちしき）（8）顧客（こきゃく）管理（かんり）（カスタマーリレーションズ）","q":"顧客（こきゃく）管理（かんり）（カスタマーリレーションズ）と個人情報（こじんじょうほう）の取扱（とりあつか）いについて、正（ただ）しいものはどれか。","ch":["顧客（こきゃく）管理（かんり）とは、データの管理（かんり）ではなく、お客様（きゃくさま）と店（みせ）とのより良（よ）い関係（かんけい）づくりを図（はか）ることである。","顧客（こきゃく）データは店（みせ）の財産（ざいさん）なので、本来（ほんらい）の目的以外（もくてきいがい）にも自由（じゆう）に使（つか）ってよい。","個人情報（こじんじょうほう）の管理（かんり）は本部（ほんぶ）がおこなう仕事（しごと）なので、店舗（てんぽ）責任者（せきにんしゃ）が従業員（じゅうぎょういん）に指導（しどう）・監督（かんとく）をする必要（ひつよう）はない。"],"answer_index":0,"ex":"顧客（こきゃく）管理（かんり）はデータ管理（かんり）だけでなく、積極的（せっきょくてき）にお客様（きゃくさま）と店（みせ）とのより良（よ）い関係（かんけい）づくりを図（はか）ることであり、店舗（てんぽ）管理責任者（かんりせきにんしゃ）の重要（じゅうよう）な職務（しょくむ）です。氏名（しめい）・住所（じゅうしょ）・電話番号（でんわばんごう）など個人（こじん）を特定（とくてい）できる個人情報（こじんじょうほう）は、漏（ろう）えいや紛失（ふんしつ）、従業員（じゅうぎょういん）の不正利用（ふせいりよう）や目的外（もくてきがい）利用（りよう）が起（お）きないよう、ルールを守（まも）るよう指導（しどう）・監督（かんとく）する必要（ひつよう）があります。"}]},{"title":"接客全般 学科 · भाग 3 (p.12–25)","words":[{"subject":"接客全般","type":"学科","source":"接客全般 p.12","tp":"2. 食（は）に関（かん）する知識（ちしき）（1）食物（たべもの）アレルギーについて","q":"食物（たべもの）アレルギーの特定（とくてい）原材料（げんざいりょう）８品目（ひんもく）の組み合（くみあ）わせとして、正（ただ）しいものはどれか。","ch":["卵（たまご）、乳（ちち）、小麦（こむぎ）、そば、落花生（らっかせい）、えび、かに、大豆（だいず）","卵（たまご）、乳（ちち）、小麦（こむぎ）、そば、落花生（らっかせい）、えび、かに、いか","卵（たまご）、乳（ちち）、小麦（こむぎ）、そば、落花生（らっかせい）、えび、かに、くるみ"],"answer_index":2,"ex":"特定（とくてい）原材料（げんざいりょう）８品目（ひんもく）は、卵（たまご）、乳（ちち）、小麦（こむぎ）、そば、落花生（らっかせい）、えび、かに、くるみです。これらが入（いっ）っているメニューを店舗（てんぽ）責任者（せきにんしゃ）が把握（はあく）し、ほかの従業員（じゅうぎょういん）も把握（はあく）しているか確認（かくにん）する必要（ひつよう）があります。大豆（だいず）、いか、米（こめ）は特定（とくてい）原材料（げんざいりょう）８品目（ひんもく）には含（ふく）まれません。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.12","tp":"2. 食（は）に関（かん）する知識（ちしき）（1）食物（たべもの）アレルギーについて","q":"食物（たべもの）アレルギーの情報提供（じょうほうていきょう）について、正（ただ）しいものはどれか。","ch":["メニューや写真（しゃしん）を見（み）ればわかるので、店（みせ）から情報提供（じょうほうていきょう）する必要（ひつよう）はない。","ソースなど見（み）てわからないものやコンタミネーションのおそれがあるものは、店内（てんない）に記載（きさい）・掲示（けいじ）して情報提供（じょうほうていきょう）する。","情報提供（じょうほうていきょう）した内容（ないよう）が誤（あやま）っていたり最新（さいしん）でなかったりしても、お客様（きゃくさま）の自己責任（じこせきにん）であり、店（みせ）が責任（せきにん）を問（と）われることはない。"],"answer_index":1,"ex":"お客様（きゃくさま）は見（み）てわかる食材（しょくざい）は避（さ）けられますが、ソースなど見（み）てもわからないものやコンタミネーションのおそれがあるものは、店（みせ）から記載（きさい）・掲示（けいじ）して情報提供（じょうほうていきょう）することが有効（ゆうこう）です。知（し）らずに食（た）べて発症（はっしょう）すると、最悪（さいあく）の場合（ばあい）アナフィラキシーショックで死亡（しぼう）することもあります。誤（あやま）った情報（じょうほう）や最新（さいしん）でない情報（じょうほう）で事故（じこ）になれば責任問題（せきにんもんだい）となります。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.13","tp":"2. 食（は）に関（かん）する知識（ちしき）（3）消費（しょうひ）期限（きげん）と賞味期限（しょうみきげん）の違（ちが）いについて","q":"消費（しょうひ）期限（きげん）の説明（せつめい）として正（ただ）しいものはどれか。","ch":["開封（かいふう）した後（あと）でも、書（か）かれた期限（きげん）までは安全（あんぜん）が保証（ほしょう）される。","定（さだ）められた方法（ほうほう）で保存（ほぞん）した場合（ばあい）に、期限（きげん）を過（す）ぎても品質（ひんしつ）が保（たも）たれていれば食（た）べてよいことを示（しめ）す期限（きげん）である。","定（さだ）められた方法（ほうほう）で保存（ほぞん）した場合（ばあい）に安全性（あんぜんせい）を欠（か）くおそれがないと認（みと）められる期限（きげん）で、過（す）ぎたものは食（た）べない。"],"answer_index":2,"ex":"消費（しょうひ）期限（きげん）は、定（さだ）められた方法（ほうほう）で保存（ほぞん）した場合（ばあい）に、腐敗（ふはい）・変敗（へんぱい）その他（ほか）の品質（ひんしつ）の劣化（れっか）に伴（ともな）い安全性（あんぜんせい）を欠（か）くおそれがないと認（みと）められる期限（きげん）です。開封（かいふう）前（まえ）の状態（じょうたい）で定（さだ）められた方法（ほうほう）により保存（ほぞん）すれば食品（しょくひん）衛生上（えいせいじょう）の問題（もんだい）が生（しょう）じないもので、過（す）ぎた食品（しょくひん）は食（た）べないようにします。期限（きげん）を過（す）ぎても食（た）べられる場合（ばあい）があるのは賞味期限（しょうみきげん）です。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.13","tp":"2. 食（は）に関（かん）する知識（ちしき）（3）消費（しょうひ）期限（きげん）と賞味期限（しょうみきげん）の違（ちが）いについて","q":"賞味期限（しょうみきげん）の説明（せつめい）として正（ただ）しいものはどれか。","ch":["賞味期限（しょうみきげん）を過（す）ぎた食品（しょくひん）は、必（かなら）ず食（た）べられなくなる。","賞味期限（しょうみきげん）が過（す）ぎた食品（しょくひん）でも、においや見た目（みため）に問題（もんだい）がなければ、お客様（きゃくさま）に提供（ていきょう）してもよいことになっている。","期待（きたい）されるすべての品質（ひんしつ）の保持（ほじ）が可能（かのう）と認（みと）められる期限（きげん）で、過（す）ぎてもすぐ食（た）べられなくなるとは限（かぎ）らない。"],"answer_index":2,"ex":"賞味期限（しょうみきげん）は、定（さだ）められた方法（ほうほう）で保存（ほぞん）した場合（ばあい）に、期待（きたい）されるすべての品質（ひんしつ）の保持（ほじ）が十分（じゅうぶん）に可能（かのう）と認（みと）められる期限（きげん）で、超（こ）えても品質（ひんしつ）が保持（ほじ）されていることがあります。ただし店（みせ）では、消費（しょうひ）期限（きげん）・賞味期限（しょうみきげん）とも過（す）ぎたものをお客様（きゃくさま）に提供（ていきょう）してはいけません。また、期限（きげん）は未開封（みかいふう）の状態（じょうたい）を前提（ぜんてい）としています。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.14","tp":"2. 食（は）に関（かん）する知識（ちしき）（3）消費（しょうひ）期限（きげん）と賞味期限（しょうみきげん）の違（ちが）いについて","q":"店舗（てんぽ）における期限（きげん）表示（ひょうじ）の管理（かんり）について、正（ただ）しいものはどれか。","ch":["消費（しょうひ）期限（きげん）・賞味期限（しょうみきげん）はともに未開封（みかいふう）で決（き）められた保存状態（ほぞんじょうたい）での期限（きげん）で、開封（かいふう）すればメーカーの保証（ほしょう）はなくなる。","消費（しょうひ）期限（きげん）がある食材（しょくざい）より、賞味期限（しょうみきげん）がある食材（しょくざい）のほうを厳（いかめ）しく管理（かんり）する。","賞味期限（しょうみきげん）が過（す）ぎたものは、品質（ひんしつ）が保（たも）たれていればお客様（きゃくさま）に提供（ていきょう）してよいが、消費（しょうひ）期限（きげん）が過（す）ぎたものは提供（ていきょう）できない。"],"answer_index":0,"ex":"消費（しょうひ）期限（きげん）・賞味期限（しょうみきげん）はいずれも未開封（みかいふう）で決（き）められた保存状態（ほぞんじょうたい）での期限（きげん）であり、開封（かいふう）や異（こと）なる保存（ほぞん）をするとメーカーの保証（ほしょう）はなくなります。一度（いちど）開封（かいふう）したものは店（みせ）や会社（かいしゃ）で決（き）めた使用期間（しようきかん）ルールで使用（しよう）します。より厳（いかめ）しく管理（かんり）するのは消費（しょうひ）期限（きげん）がある食材（しょくざい）で、期限（きげん）を過（す）ぎたものはどちらも提供（ていきょう）してはいけません。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.17","tp":"3. 店舗（てんぽ）管理（かんり）に関（かん）する知識（ちしき）（2）清掃（せいそう）作業（さぎょう）（調理場（ちょうりば）以外（いがい））","q":"清掃（せいそう）作業（さぎょう）のポイントとして、正（ただ）しいものはどれか。","ch":["モップは糸（いと）を広（ひろ）げて「８」の字（じ）を描（えが）き、後（うし）ろへ下（さ）がりながら拭（ふ）く。","洗剤（せんざい）は濃（こ）いほど汚（よご）れが落（お）ちるので、希釈（きしゃく）せずに使（つか）う。","窓（まど）ガラスは乾（かわ）いた布（ぬの）だけでふき、スクイジーは使（つか）わない。"],"answer_index":0,"ex":"モップは糸（いと）を広（ひろ）げて「８」の字（じ）を描（えが）き、後（うし）ろへ下（さ）がりながら拭（ふ）くのが正（ただ）しい使い方（つかいかた）です。洗剤（せんざい）は正（ただ）しい希釈（きしゃく）濃度（のうど）で使（つか）い、窓（まど）ガラスはスクイジーを使（つか）って正（ただ）しい手順（てじゅん）でふきます。また、清掃（せいそう）の教育（きょういく）訓練（くんれん）は間違（まちが）った覚（おぼ）え方（ほう）を防（ふせ）ぐため、一番最初（いちばんさいしょ）に店舗（てんぽ）責任者（せきにんしゃ）みずからが指導（しどう）しなければなりません。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.20","tp":"3. 店舗（てんぽ）管理（かんり）に関（かん）する知識（ちしき）（4）レジ操作（そうさ）の重要（じゅうよう）さ","q":"レジを締（し）めたとき、ロール上（うえ）の現金（げんきん）有（あ）り高（たか）より実際（じっさい）の現金（げんきん）有（あ）り高（たか）が多（おお）かった。この状態（じょうたい）の説明（せつめい）として正（ただ）しいものはどれか。","ch":["誤差（ごさ）は必（かなら）ず出（で）るものなので、原因（げんいん）を調（しら）べる必要（ひつよう）はない。","レジの現金（げんきん）が多（おお）いので、店（みせ）にとっては利益（りえき）であり問題（もんだい）はない。","お客様（きゃくさま）に損失（そんしつ）が発生（はっせい）しており、信頼（しんらい）を損（そこ）ねて客数（きゃくすう）を減（へ）らす要因（よういん）になる。"],"answer_index":2,"ex":"実際（じっさい）の現金（げんきん）有（あ）り高（たか）がロール上（うえ）より多（おお）い場合（ばあい）は、代金（だいきん）を多（おお）く受け取（うけと）ったか、釣銭（つりせん）を少（すく）なく渡（わた）したということで、お客様（きゃくさま）に損失（そんしつ）が発生（はっせい）しています。これは信頼（しんらい）を損（そこ）ね客数（きゃくすう）を減（へ）らす要因（よういん）になります。逆（ぎゃく）に実際（じっさい）の現金（げんきん）が少（すく）なければ店（みせ）に損失（そんしつ）が発生（はっせい）します。いずれの場合（ばあい）も原因（げんいん）を調（しら）べる必要（ひつよう）があります。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.24","tp":"（参考（さんこう））サービス基本用語（きほんようご）","q":"「アイドルタイム」の説明（せつめい）として正（ただ）しいものはどれか。","ch":["お客様（きゃくさま）が集中（しゅうちゅう）して来店（らいてん）される時間帯（じかんたい）のこと。","オーダーを承（うけたまわ）ってから料理（りょうり）が提供（ていきょう）されるまでの時間（じかん）のことで、目安（めやす）は５分（ふん）～７分（ふん）である。","客数（きゃくすう）の少（すく）ない時間帯（じかんたい）のことで、サイドワークや教育（きょういく）トレーニングを実施（じっし）する。"],"answer_index":2,"ex":"アイドルタイムは客数（きゃくすう）の少（すく）ない時間帯（じかんたい）で、ピークタイムの反対（はんたい）の言葉（ことば）です。外食産業（がいしょくさんぎょう）では食事時（しょくじどき）間（かん）がピークとなるため、その合間（あいま）がアイドルタイムとなり、人件費（じんけんひ）を削減（さくげん）し、サイドワークや教育（きょういく）トレーニングを実施（じっし）します。お客様（きゃくさま）が集中（しゅうちゅう）する時間帯（じかんたい）はピークタイムです。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.24","tp":"（参考（さんこう））サービス基本用語（きほんようご）","q":"「サービングタイム」の説明（せつめい）として正（ただ）しいものはどれか。","ch":["お客様（きゃくさま）が入店（にゅうてん）してから席（せき）にご案内（あんない）するまでの時間（じかん）のこと。","オーダーを承（うけたまわ）ってから料理（りょうり）が提供（ていきょう）されるまでの時間（じかん）で、ファミリーレストランの目安（めやす）はランチタイム５分（ふん）～７分（ふん）、ディナー１２分（ふん）～１５分（ふん）である。","オーダーを承（うけたまわ）ってから料理（りょうり）が提供（ていきょう）されるまでの時間（じかん）で、ファミリーレストランの目安（めやす）はランチタイム１２分（ふん）～１５分（ふん）、ディナー５分（ふん）～７分（ふん）である。"],"answer_index":1,"ex":"サービングタイムは、オーダーを承（うけたまわ）ってから料理（りょうり）が提供（ていきょう）されるまでの時間（じかん）です。通常（つうじょう）、ファミリーレストランではランチタイム５分（ふん）～７分（ふん）、ディナー１２分（ふん）～１５分（ふん）が目安（めやす）で、ランチとディナーの数値（すうち）が逆（ぎゃく）の選択肢（せんたくし）は誤（あやま）りです。売上（うりあげ）予測（よそく）に基（もと）づく適正（てきせい）な仕込（しこ）み量（りょう）と準備作業（じゅんびさぎょう）の徹底（てってい）が決め手（きめて）となります。"},{"subject":"接客全般","type":"学科","source":"接客全般 p.25","tp":"（参考（さんこう））サービス基本用語（きほんようご）","q":"「同時（どうじ）同（どう）卓（たく）提供（ていきょう）」の説明（せつめい）として正（ただ）しいものはどれか。","ch":["同一（どういつ）テーブルのお客様（きゃくさま）がオーダーした複数（ふくすう）のメイン料理（りょうり）を、同時（どうじ）に提供（ていきょう）すること。","複数（ふくすう）のテーブルのお客様（きゃくさま）がオーダーした料理（りょうり）を、同（おな）じタイミングでまとめて提供（ていきょう）すること。","同（おな）じ料理（りょうり）を注文（ちゅうもん）したお客様（きゃくさま）にだけ、同時（どうじ）に提供（ていきょう）すること。"],"answer_index":0,"ex":"同時（どうじ）同（どう）卓（たく）提供（ていきょう）とは、同一（どういつ）テーブルのお客様（きゃくさま）がオーダーした複数（ふくすう）のメイン料理（りょうり）を同時（どうじ）にテーブルに提供（ていきょう）することです。一（ひと）つでも料理（りょうり）が遅（おそ）くなると食（た）べるタイミングがずれ、連（つ）れのお客様（きゃくさま）全員（ぜんいん）に迷惑（めいわく）がかかり、店側（みせがわ）でも客席（きゃくせき）回転数（かいてんすう）がダウンします。"}]},{"title":"接客全般 実技 · भाग 1 (p.8–13)","words":[{"subject":"接客全般","type":"実技","source":"接客全般 p.8","tp":"１．（２）接客（せっきゃく）における基本動作（きほんどうさ）（お辞儀（じぎ））","q":"お辞儀（じぎ）のトレーニングで『出迎（でむか）え３歩（ほ）、見送（みおく）り７歩（ほ）』を実行（じっこう）する。1組（く）のお客様（きゃくさま）に対（たい）する歩数（ほすう）の組み合（くみあ）わせと合計（ごうけい）として正（ただ）しいものはどれか。","ch":["出迎（でむか）え7歩（ほ）、見送（みおく）り3歩（ほ）、合計（ごうけい）10歩（ほ）","出迎（でむか）え3歩（ほ）、見送（みおく）り5歩（ほ）、合計（ごうけい）8歩（ほ）","出迎（でむか）え3歩（ほ）、見送（みおく）り7歩（ほ）、合計（ごうけい）10歩（ほ）"],"answer_index":2,"ex":"テキストは『出迎（でむか）え３歩（ほ）、見送（みおく）り７歩（ほ）』と示（しめ）している。3歩（ほ）＋7歩（ほ）＝10歩（ほ）が合計（ごうけい）。見送（みおく）りを長（なが）くするのは、来店（らいてん）に対（たい）する感謝（かんしゃ）の心（こころ）を添（そ）えるためである。出迎（でむか）えを7歩（ほ）、見送（みおく）りを3歩（ほ）とするのは順序（じゅんじょ）が逆（ぎゃく）で誤（あやま）り。","jt":"計画立案"},{"subject":"接客全般","type":"実技","source":"接客全般 p.10","tp":"1. 接客（せっきゃく）に関（かん）する知識（ちしき）（4）配慮（はいりょ）が必要（ひつよう）なお客様（きゃくさま）への対応（たいおう）","q":"車椅子（くるまいす）のお客様（きゃくさま）が入口（いりぐち）に来店（らいてん）された。店内（てんない）はいくつかの席（せき）が空（あ）いている。店長（てんちょう）としてとるべき対応（たいおう）はどれか。","ch":["空（あ）いている席（せき）のうち、出入（でい）りがしやすい入口（いりぐち）に一番近（いちばんちか）い席（せき）へ、必（かなら）ずご案内（あんない）するように決（き）めておく。","車椅子（くるまいす）のままでは危（あぶ）ないので、店（みせ）の椅子（いす）に座（すわ）り替（か）えていただく。","どのテーブルが車椅子（くるまいす）に対応（たいおう）できるかを日（にち）ごろから確認（かくにん）しておき、そのテーブルへご案内（あんない）する。"],"answer_index":2,"ex":"ハンディキャップを持（も）っている方（ほう）や配慮（はいりょ）が必要（ひつよう）な方（ほう）には、言（い）われなくとも見（み）て判断（はんだん）できる場合（ばあい）は率先（そっせん）して対応（たいおう）することが必要（ひつよう）です。どのテーブルが車椅子（くるまいす）に対応（たいおう）できるかを事前（じぜん）に確認（かくにん）しておき、そのテーブルへご案内（あんない）します。入口（いりぐち）に近（ちか）いという理由（りゆう）だけで席（せき）を決（き）めたり、座（すわ）り替（か）えを求（もと）めたりするのは適切（てきせつ）ではありません。","jt":"判断試験"},{"subject":"接客全般","type":"実技","source":"接客全般 p.10","tp":"1. 接客（せっきゃく）に関（かん）する知識（ちしき）（4）配慮（はいりょ）が必要（ひつよう）なお客様（きゃくさま）への対応（たいおう）","q":"補助（ほじょ）犬（いぬ）を連（つ）れたお客様（きゃくさま）が来店（らいてん）された。店長（てんちょう）としてとるべき対応（たいおう）はどれか。","ch":["ほかのお客様（きゃくさま）の迷惑（めいわく）になり、衛生上（えいせいじょう）も問題（もんだい）があるので、補助（ほじょ）犬（いぬ）に同伴（どうはん）されたお客様（きゃくさま）の入店（にゅうてん）はお断（ことわ）りする。","補助（ほじょ）犬（いぬ）同伴（どうはん）のお客様（きゃくさま）に適（てき）したテーブルを日（にち）ごろから確認（かくにん）しておき、そのテーブルへご案内（あんない）する。","空（あ）いていればどの席（せき）でもよいので、早（はや）く座（すわ）っていただく。"],"answer_index":1,"ex":"配慮（はいりょ）が必要（ひつよう）なお客様（きゃくさま）には率先（そっせん）して対応（たいおう）します。テキストでは、どのテーブルが補助（ほじょ）犬（いぬ）同伴（どうはん）のお客様（きゃくさま）に適（てき）しているか確認（かくにん）しておくこととされています。入店（にゅうてん）を断（ことわ）る、犬（いぬ）だけを外（そと）につなぐ、席（せき）を考（かんが）えずに案内（あんない）する対応（たいおう）は誤（あやま）りです。","jt":"判断試験"},{"subject":"接客全般","type":"実技","source":"接客全般 p.10","tp":"1. 接客（せっきゃく）に関（かん）する知識（ちしき）（4）配慮（はいりょ）が必要（ひつよう）なお客様（きゃくさま）への対応（たいおう）","q":"客席（きゃくせき）を見回（みまわ）ったところ、あるテーブルの下（くだ）と通路（つうろ）が濡（ぬ）れていて、食材（しょくざい）のゴミも落（お）ちていた。まだお客様（きゃくさま）は食事中（しょくじちゅう）である。店長（てんちょう）としてとるべき対応（たいおう）はどれか。","ch":["お客様（きゃくさま）が食事中（しょくじちゅう）なので、お帰（かえ）りになってから閉店（へいてん）後（のち）にまとめて清掃（せいそう）するよう指示（しじ）する。","「足元（あしもと）にご注意（ちゅうい）ください」と声（こえ）をかけるだけにする。","転倒（てんとう）防止（ぼうし）のため、すぐに拭（ふ）き取（と）り、落（お）ちているゴミを取り除（とりのぞ）くよう指示（しじ）する。"],"answer_index":2,"ex":"配慮（はいりょ）が必要（ひつよう）なお客様（きゃくさま）への対応（たいおう）として、テーブルの下（した）や通路（つうろ）が濡（ぬ）れていたり、油（あぶら）汚（よご）れや食材（しょくざい）ゴミが落（お）ちていたりしないか確認（かくにん）することが求（もと）められます。これは転倒（てんとう）防止（ぼうし）のためであり、気（き）づいた時点（じてん）ですぐに対応（たいおう）する必要（ひつよう）があります。後回（あとまわ）しや声掛（こえか）けだけでは危険（きけん）が残（のこ）ります。","jt":"判断試験"},{"subject":"接客全般","type":"実技","source":"接客全般 p.10","tp":"１．（５）適切（てきせつ）な配膳（はいぜん）（サービング）について","q":"大人（おとな）2名（めい）と子（こ）ども1名（めい）のテーブルの料理（りょうり）が出来上（できあ）がった。このお客様（きゃくさま）は食後（しょくご）に持ち帰（もちかえ）るテイクアウト商品（しょうひん）も注文（ちゅうもん）している。配膳（はいぜん）とお渡（わた）しの計画（けいかく）として正（ただ）しいものはどれか。","ch":["大人（おとな）の料理（りょうり）を先（さき）に出（だ）し、子（こ）どもの料理（りょうり）を最後（さいご）に出（だ）し、テイクアウトは料理（りょうり）と一緒（いっしょ）に渡（わた）す","子（こ）どもの料理（りょうり）を一番先（いちばんさき）に出（だ）し、大人（おとな）の料理（りょうり）はほぼ同時（どうじ）に出（だ）し、テイクアウトは帰（かえ）る直前（ちょくぜん）に渡（わた）す","出来上（できあ）がった料理（りょうり）から1品（ひん）ずつ順（じゅん）に出（だ）し、テイクアウトは注文（ちゅうもん）を受（う）けたときにすぐお渡（わた）しする"],"answer_index":1,"ex":"配膳（はいぜん）の順序（じゅんじょ）は お子（こ）様（よう）の料理（りょうり） → 大人（おとな）の料理（りょうり）（ほぼ同時（どうじ））→ お帰（かえ）りの直前（ちょくぜん）にテイクアウト商品（しょうひん）、となる。同（おな）じテーブルのお客様（きゃくさま）へはほぼ同時（どうじ）に提供（ていきょう）し、同時（どうじ）提供（ていきょう）であってもお子（こ）様（よう）の料理（りょうり）を一番先（いちばんさき）に配膳（はいぜん）する。テイクアウト商品（しょうひん）は帰（かえ）る直前（ちょくぜん）にお渡（わた）しし、消費（しょうひ）期限（きげん）も必（かなら）ず伝（つた）える。","jt":"計画立案"},{"subject":"接客全般","type":"実技","source":"接客全般 p.11","tp":"１．（７）サービスの優先順位（ゆうせんじゅんい）","q":"接客（せっきゃく）の人員（じんいん）が少（すく）ない時間帯（じかんたい）に、次（つぎ）の3つの業務（ぎょうむ）が同時（どうじ）に発生（はっせい）した。ア 出来上（できあ）がった料理（りょうり）の提供（ていきょう）、イ レジで待（ま）つお客様（きゃくさま）の精算（せいさん）、ウ 入口（いりぐち）で待（ま）つお客様（きゃくさま）のご案内（あんない）。どの順（じゅん）で処理（しょり）する計画（けいかく）が正（ただ）しいか。","ch":["ア → イ → ウ","イ → ア → ウ","ウ → ア → イ"],"answer_index":0,"ex":"サービスの優先順位（ゆうせんじゅんい）は①料理（りょうり）提供（ていきょう）②レジ精算（せいさん）③ご案内（あんない）④注文（ちゅうもん）受（う）け⑤デザート・ドリンクの提供（ていきょう）⑥下（さ）げ。よってア（料理（りょうり）提供（ていきょう））→イ（レジ精算（せいさん））→ウ（ご案内（あんない））となる。料理（りょうり）提供（ていきょう）が最優先（さいゆうせん）なのは、待（ま）たせすぎると料理（りょうり）が冷（さ）めて美味（おい）しさが低下（ていか）するため。レジ精算（せいさん）が2番目（ばんめ）なのは、声掛（こえか）けで待（ま）ってもらえるためである。","jt":"計画立案"},{"subject":"接客全般","type":"実技","source":"接客全般 p.11","tp":"１．（７）サービスの優先順位（ゆうせんじゅんい）","q":"ピークタイムに、次（つぎ）の4つの業務（ぎょうむ）が同時（どうじ）に発生（はっせい）した。ア 注文（ちゅうもん）受（う）け、イ 食（た）べ終（お）わった食器（しょっき）の下（さ）げ、ウ デザートの提供（ていきょう）、エ 出来上（できあ）がった料理（りょうり）の提供（ていきょう）。正（ただ）しい処理順（しょりじゅん）はどれか。","ch":["ア → エ → ウ → イ","エ → ア → ウ → イ","エ → ウ → ア → イ"],"answer_index":1,"ex":"優先順位（ゆうせんじゅんい）は①料理（りょうり）提供（ていきょう）②レジ精算（せいさん）③ご案内（あんない）④注文（ちゅうもん）受（う）け⑤デザート・ドリンクの提供（ていきょう）⑥下（さ）げ。この4つを並（なら）べるとエ（料理（りょうり）提供（ていきょう））→ア（注文（ちゅうもん）受（う）け）→ウ（デザート提供（ていきょう））→イ（下（さ）げ）になる。注文（ちゅうもん）受（う）けはデザート提供（ていきょう）より先（さき）、下（さ）げは最後（さいご）である。","jt":"計画立案"},{"subject":"接客全般","type":"実技","source":"接客全般 p.12","tp":"2. 食（は）に関（かん）する知識（ちしき）（1）食物（たべもの）アレルギーについて","q":"お客様（きゃくさま）から「このハンバーグのソースに卵（たまご）は使（つか）っていますか」と聞（き）かれたが、担当（たんとう）の従業員（じゅうぎょういん）は分（わ）からなかった。店長（てんちょう）としてとるべき対応（たいおう）はどれか。","ch":["料理（りょうり）に使用（しよう）している原材料（げんざいりょう）・食材（しょくざい）を正（ただ）しく確認（かくにん）したうえで、正確（せいかく）な情報（じょうほう）をお客様（きゃくさま）に伝（つた）える。","見た目（みため）では分（わ）からないので、「たぶん入（いっ）っていないと思（おも）います」とお答（こた）えして注文（ちゅうもん）を受（う）ける。","少量（しょうりょう）なら問題（もんだい）ないので、「気（き）にしなくてよい」とお伝（つた）えする。"],"answer_index":0,"ex":"料理（りょうり）に使用（しよう）されている原材料（げんざいりょう）・食材（しょくざい）を正（ただ）しく把握（はあく）し、お客様（きゃくさま）からの問合（といあわ）せに対応（たいおう）できるようにしておくことが重要（じゅうよう）です。ソースなど見（み）てわからないものは特（とく）に注意（ちゅうい）が必要（ひつよう）で、あいまいな回答（かいとう）は危険（きけん）です。誤（あやま）った情報（じょうほう）や最新（さいしん）でない情報（じょうほう）で事故（じこ）になった場合（ばあい）は責任問題（せきにんもんだい）となり、最悪（さいあく）の場合（ばあい）アナフィラキシーショックにつながります。","jt":"判断試験"},{"subject":"接客全般","type":"実技","source":"接客全般 p.12","tp":"1. 接客（せっきゃく）に関（かん）する知識（ちしき）（8）顧客（こきゃく）管理（かんり）（カスタマーリレーションズ）","q":"予約（よやく）台帳（だいちょう）には、お客様（きゃくさま）の氏名（しめい）と電話番号（でんわばんごう）が書（か）かれています。アルバイトが「常連（じょうれん）のお客様（きゃくさま）に個人的（こじんてき）に連絡（れんらく）したい」と言（い）って、台帳（だいちょう）をスマートフォンで撮影（さつえい）しようとしていました。店長（てんちょう）としてとるべき対応（たいおう）はどれか。","ch":["常連（じょうれん）のお客様（きゃくさま）なので、本人（ほんにん）が喜（よろこ）ぶと考（かんが）えて撮影（さつえい）を認（みと）める","本来（ほんらい）の目的以外（もくてきいがい）の利用（りよう）にあたるため、撮影（さつえい）をやめさせて指導（しどう）する","顧客（こきゃく）データは店（みせ）のものなので、従業員（じゅうぎょういん）は自由（じゆう）に使（つか）ってよいと伝（つた）える"],"answer_index":1,"ex":"顧客（こきゃく）データに氏名（しめい）、住所（じゅうしょ）、電話番号（でんわばんごう）など個人（こじん）を特定（とくてい）できる「個人情報（こじんじょうほう）」が含（ふく）まれる場合（ばあい）は、漏（ろう）えいや紛失（ふんしつ）、従業員（じゅうぎょういん）による不正利用（ふせいりよう）や本来（ほんらい）の目的以外（もくてきいがい）での利用（りよう）などが発生（はっせい）しないよう、十分（じゅうぶん）に注意（ちゅうい）する必要（ひつよう）があります。そのため、従業員（じゅうぎょういん）にルールを守（まも）るよう指導（しどう）・監督（かんとく）することが重要（じゅうよう）です。顧客（こきゃく）管理（かんり）は、お客様（きゃくさま）と店（みせ）とのより良（よ）い関係（かんけい）づくりのためにおこなうものです。","jt":"判断試験"},{"subject":"接客全般","type":"実技","source":"接客全般 p.12","tp":"２．（１）食物（たべもの）アレルギーについて","q":"お客様（きゃくさま）から「小麦（こむぎ）が食（た）べられません」と申し出（もうしで）があった。注文（ちゅうもん）を受（う）けるまでの手順（てじゅん）の順番（じゅんばん）として正（ただ）しいものはどれか。","ch":["① 原材料（げんざいりょう）を調（しら）べる ② 混入（こんにゅう）のおそれも伝（つた）える ③ 確認（かくにん）してから注文（ちゅうもん）を受（う）ける","① 先（さき）に注文（ちゅうもん）を受（う）ける ② 料理（りょうり）を提供（ていきょう）する ③ 提供（ていきょう）した後（あと）で原材料（げんざいりょう）を調（しら）べる","① メニュー表（おもて）だけ見（み）せる ② お客様（きゃくさま）の判断（はんだん）にまかせる ③ そのまま注文（ちゅうもん）を受（う）ける"],"answer_index":0,"ex":"手順（てじゅん）は ①料理（りょうり）に使用（しよう）されている原材料（げんざいりょう）・食材（しょくざい）の確認（かくにん） → ②ソースなど見（み）てもわからないものやコンタミネーション（混入（こんにゅう））のおそれの説明（せつめい） → ③確認（かくにん）した内容（ないよう）で注文（ちゅうもん）受（う）け、の順（じゅん）になる。食物（たべもの）アレルギーは最悪（さいあく）の場合（ばあい）アナフィラキシーショックを起（お）こす。誤（あやま）った情報（じょうほう）を伝（つた）えて事故（じこ）になると責任問題（せきにんもんだい）となる。","jt":"計画立案"},{"subject":"接客全般","type":"実技","source":"接客全般 p.13","tp":"2. 食（は）に関（かん）する知識（ちしき）（1）食物（たべもの）アレルギーについて","q":"そばアレルギーのお客様（きゃくさま）から「うどんなら食（た）べられますか」と聞（き）かれた。この店（みせ）では、そばとうどんを同（おな）じ釜（かま）でゆでている。とるべき対応（たいおう）はどれか。","ch":["うどんにそばは入（いっ）っていないので、「大丈夫（だいじょうぶ）です」とお答（こた）えする。","責任（せきにん）を持（も）てないので何（なに）も答（こた）えず、注文（ちゅうもん）だけを受（う）ける。","そばと同（おな）じ釜（かま）でゆでていることをお客様（きゃくさま）に伝（つた）え、判断（はんだん）していただく。"],"answer_index":2,"ex":"そばとうどんを同（おな）じ釜（かま）でゆでている店舗（てんぽ）では、そのことをお客様（きゃくさま）に伝（つた）える必要（ひつよう）があります。コンタミネーション（混入（こんにゅう））のおそれがあるためで、「大丈夫（だいじょうぶ）」と答（こた）えるのは誤（あやま）りです。誤（あやま）った情報提供（じょうほうていきょう）で事故（じこ）になった場合（ばあい）は責任問題（せきにんもんだい）となることがあります。","jt":"判断試験"},{"subject":"接客全般","type":"実技","source":"接客全般 p.13","tp":"2. 食（は）に関（かん）する知識（ちしき）（2）お酒（さけ）の取扱（とりあつか）いについて","q":"車（くるま）で来店（らいてん）した4人（にん）のお客様（きゃくさま）のうち、運転（うんてん）をする方（ほう）が「少（すこ）しだけならビールを飲（の）みたい」と言（い）っている。とるべき対応（たいおう）はどれか。","ch":["少量（しょうりょう）なら問題（もんだい）ないので、提供（ていきょう）する。","ご本人（ほんにん）が希望（きぼう）されているので、飲酒（いんしゅ）後（のち）の運転（うんてん）は自己責任（じこせきにん）であることを伝（つた）えたうえで提供（ていきょう）する。","運転（うんてん）される方（ほう）にはお酒（さけ）を提供（ていきょう）できないことをお伝（つた）えし、ソフトドリンクをおすすめする。"],"answer_index":2,"ex":"未成年者（みせいねんしゃ）や車両（しゃりょう）などの運転者（うんてんしゃ）には、お酒（さけ）を提供（ていきょう）しないよう注意（ちゅうい）する必要（ひつよう）があります。量（りょう）が少（すく）ない、本人（ほんにん）の希望（きぼう）である、時間（じかん）をおくといった理由（りゆう）で提供（ていきょう）してよいことにはなりません。代（か）わりにソフトドリンクをすすめる対応（たいおう）が適切（てきせつ）です。","jt":"判断試験"}]},{"title":"接客全般 実技 · भाग 2 (p.14–22)","words":[{"subject":"接客全般","type":"実技","source":"接客全般 p.14","tp":"2. 食（は）に関（かん）する知識（ちしき）（4）味覚（みかく）について","q":"お客様（きゃくさま）から「このスープ、味（あじ）がいつもとおかしい」と言（い）われた。店長（てんちょう）としてとるべき対応（たいおう）はどれか。","ch":["すぐに新（あたら）しいものを作（つく）らせるだけで、原因（げんいん）は調（しら）べない。","自分（じぶん）で味（あじ）を確認（かくにん）し、作（つく）った従業員（じゅうぎょういん）に工程（こうてい）を確認（かくにん）する。","作（つく）った従業員（じゅうぎょういん）を、その場（ば）でお客様（きゃくさま）の前（まえ）で注意（ちゅうい）する。"],"answer_index":1,"ex":"味（あじ）がおかしいとクレームがあった場合（ばあい）は、自分（じぶん）で味（あじ）を確認（かくにん）し、作（つく）った従業員（じゅうぎょういん）に工程（こうてい）を確認（かくにん）します。問題（もんだい）があった場合（ばあい）は原因（げんいん）を見（み）つけ、再発（さいはつ）防止（ぼうし）のため問題点（もんだいてん）を店内（てんない）で共有（きょうゆう）します。原因（げんいん）を調（しら）べない対応（たいおう）や、お客様（きゃくさま）の前（まえ）で従業員（じゅうぎょういん）を注意（ちゅうい）する対応（たいおう）は適切（てきせつ）ではありません。","jt":"判断試験"},{"subject":"接客全般","type":"実技","source":"接客全般 p.14","tp":"2. 食（は）に関（かん）する知識（ちしき）（5）食（しょく）の多様化（たようか）について","q":"ムスリム（イスラム教（きょう））のお客様（きゃくさま）が来店（らいてん）された。店長（てんちょう）としてとるべき対応（たいおう）はどれか。","ch":["食（た）べられないものを確認（かくにん）してから料理（りょうり）を提供（ていきょう）し、食材（しょくざい）にアルコールはかけない。","香（かお）りづけに使（つか）うアルコールはごく少量（しょうりょう）なので、確認（かくにん）せずそのまま使（つか）って調理（ちょうり）する。","肉（にく）を使（つか）っていなければ問題（もんだい）ないので、確認（かくにん）はせず野菜（やさい）料理（りょうり）だけをおすすめする。"],"answer_index":0,"ex":"ハラール（イスラム圏（けん）での原材料（げんざいりょう）基準（きじゅん））ではアルコールは使（つか）えないため、食材（しょくざい）にアルコールをかけることはできません。また、ムスリムやベジタリアンなどのお客様（きゃくさま）が来店（らいてん）したときは、できるだけそのお客様（きゃくさま）が食（た）べられないものを確認（かくにん）してから料理（りょうり）を提供（ていきょう）することが望（のぞ）まれます。少量（しょうりょう）ならよいという判断（はんだん）は誤（あやま）りです。","jt":"判断試験"},{"subject":"接客全般","type":"実技","source":"接客全般 p.14-15","tp":"３．（１）開店（かいてん）準備（じゅんび）、閉店（へいてん）作業（さぎょう）","q":"開店時（かいてんじ）刻（こく）は午前（ごぜん）11時（とき）00分（ふん）である。客席（きゃくせき）と調理（ちょうり）設備（せつび）の開店（かいてん）準備（じゅんび）の計画（けいかく）として正（ただ）しいものはどれか。","ch":["客席（きゃくせき）は最初（さいしょ）に照明（しょうめい）とBGMを入（い）れ、フライヤーやグリドルは10時（とき）45分（ふん）に点火（てんか）する","客席（きゃくせき）は最初（さいしょ）にテーブルをふき、フライヤーやグリドルは11時（とき）00分（ふん）に点火（てんか）する","客席（きゃくせき）は最初（さいしょ）に空調機（くうちょうき）の電源（でんげん）を入（い）れ、フライヤーやグリドルは10時（とき）30分（ふん）に点火（てんか）する"],"answer_index":2,"ex":"客席（きゃくせき）の開店（かいてん）準備（じゅんび）は最初（さいしょ）に空調機（くうちょうき）の電源（でんげん）を入（い）れる。店内（てんない）の温度（おんど）を上（あ）げたり下（さ）げたりするには時間（じかん）がかかるためである。フライヤー、グリドル、湯煎（ゆせん）は使（つか）えるようになるまで時間（じかん）がかかるので開店（かいてん）30分前（ふんまえ）、つまり11時（とき）00分（ふん）−30分（ふん）＝10時（とき）30分（ふん）に点火（てんか）する。","jt":"計画立案"},{"subject":"接客全般","type":"実技","source":"接客全般 p.15","tp":"3. 店舗（てんぽ）管理（かんり）に関（かん）する知識（ちしき）（1）開店（かいてん）準備（じゅんび）、閉店（へいてん）作業（さぎょう）","q":"11時（とき）に開店（かいてん）する店（みせ）で、10時（とき）に出勤（しゅっきん）した。開店（かいてん）準備（じゅんび）の進め方（すすめかた）として正（ただ）しいものはどれか。","ch":["最初（さいしょ）に空調機（くうちょうき）の電源（でんげん）を入（い）れ、フライヤーやグリドルなどは開店（かいてん）３０分前（ふんまえ）にスイッチを入（い）れる。","客席（きゃくせき）の空調（くうちょう）は開店（かいてん）の直前（ちょくぜん）に入（い）れれば十分（じゅうぶん）に間に合（まにあ）うので、開店（かいてん）準備（じゅんび）の一番最後（いちばんさいご）におこなえばよい。","フライヤーやグリドルは、開店（かいてん）と同時（どうじ）にスイッチを入（い）れる。"],"answer_index":0,"ex":"客席（きゃくせき）では、開店（かいてん）準備（じゅんび）の最初（さいしょ）に空調機（くうちょうき）の電源（でんげん）を入（い）れます。店内（てんない）の温度（おんど）を上（あ）げ下（さ）げするには時間（じかん）がかかるためです。フライヤー、グリドル、湯煎（ゆせん）などは使用（しよう）できるようになるまで時間（じかん）がかかるので、開店（かいてん）３０分前（ふんまえ）にスイッチを入（い）れたり点火（てんか）したりします。BGMや照明（しょうめい）は開店時（かいてんじ）間（かん）までに作動（さどう）させます。","jt":"計画立案"},{"subject":"接客全般","type":"実技","source":"接客全般 p.15","tp":"3. 店舗（てんぽ）管理（かんり）に関（かん）する知識（ちしき）（1）開店（かいてん）準備（じゅんび）、閉店（へいてん）作業（さぎょう）","q":"開店（かいてん）30分前（ふんまえ）になっても、シフトに入（いっ）っている従業員（じゅうぎょういん）が1名出（ないで）勤（つとむ）しておらず、連絡（れんらく）もない。店長（てんちょう）としてとるべき対応（たいおう）はどれか。","ch":["すぐに電話（でんわ）で確認（かくにん）し、欠勤（けっきん）であればほかの従業員（じゅうぎょういん）に連絡（れんらく）して出勤（しゅっきん）を要請（ようせい）する。","本人（ほんにん）から連絡（れんらく）が来（く）るまでこちらからは何（なに）もせず、開店（かいてん）してから対応（たいおう）を考（かんが）える。","開店時（かいてんじ）間（かん）を30分（ふん）遅（おく）らせて、その従業員（じゅうぎょういん）が出勤（しゅっきん）してくるのを店（みせ）で待（ま）つ。"],"answer_index":0,"ex":"開店（かいてん）準備（じゅんび）では、予定（よてい）どおりの従業員（じゅうぎょういん）が出勤（しゅっきん）しているか確認（かくにん）し、来（き）ていない従業員（じゅうぎょういん）にはすぐ電話（でんわ）で確認（かくにん）します。欠勤（けっきん）の場合（ばあい）は、ほかの従業員（じゅうぎょういん）に連絡（れんらく）をして出勤（しゅっきん）を要請（ようせい）します。連絡（れんらく）を待（ま）つだけの対応（たいおう）や、開店（かいてん）を遅（おく）らせる対応（たいおう）は示（しめ）されていません。","jt":"計画立案"},{"subject":"接客全般","type":"実技","source":"接客全般 p.15","tp":"3. 店舗（てんぽ）管理（かんり）に関（かん）する知識（ちしき）（1）開店（かいてん）準備（じゅんび）、閉店（へいてん）作業（さぎょう）","q":"閉店（へいてん）後（のち）のレジ締（し）めで、現金（げんきん）が1,000円（えん）不足（ふそく）していた。店長（てんちょう）としてとるべき対応（たいおう）はどれか。","ch":["不足（ふそく）が出（で）た原因（げんいん）を調（しら）べる。","翌日（よくじつ）の売上（うりあげ）に足（た）して調整（ちょうせい）する。","その日（にち）のレジ担当者（たんとうしゃ）に、不足分（ふそくぶん）を支払（しはら）わせる。"],"answer_index":0,"ex":"閉店（へいてん）作業（さぎょう）では、レジ締（し）めで不足（ふそく）又（また）は過（か）金（きん）が出（で）た場合（ばあい）、その原因（げんいん）を調（しら）べているか確認（かくにん）します。誤差（ごさ）は、受け取（うけと）るべき代金（だいきん）や渡（わた）すべき釣銭（つりせん）の金額（きんがく）が誤（あやま）っていたことを意味（いみ）するため、原因（げんいん）を調（しら）べないまま処理（しょり）してはいけません。","jt":"判断試験"},{"subject":"接客全般","type":"実技","source":"接客全般 p.15","tp":"３．（１）開店（かいてん）準備（じゅんび）、閉店（へいてん）作業（さぎょう）","q":"閉店（へいてん）作業（さぎょう）をおこなう。ア 火（ひ）の元（もと）の安全確認（あんぜんかくにん）、イ ラストオーダーのタイミングをキッチンの担当者（たんとうしゃ）と確認（かくにん）、ウ レジ締（し）め、エ セキュリティー装置（そうち）のセット。正（ただ）しい順（したが）はどれか。","ch":["イ → ウ → ア → エ","ウ → イ → ア → エ","イ → ア → ウ → エ"],"answer_index":0,"ex":"閉店（へいてん）作業（さぎょう）はラストオーダーの確認（かくにん）→レジ締（し）め→翌日（よくじつ）への持ち越（もちこ）し食材（しょくざい）の処理（しょり）→火（ひ）の元（もと）の安全確認（あんぜんかくにん）→セキュリティー装置（そうち）のセットの順（じゅん）でおこなう。よってイ→ウ→ア→エ。ラストオーダーは営業中（えいぎょうちゅう）に調整（ちょうせい）するので最初（さいしょ）、セキュリティーのセットは店（みせ）を出（で）るときなので最後（さいご）になる。","jt":"計画立案"},{"subject":"接客全般","type":"実技","source":"接客全般 p.20","tp":"4. クレーム対応（たいおう）に関（かん）する知識（ちしき）（1）お客様（きゃくさま）からのクレームへの対応（たいおう）","q":"ランチのピークタイム中（なか）、新人（しんじん）の従業員（じゅうぎょういん）から「お客様（きゃくさま）に『料理（りょうり）が注文（ちゅうもん）と違（ちが）う』と小（ちい）さな声（こえ）で言（い）われました」と報告（ほうこく）があった。店長（てんちょう）としてとるべき対応（たいおう）はどれか。","ch":["店長（てんちょう）が迅速（じんそく）に直接（ちょくせつ）そのテーブルまで行（い）き、対応（たいおう）する。","小（ちい）さな苦情（くじょう）なので、報告（ほうこく）した新人（しんじん）に任（まか）せて自分（じぶん）は作業（さぎょう）を続（つづ）ける。","ピークタイムが終（お）わってから、そのテーブルに行（い）く。"],"answer_index":0,"ex":"クレームへの基本的（きほんてき）な対応（たいおう）では、どんな小（ちい）さな苦情（くじょう）でも部下（ぶか）から報告（ほうこく）させ、店長（てんちょう）が迅速（じんそく）に直接（ちょくせつ）テーブルまで行（い）って対応（たいおう）します。後回（あとまわ）しにしたり、新人（しんじん）に任（まか）せたりするのは誤（あやま）りです。クレームは店（みせ）の質的（しつてき）改善（かいぜん）につながる材料（ざいりょう）でもあります。","jt":"判断試験"},{"subject":"接客全般","type":"実技","source":"接客全般 p.20","tp":"4. クレーム対応（たいおう）に関（かん）する知識（ちしき）（1）お客様（きゃくさま）からのクレームへの対応（たいおう）","q":"料理（りょうり）の提供（ていきょう）が遅（おく）れたことでお客様（きゃくさま）から苦情（くじょう）を受（う）け、その場（ば）で担当者（たんとうしゃ）と店長（てんちょう）がお詫（わ）びをした。会計（かいけい）が終（お）わり、お客様（きゃくさま）が帰（かえ）ろうとしている。店長（てんちょう）としてとるべき対応（たいおう）はどれか。","ch":["お帰（かえ）りの際（さい）にもう一度（いちど）、担当者（たんとうしゃ）と店長（てんちょう）が丁重（ていちょう）にお詫（わ）びし、お見送（みおく）りをする。","お詫（わ）びの代（か）わりに、次回（じかい）使（つか）える割引券（わりびきけん）を必（かなら）ずお渡（わた）しする。","苦情（くじょう）を受（う）けたお客様（きゃくさま）には話（はな）しかけないほうがよいので、担当者（たんとうしゃ）を裏（うら）に下（さ）げる。"],"answer_index":0,"ex":"実際（じっさい）に苦情（くじょう）が発生（はっせい）した場合（ばあい）は、お帰（かえ）りの際（さい）にもう一度（いちど）、担当者（たんとうしゃ）と店長（てんちょう）が丁重（ていちょう）にお詫（わ）びし、お見送（みおく）りをします。何（なに）も言（い）わずに見送（みおく）る、担当者（たんとうしゃ）を隠（かく）すという対応（たいおう）は誤（あやま）りです。割引券（わりびきけん）などの対応（たいおう）は店（みせ）のルールで決（き）まっている場合（ばあい）に従（したが）うもので、必（かなら）ず渡（わた）すものではありません。","jt":"判断試験"},{"subject":"接客全般","type":"実技","source":"接客全般 p.20","tp":"3. 店舗（てんぽ）管理（かんり）に関（かん）する知識（ちしき）（5）夜間（やかん）金庫（きんこ）の対応（たいおう）","q":"閉店（へいてん）後（のち）、レジ締（し）めが終（お）わり、売上金（うりあげきん）を夜間（やかん）金庫（きんこ）に入金（にゅうきん）することになった。従業員（じゅうぎょういん）はすでに全員（ぜんいん）帰（かえ）り、店長（てんちょう）一人（ひとり）が残（のこ）っている。正（ただ）しい対応（たいおう）はどれか。","ch":["一人（ひとり）で運（はこ）んでも問題（もんだい）ないので、そのまま売上金（うりあげきん）を夜間（やかん）金庫（きんこ）へ持（も）っていく。","翌朝（よくちょう）に持（も）っていくことにして、売上金（うりあげきん）は今夜（こんや）はレジの中（なか）に入（い）れたままにする。","防犯（ぼうはん）のため必（かなら）ず二人（ふたり）でおこなう必要（ひつよう）があるので、もう一人（ひとり）と一緒（いっしょ）に入金（にゅうきん）する。"],"answer_index":2,"ex":"売上金（うりあげきん）は原則（げんそく）夜間（やかん）金庫（きんこ）に入金（にゅうきん）します。閉店（へいてん）後（のち）レジ締（し）めをおこない、所定（しょてい）のバッグに現金（げんきん）と入金票（にゅうきんひょう）を入（い）れて投入（とうにゅう）しますが、この時（とき）は防犯（ぼうはん）のため必（かなら）ず二人（ふたり）でおこないます。また、翌日（よくじつ）用（よう）の釣銭（つりせん）は夜間（やかん）金庫（きんこ）ではなく店内（てんない）金庫（きんこ）に保管（ほかん）します。","jt":"判断試験"},{"subject":"接客全般","type":"実技","source":"接客全般 p.20","tp":"３．（５）夜間（やかん）金庫（きんこ）の対応（たいおう）","q":"閉店（へいてん）後（のち）のレジ締（し）めで、レジの中（なか）の現金（げんきん）は185,000円（えん）だった。翌日（よくじつ）用（よう）の釣銭（つりせん）30,000円（えん）は店内（てんない）金庫（きんこ）に残（のこ）す。夜間（やかん）金庫（きんこ）の作業（さぎょう）の計画（けいかく）として正（ただ）しいものはどれか。","ch":["185,000円（えん）を入金票（にゅうきんひょう）とともにバッグに入（い）れ、二人（ふたり）で夜間（やかん）金庫（きんこ）に入（い）れる","155,000円（えん）を入金票（にゅうきんひょう）とともにバッグに入（い）れ、一人（ひとり）で夜間（やかん）金庫（きんこ）に入（い）れる","155,000円（えん）を入金票（にゅうきんひょう）とともにバッグに入（い）れ、二人（ふたり）で夜間（やかん）金庫（きんこ）に入（い）れる"],"answer_index":2,"ex":"185,000円（えん）−30,000円（えん）＝155,000円（えん）が夜間（やかん）金庫（きんこ）に入（い）れる金額（きんがく）。翌日（よくじつ）用（よう）の釣銭（つりせん）は店内（てんない）金庫（きんこ）に保管（ほかん）する。所定（しょてい）のバッグに現金（げんきん）と入金票（にゅうきんひょう）を入（い）れて投入（とうにゅう）し、この作業（さぎょう）は防犯（ぼうはん）のため必（かなら）ず二人（ふたり）でおこなう。","jt":"計画立案"},{"subject":"接客全般","type":"実技","source":"接客全般 p.22","tp":"4. クレーム対応（たいおう）に関（かん）する知識（ちしき）（2）異物（いぶつ）混入（こんにゅう）発生時（はっせいじ）の対応（たいおう）","q":"お客様（きゃくさま）から「料理（りょうり）に髪の毛（かみのけ）が入（いっ）っている」と申し出（もうしで）があった。事実（じじつ）を確認（かくにん）し、すぐにお詫（わ）びをした。次（つぎ）にとるべき対応（たいおう）はどれか。","ch":["伝票（でんぴょう）をキャンセルし、何（なに）も言（い）わずにお客様（きゃくさま）をお見送（みおく）りする。","お客様（きゃくさま）に作り直（つくりなお）してよいか確認（かくにん）しないまま、すぐに新（あたら）しい料理（りょうり）を作り直（つくりなお）して、お詫（わ）びとともにお出（だ）しする。","まず作り直（つくりなお）してよいか確認（かくにん）し、作り直（つくりなお）し不要（ふよう）と言（い）われれば伝票（でんぴょう）をキャンセルする対応（たいおう）を素早（すばや）くおこなう。"],"answer_index":2,"ex":"異物（いぶつ）混入（こんにゅう）では、事実（じじつ）を確認（かくにん）したらすぐにお詫（わ）びし、お客様（きゃくさま）にはまず作り直（つくりなお）してよいか確認（かくにん）します。作り直（つくりなお）し不要（ふよう）と言（い）われれば伝票（でんぴょう）をキャンセルする対応（たいおう）を素早（すばや）くおこないます。それ以上（いじょう）の対応（たいおう）が店（みせ）のルールで決（き）まっている場合（ばあい）はそれに従（したが）います。また、どこで混入（こんにゅう）したかを調（しら）べ、従業員（じゅうぎょういん）の身（み）だしなみを確認（かくにん）して再発（さいはつ）を防（ふせ）ぎます。","jt":"判断試験"}]},{"title":"接客全般 実技 · भाग 3 (p.22–24)","words":[{"subject":"接客全般","type":"実技","source":"接客全般 p.22","tp":"4. クレーム対応（たいおう）に関（かん）する知識（ちしき）（2）異物（いぶつ）混入（こんにゅう）発生時（はっせいじ）の対応（たいおう）","q":"お客様（きゃくさま）の料理（りょうり）に短（みじか）い毛（け）が入（いっ）っていた。髪の毛（かみのけ）ではないようである。店長（てんちょう）としてとるべき対応（たいおう）はどれか。","ch":["何（なん）の毛（け）であるか、また混入（こんにゅう）した経緯（けいい）を調（しら）べて特定（とくてい）し、再発（さいはつ）防止（ぼうし）を全（ぜん）従業員（じゅうぎょういん）に周知（しゅうち）する。","まつげや眉毛（まゆげ）は防（ふせ）ぐことができないので、記録（きろく）を残（のこ）すだけで原因（げんいん）の調査（ちょうさ）は終（お）わりにする。","その日（にち）に調理（ちょうり）を担当（たんとう）した従業員（じゅうぎょういん）だけに注意（ちゅうい）し、ほかの従業員（じゅうぎょういん）には伝（つた）えない。"],"answer_index":0,"ex":"髪の毛（かみのけ）以外（いがい）（まつげ、眉毛（まゆげ）、体毛（たいもう）など）でも、何（なん）の毛（け）であるか、また混入（こんにゅう）した経緯（けいい）を調（しら）べて特定（とくてい）し、再発（さいはつ）防止（ぼうし）を全（ぜん）従業員（じゅうぎょういん）に周知（しゅうち）します。責任（せきにん）を否定（ひてい）したり、担当者（たんとうしゃ）だけに伝（つた）えたりするのは誤（あやま）りです。クレームの大半（たいはん）は異物（いぶつ）混入（こんにゅう）で、とりわけ多（おお）いのが髪の毛（かみのけ）の混入（こんにゅう）です。","jt":"判断試験"},{"subject":"接客全般","type":"実技","source":"接客全般 p.22","tp":"4. クレーム対応（たいおう）に関（かん）する知識（ちしき）（2）異物（いぶつ）混入（こんにゅう）発生時（はっせいじ）の対応（たいおう）","q":"厨房（ちゅうぼう）に捕虫（ほちゅう）器（き）がある店（みせ）で点検（てんけん）したところ、捕虫（ほちゅう）器（き）のランプが切（き）れており、さらにランプの光（ひかり）が厨房（ちゅうぼう）の外（そと）からも見（み）えることが分（わ）かった。とるべき対応（たいおう）はどれか。","ch":["ランプを交換（こうかん）し、捕虫（ほちゅう）器（き）の光（ひかり）が厨房（ちゅうぼう）以外（いがい）から見（み）えないようにする。","ランプが切（き）れているほうが虫（むし）を集（あつ）めないので、そのままにする。","光（ひかり）が外（そと）から見（み）えるほうが虫（むし）を引（ひ）き寄（よ）せられるので、そのままにする。"],"answer_index":0,"ex":"異物（いぶつ）混入（こんにゅう）で髪の毛（かみのけ）の次（つぎ）に多（おお）いのは虫（むし）の混入（こんにゅう）です。捕虫（ほちゅう）器（き）を設置（せっち）している場合（ばあい）はランプが切（き）れていないか確認（かくにん）し、厨房（ちゅうぼう）の捕虫（ほちゅう）器（き）のランプが厨房（ちゅうぼう）以外（いがい）から見（み）えていないか確認（かくにん）します。光（ひかり）が外（そと）から見（み）えていると、逆（ぎゃく）に虫（むし）を外（そと）から誘引（ゆういん）してしまいます。","jt":"判断試験"},{"subject":"接客全般","type":"実技","source":"接客全般 p.22","tp":"5. 緊急時（きんきゅうじ）の対応（たいおう）に関（かん）する知識（ちしき）（1）体調不良（たいちょうふりょう）者（もの）が発生（はっせい）した場合（ばあい）の対応（たいおう）","q":"客席（きゃくせき）でお客様（きゃくさま）が倒（たお）れた。一人（ひとり）で来店（らいてん）されており、声（こえ）をかけても意識（いしき）がない。とるべき対応（たいおう）はどれか。","ch":["すぐに抱（だ）き起（お）こして、ほかのお客様（きゃくさま）の目（め）に触（ふ）れない店（みせ）の裏（うら）の休憩室（きゅうけいしつ）まで運（はこ）んで休（やす）ませる。","意識（いしき）が戻（もど）るまで、そのまま様子（ようす）を見（み）る。","すぐに救急車（きゅうきゅうしゃ）を呼（よ）び、むやみに抱（だ）き起（お）こさず、そのままの状態（じょうたい）で待機（たいき）する。"],"answer_index":2,"ex":"体調不良（たいちょうふりょう）者（もの）が発生（はっせい）した場合（ばあい）、同伴者（どうはんしゃ）がいなければ、意識（いしき）がある場合（ばあい）はご本人（ほんにん）の意思（いし）に従（したが）い、意識（いしき）がない場合（ばあい）はすぐに救急車（きゅうきゅうしゃ）を呼（よ）びます。また、むやみに抱（だ）き起（お）こさず、そのままの状態（じょうたい）で待機（たいき）します。運（はこ）んだり水（みず）を飲（の）ませたりする対応（たいおう）は誤（あやま）りです。","jt":"判断試験"},{"subject":"接客全般","type":"実技","source":"接客全般 p.23","tp":"5. 緊急時（きんきゅうじ）の対応（たいおう）に関（かん）する知識（ちしき）（1）体調不良（たいちょうふりょう）者（もの）が発生（はっせい）した場合（ばあい）の対応（たいおう）","q":"客席（きゃくせき）でお客様（きゃくさま）が急（きゅう）に倒（たお）れ、心（こころ）停止（ていし）を起（お）こしたと思（おも）われる。店（みせ）にはAEDが設置（せっち）されている。とるべき対応（たいおう）はどれか。","ch":["救急車（きゅうきゅうしゃ）を呼（よ）び、到着（とうちゃく）するまではお客様（きゃくさま）に触（ふ）れずに、そのまま何（なに）もしないで待（ま）つ。","AED（自動（じどう）体外（たいがい）式（しき）除（じょ）細動（さいどう）器（き））をすぐに当（あ）て、同時（どうじ）に救急車（きゅうきゅうしゃ）を呼（よ）ぶ。","AEDは医師（いし）しか使（つか）えないので、使（つか）わずに待（ま）つ。"],"answer_index":1,"ex":"心（こころ）停止（ていし）を起（お）こしたお客様（きゃくさま）にはAED（自動（じどう）体外（たいがい）式（しき）除（じょ）細動（さいどう）器（き））をすぐに当（あ）て、同時（どうじ）に救急車（きゅうきゅうしゃ）を呼（よ）びます。そのため、AEDの使い方（つかいかた）の訓練（くんれん）を定期的（ていきてき）に実施（じっし）しておく必要（ひつよう）があります。なお、てんかん発作（ほっさ）で倒（たお）れたお客様（きゃくさま）には付（つ）き添（そ）いの方（ほう）の指示（しじ）に従（したが）い、付（つ）き添（そ）いがいない場合（ばあい）はすぐに救急車（きゅうきゅうしゃ）を呼（よ）びます。","jt":"判断試験"},{"subject":"接客全般","type":"実技","source":"接客全般 p.24","tp":"（参考（さんこう））サービス基本用語（きほんようご）（サービングタイム）","q":"ディナータイムの18時（とき）40分（ふん）に、お客様（きゃくさま）から料理（りょうり）の注文（ちゅうもん）を受（う）けた。ファミリーレストランのサービングタイムの目安（めやす）に従（したが）うと、遅（おそ）くとも何時（なんじ）までに料理（りょうり）を提供（ていきょう）すべきか。","ch":["18時（とき）47分（ふん）まで","18時（とき）55分（ふん）まで","19時（とき）05分（ふん）まで"],"answer_index":1,"ex":"ディナーのサービングタイムの目安（めやす）は12分（ふん）〜15分（ふん）。18時（とき）40分（ふん）＋15分（ふん）＝18時（とき）55分（ふん）が最（もっと）も遅（おそ）い提供（ていきょう）時刻（じこく）。18時（とき）47分（ふん）はランチの目安（めやす）（5分（ふん）〜7分（ふん））で計算（けいさん）した誤（あやま）り。19時（とき）05分（ふん）は25分（わ）かかることになり、目安（めやす）を大（おお）きく超（こ）える。","jt":"計画立案"},{"subject":"接客全般","type":"実技","source":"接客全般 p.24","tp":"（参考（さんこう））サービス基本用語（きほんようご）（サービングタイム）","q":"ランチタイムの12時（とき）10分（ふん）に、お客様（きゃくさま）から料理（りょうり）の注文（ちゅうもん）を受（う）けた。サービングタイムの目安（めやす）どおりに提供（ていきょう）するとき、提供（ていきょう）時刻（じこく）はいつからいつまでの間（ま）になるか。","ch":["12時（とき）12分（わ）から12時（とき）14分（ふん）の間（かん）","12時（とき）22分（わ）から12時（とき）25分（ふん）の間（かん）","12時（とき）15分（わ）から12時（とき）17分（ふん）の間（かん）"],"answer_index":2,"ex":"ランチのサービングタイムの目安（めやす）は5分（ふん）〜7分（ふん）。12時（とき）10分（ふん）＋5分（ふん）＝12時（とき）15分（ふん）、12時（とき）10分（ふん）＋7分（ふん）＝12時（とき）17分（ふん）となる。12時（とき）22分（わ）から12時（とき）25分（ふん）はディナーの目安（めやす）（12分（ふん）〜15分（ふん））を使（つか）った誤（あやま）り。12時（とき）12分（わ）から12時（とき）14分（ふん）は目安（めやす）より短（みじか）い。","jt":"計画立案"},{"subject":"接客全般","type":"実技","source":"接客全般 p.24","tp":"（参考（さんこう））サービス基本用語（きほんようご）（サービングタイム）","q":"ランチタイムの12時（とき）05分（ふん）に注文（ちゅうもん）を受（う）けた料理（りょうり）が、12時（とき）14分（ふん）に提供（ていきょう）された。サービングタイムの目安（めやす）と比（くら）べた評価（ひょうか）として正（ただ）しいものはどれか。","ch":["9分（わ）かかり、目安（めやす）の上限（じょうげん）より2分遅（ふんちが）い","7分（わ）かかり、目安（めやす）のとおりである","9分（わ）かかり、目安（めやす）の上限（じょうげん）より4分遅（ふんちが）い"],"answer_index":0,"ex":"12時（とき）14分（ふん）−12時（とき）05分（ふん）＝9分（わ）かかっている。ランチの目安（めやす）は5分（ふん）〜7分（ふん）なので、上限（じょうげん）の7分（ふん）と比（くら）べて9分（ふん）−7分（ふん）＝2分（ふん）の遅（おく）れとなる。9分（ふん）−5分（ふん）＝4分（ふん）は下限（かげん）との差（さ）であり、遅（おく）れの評価（ひょうか）には使（つか）わない。","jt":"計画立案"},{"subject":"接客全般","type":"実技","source":"接客全般 p.24","tp":"（参考（さんこう））サービス基本用語（きほんようご）（客席（きゃくせき）レイアウト）","q":"客席（きゃくせき）は4人（にん）掛（か）けテーブルが10卓（たく）（40席（せき））ある。18時（とき）からの予約（よやく）は4名（めい）が2組（くみ）、2名（めい）が3組（くみ）である。1組（く）に1卓（たく）を使（つか）うとき、予約（よやく）で使（つか）う卓（たく）数（かず）と、予約（よやく）以外（いがい）に使（つか）える卓（たく）数（かず）はいくつか。","ch":["予約（よやく）4卓（たく）、予約（よやく）以外（いがい）に使（つか）えるのは6卓（たく）","予約（よやく）7卓（たく）、予約（よやく）以外（いがい）に使（つか）えるのは3卓（たく）","予約（よやく）5卓（たく）、予約（よやく）以外（いがい）に使（つか）えるのは5卓（たく）"],"answer_index":2,"ex":"4名（めい）2組（くみ）で2卓（たく）、2名（めい）3組（くみ）で3卓（たく）、2卓（たく）＋3卓（たく）＝5卓（たく）が予約（よやく）で使（つか）う卓（たく）数（かず）。10卓（たく）−5卓（たく）＝5卓（たく）が予約（よやく）以外（いがい）に使（つか）える。人数（にんずう）の合計（ごうけい）14名（めい）を4で割（さ）って4卓（たく）とするのは、2名（めい）でも1卓（たく）を使（つか）うことを忘（わす）れた誤（あやま）り。客席（きゃくせき）稼働率（かどうりつ）を高（たか）めるには、利用客（りようきゃく）の人数（にんずう）に合（あ）わせた席（せき）の割り振（わりふ）りが重要（じゅうよう）である。","jt":"計画立案"},{"subject":"接客全般","type":"実技","source":"接客全般 p.24-25","tp":"（参考（さんこう））サービス基本用語（きほんようご）（同時（どうじ）同（どう）卓（たく）提供（ていきょう）・客席（きゃくせき）回転数（かいてんすう））","q":"4人（にん）掛（か）けテーブルが10卓（たく）ある。ディナーは18時（とき）00分（わ）から21時（とき）00分（ふん）までで、1組（く）の平均（へいきん）滞在時間（たいざいじかん）は45分（ふん）、お帰（かえ）り後（のち）の片付（かたづ）けとテーブルセッティングに15分（わ）かかる。受け入（うけい）れられる組数（くみすう）はいくつか。","ch":["1卓（たく）3組（くみ）、店（みせ）全体（ぜんたい）で30組（くみ）","1卓（たく）4組（くみ）、店（みせ）全体（ぜんたい）で40組（くみ）","1卓（たく）2組（くみ）、店（みせ）全体（ぜんたい）で20組（くみ）"],"answer_index":0,"ex":"1組（く）にかかる時間（じかん）は45分（ふん）＋15分（ふん）＝60分（ふん）。18時（とき）から21時（とき）までは180分（ふん）なので、180分（ふん）÷60分（ふん）＝3組（くみ）が1卓（たく）の受入（うけいれ）数（かず）。10卓（たく）×3組（くみ）＝30組（くみ）が店（みせ）全体（ぜんたい）の受入（うけいれ）数（かず）となる。片付（かたづ）けとセッティングの15分（ふん）を数（かぞ）えないと180分（ふん）÷45分（ふん）＝4組（くみ）（40組（くみ））となり、計画（けいかく）を誤（あやま）る。","jt":"計画立案"},{"subject":"接客全般","type":"実技","source":"接客全般 p.24-25","tp":"（参考（さんこう））サービス基本用語（きほんようご）（ピークタイム・アイドルタイム）","q":"ランチのピークタイムは11時（とき）30分（わ）から13時（とき）00分（ふん）、アイドルタイムは14時（とき）00分（わ）から17時（とき）00分（ふん）である。1日（にち）の作業（さぎょう）計画（けいかく）として正（ただ）しいものはどれか。","ch":["仕込（しこ）みと点検（てんけん）補充（ほじゅう）と清掃（せいそう）はすべて13時（とき）00分（ふん）までに終（お）え、教育（きょういく）トレーニングは11時（とき）30分（わ）からおこなう","仕込（しこ）みと点検（てんけん）補充（ほじゅう）と清掃（せいそう）は11時（とき）30分（ふん）までに終（お）え、教育（きょういく）トレーニングは14時（とき）から17時（とき）におこなう","仕込（しこ）みと点検（てんけん）補充（ほじゅう）と清掃（せいそう）は14時（とき）00分（ふん）までに終（お）え、教育（きょういく）トレーニングは17時以降（じいこう）におこなう"],"answer_index":1,"ex":"時間（じかん）の並（なら）びは 仕込（しこ）み・点検（てんけん）補充（ほじゅう）・清掃（せいそう）（11時（とき）30分（ふん）まで）→ ピークタイム11時（とき）30分（ふん）〜13時（とき）00分（ふん） → アイドルタイム14時（とき）00分（ふん）〜17時（とき）00分（ふん）に教育（きょういく）トレーニング、となる。これらの作業（さぎょう）はピークタイム前（まえ）に完了（かんりょう）し、お客様（きゃくさま）を迎（むか）える必要（ひつよう）がある。アイドルタイムは客数（きゃくすう）の少（すく）ない時間帯（じかんたい）で、サイドワークや教育（きょういく）トレーニングを実施（じっし）する。","jt":"計画立案"}]},{"title":"衛生管理 学科 · भाग 1 (p.5–11)","words":[{"subject":"衛生管理","type":"学科","source":"衛生管理 p.5","tp":"1. 食品（しょくひん）衛生（えいせい）の現状（げんじょう）（1）食品（しょくひん）衛生（えいせい）法（ほう）の目的（もくてき）","q":"食品（しょくひん）衛生（えいせい）法（ほう）の第一（だいいち）条（じょう）に書（か）かれている目的（もくてき）として、正（ただ）しいものはどれか。","ch":["食品（しょくひん）の価格（かかく）の急（きゅう）な変動（へんどう）をおさえ、消費者（しょうひしゃ）の家計（かけい）の負担（ふたん）を軽（かる）くすること","国内（こくない）の食品（しょくひん）の生産量（せいさんりょう）を増（ふ）やし、食料（しょくりょう）を安定（あんてい）して供給（きょうきゅう）できる体制（たいせい）を作（つく）ること","飲食（いんしょく）に起因（きいん）する衛生上（えいせいじょう）の危害（きがい）の発生（はっせい）を防止（ぼうし）し、国民（こくみん）の健康（けんこう）の保護（ほご）を図（はか）ること"],"answer_index":2,"ex":"食品（しょくひん）衛生（えいせい）法（ほう）第一（だいいち）条（じょう）は、その目的（もくてき）を「飲食（いんしょく）に起因（きいん）する衛生上（えいせいじょう）の危害（きがい）の発生（はっせい）を防止（ぼうし）し、国民（こくみん）の健康（けんこう）の保護（ほご）を図（はか）ること」と明記（めいき）しています。生産量（せいさんりょう）、価格（かかく）、輸出（ゆしゅつ）はこの法律（ほうりつ）の目的（もくてき）ではありません。食品（しょくひん）等（など）事業者（じぎょうしゃ）は、この法律（ほうりつ）に定（さだ）められた内容（ないよう）をしっかり守（まも）る必要（ひつよう）があります。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.5","tp":"1. 食品（しょくひん）衛生（えいせい）の現状（げんじょう）（2）食中毒（しょくちゅうどく）の発生（はっせい）状況（じょうきょう）","q":"令和（れいわ）4年（ねん）の食中毒（しょくちゅうどく）で、事件（じけん）数（かず）がもっとも多（おお）かった病因（びょういん）物質（ぶっしつ）はどれか。","ch":["ノロウイルス","アニサキス","カンピロバクター"],"answer_index":1,"ex":"令和（れいわ）4年（ねん）の全（ぜん）事件（じけん）数（かず）962件（けん）のうち、多（おお）い順（じゅん）に①アニサキス566件（けん）、②カンピロバクター185件（けん）、③ノロウイルス63件（けん）でした。ノロウイルスは患者数（かんじゃすう）では1位（くらい）ですが、事件（じけん）数（かず）では3位（くらい）です。サルモネラ属（ぞく）菌（きん）は事件（じけん）数（かず）の上位（じょうい）3位（くらい）に入（いっ）っていません。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.7","tp":"2. 食品（しょくひん）衛生（えいせい）管理（かんり）の基本（きほん）（1）食中毒（しょくちゅうどく）予防（よぼう）の3原則（げんそく）","q":"食中毒（しょくちゅうどく）予防（よぼう）の3原則（げんそく）の組み合（くみあ）わせとして、正（ただ）しいものはどれか。","ch":["つけない・増（ふ）やさない・やっつける","洗（あら）う・冷（ひ）やす・捨（す）てる","見（み）ない・触（ふ）らない・持ち込（もちこ）まない"],"answer_index":0,"ex":"食中毒（しょくちゅうどく）予防（よぼう）の3原則（げんそく）は「つけない・増（ふ）やさない・やっつける」です。この原則（げんそく）は、一般的（いっぱんてき）な衛生（えいせい）管理（かんり）やHACCPに沿（そ）った衛生（えいせい）管理（かんり）の基礎（きそ）にもなります。整理（せいり）・整頓（せいとん）・清掃（せいそう）は5S活動（かつどう）の一部（いちぶ）であり、3原則（げんそく）ではありません。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.7","tp":"2. 食品（しょくひん）衛生（えいせい）管理（かんり）の基本（きほん）（1）食中毒（しょくちゅうどく）予防（よぼう）の3原則（げんそく）","q":"腸管（ちょうかん）出血性（しゅっけつせい）大腸菌（だいちょうきん）（O157）やノロウイルスの「少量（しょうりょう）感染（かんせん）」の説明（せつめい）として、正（ただ）しいものはどれか。","ch":["菌（きん）やウイルスが1個（こ）から5個（こ）程度（ていど）あれば、それだけで必（かなら）ず感染（かんせん）する","10個（こ）から100個（こ）程度（ていど）の少（すく）ない量（りょう）を摂取（せっしゅ）するだけで感染（かんせん）する","1万個（まんこ）以上（いじょう）をまとめて摂取（せっしゅ）しなければ、感染（かんせん）することはない"],"answer_index":1,"ex":"テキストでは、O157やノロウイルスなどは10個（こ）から100個（こ）程度（ていど）の少（すく）ない量（りょう）を摂取（せっしゅ）するだけで感染（かんせん）し、これを「少量（しょうりょう）感染（かんせん）」と説明（せつめい）しています。そのため3原則（げんそく）のうち「つけない」対策（たいさく）が特（とく）に重要（じゅうよう）になります。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.7","tp":"2. 食品（しょくひん）衛生（えいせい）管理（かんり）の基本（きほん）（1）食中毒（しょくちゅうどく）予防（よぼう）の3原則（げんそく）","q":"「増（ふ）やさない」についての説明（せつめい）として、誤（あやま）っているものはどれか。","ch":["保存（ほぞん）する食品（しょくひん）は低温（ていおん）（10℃以下（いか））あるいは高温（こうおん）（60℃以上（いじょう））で保管（ほかん）する","細菌（さいきん）にとって最適（さいてき）な温度（おんど）や時間（じかん）を与（あた）えないことが重要（じゅうよう）である","ウイルスも食品（しょくひん）中（なか）で増（ふ）えるので、この原則（げんそく）はウイルスにも当（あ）てはまる"],"answer_index":2,"ex":"ウイルスは食品（しょくひん）中（なか）で増（ふ）えないため、「増（ふ）やさない」の原則（げんそく）は適用（てきよう）できません。細菌（さいきん）は食品（しょくひん）を一定時間以上（いっていじかんいじょう）室温（しつおん）に放置（ほうち）すると増殖（ぞうしょく）するので、低温（ていおん）（10℃以下（いか））または高温（こうおん）（60℃以上（いじょう））での保管（ほかん）、冷蔵（れいぞう）・冷凍庫（れいとうこ）の温度（おんど）確認（かくにん）、迅速（じんそく）な処理（しょり）が有効（ゆうこう）です。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.8","tp":"2. 食品（しょくひん）衛生（えいせい）管理（かんり）の基本（きほん）（2）5S活動（かつどう）の衛生（えいせい）管理（かんり）への応用（おうよう）","q":"衛生（えいせい）管理（かんり）の5S活動（かつどう）を構成（こうせい）する5つの言葉（ことば）として、正（ただ）しいものはどれか。","ch":["整理（せいり）・整頓（せいとん）・清掃（せいそう）・洗浄（せんじょう）・消毒（しょうどく）","整理（せいり）・整頓（せいとん）・清掃（せいそう）・清潔（せいけつ）・習慣（しゅうかん）","整理（せいり）・整頓（せいとん）・洗浄（せんじょう）・記録（きろく）・点検（てんけん）"],"answer_index":1,"ex":"5S活動（かつどう）は①整理（せいり）（Seiri）②整頓（せいとん）（Seiton）③清掃（せいそう）（Seisou）④清潔（せいけつ）（Seiketsu）⑤習慣（しゅうかん）（Syukan）の5つで構成（こうせい）されます。ローマ字（じ）の頭文字（かしらもじ）がすべてSなので5Sといいます。洗浄（せんじょう）・消毒（しょうどく）は清掃（せいそう）の中（なか）でおこなう作業（さぎょう）であり、5Sの項目名（こうもくめい）ではありません。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.8","tp":"2. 食品（しょくひん）衛生（えいせい）管理（かんり）の基本（きほん）（2）5S活動（かつどう）の衛生（えいせい）管理（かんり）への応用（おうよう）","q":"5S活動（かつどう）の「整頓（せいとん）」の説明（せつめい）として、正（ただ）しいものはどれか。","ch":["不要（ふよう）なものを処分（しょぶん）し、必要（ひつよう）なものは個数（こすう）を明確（めいかく）にする","必要（ひつよう）なものを必要（ひつよう）な時（とき）に必要（ひつよう）な量（りょう）だけ取り出（とりだ）せるように、定（さだ）めた場所（ばしょ）に保管（ほかん）する","ルールやマニュアルを設（もう）けて教育（きょういく）訓練（くんれん）し、清潔（せいけつ）が維持（いじ）されるようにする"],"answer_index":1,"ex":"「整頓（せいとん）」は、必要（ひつよう）なものを必要（ひつよう）な時（とき）に必要（ひつよう）な量（りょう）だけ取り出（とりだ）せるように定位置（ていいち）に保管（ほかん）することです。くり返（かえ）し使（つか）う用具（ようぐ）は使（つか）った後（のち）に必（かなら）ず定位置（ていいち）に戻（もど）します。選択肢（せんたくし）1は整理（せいり）、2は清掃（せいそう）、4は習慣（しゅうかん）の説明（せつめい）です。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.9","tp":"3. HACCPに沿（そ）った衛生（えいせい）管理（かんり）（1）「HACCPに沿（そ）った衛生（えいせい）管理（かんり）」の制度化（せいどか）","q":"食品（しょくひん）衛生（えいせい）法（ほう）が定（さだ）める「HACCPに沿（そ）った衛生（えいせい）管理（かんり）」の基準（きじゅん）は、2つの基準（きじゅん）で構成（こうせい）されている。その2つとして正（ただ）しいものはどれか。","ch":["容器（ようき）包装（ほうそう）への食品（しょくひん）表示（ひょうじ）の基準（きじゅん）と、原材料（げんざいりょう）の産地（さんち）を表示（ひょうじ）するための基準（きじゅん）","店舗（てんぽ）の客席（きゃくせき）の面積（めんせき）の基準（きじゅん）と、調理（ちょうり）設備（せつび）の台数（だいすう）を決（き）めるための基準（きじゅん）","一般的（いっぱんてき）な衛生（えいせい）管理（かんり）の基準（きじゅん）と、重要（じゅうよう）な工程（こうてい）を管理（かんり）するための取組（とりくみ）の基準（きじゅん）"],"answer_index":2,"ex":"基準（きじゅん）は、すべての食品（しょくひん）等（など）事業者（じぎょうしゃ）が守（まも）る「施設（しせつ）の内外（ないがい）の清潔（せいけつ）保持（ほじ）などの一般的（いっぱんてき）な衛生（えいせい）管理（かんり）の基準（きじゅん）」と、「食品（しょくひん）衛生上（えいせいじょう）の危害（きがい）の発生（はっせい）を防止（ぼうし）するために特（とく）に重要（じゅうよう）な工程（こうてい）を管理（かんり）するための取組（とりくみ）の基準（きじゅん）」の2つで構成（こうせい）されます。表示（ひょうじ）、労働時間（ろうどうじかん）、店舗面積（てんぽめんせき）はこの基準（きじゅん）の構成要素（こうせいようそ）ではありません。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.9","tp":"3. HACCPに沿（そ）った衛生（えいせい）管理（かんり）（2）すべての営業者（えいぎょうしゃ）が実施（じっし）しなければならないこと","q":"「HACCPに沿（そ）った衛生（えいせい）管理（かんり）」で、すべての営業者（えいぎょうしゃ）がおこなわなければならないこととして、誤（あやま）っているものはどれか。","ch":["衛生（えいせい）管理（かんり）計画（けいかく）や手順書（てじゅんしょ）の効果（こうか）を定期的（ていきてき）に検証（けんしょう）し、必要（ひつよう）に応（おう）じて見直（みなお）す","衛生（えいせい）管理（かんり）計画（けいかく）を作成（さくせい）し、従業員（じゅうぎょういん）に周知徹底（しゅうちてってい）を図（はか）る","自分（じぶん）の店（みせ）の衛生（えいせい）管理（かんり）計画（けいかく）を保健所（ほけんしょ）に代（か）わりに作（つく）ってもらう"],"answer_index":2,"ex":"営業者（えいぎょうしゃ）がおこなうことは、①衛生（えいせい）管理（かんり）計画（けいかく）の作成（さくせい）と従業員（じゅうぎょういん）への周知徹底（しゅうちてってい）、②必要（ひつよう）に応（おう）じた手順書（てじゅんしょ）の作成（さくせい）、③記録（きろく）と保存（ほぞん）、④定期的（ていきてき）な検証（けんしょう）と見直（みなお）しの4つです。計画（けいかく）は営業者（えいぎょうしゃ）みずからが作成（さくせい）するもので、保健所（ほけんしょ）に作（つく）ってもらうものではありません。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.10","tp":"3. HACCPに沿（そ）った衛生（えいせい）管理（かんり）（4）重要（じゅうよう）工程（こうてい）管理（かんり）の取組（とりく）みのための基準（きじゅん）","q":"HACCP7原則（げんそく）の「重要（じゅうよう）管理（かんり）点（てん）の決定（けってい）」の説明（せつめい）として、正（ただ）しいものはどれか。","ch":["モニタリングの結果（けっか）、管理（かんり）基準（きじゅん）を逸脱（いつだつ）した場合（ばあい）の改善（かいぜん）措置（そち）を決（き）めること","措置（そち）の内容（ないよう）の効果（こうか）を定期的（ていきてき）に検証（けんしょう）する手順（てじゅん）を定（さだ）めること","危害（きがい）要因（よういん）を防止（ぼうし）・排除（はいじょ）・低減（ていげん）するために管理（かんり）措置（そち）が不可欠（ふかけつ）な工程（こうてい）を特定（とくてい）すること"],"answer_index":2,"ex":"「重要（じゅうよう）管理（かんり）点（てん）の決定（けってい）」は、特定（とくてい）された危害（きがい）要因（よういん）の発生（はっせい）の防止（ぼうし）、排除（はいじょ）又（また）は許容（きょよう）できる水準（すいじゅん）にまで低減（ていげん）するために管理（かんり）措置（そち）を講（こう）ずることが不可欠（ふかけつ）な工程（こうてい）を特定（とくてい）することです。選択肢（せんたくし）1は危害（きがい）要因（よういん）の分析（ぶんせき）、2は改善（かいぜん）措置（そち）の設定（せってい）、3は検証（けんしょう）方法（ほうほう）の設定（せってい）の説明（せつめい）です。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.11","tp":"4. 一般的（いっぱんてき）な衛生（えいせい）管理（かんり）の基準（きじゅん）14項目（こうもく）の詳細（しょうさい）（1）食品（しょくひん）衛生（えいせい）責任者（せきにんしゃ）などの選任（せんにん）","q":"食品（しょくひん）衛生（えいせい）責任者（せきにんしゃ）の役割（やくわり）として、正（ただ）しいものはどれか。","ch":["HACCPに沿（そ）った衛生（えいせい）管理（かんり）を実践（じっせん）するために必要（ひつよう）な注意（ちゅうい）をおこない、営業者（えいぎょうしゃ）に必要（ひつよう）な意見（いけん）を述（の）べる","保健所（ほけんしょ）の職員（しょくいん）として店舗（てんぽ）に立入検査（たちいりけんさ）をおこない、違反（いはん）した営業者（えいぎょうしゃ）に営業停止（えいぎょうていし）を命（めい）じる","店舗（てんぽ）の売上（うりあげ）目標（もくひょう）と人件費（じんけんひ）の管理（かんり）を担当（たんとう）し、衛生（えいせい）管理（かんり）は調理（ちょうり）担当者（たんとうしゃ）だけにまかせて指示（しじ）しない"],"answer_index":0,"ex":"食品（しょくひん）衛生（えいせい）責任者（せきにんしゃ）は、HACCPに沿（そ）った衛生（えいせい）管理（かんり）を実践（じっせん）するために必要（ひつよう）な注意（ちゅうい）をおこなうとともに、営業者（えいぎょうしゃ）に対（たい）し必要（ひつよう）な意見（いけん）を述（の）べることとされ、営業者（えいぎょうしゃ）はその意見（いけん）を尊重（そんちょう）することが定（さだ）められています。また、営業者（えいぎょうしゃ）の指示（しじ）に従（したが）って衛生（えいせい）管理（かんり）に当（あ）たることも守（まも）るべきこととされています。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.11","tp":"4. 一般的（いっぱんてき）な衛生（えいせい）管理（かんり）の基準（きじゅん）14項目（こうもく）の詳細（しょうさい）（1）食品（しょくひん）衛生（えいせい）責任者（せきにんしゃ）などの選任（せんにん）","q":"食品（しょくひん）衛生（えいせい）責任者（せきにんしゃ）に該当（がいとう）する者（もの）として、誤（あやま）っているものはどれか。","ch":["調理師（ちょうりし）、製菓（せいか）衛生（えいせい）師（し）、栄養士（えいようし）、船舶（せんぱく）料理（りょうり）士（さむらい）などの資格（しかく）を持（も）っている者（もの）","食品（しょくひん）衛生（えいせい）に関（かん）する講習（こうしゅう）を受（う）けていない、勤続（きんぞく）年数（ねんすう）が長（なが）いアルバイト従業員（じゅうぎょういん）","都道府県知事（とどうふけんちじ）などがおこなう講習会（こうしゅうかい）や、適正（てきせい）と認（みと）める講習会（こうしゅうかい）を受講（じゅこう）した者（もの）"],"answer_index":1,"ex":"食品（しょくひん）衛生（えいせい）責任者（せきにんしゃ）は、①食品（しょくひん）衛生（えいせい）監視員（かんしいん）または食品（しょくひん）衛生（えいせい）管理者（かんりしゃ）の資格（しかく）要件（ようけん）を満（み）たす者（もの）、②調理師（ちょうりし）、製菓（せいか）衛生（えいせい）師（し）、栄養士（えいようし）などの資格（しかく）を持（も）つ者（もの）、③都道府県知事（とどうふけんちじ）などがおこなう講習会（こうしゅうかい）などを受講（じゅこう）した者（もの）のいずれかに該当（がいとう）する者（もの）です。勤続（きんぞく）年数（ねんすう）の長（なが）さだけでは該当（がいとう）しません。"}]},{"title":"衛生管理 学科 · भाग 2 (p.11–22)","words":[{"subject":"衛生管理","type":"学科","source":"衛生管理 p.11","tp":"4.（2）施設（しせつ）の衛生（えいせい）管理（かんり）　1）施設（しせつ）の清掃（せいそう）について","q":"調理（ちょうり）施設（しせつ）の内壁（ないへき）の清掃（せいそう）について、正（ただ）しいものはどれか。","ch":["内壁（ないへき）は月（がつ）に1回（かい）まとめて清掃（せいそう）すればよい","床（とこ）から1mの高（たか）さまでの内壁（ないへき）を毎日（まいにち）清掃（せいそう）する","内壁（ないへき）は汚（よご）れが目立（めだ）った時（とき）だけ清掃（せいそう）する"],"answer_index":1,"ex":"床（とこ）から1mの高（たか）さまでの内壁（ないへき）は毎日（まいにち）清掃（せいそう）します。特（とく）に調理（ちょうり）台（だい）周辺（しゅうへん）は食品（しょくひん）残（のこ）さが飛（と）び散（ち）って内壁（ないへき）や棚（たな）に付着（ふちゃく）していることがあるので、入念（にゅうねん）に点検（てんけん）して清掃（せいそう）します。天井（てんじょう）は「定期的（ていきてき）・汚（よご）れ具合（ぐあい）で適宜（てきぎ）」の清掃（せいそう）箇所（かしょ）です。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.12","tp":"4.（2）施設（しせつ）の衛生（えいせい）管理（かんり）　1）施設（しせつ）の清掃（せいそう）について","q":"冷蔵庫（れいぞうこ）・冷凍庫（れいとうこ）の管理（かんり）温度（おんど）として、正（ただ）しい組み合（くみあ）わせはどれか。","ch":["冷蔵庫（れいぞうこ）は10℃以下（いか）、冷凍庫（れいとうこ）は－15℃以下（いか）","冷蔵庫（れいぞうこ）は15℃以下（いか）、冷凍庫（れいとうこ）は－5℃以下（いか）","冷蔵庫（れいぞうこ）は20℃以下（いか）、冷凍庫（れいとうこ）は－10℃以下（いか）"],"answer_index":0,"ex":"冷蔵庫（れいぞうこ）内（ない）は10℃以下（いか）、冷凍庫（れいとうこ）は－15℃以下（いか）に保（たも）ちます。ただし低温（ていおん）でも微生物（びせいぶつ）は死滅（しめつ）せず生存（せいぞん）しているので、庫内（こない）の定期的（ていきてき）な清掃（せいそう）と、次亜塩素酸（じあえんそさん）ナトリウム溶液（ようえき）などによる消毒（しょうどく）も必要（ひつよう）です。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.14","tp":"4.（2）施設（しせつ）の衛生（えいせい）管理（かんり）　3）調理（ちょうり）施設（しせつ）での動物（どうぶつ）飼育（しいく）は厳禁（げんきん）","q":"調理（ちょうり）施設（しせつ）での動物（どうぶつ）の取扱（とりあつか）いについて、正（ただ）しいものはどれか。","ch":["犬（いぬ）や猫（ねこ）などの小型（こがた）の動物（どうぶつ）なら、ケージに入（い）れておけば調理場（ちょうりば）の中（なか）で飼（か）ってもよい","調理場（ちょうりば）に入（い）れなければ、食品（しょくひん）を保存（ほぞん）している倉庫（そうこ）の中（なか）では動物（どうぶつ）を飼（か）ってもよい","食品（しょくひん）又（また）は添加物（てんかぶつ）を取り扱（とりあつか）い、又（また）は保存（ほぞん）する区域（くいき）において動物（どうぶつ）を飼育（しいく）してはならない"],"answer_index":2,"ex":"食品（しょくひん）衛生（えいせい）法（ほう）施行規則（しこうきそく）の「施設（しせつ）の衛生（えいせい）管理（かんり）」では、食品（しょくひん）又（また）は添加物（てんかぶつ）を取り扱（とりあつか）い、又（また）は保存（ほぞん）する区域（くいき）において動物（どうぶつ）を飼育（しいく）しないことと定（さだ）めています。動物（どうぶつ）カフェなどでも飼育（しいく）スペースはお客様（きゃくさま）が立ち入（たちい）る客席（きゃくせき）のみで、客席（きゃくせき）についても計画的（けいかくてき）な日々（ひび）の清掃（せいそう）と消毒（しょうどく）が求（もと）められます。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.15、p.18","tp":"4.（3）－1 器具（きぐ）・容器（ようき）・設備（せつび）の洗浄（せんじょう）、消毒（しょうどく）、保管（ほかん）　1）洗浄（せんじょう）と洗浄剤（せんじょうざい）について","q":"「洗浄（せんじょう）」と「消毒（しょうどく）」の使い分（つかいわ）けについて、正（ただ）しいものはどれか。","ch":["先（さき）に消毒（しょうどく）剤（ざい）をかけておけば、器具（きぐ）についた汚（よご）れや油（あぶら）も自然（しぜん）に落（お）ちていく","中性洗剤（ちゅうせいせんざい）には殺菌（さっきん）の効果（こうか）があるので、洗浄（せんじょう）さえすれば消毒（しょうどく）は必要（ひつよう）ない","汚（よご）れや異物（いぶつ）を落（お）とす目的（もくてき）なら洗浄（せんじょう）、有害（ゆうがい）微生物（びせいぶつ）を除（のぞ）きたい場合（ばあい）は消毒（しょうどく）をおこなう"],"answer_index":2,"ex":"汚（よご）れや異物（いぶつ）を落（お）とす目的（もくてき）であれば「洗浄（せんじょう）」、有害（ゆうがい）微生物（びせいぶつ）を除（のぞ）きたい場合（ばあい）には「消毒（しょうどく）」をおこないます。器具（きぐ）・容器（ようき）・設備（せつび）は、洗浄（せんじょう）で有機物（ゆうきぶつ）をできる限（かぎ）り除去（じょきょ）した後（のち）に消毒（しょうどく）剤（ざい）を用（もち）いると効果的（こうかてき）です。中性洗剤（ちゅうせいせんざい）は殺菌（さっきん）を目的（もくてき）としたものではありません。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.15","tp":"4.（3）設備（せつび）などの衛生（えいせい）管理（かんり）","q":"調理（ちょうり）に使（つか）う機械（きかい）器具（きぐ）の使用区分（しようくぶん）について、正（ただ）しいものはどれか。","ch":["機械（きかい）器具（きぐ）は用途別（ようとべつ）・食品（しょくひん）種類別（しゅるいべつ）に用意（ようい）し、混同（こんどう）しないように使用（しよう）する","洗（あら）う手間（てま）が減（へ）るので、すべての食材（しょくざい）に1つの器具（きぐ）を使（つか）いまわすほうがよい","食肉（しょくにく）類（るい）に使（つか）った器具（きぐ）は、あとで加熱（かねつ）する料理（りょうり）に使（つか）うなら洗（あら）わずに使（つか）ってよい"],"answer_index":0,"ex":"食材（しょくざい）・食品（しょくひん）の相互（そうご）汚染（おせん）や二次（にじ）汚染（おせん）を防（ふせ）ぐため、機械（きかい）器具（きぐ）は用途別（ようとべつ）（下（した）処理用（しょりよう）、調理用（ちょうりよう）など）、食品（しょくひん）種類別（しゅるいべつ）（食肉（しょくにく）類（るい）、魚介類（ぎょかいるい）、野菜類（やさいるい）など）に用意（ようい）し、混同（こんどう）しないように使用（しよう）します。専用（せんよう）使用（しよう）できない機械（きかい）器具（きぐ）は、十分（じゅうぶん）に洗浄（せんじょう）・消毒（しょうどく）し清潔（せいけつ）に保（たも）ちます。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.17","tp":"4.（3）－1 器具（きぐ）・容器（ようき）・設備（せつび）の洗浄（せんじょう）、消毒（しょうどく）、保管（ほかん）　1）洗浄（せんじょう）と洗浄剤（せんじょうざい）について","q":"洗浄剤（せんじょうざい）を使用（しよう）した後（のち）のすすぎの基準（きじゅん）について、正（ただ）しいものはどれか。","ch":["流水（りゅうすい）を用（もち）いる場合（ばあい）、野菜（やさい）・果実（かじつ）は5秒間（びょうかん）以上（いじょう）、食器（しょっき）は30秒間（びょうかん）以上（いじょう）すすぐ","ため水（みず）を用（もち）いる場合（ばあい）、水（みず）はかえずに1回（まわ）すすげばよい","流水（りゅうすい）を用（もち）いる場合（ばあい）、野菜（やさい）・果実（かじつ）は30秒間（びょうかん）以上（いじょう）、食器（しょっき）は5秒間（びょうかん）以上（いじょう）すすぐ"],"answer_index":2,"ex":"野菜（やさい）、果実（かじつ）、食器（しょっき）は洗浄剤（せんじょうざい）の使用後（しようご）に水（みず）ですすぐ必要（ひつよう）があり、流水（りゅうすい）の場合（ばあい）は野菜（やさい）・果実（かじつ）が30秒間（びょうかん）以上（いじょう）、食器（しょっき）は5秒間（びょうかん）以上（いじょう）と定（さだ）められています。ため水（みず）を用（もち）いる場合（ばあい）は、ため水（みず）をかえて2回（かい）以上（いじょう）すすぎます。また、野菜（やさい）または果実（かじつ）は5分間（ふんかん）以上（いじょう）洗浄剤（せんじょうざい）の溶液（ようえき）に浸（ひた）せきしてはいけません。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.17","tp":"4.（3）－1 器具（きぐ）・容器（ようき）・設備（せつび）の洗浄（せんじょう）、消毒（しょうどく）、保管（ほかん）　1）洗浄（せんじょう）と洗浄剤（せんじょうざい）について","q":"洗浄剤（せんじょうざい）の種類（しゅるい）と使用目的（しようもくてき）の組み合（くみあ）わせとして、正（ただ）しいものはどれか。","ch":["中性洗剤（ちゅうせいせんざい） ― 食器（しょっき）洗浄機（せんじょうき）の内部（ないぶ）に付着（ふちゃく）したスケールの除去（じょきょ）","アルカリ洗浄剤（せんじょうざい） ― 特（とく）にひどい油（あぶら）汚（よご）れや焦（こ）げついた汚（よご）れの除去（じょきょ）","アルカリ洗浄剤（せんじょうざい） ― 水分（すいぶん）中（なか）のミネラル由来（ゆらい）の汚（よご）れの除去（じょきょ）"],"answer_index":1,"ex":"アルカリ洗浄剤（せんじょうざい）は、中性洗剤（ちゅうせいせんざい）で対応（たいおう）できない特（とく）にひどい油（あぶら）汚（よご）れ、焦（こ）げついた汚（よご）れ、たんぱく質（しつ）汚（よご）れに使（つか）います。スケールなど水分（すいぶん）中（なか）のミネラル由来（ゆらい）の汚（よご）れには酸性（さんせい）洗浄剤（せんじょうざい）を使（つか）います。中性洗剤（ちゅうせいせんざい）は調理器具（ちょうりきぐ）類（るい）や野菜（やさい）などの食品（しょくひん）由来（ゆらい）の汚（よご）れ全般（ぜんぱん）に使（つか）います。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.18","tp":"4.（3）－1 器具（きぐ）・容器（ようき）・設備（せつび）の洗浄（せんじょう）、消毒（しょうどく）、保管（ほかん）　2）消毒（しょうどく）とその方法（ほうほう）について","q":"食器類（しょっきるい）や調理器具（ちょうりきぐ）類（るい）の加熱（かねつ）消毒（しょうどく）の条件（じょうけん）として、正（ただ）しいものはどれか。","ch":["洗浄（せんじょう）後（のち）の食器類（しょっきるい）、調理器具（ちょうりきぐ）・機械（きかい）類（たぐ）は50℃で1分間（ふんかん）以上（いじょう）加熱（かねつ）する","洗浄（せんじょう）後（のち）の食器類（しょっきるい）、調理器具（ちょうりきぐ）・機械（きかい）類（たぐ）は80℃で5分間（ふんかん）以上（いじょう）加熱（かねつ）する","加熱（かねつ）消毒（しょうどく）は水温（すいおん）に関係（かんけい）なく、水（みず）に10分間（ふんかん）つければよい"],"answer_index":1,"ex":"洗浄（せんじょう）後（のち）の食器類（しょっきるい）、調理器具（ちょうりきぐ）・機械（きかい）類（たぐ）は80℃で5分間（ふんかん）以上（いじょう）加熱（かねつ）して消毒（しょうどく）します。フードカッターの耐熱（たいねつ）性（せい）部品（ぶひん）、布（ぬの）きん、タオルなどは100℃で5分間（ふんかん）以上（いじょう）の煮沸（しゃふつ）殺菌（さっきん）が有効（ゆうこう）です。水（みず）につけるだけでは消毒（しょうどく）になりません。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.20","tp":"4.（3）－2 計器（けいき）類（るい）・装置（そうち）、手洗（てあら）い設備（せつび）の管理（かんり）　1）計器（けいき）類（るい）や装置（そうち）の点検（てんけん）について","q":"紫外線（しがいせん）殺菌（さっきん）灯（ともしび）の管理（かんり）について、正（ただ）しいものはどれか。","ch":["寿命（じゅみょう）は3,000時間程度（じかんていど）なので、交換時期（こうかんじき）を記録（きろく）して適切（てきせつ）に管理（かんり）する","点灯（てんとう）していれば殺菌効果（さっきんこうか）は落（お）ちないので、日々（ひび）の確認（かくにん）は不要（ふよう）である","寿命（じゅみょう）は300時間程度（じかんていど）なので、毎月（まいつき）交換（こうかん）する"],"answer_index":0,"ex":"紫外線（しがいせん）殺菌（さっきん）灯（ともしび）は使用時間（しようじかん）の経過（けいか）にともなって殺菌効果（さっきんこうか）が減少（げんしょう）し、寿命（じゅみょう）は3,000時間程度（じかんていど）です。日々（ひび）の点灯（てんとう）状態（じょうたい）の確認（かくにん）とともに、交換時期（こうかんじき）を記録（きろく）し、次回（じかい）の交換（こうかん）予定（よてい）時期（じき）を含（ふく）めて適切（てきせつ）に管理（かんり）することが必要（ひつよう）です。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.20","tp":"4.（3）－2 計器（けいき）類（るい）・装置（そうち）、手洗（てあら）い設備（せつび）の管理（かんり）　2）手洗（てあら）い設備（せつび）の整備（せいび）について","q":"手洗（てあら）い設備（せつび）の整備（せいび）について、テキストが望（のぞ）ましいとしている内容（ないよう）はどれか。","ch":["給水（きゅうすい）栓（せん）は、水（みず）の量（りょう）を調整（ちょうせい）しやすい手指（てゆび）でしっかり回（まわ）すハンドル式（しき）がよい","手（て）をふくものは、ごみが出（で）ないみんなで使（つか）う共用（きょうよう）の布（ぬの）タオルがよい","手洗（てあら）い用（よう）洗浄剤（せんじょうざい）は、一回（いっかい）ごとに使（つか）い切（き）る液体（えきたい）石（いし）けんが衛生的（えいせいてき）である"],"answer_index":2,"ex":"手洗（てあら）い用（よう）洗浄剤（せんじょうざい）は、一回（いっかい）ごとに使（つか）い切（き）る液体（えきたい）石（いし）けんが衛生的（えいせいてき）です。給水（きゅうすい）栓（せん）は手指（てゆび）が触（ふ）れずに操作（そうさ）できるセンサー式（しき）、足踏（あしふ）み式（しき）、肘（ひじ）押（お）し式（しき）などが望（のぞ）ましく、乾燥（かんそう）はペーパータオルなどでおこないます。爪（つめ）ブラシは共用（きょうよう）しないなど衛生的（えいせいてき）な管理（かんり）が必要（ひつよう）です。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.21","tp":"4.（4）使用（しよう）水（みず）などの管理（かんり）　2）施設（しせつ）における使用（しよう）水（みず）の管理方法（かんりほうほう）","q":"使用（しよう）水（みず）の日常（にちじょう）点検（てんけん）について、正（ただ）しいものはどれか。","ch":["点検（てんけん）は、水道水（すいどうすい）を使（つか）っている店（みせ）であれば1週間（しゅうかん）に1回（かい）おこなえば十分（じゅうぶん）である","作業（さぎょう）開始前（かいしまえ）に確認（かくにん）する項目（こうもく）は、水（みず）の「温度（おんど）」と「量（りょう）」の2つだけと法律（ほうりつ）で決（き）められている","作業（さぎょう）開始前（かいしまえ）に「色（いろ）、濁（にご）り、臭（くさ）い、味（あじ）」の異常（いじょう）の有無（うむ）を確認（かくにん）し、1日（にち）1回（かい）以上（いじょう）おこなう"],"answer_index":2,"ex":"使用（しよう）水（みず）の日常（にちじょう）点検（てんけん）は、作業（さぎょう）開始前（かいしまえ）に「色（いろ）、濁（にご）り、臭（くさ）い、味（あじ）」について異常（いじょう）の有無（うむ）を確認（かくにん）し、記録（きろく）します。点検（てんけん）は1日（にち）1回（かい）以上（いじょう）おこないます。異常（いじょう）がない場合（ばあい）も記録（きろく）を残（のこ）すことが必要（ひつよう）です。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.22","tp":"4.（4）使用（しよう）水（みず）などの管理（かんり）　2）施設（しせつ）における使用（しよう）水（みず）の管理方法（かんりほうほう）","q":"殺菌（さっきん）装置（そうち）または浄水（じょうすい）装置（そうち）を設置（せっち）している場合（ばあい）の作業（さぎょう）開始前（かいしまえ）の確認（かくにん）について、正（ただ）しいものはどれか。","ch":["残留（ざんりゅう）塩素（えんそ）が検出（けんしゅつ）されないことを確認（かくにん）する","残留（ざんりゅう）塩素（えんそ）濃度（のうど）が10ppm以上（いじょう）あることを確認（かくにん）する","残留（ざんりゅう）塩素（えんそ）濃度（のうど）が0.1ppm以上（いじょう）あることを確認（かくにん）する"],"answer_index":2,"ex":"飲用（いんよう）井戸（いど）などの使用時（しようじ）に殺菌（さっきん）装置（そうち）または浄水（じょうすい）装置（そうち）を設置（せっち）している場合（ばあい）は、作業（さぎょう）開始前（かいしまえ）に異常（いじょう）の有無（うむ）を確認（かくにん）し、作動（さどう）状況（じょうきょう）と残留（ざんりゅう）塩素（えんそ）濃度（のうど）が0.1ppm以上（いじょう）あることを確認（かくにん）して記録（きろく）します。残留（ざんりゅう）塩素（えんそ）が検出（けんしゅつ）されないことを確認（かくにん）するのではありません。"}]},{"title":"衛生管理 学科 · भाग 3 (p.22–29)","words":[{"subject":"衛生管理","type":"学科","source":"衛生管理 p.22","tp":"4.（5）ねずみ及（およ）び昆虫（こんちゅう）対策（たいさく）　1）ねずみ及（およ）び昆虫（こんちゅう）の侵入（しんにゅう）防止（ぼうし）・駆除（くじょ）方法（ほうほう）と記録（きろく）","q":"ねずみおよび昆虫（こんちゅう）の駆除（くじょ）の回数（かいすう）と記録（きろく）について、正（ただ）しいものはどれか。","ch":["駆除（くじょ）は3年（ねん）に1回（かい）以上（いじょう）おこない、記録（きろく）は保管（ほかん）しなくてよい","駆除（くじょ）は毎月（まいつき）1回（かい）以上（いじょう）おこない、記録（きろく）を5年間（ねんかん）保管（ほかん）する","駆除（くじょ）は1年（ねん）に2回（かい）以上（いじょう）おこない、その記録（きろく）を1年間（ねんかん）保管（ほかん）する"],"answer_index":2,"ex":"ねずみおよび昆虫（こんちゅう）の駆除（くじょ）は1年（ねん）に2回（かい）以上（いじょう）実施（じっし）し、その記録（きろく）を1年間（ねんかん）保管（ほかん）します。ただし、定期的（ていきてき）に生息（せいそく）状態（じょうたい）などの調査（ちょうさ）（モニタリング）を実施（じっし）し、発生（はっせい）が認（みと）められない場合（ばあい）は、1年（ねん）に2回（かい）以上（いじょう）の駆除（くじょ）作業（さぎょう）をおこなわなくても差し支（さしつか）えありません。"},{"subject":"衛生管理","type":"学科","source":"衛生管理 p.24","tp":"4.（5）ねずみ及（およ）び昆虫（こんちゅう）対策（たいさく）　4）ねずみの侵入（しんにゅう）防止（ぼうし）および駆除（くじょ）","q":"調理（ちょうり）施設（しせつ）で被害（ひがい）をもたらすねずみの特徴（とくちょう）として、正（ただ）しいものはどれか。","ch":["クマねずみは垂直（すいちょく）面（めん）の移動（いどう）が得意（とくい）で、2cm程度（ていど）のすき間（かん）も通（とう）り抜（ぬ）けて侵入（しんにゅう）する","ドブねずみは垂直（すいちょく）面（めん）の移動（いどう）が得意（とくい）で、天井（てんじょう）の配線（はいせん）やパイプを伝（つた）って移動（いど
